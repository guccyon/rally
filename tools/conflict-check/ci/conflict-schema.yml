# 制御プレーンの直近の窓のイベント列を、衝突したファイルの列（conflict_files）を必須にした定義（conflict-files.yaml）に、
# 毎日と手動で schema.py で照らす（知見 K-0014 の担保。議決 D-0101（Issue #1207 の起票時の番号は D-0073。PR #1204）、Issue #1207）。決定論（LLM を使わない）。
# 定義と schema.py は議決 D-0049・Issue #1136 で作ったが、走らせる配線がなく、Engine が欄のないイベントを出しても誰も気づかない。
# 照らすのは、Engine に engine/conflict-files.patch を当てた時刻（CONFLICT_FILES_SINCE）と直近 WINDOW_DAYS 日の始まりの遅いほうから後のイベントだけ
# （window-events.sql と schema.py の --since）。差分の前の Engine はこの欄を出さないので、前のイベントまで照らすとすべて missing_field で落ちる。
# 欄がない・null（missing_field）、空の列・文字列の列でない（bad_field）イベントが 1 件でもあれば落ちる。
# CONFLICT_FILES_SINCE が空か時差つきの ISO 8601 の時刻でなければ conflict_files_since_missing で、
# イベントを読めなければ events_unreadable で落ちる（照らさずに緑にしない）。
# 制御プレーンの events は PR の GITHUB_TOKEN では読めないので、events を読むだけの権限の接続先をシークレット CONFLICT_EVENTS_DATABASE_URL に置く（建設者）。
# PR には紐づかない記録を見るので、PR ごとには走らせない（落ちても PR を止めない。直すのは Engine）。
# ワーカーは .github/workflows/ を変えられないので、建設者が Engine に差分を当て、Engine がこの欄を載せて出すようになってから、
# このファイルを .github/workflows/conflict-schema.yml に写す。写すときに変えてよいのは CONFLICT_FILES_SINCE の行（差分を当てた時刻を書く）だけ。
# 写したら K-0014 の issue 1136 と 1207 の解決策を wired: true にし、wired_by に
# {workflow: .github/workflows/conflict-schema.yml, job: conflict-schema, runs: tools/conflict-check/schema.py} を書く
# （tools/knowledge-enforcement-check/check.py が、このワークフローの schedule でも走るジョブから schema.py を呼ぶことを求める）。
# test_schema_ci.py（ci/conflict-check.yml の unittest discover で走る）が、このファイルの形・手順の振る舞い・写しとのずれを見る。
name: conflict-schema

on:
  schedule:
    - cron: "40 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conflict-schema
  cancel-in-progress: false

env:
  CONFLICT_FILES_SINCE: ""
  WINDOW_DAYS: "8"

jobs:
  conflict-schema:
    runs-on: ubuntu-latest
    steps:
      - name: 差分を当てた時刻を確かめる（K-0014）
        shell: bash
        run: |
          if ! [[ "${CONFLICT_FILES_SINCE:-}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$ ]]; then
            echo "::error title=conflict-schema conflict_files_since_missing::CONFLICT_FILES_SINCE に Engine に engine/conflict-files.patch を当てた時刻を時差つきの ISO 8601 で書く（今は '${CONFLICT_FILES_SINCE:-}'）"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: PyYAML を入れる
        run: python3 -m pip install pyyaml
      - name: 直近の窓のイベント列を読む（K-0014）
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.CONFLICT_EVENTS_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error title=conflict-schema events_unreadable::シークレット CONFLICT_EVENTS_DATABASE_URL がない（制御プレーンの events を読める接続先を置く）"
            exit 1
          fi
          if ! psql "$DATABASE_URL" -X -q -A -t -v ON_ERROR_STOP=1 -v since="$CONFLICT_FILES_SINCE" -v window_days="$WINDOW_DAYS" \
              -f tools/conflict-check/window-events.sql > conflict-events.json; then
            echo "::error title=conflict-schema events_unreadable::制御プレーンの events を読めなかった（接続先と権限を確かめる）"
            exit 1
          fi
      - name: 衝突したファイルの列を照らす（K-0014）
        shell: bash
        run: |
          code=0
          python3 -B tools/conflict-check/schema.py --events conflict-events.json --since "$CONFLICT_FILES_SINCE" > conflict-schema.txt || code=$?
          cat conflict-schema.txt
          { echo '```'; cat conflict-schema.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
