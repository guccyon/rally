# PR 本文の関所（tools/pr-body-check/gate.mjs）を Engine の本物の本文の組み込みで確かめる（知見 K-0001 の担保。議決 D-0013・D-0019、Issue #956・#975）。決定論（LLM を使わない）。
# Engine を固定した版（ENGINE_REF）でチェックアウトして ENGINE_DIR を向け、tools/pr-body-check のテスト（check.test.mjs・gate.test.mjs・engine.test.mjs・followers.test.mjs など）を PR ごとに走らせる。
# recheck.test.mjs は、本文の直し（body_fix）の終わりと直した本文の再検査を待たずにマージしたイベント列（事例 C-0003・C-0005・C-0006）が落ちることを確かめる（知見 K-0012 の担保。議決 D-0050、Issue #1131）。
# merge-order.test.mjs は、検査と裁きの前にマージを決め、採用した機械的に直せるコードの指摘を直さずにマージしたイベント列（事例 C-0012）が落ちることを確かめる（知見 K-0026 の担保。議決 D-0151、Issue #1392）。
# engine.test.mjs の (12) は、Engine の supervisor の merge_step がマージの前に本文の直しの終わりと直した本文の pr-body-check を待つことを確かめ、ci.test.mjs がその (12) が pass と数えられたかを見る（知見 K-0012 の担保。議決 D-0100、Issue #1197）。
# followers.test.mjs は、見出しの正本（template.json）に Engine の rubric の PR-002・実装役の報告の型（entrypoint.sh）と CLAUDE.md が合っているかを照らし、食い違ったら落ちる（知見 K-0005 の担保。Issue #1121・#1194）。Engine の食い違いが Issue #1121・#1194 の時点の形だけのときは todo。
# ENGINE_DIR を渡すので、Engine のチェックアウトがないときや entrypoint.sh から本文を組む節を取り出せないときは飛ばさずに落ちる。
# PR 本文そのものはここでは見ない（落ちると ci_failed の続きのジョブが積まれ、その summary がまた本文に足されるため。本文は Engine が更新の前に関所に照らす）。
# ワーカーは .github/workflows/ を変えられないので、建設者がこのファイルを .github/workflows/pr-body-engine.yml に写す。
# engine.test.mjs の (3) に todo はないので、関所を呼ばない Engine の版では落ちる。engine/pr-body-gate.patch を Engine に入れて ENGINE_REF を上げるのと同じ PR で写し、engine-test を必須のチェックにする（議決 D-0019）。
# 写すときに変えてよいのは ENGINE_REF の行だけ（tools/sendback-check/ci/sendback-engine.yml と同じ版にそろえる。上げるときはテストが通ることを確かめる）。
# engine-test が報告するチェックの名前は pr-body-engine-test（ジョブの name:）。id のままの engine-test（knowledge-enforcement.yml も報告する）と同じ名前だと、必須のチェックの
# 「engine-test」がどちらの報告でも満たされ、この写しを消しても止まらないため（議決 D-0032、Issue #1037）。
# ci.test.mjs（このテストの中で走る）が、形・ENGINE_REF・sendback-engine.yml との版のずれ・写しとのずれを見張り、
# gate.test.mjs（関所と CLI のテスト）と engine.test.mjs の (10)（通る側の写し）が skip・todo・only・道や名前の絞り込み（NODE_OPTIONS を含む）で外れていないことも見て（議決 D-0045、Issue #1109）、
# その 2 つを TAP で走らせた結果で、通る側のテストと (10) が pass と数えられ skip・todo が 0 かも見て（議決 D-0070、Issue #1183）、
# protection.mjs で建設者が必須のチェックに入っているかを照らす（README の「配線の手順（建設者）」）。
name: pr-body-engine

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-body-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  ENGINE_REF: 9fee9c2b3d8d2dd22db63e8989d839cd982fd046

jobs:
  engine-test:
    name: pr-body-engine-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine を取る（固定した版）
        uses: actions/checkout@v4
        with:
          repository: guccyon/factory-engine
          ref: ${{ env.ENGINE_REF }}
          path: .engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PR 本文の関所のテスト（K-0001）
        working-directory: tools/pr-body-check
        env:
          ENGINE_DIR: ${{ github.workspace }}/.engine
        run: |
          rc=0
          node --test --test-reporter=spec > pr-body-test.txt 2>&1 || rc=$?
          { echo "## pr-body-engine（ENGINE_REF=${ENGINE_REF}）"; echo; echo '```'; cat pr-body-test.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat pr-body-test.txt
          exit $rc
