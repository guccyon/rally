# sendback-engine.yml の写しの 2 つのジョブ（engine-test・wiring-order）が branch protection の必須のチェックに入っているかを、
# 毎日と手動で protection.mjs で照らす（知見 K-0004 の担保。議決 D-0039、Issue #1087）。決定論（LLM を使わない）。
# 必須にしたあとで外されると、写しを消す・見張りを書き換える PR が止まらなくなる。protection.mjs を建設者が一度走らせるだけでは、
# 後で外されたことに気づけないので、定期に走らせる。
# PR ごとにも走らせ（protection-pr のジョブ）、その PR の .github/workflows/ と本物の branch protection を照らして、
# required_check_missing・check_name_changed・check_name_shared（と workflow_not_copied）なら ::error で落とす（議決 D-0059（起票時の番号は D-0056）、Issue #1158）。
# 必須のチェックを外したあと・ジョブの名前を変える PR・同じチェックの名前を報告するジョブを足す PR を、その PR の上で止める。
# branch protection は GITHUB_TOKEN では読めないので、読める権限のトークン（GitHub App か administration:read の fine-grained PAT）を
# シークレット SENDBACK_PROTECTION_TOKEN に置く（建設者）。そのトークンは branch protection を読む手順だけに渡す。
# 定期と手動（protection のジョブ）では、外れたら ::error を出して落ち、Issue を開くか、開いている Issue を更新する
# （同じ外れ方の記録がすでにあれば足さない）。通ったら、開いている Issue に通ったことを書いて閉じる。
# PR（protection-pr のジョブ）では Issue を開かない（issues: write を持たせない。PR のコードを issues: write で動かさない）。落ちた PR の上で直す。
# トークンがない・読めなかったときは protection_unreadable の ::error で落ちる（Issue は開かない。必須のチェックの有無が分からないため）。
# フォークからの PR にはシークレットが渡らないので、protection-pr は protection_unreadable で落ちる。
# ワーカーは .github/workflows/ を変えられないので、建設者がこのファイルを .github/workflows/sendback-protection.yml にそのまま写す。
# 写したら、PR で protection-pr が落ちる実行と schedule で protection が走った実行を Issue #948 と事例記録（.factory-config/knowledge/cases/）に残してから、
# K-0004 の Issue #1158 の解決策の wired・verified を true にする（wired_by に protection と protection-pr の 2 つ。
# tools/knowledge-enforcement-check/check.py が schedule と pull_request の両方のジョブから protection.mjs を呼ぶことを求める）。
# ci.test.mjs（sendback-engine.yml の wiring-order で走る）が、このファイルの形・手順の振る舞い・写しとのずれを見る。
name: sendback-protection

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sendback-protection-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

env:
  BRANCH: main
  ISSUE_TITLE: "sendback-check: engine-test・wiring-order が必須のチェックから外れている（K-0004）"

jobs:
  protection:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: branch protection を読む（K-0004）
        id: read
        env:
          GH_TOKEN: ${{ secrets.SENDBACK_PROTECTION_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=sendback-protection protection_unreadable::シークレット SENDBACK_PROTECTION_TOKEN がない（branch protection を読める権限のトークンを置く）"
            exit 1
          fi
          # 古い形。保護がない（404 の Branch not protected）ときはその JSON のまま渡し、必須のチェックが空として外れる
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}/protection" > protection-classic.json; then
            if ! grep -qF '"Branch not protected"' protection-classic.json; then
              echo "::error title=sendback-protection protection_unreadable::${BRANCH} の branch protection を読めなかった（トークンの権限を確かめる）"
              exit 1
            fi
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/rules/branches/${BRANCH}?per_page=100" > protection-rules.json; then
            echo "::error title=sendback-protection protection_unreadable::${BRANCH} の rulesets を読めなかった（トークンの権限を確かめる）"
            exit 1
          fi
      - name: 必須のチェックを照らす（K-0004）
        id: check
        working-directory: tools/sendback-check
        run: |
          node protection.mjs --protection ../../protection-classic.json --protection ../../protection-rules.json \
            --json protection-result.json --summary "$GITHUB_STEP_SUMMARY"
      - name: 外れたら Issue を開くか更新する（K-0004）
        if: always()
        working-directory: tools/sendback-check
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          if [ ! -f protection-result.json ]; then
            echo "照らした結果がない（branch protection を読めなかった）ので Issue は開かない"
            exit 0
          fi
          errors=$(node -e 'for (const e of require("./protection-result.json").errors) console.log(`${e.rule}: ${e.message}`)')
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # 開いている Issue を題で探す。読めなければ開いていないとして扱う（外れを黙って捨てない）
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,title \
            --jq '.[] | select(.title == env.ISSUE_TITLE) | .number' | head -n 1 || true)
          if [ "${CHECK_OUTCOME:-failure}" = success ] && [ -z "$errors" ]; then
            if [ -n "$number" ]; then
              printf '%s\n\n- 実行: %s\n' "engine-test・wiring-order が必須のチェックに戻った（protection.mjs が通った）ので閉じる。" "$run_url" > protection-comment.md
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file protection-comment.md
              gh issue close "$number" --repo "$GITHUB_REPOSITORY"
            fi
            exit 0
          fi
          marker="<!-- sendback-protection: $(printf '%s' "$errors" | sha256sum | cut -c1-16) -->"
          {
            echo "$marker"
            echo "\`tools/sendback-check/protection.mjs\` が外れた（知見 K-0004、議決 D-0026・D-0039）。\`.github/workflows/sendback-engine.yml\` の engine-test・wiring-order が ${BRANCH} の必須のチェックにないと、写しを消す・見張りを書き換える PR が止まらない。"
            echo
            echo '```'
            echo "$errors"
            echo '```'
            echo
            echo "- 実行: ${run_url}"
          } > protection-comment.md
          if [ -z "$number" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file protection-comment.md
            exit 0
          fi
          recorded=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${number}" --jq '.body' || true)
          recorded+=$'\n'$(gh api "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" --paginate --jq '.[].body' || true)
          if grep -qF -- "$marker" <<< "$recorded"; then
            echo "Issue #${number} に同じ外れ方の記録があるので足さない"
            exit 0
          fi
          gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file protection-comment.md

  protection-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: branch protection を読む（K-0004）
        id: read
        env:
          GH_TOKEN: ${{ secrets.SENDBACK_PROTECTION_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=sendback-protection protection_unreadable::シークレット SENDBACK_PROTECTION_TOKEN がない（branch protection を読める権限のトークンを置く）"
            exit 1
          fi
          # 古い形。保護がない（404 の Branch not protected）ときはその JSON のまま渡し、必須のチェックが空として外れる
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}/protection" > protection-classic.json; then
            if ! grep -qF '"Branch not protected"' protection-classic.json; then
              echo "::error title=sendback-protection protection_unreadable::${BRANCH} の branch protection を読めなかった（トークンの権限を確かめる）"
              exit 1
            fi
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/rules/branches/${BRANCH}?per_page=100" > protection-rules.json; then
            echo "::error title=sendback-protection protection_unreadable::${BRANCH} の rulesets を読めなかった（トークンの権限を確かめる）"
            exit 1
          fi
      - name: 必須のチェックを照らす（K-0004）
        id: check
        working-directory: tools/sendback-check
        run: |
          node protection.mjs --protection ../../protection-classic.json --protection ../../protection-rules.json \
            --json protection-result.json --summary "$GITHUB_STEP_SUMMARY"
