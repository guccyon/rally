# 差し戻し・続きのジョブの判定を Engine の本物の判定で確かめる（知見 K-0004 の担保。議決 D-0011、Issue #948）。決定論（LLM を使わない）。
# Engine を固定した版（ENGINE_REF）でチェックアウトして ENGINE_DIR を向け、tools/sendback-check/engine.test.mjs を PR ごとに走らせる。
# ENGINE_DIR を渡すので、Engine のチェックアウトがないときや engine_harness.py が判定の関数を取り出せないときは飛ばさずに落ちる。
# ワーカーは .github/workflows/ を変えられないので、建設者がこのファイルを .github/workflows/sendback-engine.yml に写す。
# 写すときに変えてよいのは ENGINE_REF の行だけ（Engine を上げるときはこの版も上げ、engine.test.mjs が通ることを確かめる）。
name: sendback-engine

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sendback-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  ENGINE_REF: 9fee9c2b3d8d2dd22db63e8989d839cd982fd046

jobs:
  engine-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine を取る（固定した版）
        uses: actions/checkout@v4
        with:
          repository: guccyon/factory-engine
          ref: ${{ env.ENGINE_REF }}
          path: .engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Engine の本物の判定のテスト（K-0004）
        working-directory: tools/sendback-check
        env:
          ENGINE_DIR: ${{ github.workspace }}/.engine
        run: |
          rc=0
          node --test --test-reporter=spec engine.test.mjs > engine-test.txt 2>&1 || rc=$?
          { echo "## sendback-engine（ENGINE_REF=${ENGINE_REF}）"; echo; echo '```'; cat engine-test.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat engine-test.txt
          exit $rc
