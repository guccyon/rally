# 差し戻し・続きのジョブの判定を Engine の本物の判定で確かめる（知見 K-0004 の担保。議決 D-0011、Issue #948）。決定論（LLM を使わない）。
# Engine を固定した版（ENGINE_REF）でチェックアウトして ENGINE_DIR を向け、tools/sendback-check/engine.test.mjs を PR ごとに走らせる。
# ENGINE_DIR を渡すので、Engine のチェックアウトがないときや engine_harness.py が判定の関数を取り出せないときは飛ばさずに落ちる。
# wiring-order は配線の順序の見張り（議決 D-0012、Issue #953）。.github/workflows/ に check.mjs --events を呼ぶ手順があるのに、
# engine.test.mjs に todo が残っているか、engine.test.mjs を走らせる手順がないときに落ちる（Engine は要らない）。
# ワーカーは .github/workflows/ を変えられないので、建設者がこのファイルを .github/workflows/sendback-engine.yml に写す。
# 写すときに変えてよいのは ENGINE_REF の行だけ（Engine を上げるときはこの版も上げ、engine.test.mjs が通ることを確かめる）。
# 写したら branch protection で engine-test と wiring-order を必須のチェックにする（議決 D-0014、Issue #960）。
# ENGINE_REF は 40 桁のコミット SHA に限る。ブランチ名やタグは動くので、同じ PR でも結果が変わる。engine-test の最初の手順
# （どのチェックアウトよりも前）で確かめ、違えば Engine を取らずに落とす（議決 D-0014、Issue #960。テストは ci.test.mjs）。
# wiring-order は ci.test.mjs も走らせ、.github/workflows/sendback-engine.yml の写しが ENGINE_REF の行のほかでこのファイルとずれたら落とす。
# ci.test.mjs は、このファイルが必須のチェックにできる形（絞り込みのない pull_request・if: と continue-on-error なし・engine-test と wiring-order の名前と見張りの手順）かも見て、
# GitHub Actions では写しが .github/workflows/sendback-engine.yml にないと落とす。見張りを外す PR を止めるため（議決 D-0017、Issue #969）。
# engine-test は engine.test.mjs の結果（TAP）を同じ手順で order.mjs --engine-report に渡し、check.mjs --events を呼ぶ手順があるのに
# ENGINE_REF の Engine で (3) か (c) が通っていない（LEGACY_BASIS の todo など）ときに落とす（議決 D-0016、Issue #964）。
# ENGINE_REF を固定したので Engine の判定の変化は ENGINE_REF を上げるまで見えない。同じ engine.test.mjs を Engine の既定のブランチの先頭で定期に走らせ、
# 落ちたら ::error と Issue #948 への記録で知らせるのは ci/sendback-engine-head.yml（議決 D-0020、Issue #977。PR では走らせない）。
# required-checks は engine-test と wiring-order が main の必須のチェックに入っているかを PR ごとに照らし、外れていれば落とす（議決 D-0040、Issue #1091）。
# 必須にし忘れると、写しを消す・見張りを書き換える PR が止まらないため。gh api でブランチ（protection の要約）と rulesets の JSON を取り、
# protection.mjs に渡す。どちらも PR の GITHUB_TOKEN（contents: read）で読める（branches/main/protection は管理者の権限が要るので使わない）。
# 写しがないと workflow_not_copied、必須にないと required_check_missing、JSON が取れないと protection_unreadable で落ちる。
name: sendback-engine

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sendback-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  ENGINE_REF: 9fee9c2b3d8d2dd22db63e8989d839cd982fd046

jobs:
  wiring-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: check.mjs の ci_check の配線の順序（K-0004）
        run: node tools/sendback-check/order.mjs --summary "$GITHUB_STEP_SUMMARY"
      - name: ENGINE_REF の見張りと写しのずれ（K-0004）
        working-directory: tools/sendback-check
        run: node --test --test-reporter=spec ci.test.mjs

  required-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: engine-test と wiring-order が main の必須のチェックか（K-0004）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fetch() {
            if ! gh api "repos/${GITHUB_REPOSITORY}/$1" > "$2"; then
              echo "::error title=sendback-check protection_unreadable::gh api repos/${GITHUB_REPOSITORY}/$1 が読めなかった。必須のチェックを照らせないので落とす"
              exit 1
            fi
          }
          fetch branches/main protection-branch.json
          fetch rules/branches/main protection-rules.json
          node tools/sendback-check/protection.mjs --protection protection-branch.json --protection protection-rules.json --summary "$GITHUB_STEP_SUMMARY"

  engine-test:
    runs-on: ubuntu-latest
    steps:
      - name: ENGINE_REF が 40 桁のコミット SHA か（K-0004）
        shell: bash
        run: |
          if [[ ! "$ENGINE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=sendback-engine engine_ref_not_sha::ENGINE_REF は 40 桁のコミット SHA（小文字の 16 進）にする。ブランチ名やタグは動くので使わない（ENGINE_REF=${ENGINE_REF}）"
            exit 1
          fi
          echo "ENGINE_REF=${ENGINE_REF}"
      - uses: actions/checkout@v4
      - name: Engine を取る（固定した版）
        uses: actions/checkout@v4
        with:
          repository: guccyon/factory-engine
          ref: ${{ env.ENGINE_REF }}
          path: .engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Engine の本物の判定のテスト（K-0004）
        working-directory: tools/sendback-check
        env:
          ENGINE_DIR: ${{ github.workspace }}/.engine
        run: |
          rc=0
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=engine-test.tap engine.test.mjs \
            > engine-test.txt 2>&1 || rc=$?
          { echo "## sendback-engine（ENGINE_REF=${ENGINE_REF}）"; echo; echo '```'; cat engine-test.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat engine-test.txt
          # ENGINE_REF の Engine で basis の場合が通ってから配線しているか。テストが落ちても結果を見るため同じ手順で走らせる（if: は使わない）
          node order.mjs --engine-report engine-test.tap --summary "$GITHUB_STEP_SUMMARY" || rc=1
          exit $rc
