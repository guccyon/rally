# L1（構造・境界）: 契約の互換性。PR の base と head の specs/contracts/ を比べ、支えている版のクライアント・購読先を壊す変更を拾う。
# チェッカーは factory-engine の core-gates/compat_check.py を、固定した版で取って走らせる（Engine を上げるときはこの版も上げる）。
# P1 は shadow: 結果を Job Summary に残すだけで、PR は落とさない（必須チェックにもしない）。格上げは工場のアーキテクチャの判断として確認してから。
name: contract-compat

on:
  pull_request:
    paths:
      - "specs/contracts/**"
      - ".factory-config/manifest.yaml"

permissions:
  contents: read

concurrency:
  group: contract-compat-${{ github.ref }}
  cancel-in-progress: true


jobs:
  compat:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Engine の版を読む（.factory-config/engine.lock。factory-engine の main にある版だけ受ける）
        run: |
          lock=.factory-config/engine.lock
          if [ ! -f "$lock" ]; then echo "ENGINE_REF=self" >> "$GITHUB_ENV"; exit 0; fi
          ref=$(grep -Ev '^[[:space:]]*(#|$)' "$lock" | head -1 | tr -d '[:space:]')
          if ! printf '%s' "$ref" | grep -qE '^[0-9a-f]{40}$'; then echo "::error::$lock には 40 桁の commit SHA を 1 行で書く"; exit 1; fi
          git init -q "$RUNNER_TEMP/engine"
          git -C "$RUNNER_TEMP/engine" fetch -q --filter=blob:none https://github.com/guccyon/factory-engine.git main
          if ! git -C "$RUNNER_TEMP/engine" merge-base --is-ancestor "$ref" FETCH_HEAD 2>/dev/null; then echo "::error::$lock の版 $ref は factory-engine の main にない"; exit 1; fi
          echo "ENGINE_REF=$ref" >> "$GITHUB_ENV"
      - name: チェッカーを取る
        run: |
          python3 -m pip install --quiet pyyaml
          curl -fsSL -o /tmp/compat_check.py "https://raw.githubusercontent.com/guccyon/factory-engine/${ENGINE_REF}/core-gates/compat_check.py"
      - name: 契約の互換性（shadow）
        run: |
          python3 /tmp/compat_check.py --base "origin/${{ github.base_ref }}" --json compat.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-compat
          path: compat.json
          if-no-files-found: ignore
