[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/infra",
    "crates/interface",
    "crates/server",
    "crates/architecture",
    "crates/seed",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# 層の依存方向は docs/adr/0003-backend-layers.md。
# 許す辺は crates/architecture/tests/dependency_direction.rs の表が正。
[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infra = { path = "crates/infra" }
interface = { path = "crates/interface" }
server = { path = "crates/server" }
seed = { path = "crates/seed" }

axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
cargo_metadata = "0.23"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
time = { version = "0.3", features = ["formatting", "parsing"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "time"] }
rand = "0.10"
object_store = { version = "0.14", default-features = false, features = ["aws"] }
