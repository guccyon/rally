# ローカル開発用の Postgres とオブジェクトストア（P1）。本番相当の環境は P2 の IaC で別に作る。
# 手元からだけつながるよう 127.0.0.1 に限り、パスワードなし（trust）・認証なしで動かす。秘密情報は置かない。
# 使い方は apps/backend/README.md の「データベース」と「行動イベントの配信先」。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rally
      POSTGRES_DB: rally
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rally", "-d", "rally"]
      interval: 2s
      timeout: 3s
      retries: 15
  # S3 API のオブジェクトストア（モック）。行動イベントのモックの配信先（ANALYTICS_SINK=object_store）が
  # バケット rally-analytics に JSON Lines を書く。認証情報は要らない（どんな署名・署名なしも受け付ける）
  objectstore:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: rally-analytics
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - objectstore-data:/s3mockroot

volumes:
  postgres-data:
  objectstore-data:
