name: rally_student_app
description: "Rally の生徒アプリ（Gen1 の最小）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  # 応答の Date ヘッダーを読む（lib/api/server_clock.dart。http が使っているもの）
  http_parser: ^4.1.2
  # 入室前チェックの iOS 版で端末のカメラ・マイク・スピーカーを使い、許可を断ったときにこのアプリの設定を開く
  # （lib/device/ios_local_media.dart。camera は映すだけ・record は音の大きさを計るだけで、録らない・残さない）
  camera: ^0.12.2
  record: ^7.2.0
  audioplayers: ^6.8.1
  url_launcher: ^6.3.3
  # 登録の結果を iOS / Android のアプリのファイルに残す置き場所（Application Support）を引く（lib/session/session_store_stub.dart）
  path_provider: ^2.1.5
  # 入室前チェックの Web 版でブラウザーのカメラ・マイク・Web Audio を使う（lib/device/web_local_media.dart）。
  # 登録の結果をブラウザーの localStorage に残すのにも使う（lib/session/session_store_web.dart）
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.4

flutter:
  uses-material-design: true
  # 日時と回数の数字の書体（specs/design/tokens.yaml の typography.families.numeric）。SIL OFL 1.1 で、OFL.txt を LicenseRegistry に載せる
  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
  assets:
    - assets/fonts/OFL.txt
    # 入室前チェックの iOS 版の試し音（3 秒。660Hz と 880Hz を 0.5 秒ごとに 6 回。Web 版が Web Audio で作る音と同じ形）
    - assets/sounds/test_tone.wav
