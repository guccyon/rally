name: rally_student_app
description: "Rally の生徒アプリ（Gen1 の最小）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.4

flutter:
  uses-material-design: true
  # 日時と回数の数字の書体（specs/design/tokens.yaml の typography.families.numeric）。SIL OFL 1.1 で、OFL.txt を LicenseRegistry に載せる
  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
  assets:
    - assets/fonts/OFL.txt
