# 基礎（トークン）。アプリのテーマ（student-app の ThemeData、admin-web の @theme）はこの名前と値に合わせる（color-primary・RallyColors.primary）
# 0.5.0 で「スコアボード」の方向に見直した（人の判断 2026-11-05）
schema_version: "0.1"
status: draft
section: foundations
concept: rally-court

color:
  roles:   # 明るい配色（Gen1 の既定で、唯一の配色）
    primary: "#0E1013"              # 主（インク）。主なボタン・リンク・選択中（0.5.0 で青 #3A54B0 から変えた）
    on_primary: "#FFFFFF"
    primary_pressed: "#33372F"      # 押下のとき（白の文字と 12.15）
    primary_container: "#E4E6E0"    # 副のボタン・選択中の行・押下の面
    primary_container_pressed: "#D6D9D0"   # 0.5.0 で足した。副のボタンの押下
    on_primary_container: "#0E1013"
    secondary: "#D4F53C"            # 副（ライム）。文字の色にしない。使う場所は usage_rules の 3 つだけ
    on_secondary: "#0E1013"
    text: "#0E1013"
    text_muted: "#5B6058"           # 補足の文字
    background: "#FFFFFF"           # 画面の地・カード・欄
    surface: "#F2F3EE"              # 淡い面（空の表示・無効・日付のコマ）
    inverse_surface: "#0E1013"      # 濃い面。1 画面に 1 か所（成功の知らせは数えない）
    on_inverse_surface: "#FFFFFF"
    on_inverse_surface_muted: "#B9BDB3"
    border: "#E4E6E0"               # カードの輪郭と区切り線（1.26）
    border_strong: "#7A7F74"        # 入力欄の輪郭・状態の点（中立）（4.11）
    focus_ring: "#667F00"           # 濃い面の上では secondary
    scrim: "rgba(14,16,19,0.56)"    # ダイアログの後ろ
  status:
    info:    {fg: "#0E1013", container: "#F2F3EE", on_container: "#0E1013"}   # 0.5.0 で青をやめた
    success: {fg: "#0E7A3E", container: "#E2F6EA", on_container: "#0A4F28"}
    warning: {fg: "#9A5B00", container: "#FFF1D6", on_container: "#5A3500"}
    danger:  {fg: "#C0182F", container: "#FDE8EB", on_container: "#7A0F1E"}
  status_rule: 状態は色の点（fg）と glossary の呼び名の文字で出す。container の面の札と知らせはやめた（0.5.0）。container は data_table の急ぎの行だけ、on_container は互換のために残す
  booking_state:   # 予約の状態（glossary の booking.states）と色の対応
    pending: warning      # 確定待ち
    confirmed: success    # 確定済み
    cancelled: neutral    # キャンセル済み（border_strong の点と text_muted の文字）
  slot_state:   # スロットの状態（glossary の slot.states）と色の対応（0.4.0 で足した。#455）
    open: info            # 公開中。予約を待っている
    booked: success       # 予約済み。予約が入った（確定待ちを含む。確定待ちかは予約の status_tag で別に出す）
    closed: neutral       # 終了
  state_rules:
    - neutral は点 border_strong・文字 text_muted（booking_state と同じ。0.5.0 で surface の面と border の輪郭をやめた）
    - 状態の色はこの対応からだけ選ぶ。スロットと予約の状態を同じ行に出すときは両方の呼び名を出す
  scale:   # 濃淡の段階。roles にない段は使わない（足すときは governance の手順で）
    ink:   {50: "#F2F3EE", 100: "#E4E6E0", 200: "#D6D9D0", 300: "#B9BDB3", 500: "#7A7F74", 700: "#5B6058", 800: "#33372F", 950: "#0E1013"}   # 0.5.0 で中立の灰に。200・800 を足した
    lime:  {300: "#D4F53C", 700: "#667F00"}   # 700 は focus_ring だけ
    blue:  {50: "#E9EDF8", 600: "#3A54B0", 700: "#2E4590", 900: "#1E2A5C"}   # deprecated（0.5.0）。使わない。1.0.0 で消す
  usage_rules:
    - secondary（ライム）を使うのは 3 つだけ。score_panel の中、予約のカードの次のレッスンの日付のコマ、完了の印（成功の知らせの丸）。どれも 1 画面に 1 か所
    - secondary は文字の色にしない
    - primary（インク）を inverse_surface の上に置かない（1.00）。濃い面の上の操作は button の on_dark（ライムの面にインクの字）
    - カードと欄は background に border の 1px。surface の面で囲わない。入力欄の輪郭は border_strong
  contrast_checked:   # WCAG 2.2 の比。文字は 4.5 以上、大きな文字と文字でない部品は 3 以上（0.5.0 で計り直した）
    - {fg: primary, bg: background, ratio: 19.05}
    - {fg: primary, bg: surface, ratio: 17.08}
    - {fg: primary, bg: primary_container, ratio: 15.15}
    - {fg: on_primary, bg: primary, ratio: 19.05}
    - {fg: on_primary, bg: primary_pressed, ratio: 12.15}
    - {fg: on_primary_container, bg: primary_container, ratio: 15.15}
    - {fg: text, bg: primary_container_pressed, ratio: 13.33}
    - {fg: text, bg: background, ratio: 19.05}
    - {fg: text, bg: surface, ratio: 17.08}
    - {fg: text_muted, bg: background, ratio: 6.44}
    - {fg: text_muted, bg: surface, ratio: 5.78}
    - {fg: text_muted, bg: primary_container, ratio: 5.12}
    - {fg: on_secondary, bg: secondary, ratio: 15.36}
    - {fg: on_inverse_surface, bg: inverse_surface, ratio: 19.05}
    - {fg: on_inverse_surface_muted, bg: inverse_surface, ratio: 9.97}
    - {fg: secondary, bg: inverse_surface, ratio: 15.36, note: 文字でない強調と display の数字}
    - {fg: focus_ring, bg: background, ratio: 4.56}
    - {fg: focus_ring, bg: surface, ratio: 4.09}
    - {fg: focus_ring, bg: primary, ratio: 4.17}
    - {fg: border_strong, bg: background, ratio: 4.11}
    - {fg: border_strong, bg: surface, ratio: 3.68}
    - {fg: danger.fg, bg: background, ratio: 6.15}
    - {fg: danger.fg, bg: surface, ratio: 5.52}
    - {fg: danger.fg, bg: danger.container, ratio: 5.25}
    - {fg: text, bg: danger.container, ratio: 16.26}
    - {fg: on_primary, bg: danger.fg, ratio: 6.15}
    - {fg: success.fg, bg: background, ratio: 5.42}
    - {fg: success.fg, bg: surface, ratio: 4.86}
    - {fg: warning.fg, bg: background, ratio: 5.43}
    - {fg: warning.fg, bg: surface, ratio: 4.87}
    - {fg: warning.fg, bg: danger.container, ratio: 4.63, note: 急ぎの行の状態の点}
  not_allowed_pairs:   # 比が足りないので使わない
    - {fg: secondary, bg: background, ratio: 1.24, note: 文字と線として。日付のコマの面は中の字で読む}
    - {fg: primary, bg: inverse_surface, ratio: 1.00}
    - {fg: border, bg: background, ratio: 1.26, note: 押せることを伝える輪郭として}
  dark_mode:
    gen1: 明るい配色だけ。端末がダークでも明るい配色で出す（Flutter は themeMode を ThemeMode.light、admin-web は color-scheme を light）
    why: 熱い場所 1 か所の設計を、まず明るい配色で確かめるため（暗い案 B は選ばれなかった 2026-11-05）
    proposed_roles: {background: "#0E1013", surface: "#1B1D19", text: "#F2F3EE", text_muted: "#B9BDB3", primary: "#F2F3EE", secondary: "#D4F53C", border: "#2E312B", border_strong: "#7A7F74", danger_fg: "#FF8A99", success_fg: "#5BD68F", warning_fg: "#FFC266"}   # proposed。人の承認と画面の確かめを経て入れる。0.5.0 で中立の灰に合わせた（どれも background と surface で 4.1 以上）

typography:
  families:
    sans: "'Noto Sans CJK JP', 'Noto Sans JP', sans-serif"   # 和文と本文。同梱の書体。Web フォントは読まない
    numeric: "'Barlow Condensed', 'Noto Sans CJK JP', sans-serif"   # 0.5.0 で足した。日時と回数の数字だけ（OFL 1.1）
    serif: 使わない（Noto Serif CJK JP は同梱されているが、このコンセプトでは使わない）
    bundling: >-
      student-app は pubspec の fonts に Noto Sans CJK JP と Barlow Condensed（700・800 の静的な ttf）を同梱する。admin-web は Barlow Condensed の woff2 を public/fonts/ に置き、
      @font-face で同じオリジンから読む（next/font/google と外の URL は使わない）。和文は端末の Noto Sans CJK JP を font-family で指定する
    license: Barlow Condensed は SIL OFL 1.1。両アプリに OFL.txt を同梱して示す（student-app は LicenseRegistry、admin-web は public/fonts/OFL.txt）
    bundling_status: 0.5.0 で Barlow Condensed を両アプリに同梱した（#981）。student-app の Noto Sans CJK JP の同梱はまだで、名前で指定し、端末になければ端末の既定のゴシックで出る。カタログ（catalog.html）は Web フォントを読まないので、撮った端末に Barlow Condensed がなければ numeric の 2 番目の Noto Sans CJK JP で出る
  weights: {regular: 400, bold: 700, extrabold: 800, black: 900}   # extrabold は numeric の display だけ（0.5.0）
  scale:   # 大きさ px / 太さ / 行間 / 字間。family がない段は sans
    display:  {size: 64, weight: 800, line_height: 1.0,  letter_spacing: "0em",     family: numeric, use: 残りの回数・次のレッスンの日時の数字。1 画面 1 か所, sample: "2"}
    headline: {size: 32, weight: 900, line_height: 1.2,  letter_spacing: "-0.03em", use: 画面の見出し, sample: "ホーム"}
    title:    {size: 17, weight: 900, line_height: 1.4,  letter_spacing: "0em",     use: 欄の見出し・カードの主の行・ダイアログの題, sample: "これからの予約"}
    figure:   {size: 32, weight: 700, line_height: 1.0,  letter_spacing: "0em",     family: numeric, use: 予約のカードの日付のコマの日・一覧のまとめの数, sample: "28"}
    figure_sm: {size: 22, weight: 700, line_height: 1.1, letter_spacing: "0.01em",  family: numeric, use: カードの時刻（12:00〜12:30）, sample: "12:00〜12:30"}
    body:     {size: 16, weight: 400, line_height: 1.65, letter_spacing: "0.01em",  use: 本文・規定・誤りの知らせ, sample: "予約を読み込めませんでした。「ホームを更新する」でもう一度読み込めます。"}
    small:    {size: 14, weight: 400, line_height: 1.6,  letter_spacing: "0.01em",  use: カードの補足・ラベル・状態のタグ（700）, sample: "テニス・コーチ: 山田"}
    caption:  {size: 12, weight: 700, line_height: 1.5,  letter_spacing: "0.02em",  use: しるし・日付のコマの月と曜日だけ。文には使わない, sample: "10月・水"}
  sample_rule: 書体の見本（sample とカタログ）は日本語で、実際の画面の文言にする。サービスは日本国内だけに出す
  admin_web: admin-web は display を使わず、headline を 28px（字間 -0.02em）、本文を 16px にする。figure は本部のホームとコーチのホームのまとめの数だけ。表の数字は small の sans で tnum
  emphasis: 本文の強調は 700。下線は押せるリンクと text のボタンだけ。斜体は使わない
  max_line_length: 本文の 1 行は 40 字まで（admin-web の wide の画面でも表の外の文は 40em まで）
  punctuation:
    - 句読点は「、」「。」。全角の約物（「」（）・〜）を使い、行頭に来る約物は詰める（palt を使わない。字間は letter_spacing だけ）
    - 英数字と和文のあいだは半角スペースを 1 つ（例「残り 2 回」「10/28（水）12:00」）
    - 感嘆符は全角「！」で、1 つの文言に 1 つまで。疑問符は確認の題だけ
  numerals:
    style: 日時と回数の大きな数字（display・figure・figure_sm）は numeric の書体。それ以外の数字は sans で等幅（font-feature-settings "tnum"）
    unit: 単位（回・分）と曜日は sans で、数字より小さく添える（display の数字に title の「回」）
    example: 「残り [2] 回」の 2 を display（numeric 64px 800）、回を title
    not_for: 文の中の数字（「月 2 回のうち」）と規定は sans の body のまま

spacing:   # design_guideline の spacing_layout（余白・グリッド・画面幅・安全領域）
  base_unit: 4
  scale_px: {xs: 4, sm: 8, md: 16, lg: 24, xl: 40}
  rules:
    - 画面の左右は md 16px（PC の admin-web は lg 24px）
    - 欄と欄のあいだは xl 40px、欄の中の行と行は sm 8px、カードの中の余白は md 16px
    - 押せる部品の高さは 48px 以上（student-app のボタンは 56px）、押せるもの同士のあいだは sm 8px 以上
    - 段階にない値（例 12px・20px）を余白に使わない
  grid:
    phone: 1 段。幅いっぱい（左右 16px）
    tablet: 1 段、中身の幅は 600px まで中央寄せ
    pc: admin-web は 1 段。読む画面（ログイン・詳細・フォーム・本部のホーム）は content_width_px の reading、本部の一覧の画面（data_table が主役）は wide。どちらも左右 lg 24px で中央寄せ
    admin_web_narrow: 600〜1023px は幅いっぱいで左右 lg 24px、600px 未満は左右 md 16px。表が収まらないときは data_table の wrapper だけを横に動かす
  content_width_px: {reading: 768, wide: 1280}   # 0.3.0
  wide_rules:
    - wide の画面でも、表の外の文（件数・説明・知らせ）は 1 行 40 字まで（max-width 40em）
    - 表は 1 段の幅いっぱい（width 100%）に広げ、列の幅は中身で決める。細い枠に押し込んで折り返させない
  breakpoints_px: {phone: 0, tablet: 600, pc: 1024}
  safe_area: student-app は SafeArea の内側に置く。下に固定するボタンは下の安全領域 + 16px 上に置く

shape:   # design_guideline の shape_elevation（角丸・影と重なり）
  radius_px: {sm: 6, md: 12, pill: 999}
  usage:   # 0.5.0 でボタンを pill から md に
    pill: 絞り込みのチップ・状態の点・spinner だけ
    md: ボタン・カード・ダイアログ・入力欄・知らせ・score_panel
    sm: 日付のコマ・しるし（未読など）・コーチの顔写真
  elevation:
    rule: 影は使わない（box-shadow・Material の elevation は 0）。重なりは border の線と面の色で示す
    levels:
      - {level: 0, use: 画面の地, color: background}
      - {level: 1, use: カード, color: background, note: border の 1px（0.5.0）}
      - {level: 2, use: 主役の 1 か所, color: inverse_surface, note: 1 画面に 1 か所}
      - {level: 3, use: ダイアログ・下から出る面, color: background, note: 後ろに scrim}
  z_order: [content, sticky_bar, toast, scrim, dialog]

iconography:
  set: Material Symbols Rounded（Outlined の線の形）。Flutter は同梱の Icons の *_outlined / *_rounded、admin-web は同じ形の SVG を同梱する
  stroke_px: 2.25
  size_px: {default: 24, small: 20}
  touch_target_px: 48
  color: 文字と同じ色（text か on_inverse_surface）。状態のアイコンと点だけ status の fg
  label:
    - アイコンだけの押せる部品には必ず読み上げのラベル（tooltip / aria-label）を付ける
    - 画面の主な入口（ホームの「コーチを探す」など）はアイコンと文字を並べる
    - 大事な入口はアイコンを inverse_surface の面に白抜きで置く（1 画面 1 か所）
  status_mark: 状態は 8px の丸い点（status の fg）。完了の印は 20px のライムの丸にインクのチェック（成功の知らせの中だけ）
  decoration: 太い直線 4px と斜めの帯（-12°）。inverse_surface の中で secondary の色だけ

motion:
  durations_ms: {instant: 0, fast: 120, base: 200, slow: 320}
  easing:
    standard: "cubic-bezier(0.2, 0, 0, 1)"
    enter: "cubic-bezier(0, 0, 0, 1)"
    exit: "cubic-bezier(0.3, 0, 1, 1)"
  usage:
    - 押下の色の変化は fast 120ms
    - 画面の移り・ダイアログ・知らせの出入りは base 200ms
    - 確定したときの数字の入れ替わりだけ slow 320ms（1 回だけ。くり返さない）
    - 点滅・3 回以上くり返す動き・自動で流れる動きは使わない
  reduced_motion: 端末の「視差効果を減らす」（MediaQuery.disableAnimations / prefers-reduced-motion）では、移動と拡大をやめ、色と透明度の変化だけ fast 120ms にする
