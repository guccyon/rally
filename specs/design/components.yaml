# 部品。オンボーディングでは基本の部品だけ。値は tokens.yaml の名前で書く
# 基準の書き方: level（must | should | may）・statement・why・check（deterministic | design_inspector | human）
# 状態の共通: pressed は fast 120ms で色を変える / disabled は押せない理由を近くに文で出す / loading は二度押しを止める
schema_version: "0.1"
status: draft
section: components
lifecycle_default: trial   # オンボーディングの部品は試用から始める（governance）

components:
  - id: button
    ja: ボタン
    lifecycle: trial
    use: 画面の操作を 1 つ実行する（予約する・送る・保存する）
    not_for: 画面の移動だけ → list_row か文字のリンク。並ぶ選択肢 → チップ（未定義。足りなければ提案する）
    parts: [container, label, leading_icon（任意）, spinner]
    variants:
      primary:   {container: primary, label: on_primary, radius: pill, note: 1 画面に 1 つ}
      secondary: {container: background, border: border_strong, label: primary, radius: pill}
      on_dark:   {container: secondary, label: on_secondary, radius: pill, note: inverse_surface の面の中だけ}
      danger:    {container: danger.fg, label: on_primary, radius: pill, note: 取り消せない操作の確認の中だけ}
      text:      {container: なし, label: primary, note: 補助の操作（「予約をすべて見る」）}
    size: {height_px: 48, padding_x_px: 24, label: "title 以下。16px・700"}
    states:
      default: 上の variants
      pressed: primary は primary_pressed、secondary と text は primary_container の面
      disabled: 面 surface・文字 text_muted・輪郭なし
      loading: ラベルを残したまま spinner を前に出し、押せなくする
      error: ボタンは変えず、notice で失敗を出す
    behavior: 押したら結果が出るまで loading。二度押しで同じ操作を 2 回送らない
    wording: 動詞で終える（「予約する」「動画を送る」）。「OK」「はい」を使わない
    a11y: 文字のないボタンは読み上げのラベル。押せる範囲は 48×48px 以上
    rules:
      - level: should
        statement: 主なボタン（primary）は 1 画面に 1 つまで
        why: 次の一手が 2 つあると、生徒が迷って止まる
        check: design_inspector
      - level: should
        statement: ボタンの文言は動詞で終える
        why: 押すと何が起きるかが文言だけで分かる
        check: deterministic
    examples:
      good: 「スロットを探して予約する」が primary、「予約をすべて見る」が text
      bad: 「予約する」と「コーチを探す」がどちらも primary で並ぶ
    preview:
      - label: "primary"
        html: "<div class=\"pv\"><span class=\"btn btn-primary\">スロットを探して予約する</span></div>"
      - label: "押下"
        html: "<div class=\"pv\"><span class=\"btn btn-pressed\">スロットを探して予約する</span></div>"
      - label: "secondary・text"
        html: "<div class=\"pv\"><span class=\"btn btn-secondary\">コーチを探す</span> <span class=\"btn btn-text\">予約をすべて見る</span></div>"
      - label: "読み込み中"
        html: "<div class=\"pv\"><span class=\"btn btn-primary\" aria-busy=\"true\"><i class=\"spin\"></i>予約する</span></div>"
      - label: "無効"
        html: "<div class=\"pv\"><span class=\"btn btn-disabled\" aria-disabled=\"true\">予約する</span><p class=\"type-small hint\">スロットを選ぶと予約できます。</p></div>"


  - id: text_field
    ja: 入力欄
    lifecycle: trial
    use: 文字を 1 行か数行入れる（表示名・チャットの本文・評価の一言・自己紹介）
    not_for: 決まった選択肢 → 選択欄（select）かラジオ。オンとオフ → スイッチ
    parts: [label, field, helper, counter（上限のある欄）, error_text]
    variants: {single_line: 高さ 48px, multi_line: 3 行から伸びる}
    style: {field: background, border: border_strong 1px, radius: md, label: small 700 text, helper: small text_muted}
    states:
      default: border_strong
      focus: focus_ring 2px
      disabled: 面 surface・文字 text_muted
      error: 輪郭 danger.fg 2px と、下に error_text（danger.fg の文字とアイコン）
    behavior: 検証は欄を離れたときと送るとき。打っている途中には誤りを出さない
    wording: ラベルは名詞（「表示名」）。helper に上限（「200 文字まで」）
    a11y: ラベルは field に結び付ける（placeholder だけにしない）。error_text は読み上げで欄と一緒に読む
    rules:
      - level: must
        statement: 入力欄には見えるラベルを付ける（placeholder で代えない）
        why: 打ち始めると placeholder が消え、何の欄か分からなくなる。読み上げでも欄の名前が要る
        check: deterministic
    examples:
      good: ラベル「一言」・helper「200 文字まで」・counter「12 / 200」
      bad: placeholder「一言を入力」だけ
    preview:
      - label: "通常"
        html: "<div class=\"pv tf\"><label class=\"type-small\">表示名</label><div class=\"field type-body\">山田 太郎</div><div class=\"help type-small\"><span>1〜20 文字</span><span>5 / 20</span></div></div>"
      - label: "フォーカス"
        html: "<div class=\"pv tf focus\"><label class=\"type-small\">一言</label><div class=\"field type-body\">フォームが分かりやすかったです</div><div class=\"help type-small\"><span>200 文字まで</span><span>15 / 200</span></div></div>"
      - label: "誤り"
        html: "<div class=\"pv tf err\"><label class=\"type-small\">表示名</label><div class=\"field type-body\"></div><div class=\"etext type-small\" role=\"alert\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v6M12 16.5v.5\"/></svg>表示名は 1〜20 文字で入れてください。</div></div>"
      - label: "無効"
        html: "<div class=\"pv tf off\"><label class=\"type-small\">メールアドレス</label><div class=\"field type-body\">taro@example.jp</div><div class=\"help type-small\"><span>メールアドレスはここでは変えられません。</span></div></div>"


  - id: card
    ja: カード
    lifecycle: trial
    use: 1 件のまとまり（予約・コーチ・添削）を面で囲む
    not_for: 文 1 行だけ → list_row。画面の主役の数字 → score_panel
    parts: [container, title, meta, status_tag（任意）, action（任意）]
    style: {container: surface, radius: md, padding_px: 16, gap_px: 8, shadow: なし}
    states: {pressed: 押せるカードは primary_container の面, disabled: 使わない}
    behavior: カード全体を押せるときは中にボタンを置かない（押せる場所を 1 つにする）
    a11y: 押せるカードは 1 つのボタンとして読み上げ、題・日時・状態を 1 つの文で読む
    examples:
      good: "題「10/28（水）12:00〜12:30」・meta「テニス・コーチ: 山田」・status_tag「確定済み」"
      bad: カードの中にカードを重ねる
    preview:
      - label: "確定済み"
        html: "<div class=\"pv card\"><div class=\"type-title\">10/28（水）12:00〜12:30</div><div class=\"type-small muted\">テニス・コーチ: 山田</div><span class=\"tag tag-success type-caption\">確定済み</span></div>"
      - label: "確定待ち"
        html: "<div class=\"pv card\"><div class=\"type-title\">11/4（水）18:00〜18:30</div><div class=\"type-small muted\">野球・コーチ: 佐藤</div><span class=\"tag tag-warning type-caption\">確定待ち</span></div>"
      - label: "押下"
        html: "<div class=\"pv card is-pressed\"><div class=\"type-title\">10/28（水）12:00〜12:30</div><div class=\"type-small muted\">テニス・コーチ: 山田</div><span class=\"tag tag-success type-caption\">確定済み</span></div>"


  - id: list_row
    ja: 一覧の行
    lifecycle: trial
    use: 同じ形のものを並べ、押すと詳細へ移る（お知らせ・スレッド・受けたレッスン・admin-web の一覧）
    not_for: 1 件に操作が 2 つ以上 → card
    parts: [leading（アイコンか顔写真。任意）, title, subtitle, trailing（しるし・chevron）]
    style: {min_height_px: 56, padding_x_px: 16, divider: border, title: body 700, subtitle: small text_muted}
    states: {pressed: primary_container, unread: 左に primary の 4px の線と、title の前に「未読」のしるし}
    a11y: 未読は色と線だけでなく、読み上げで「未読」と読む
    examples:
      good: 「コーチから返事が届きました」・「10/27 18:04」・未読のしるし
      bad: 未読を太字だけで示す
    preview:
      - label: "通常"
        html: "<div class=\"pv row\"><div class=\"main\"><div class=\"type-body t\">本部からのお知らせ</div><div class=\"type-small muted\">10/27 9:00</div></div><span class=\"muted\">›</span></div>"
      - label: "未読"
        html: "<div class=\"pv row unread\"><div class=\"main\"><div class=\"type-body t\"><span class=\"badge type-caption\">未読</span> コーチから返事が届きました</div><div class=\"type-small muted\">10/27 18:04</div></div><span class=\"muted\">›</span></div>"
      - label: "押下"
        html: "<div class=\"pv row is-pressed\"><div class=\"main\"><div class=\"type-body t\">テニス・コーチ: 山田</div><div class=\"type-small muted\">10/21 受けたレッスン</div></div><span class=\"muted\">›</span></div>"


  - id: badge
    ja: しるし
    lifecycle: trial
    use: 未読の数・状態の小さな印
    parts: [container, label]
    variants:
      count: {container: danger.fg, label: on_primary, radius: sm, min_size_px: 20}
      dot: {container: danger.fg, size_px: 8}
      on_dark: {container: secondary, label: on_secondary, radius: sm}
    a11y: 入口のラベルに数を足す（「チャット、未読 3 件」）
    preview:
      - label: "count"
        html: "<div class=\"pv\"><span class=\"entry type-body\">チャット <span class=\"badge type-caption\" aria-label=\"未読 3 件\">3</span></span></div>"
      - label: "dot"
        html: "<div class=\"pv\"><span class=\"entry type-body\">お知らせ <span class=\"dot\" aria-label=\"未読あり\"></span></span></div>"
      - label: "on_dark"
        html: "<div class=\"pv panel dark\"><span class=\"entry type-body\">返ってきた添削 <span class=\"badge dark type-caption\">1</span></span></div>"


  - id: status_tag
    ja: 状態のタグ
    lifecycle: trial
    use: 予約・動画添削・スロットの状態を出す（呼び名は glossary の states）
    style: {container: "status.*.container", label: "status.*.on_container, caption 12px 700", radius: sm, icon: 16px}
    rules:
      - level: must
        statement: 状態は色だけでなく、glossary の呼び名の文字を出す
        why: 色の見分けが難しい生徒も、読み上げの利用者も状態が分かる
        check: design_inspector
    examples:
      good: 「確定待ち」（warning の面と時計のアイコン）
      bad: 黄色の点だけ
    preview:
      - label: "確定待ち（warning）"
        html: "<div class=\"pv\"><span class=\"tag tag-warning type-caption\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/></svg>確定待ち</span></div>"
      - label: "確定済み（success）"
        html: "<div class=\"pv\"><span class=\"tag tag-success type-caption\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\" stroke-linecap=\"round\"><path d=\"M5 12l4 4 10-10\"/></svg>確定済み</span></div>"
      - label: "キャンセル済み（neutral）"
        html: "<div class=\"pv\"><span class=\"tag tag-neutral type-caption\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg>キャンセル済み</span></div>"


  - id: score_panel
    ja: スコアの面
    lifecycle: trial
    use: 画面の主役の数字を 1 つ見せる（今月のビデオ通話の残り・次のレッスンの日時）
    not_for: 一覧・規定の説明・admin-web
    parts: [container, eyebrow（small）, number（display）, unit（title）, note（small）, decoration（斜めの帯。任意）, action（on_dark のボタン。任意）]
    style: {container: inverse_surface, text: on_inverse_surface, eyebrow: on_inverse_surface_muted, accent: secondary の 4px の下線, radius: md, padding_px: 24}
    rules:
      - level: should
        statement: score_panel は 1 画面に 1 つまで
        why: 熱い場所が 2 つあると、どちらが大事か分からず疲れる
        check: deterministic
      - level: should
        statement: 数字の条件（月 2 回のうち、など）は note に本文と同じ言葉で書く
        why: 大きな数字だけだと、何の残りかを読み違える
        check: design_inspector
    a11y: 数字と単位をまとめて 1 つの文で読む（「今月のビデオ通話、残り 2 回、月 2 回のうち」）
    examples:
      good: "eyebrow「今月のビデオ通話」・number「2」・unit「回」・note「月 2 回のうち（プラン: スタンダード）」"
      bad: 「2」だけを大きく、何の数かがない
    preview:
      - label: "残りの回数"
        html: "<div class=\"pv w panel dark\" aria-label=\"今月のビデオ通話、残り 2 回、月 2 回のうち\"><i class=\"band\"></i><div class=\"eb type-small\">今月のビデオ通話</div><div><span class=\"num type-display\">2</span> <span class=\"type-title\">回</span></div><div class=\"note note-d type-small\">月 2 回のうち（プラン: スタンダード）</div></div>"
      - label: "空のホーム（on_dark のボタン）"
        html: "<div class=\"pv w panel dark\"><i class=\"band\"></i><div class=\"eb type-small\">はじめての練習</div><div class=\"type-headline\">まずは体験予約</div><span class=\"btn btn-on-dark\" style=\"align-self:flex-start\">コーチを探す</span></div>"


  - id: notice
    ja: 知らせ
    lifecycle: trial
    use: 操作の結果と、欄が読めなかったことを伝える
    variants:
      inline: {container: "status.*.container", text: "status.*.on_container", icon: "status.*.fg", radius: md, note: 欄の中か画面の上。消えない}
      toast: {container: inverse_surface, text: on_inverse_surface, radius: md, duration_ms: 4000, note: 成功だけ。画面の下、安全領域の上}
    states: [info, success, warning, danger]
    behavior: 失敗は inline で、直すか閉じるまで残す。toast は失敗に使わない
    wording: 失敗は「何が起きたか」と「どうすればよいか」の 2 文（content.yaml）
    a11y: 成功は role=status（Flutter は liveRegion）、失敗は role=alert
    rules:
      - level: should
        statement: 失敗の知らせは自動で消さない
        why: 読み終わる前に消えると、生徒は何が起きたか分からず同じ操作をくり返す
        check: design_inspector
    preview:
      - label: "成功（inline）"
        html: "<div class=\"pv notice n-success type-body\" role=\"status\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\" stroke-linecap=\"round\"><path d=\"M5 12l4 4 10-10\"/></svg><p>予約が確定しました。</p></div>"
      - label: "失敗（inline）"
        html: "<div class=\"pv notice n-danger type-body\" role=\"alert\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v6M12 16.5v.5\"/></svg><p>予約を読み込めませんでした。「ホームを更新する」でもう一度読み込めます。</p></div>"
      - label: "注意（inline）"
        html: "<div class=\"pv notice n-warning type-body\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\" stroke-linecap=\"round\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17.5v.5\"/></svg><p>今キャンセルすると、今月のビデオ通話の枠を 1 回使います。</p></div>"
      - label: "toast（成功だけ）"
        html: "<div class=\"pv notice toast type-body\" role=\"status\"><p>メッセージを送りました</p></div>"


  - id: empty_state
    ja: 空の表示
    lifecycle: trial
    use: 一覧や欄に 0 件のとき。背中を押す一言と次の操作を出す
    not_for: 読めなかったとき → notice（danger）。読み込み中 → loading
    parts: [container, message（body）, action（button。任意）]
    variants:   # 0.2.0 で決めた（人の判断 2026-11-02）
      screen:  {when: 画面にほかの主な操作（primary）がない, container: surface, action: button の primary}
      section: {when: 欄だけが空で、画面にほかの primary がある, container: background と border の 1px の線, action: button の secondary}
    style: {radius: md, padding_px: 24, gap_px: 16, text: text（0.2.0 で text_muted から変えた）}
    wording: 背中を押す一言と次の操作（「まだこれからの予約はありません。コーチを探して始めましょう」）
    a11y: message を見出しの次に読み、action は動詞のボタンとして読む
    rules:
      - level: should
        statement: surface の面の上に button の secondary を置かない（欄だけが空のときは section の形にする）
        why: 白い面のボタンが薄い灰色の面に沈み、次の操作が読みにくい（人の指摘 2026-11-02）
        check: design_inspector
      - level: should
        statement: empty_state の action は、画面にほかの primary がなければ primary、あれば secondary にする
        why: 空の画面でも次の一手を 1 つだけはっきり示し、主なボタンを 2 つにしない
        check: design_inspector
    examples:
      good: 予約が 0 件の一覧で、文と primary の「コーチを探す」
      bad: surface の面に secondary の「コーチを探す」と text_muted の文。空白のまま、または「データがありません」
    preview:
      - label: "screen（ほかに primary がない）"
        html: "<div class=\"pv empty empty-screen\"><p class=\"type-body\">まだこれからの予約はありません。コーチを探して始めましょう</p><span class=\"btn btn-primary\">コーチを探す</span></div>"
      - label: "section（画面に primary がある）"
        html: "<div class=\"pv empty empty-section\"><p class=\"type-body\">まだこれからの予約はありません。</p><span class=\"btn btn-secondary\">コーチを探す</span></div>"
      - label: "文だけ"
        html: "<div class=\"pv empty empty-screen\"><p class=\"type-body\">まだ月額契約はありません。月額契約を始めると、毎月のビデオ通話の残りの回数がここに出ます。</p></div>"


  - id: loading
    ja: 読み込み中
    lifecycle: trial
    use: API を読んでいるあいだ
    variants:
      bar: {color: primary, track: primary_container, height_px: 4, note: 画面の上。画面全体の読み込み}
      section_text: {text: "「〜を読み込んでいます…」small text_muted", note: 欄ごとの読み込み}
      spinner: {size_px: 20, note: ボタンの中だけ}
    behavior: 300ms より速く終わるときは出さない。読み込み中も読めた欄はそのまま出す
    a11y: 読み込みの始まりと終わりを読み上げに伝える
    preview:
      - label: "bar（画面全体）"
        html: "<div class=\"pv\"><div class=\"bar\" role=\"progressbar\" aria-label=\"ホームを読み込んでいます\"><i></i></div><div class=\"type-headline\">ホーム</div></div>"
      - label: "section_text（欄ごと）"
        html: "<div class=\"pv sect\"><h4 class=\"type-title\">お気に入りのコーチ</h4><p class=\"type-small muted\" role=\"status\">お気に入りのコーチを読み込んでいます…</p></div>"


  - id: confirm_dialog
    ja: 確認のダイアログ
    lifecycle: trial
    use: 送る前の確認と、取り消せない操作（予約のキャンセル・受付の停止・メニューの非公開）
    not_for: 取り消せる操作 → 確認なしで実行し、notice で結果を出す
    parts: [title（疑問の文）, body（対象と結果と条件）, cancel_action（text）, confirm_action（primary か danger）]
    style: {container: background, radius: md, padding_px: 24, scrim: scrim, max_width_px: 400}
    behavior: 開いたらフォーカスを題へ。cancel_action を左、confirm_action を右。外を押す・戻るは cancel と同じ
    wording: 題「予約をキャンセルしますか？」、confirm は動詞（「キャンセルする」）、cancel は「やめる」
    rules:
      - level: must
        statement: 回数を使う・取り消せない操作は、確認のダイアログの本文に対象と結果を省かずに書く
        why: 生徒が今月のビデオ通話の枠を知らずに失うのを防ぐ
        check: design_inspector
    examples:
      good: 本文「10/28（水）12:00〜12:30 のテニスの予約をキャンセルします。今キャンセルすると、今月のビデオ通話の枠を 1 回使います。」
      bad: 題「よろしいですか？」・ボタン「OK」
    preview:
      - label: "取り消せない操作（danger）"
        html: "<div class=\"pv w scrim\"><div class=\"dlg\" role=\"dialog\"><h4 class=\"type-title\">予約をキャンセルしますか？</h4><p class=\"type-body\">10/28（水）12:00〜12:30 のテニスの予約をキャンセルします。今キャンセルすると、今月のビデオ通話の枠を 1 回使います。</p><div class=\"acts\"><span class=\"btn btn-text\">やめる</span><span class=\"btn btn-danger\">キャンセルする</span></div></div></div>"
      - label: "送る前の確認（primary）"
        html: "<div class=\"pv w scrim\"><div class=\"dlg\" role=\"dialog\"><h4 class=\"type-title\">体験予約を申し込みますか？</h4><p class=\"type-body\">11/4（水）18:00〜18:30 の野球の体験予約を申し込みます。コーチが確定すると、チャットが開きます。</p><div class=\"acts\"><span class=\"btn btn-text\">やめる</span><span class=\"btn btn-primary\">申し込む</span></div></div></div>"
      - label: "読み込み中"
        html: "<div class=\"pv w scrim\"><div class=\"dlg\" role=\"dialog\"><h4 class=\"type-title\">受付を停止しますか？</h4><p class=\"type-body\">コーチ: 山田 の受付を停止します。新しい予約を受け付けなくなります。確定済みの予約はそのまま残ります。</p><div class=\"acts\"><span class=\"btn btn-disabled\">やめる</span><span class=\"btn btn-danger\" aria-busy=\"true\"><i class=\"spin\"></i>停止する</span></div></div></div>"

preview_css: |
  .pv{font-family:var(--font-sans);color:var(--color-text);width:320px}
  .pv.w{width:360px}
  .pv p{margin:0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-sm);min-height:48px;padding:0 var(--space-lg);border-radius:var(--radius-pill);border:1px solid transparent;font:700 16px/1.25 var(--font-sans);letter-spacing:0.01em;white-space:nowrap}
  .btn-primary{background:var(--color-primary);color:var(--color-on-primary)}
  .btn-pressed{background:var(--color-primary-pressed);color:var(--color-on-primary)}
  .btn-secondary{background:var(--color-background);border-color:var(--color-border-strong);color:var(--color-primary)}
  .btn-secondary.is-pressed{background:var(--color-primary-container)}
  .btn-text{background:none;color:var(--color-primary);padding:0 var(--space-md)}
  .btn-danger{background:var(--color-danger-fg);color:var(--color-on-primary)}
  .btn-on-dark{background:var(--color-secondary);color:var(--color-on-secondary)}
  .btn-disabled{background:var(--color-surface);color:var(--color-text-muted)}
  .spin{width:16px;height:16px;border-radius:var(--radius-pill);border:2px solid currentColor;border-right-color:transparent;display:inline-block}
  .hint{color:var(--color-text-muted);margin-top:var(--space-sm)}
  .tf label{display:block;font-weight:700;margin-bottom:var(--space-xs)}
  .tf .field{min-height:48px;display:flex;align-items:center;padding:0 var(--space-md);background:var(--color-background);border:1px solid var(--color-border-strong);border-radius:var(--radius-md)}
  .tf.focus .field{border:2px solid var(--color-focus-ring)}
  .tf.err .field{border:2px solid var(--color-danger-fg)}
  .tf.off .field{background:var(--color-surface);color:var(--color-text-muted)}
  .tf .help{display:flex;justify-content:space-between;color:var(--color-text-muted);margin-top:var(--space-xs)}
  .tf .etext{display:flex;gap:var(--space-xs);align-items:center;color:var(--color-danger-fg);margin-top:var(--space-xs)}
  .card{background:var(--color-surface);border-radius:var(--radius-md);padding:var(--space-md);display:flex;flex-direction:column;gap:var(--space-sm)}
  .card.is-pressed{background:var(--color-primary-container)}
  .muted{color:var(--color-text-muted)}
  .tag{display:inline-flex;align-items:center;gap:var(--space-xs);padding:0 var(--space-sm);border-radius:var(--radius-sm);align-self:flex-start}
  .tag-warning{background:var(--color-warning-container);color:var(--color-warning-on-container)}
  .tag-success{background:var(--color-success-container);color:var(--color-success-on-container)}
  .tag-neutral{background:var(--color-surface);color:var(--color-text-muted);border:1px solid var(--color-border)}
  .row{display:flex;align-items:center;gap:var(--space-md);min-height:56px;padding:var(--space-sm) var(--space-md);border-bottom:1px solid var(--color-border);background:var(--color-background)}
  .row.unread{box-shadow:none;border-left:4px solid var(--color-primary)}
  .row.is-pressed{background:var(--color-primary-container)}
  .row .main{flex:1}
  .row .t{font-weight:700}
  .badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 var(--space-xs);border-radius:var(--radius-sm);background:var(--color-danger-fg);color:var(--color-on-primary)}
  .badge.dark{background:var(--color-secondary);color:var(--color-on-secondary)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:var(--radius-pill);background:var(--color-danger-fg)}
  .entry{display:inline-flex;align-items:center;gap:var(--space-sm)}
  .dark{background:var(--color-inverse-surface);color:var(--color-on-inverse-surface)}
  .panel{border-radius:var(--radius-md);padding:var(--space-lg);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:var(--space-sm)}
  .panel .eb{color:var(--color-on-inverse-surface-muted)}
  .panel .num{border-bottom:4px solid var(--color-secondary);display:inline-block;margin-bottom:var(--space-xs);align-self:flex-start;font-variant-numeric:tabular-nums}
  .panel .band{position:absolute;right:-24px;top:16px;width:120px;height:16px;background:var(--color-secondary);transform:rotate(-12deg)}
  .panel .eb,.panel .note{position:relative}
  .note-d{color:var(--color-on-inverse-surface-muted)}
  .notice{display:flex;gap:var(--space-sm);align-items:flex-start;padding:var(--space-md);border-radius:var(--radius-md)}
  .n-success{background:var(--color-success-container);color:var(--color-success-on-container)}
  .n-success svg{color:var(--color-success-fg)}
  .n-danger{background:var(--color-danger-container);color:var(--color-danger-on-container)}
  .n-danger svg{color:var(--color-danger-fg)}
  .n-warning{background:var(--color-warning-container);color:var(--color-warning-on-container)}
  .n-warning svg{color:var(--color-warning-fg)}
  .toast{background:var(--color-inverse-surface);color:var(--color-on-inverse-surface)}
  .notice svg{flex:none;margin-top:var(--space-xs)}
  .empty{border-radius:var(--radius-md);padding:var(--space-lg);display:flex;flex-direction:column;gap:var(--space-md);align-items:flex-start;color:var(--color-text)}
  .empty-screen{background:var(--color-surface)}
  .empty-section{background:var(--color-background);border:1px solid var(--color-border)}
  .sect h4{margin:0 0 var(--space-sm)}
  .bar{height:4px;background:var(--color-primary-container);border-radius:var(--radius-pill);overflow:hidden;margin-bottom:var(--space-md)}
  .bar i{display:block;width:40%;height:100%;background:var(--color-primary)}
  .scrim{background:var(--color-scrim);padding:var(--space-lg);border-radius:var(--radius-md)}
  .dlg{background:var(--color-background);border-radius:var(--radius-md);padding:var(--space-lg);display:flex;flex-direction:column;gap:var(--space-md)}
  .dlg h4{margin:0}
  .acts{display:flex;justify-content:flex-end;gap:var(--space-sm)}
