# 運用（ガイドラインの育て方）
schema_version: "0.1"
status: draft
section: governance
version: 0.8.0     # 正本の版。semver。破る変更（名前・値の削除や意味の変更）は major、足すのは minor、文の直しは patch

lifecycle:
  stages:
    - {id: proposed, ja: 提案, meaning: 案だけ。画面では使わない（例 ダークモードの配色、下のタブ）}
    - {id: trial, ja: 試用, meaning: 画面で使ってよい。名前と値は変わりうる。オンボーディングの部品はここから}
    - {id: stable, ja: 安定, meaning: 名前と値を守る。変えるときは major の版と移行}
    - {id: deprecated, ja: 廃止, meaning: 新しい画面で使わない。代わりの部品と消す版を書く}
  promote_to_stable: 3 つ以上の画面で使い、デザイン検査役の指摘が 2 回続けてない部品

intake:   # 変更の入り口
  - source: design_inspector
    what: デザイン検査役の指摘（トークン外の値・部品外の要素・原則に合わない画面）
  - source: human_flag
    what: 人の違和感の印（見本・キャプチャを見て「熱すぎる」「読みにくい」など）
  - source: screen_task
    what: プロダクトデザイナー役が画面のタスクで足りなかった部品・型（Issue に「部品が足りない」と書く）

approval:
  factory: 新しい部品・新しい基準（should と may）・トークンの段の追加・試用から安定への昇格
  human: must の追加と変更、principles と concept_tone の変更、色の役割の値の変更、ダークモードの採用、廃止
  rule: 既存の名前と値を壊さない。変えるときは理由を changelog に書く

lint:   # 決定論の検査に移す基準（check が deterministic のもの）
  - id: token-only-color
    target: student-app の lib/、admin-web の src/
    detect: tokens.yaml にない色コード（Color(0x…)、Colors.*、#xxxxxx、Tailwind の色の class（text-gray-500 など））
  - id: token-only-spacing
    detect: spacing の段（4・8・16・24・40）と、その組み合わせにない余白（EdgeInsets・SizedBox・p-/m-/gap- の class）
  - id: token-only-radius
    detect: radius の段（6・12・999）にない角丸
  - id: no-shadow
    detect: elevation が 0 でない・box-shadow
  - id: font-family
    detect: Noto Sans CJK JP 以外の font-family と、Web フォントの読み込み（@import url・fonts.googleapis・next/font/google・外の URL の @font-face）
    allow: Barlow Condensed（tokens.yaml の typography.families.numeric。アプリに同梱したファイルを同じオリジンか pubspec の fonts で読むときだけ。0.5.0 で足した）
  - id: deprecated-token
    detect: scale.blue の値（#3A54B0 など）と 0.4.0 までの灰の値（#F1F3F8・#DDE1EA・#4A5163・#7D8599・#10131A）
  - id: button-shape
    detect: 角丸が md でないボタン（rounded-full・StadiumBorder）と、線だけの副のボタン（OutlinedButton）
  - id: status-tag-shape
    detect: 状態のタグの status の container の面（bg-success-container など。data_table の急ぎの行は除く）
  - id: one-score-panel
    detect: 1 画面に score_panel が 2 つ以上
  - id: a11y-labels
    detect: tooltip のない IconButton、aria-label のないアイコンだけのボタン、label のない入力欄
  - id: table-no-page-scroll
    target: admin-web の screens.ts の画面
    detect: 幅 360px と 1024px で document の scrollWidth が画面の幅を超える（ページ全体が横に動く）。table が overflow-x の包みの外にある。表の th・td に段にない余白（py-1 だけ・px-3 など）
  - id: target-size
    detect: 48px 未満の押せる部品
  - id: glossary-terms
    detect: 文言の中の glossary にない言い換え（例「予約枠」を画面の題に使う。glossary は「スロット」）
  - id: date-field-only
    target: admin-web の src/（src/components/ui/DateField.tsx を除く）
    detect: input type="date" を直に書いている要素
  - id: select-only
    target: admin-web の src/（src/components/ui/Select.tsx を除く）
    detect: select 要素を直に書いている要素（0.6.0）
  - id: media-no-record
    target: 入室前チェックの画面と camera_preview・level_meter の実装
    detect: MediaRecorder・captureStream・canvas の toBlob と toDataURL、getUserMedia の stream を fetch・WebSocket・RTCPeerConnection に渡すコード（0.7.0。must なので最初からマージを止める）
  - id: state-color-map
    detect: status_tag と timeline の点の色が booking_state・slot_state の対応と違う（timeline は 0.8.0 から）
  - id: description-list-only
    target: admin-web の src/（src/components/ui/DescriptionList.tsx を除く）
    detect: dl 要素を直に書いている要素（0.8.0）
lint_rollout: 最初は警告だけ。今の画面の違反を直し終えたら、must の基準の lint だけをマージを止める検査にする

requests:   # 画面のタスクから来た部品の求めのうち、まだ足していないもの
  - id: checkbox
    from: "#455（プロダクトデザイナー役、ADR 0025）"
    stage: 保留
    note: 案 b（予約ごとに選ぶ）でだけ使うので 0.4.0 では足さない。案 b を選んだら checkbox と「すべて選ぶ」を足すタスクを切る
  - id: patterns-detail-items
    from: "#1030"
    stage: 次の版
    note: patterns の detail の structure に description_list と timeline を書き足す（0.8.0 は字数の上限で components にだけ書いた）

changelog:
  file: specs/design/CHANGELOG.md
  format: 版・日付・変えたもの・理由・効く画面（screens.ts と capture_test.dart の画面の id）・承認（工場か人）
  entries:   # 直近の版だけ。全文は specs/design/CHANGELOG.md
    - version: 0.8.0
      date: "2026-11-09"
      change: >-
        description_list（inline・stacked）と timeline を足した。lint に description-list-only を足し、state-color-map を timeline に広げた。
        既存の見本を 10 個絞った（字数の上限。部品の定めは同じ）
      reason: >-
        #1030 の画面の設計で部品が足りなかった（ADR 0025）。admin-web の 7 か所の dl に、ラベルの幅と狭い幅の形がなかった。経緯はお知らせの取り下げなどでも要る。トークンと既存の名前・値は変えていない
      affects: admin-web の dl のある画面（hq-booking-detail・hq-coach-overview・hq-coach-reviews*・hq-student-activity・hq-coach-leave*・hq-announcement-confirm・coach-live）と design-catalog。今変わるのは design-catalog だけ
      approved_by: 工場（部品・should・lint の追加。must はない）
