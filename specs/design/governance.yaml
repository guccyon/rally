# 運用（ガイドラインの育て方）
schema_version: "0.1"
status: draft
section: governance
version: 0.4.0     # 正本の版。semver。破る変更（名前・値の削除や意味の変更）は major、足すのは minor、文の直しは patch

lifecycle:
  stages:
    - {id: proposed, ja: 提案, meaning: 案だけ。画面では使わない（例 ダークモードの配色、下のタブ）}
    - {id: trial, ja: 試用, meaning: 画面で使ってよい。名前と値は変わりうる。オンボーディングの部品はここから}
    - {id: stable, ja: 安定, meaning: 名前と値を守る。変えるときは major の版と移行}
    - {id: deprecated, ja: 廃止, meaning: 新しい画面で使わない。代わりの部品と消す版を書く}
  promote_to_stable: 3 つ以上の画面で使い、デザイン検査役の指摘が 2 回続けてない部品

intake:   # 変更の入り口
  - source: design_inspector
    what: デザイン検査役の指摘（トークン外の値・部品外の要素・原則に合わない画面）
  - source: human_flag
    what: 人の違和感の印（見本・キャプチャを見て「熱すぎる」「読みにくい」など）
  - source: screen_task
    what: プロダクトデザイナー役が画面のタスクで足りなかった部品・型（Issue に「部品が足りない」と書く）

approval:
  factory: 新しい部品・新しい基準（should と may）・トークンの段の追加・試用から安定への昇格
  human: must の追加と変更、principles と concept_tone の変更、色の役割の値の変更、ダークモードの採用、廃止
  rule: 既存の名前と値を壊さない。変えるときは理由を changelog に書く

lint:   # 決定論の検査に移す基準（check が deterministic のもの）
  - id: token-only-color
    target: student-app の lib/、admin-web の src/
    detect: tokens.yaml にない色コード（Color(0x…)、Colors.*、#xxxxxx、Tailwind の色の class（text-gray-500 など））
  - id: token-only-spacing
    detect: spacing の段（4・8・16・24・40）と、その組み合わせにない余白（EdgeInsets・SizedBox・p-/m-/gap- の class）
  - id: token-only-radius
    detect: radius の段（6・12・999）にない角丸
  - id: no-shadow
    detect: elevation が 0 でない・box-shadow
  - id: font-family
    detect: Noto Sans CJK JP 以外の font-family と、Web フォントの読み込み（@import url・fonts.googleapis）
  - id: one-score-panel
    detect: 1 画面に score_panel が 2 つ以上
  - id: a11y-labels
    detect: tooltip のない IconButton、aria-label のないアイコンだけのボタン、label のない入力欄
  - id: table-no-page-scroll
    target: admin-web の screens.ts の画面
    detect: 幅 360px と 1024px で document の scrollWidth が画面の幅を超える（ページ全体が横に動く）。table が overflow-x の包みの外にある。表の th・td に段にない余白（py-1 だけ・px-3 など）
  - id: target-size
    detect: 48px 未満の押せる部品
  - id: glossary-terms
    detect: 文言の中の glossary にない言い換え（例「予約枠」を画面の題に使う。glossary は「スロット」）
  - id: date-field-only
    target: admin-web の src/（src/components/ui/DateField.tsx を除く）
    detect: input type="date" を直に書いている要素
  - id: state-color-map
    detect: status_tag の色が booking_state・slot_state の対応と違う
lint_rollout: 最初は警告だけ。今の画面の違反を直し終えたら、must の基準の lint だけをマージを止める検査にする

requests:   # 画面のタスクから来た部品の求めのうち、まだ足していないもの
  - id: checkbox
    from: "#455（プロダクトデザイナー役、ADR 0025）"
    stage: 保留
    note: 案 b（予約ごとに選ぶ）でだけ使うので 0.4.0 では足さない。案 b を選んだら checkbox と「すべて選ぶ」を足すタスクを切る

changelog:
  file: specs/design/CHANGELOG.md
  format: 版・日付・変えたもの・理由・効く画面（screens.ts と capture_test.dart の画面の id）・承認（工場か人）
  entries:
    - version: 0.1.0
      date: "2026-11-01"
      change: デザインシステムの最初の正本。コンセプト rally-court（人が選んだ）から principles・concept_tone・tokens・components・patterns・content・accessibility を作った
      reason: rally にはデザインシステムがなかった。Issue の言う既存のトークン（#398）はリポジトリに見当たらず、今のアプリは student-app が ThemeData(colorSchemeSeed teal)、admin-web が Tailwind の既定の色（gray・green-700・red-600）だけだった。壊す名前はないので、コンセプトの値をそのまま正本にした
      affects: student-app と admin-web の全画面（テーマの色・書体・角丸・余白が変わる。キャプチャ #401 は全画面で差分が出る）
      approved_by: 人（コンセプトの選択）、工場（基準）
      migration:
        - student-app は ThemeData を tokens.yaml から作り（colorSchemeSeed をやめる）、Noto Sans CJK JP を同梱する
        - admin-web は globals.css の @theme に tokens.yaml の色・角丸・余白を写し、gray・green・red の class を役割の名前に置き換える
        - 今の文言は変えない（content.yaml は今の文言に合わせて書いた）
    - version: 0.1.1
      date: "2026-11-02"
      change: tokens.yaml の typography.families に bundling_status（student-app の書体の同梱がまだであること）を書き足した。admin-web の @theme に書体の段の字間（letter_spacing）を写した
      reason: 正本は student-app に Noto Sans CJK JP を同梱すると書くが、pubspec に fonts がなく、正本と実際がずれていた。admin-web は書体の段の大きさと行間だけを写し、字間が抜けていた
      affects: admin-web の全画面（text-xs・text-sm・text-base・text-xl・text-headline の字間が変わる）。student-app は変わらない
      approved_by: 工場（文の直しとトークンの写し）
    - version: 0.2.0
      date: "2026-11-02"
      change: >-
        tokens.yaml の青の値を変えた（primary・focus_ring・info.fg #1E3FD0→#3A54B0、primary_pressed #1A2FA8→#2E4590、
        primary_container・info.container #E6EBFF→#E9EDF8、on_primary_container・info.on_container #14246E→#1E2A5C。scale.blue も同じ段で）と contrast_checked の比。
        concept_tone.yaml に copy（コピーの 3 語とデザインの結びつき）を足した。components.yaml の empty_state に variants（screen・section）と基準を足し、文を text_muted から text にした。
        全部の部品に preview（状態ごとの見本）と preview_css を足し、正本からカタログを組み立てられるようにした。typography.scale に日本語の sample を足した
      reason: >-
        人が見本のカタログを見て「青が強い」「空の表示のボタンが読みにくい」と指摘し、彩度を下げた値と empty_state の形を決めた（2026-11-02）。
        名前は変えず値だけを変えた。新しい値も WCAG 2.2 AA を満たす（primary は background で 6.83、surface で 6.15、primary_container で 5.83）。
        primary を inverse_surface の上に置かない決まりは変わらない（2.72）
      affects: >-
        student-app と admin-web の全画面（screens.ts と capture_test.dart のすべての id。主なボタン・リンク・選択中・フォーカス・info の色が落ち着く）。
        empty_state を使う画面（student-app のホームの各欄・admin-web の一覧の 0 件）はボタンの種類と文の色が変わる
      approved_by: 人（色の役割の値の変更・concept_tone の変更、2026-11-02）、工場（部品の基準と見本）
      migration:
        - student-app の lib/ui/theme/rally_tokens.dart の RallyColors の値を新しい値にする（名前は同じ）
        - admin-web の src/app/globals.css の @theme の値と tests/designTokens.test.ts の期待の値を新しい値にする
        - EmptyState（admin-web の src/components/ui/EmptyState.tsx・student-app の lib/ui/components/empty_state.dart）は文を text にし、variant（screen・section）を受けて、screen は surface の面と primary、section は background の面と border の線と secondary にする
        - 見た目が変わる PR には前後のキャプチャを付ける
    - version: 0.3.0
      date: "2026-11-05"
      change: >-
        tokens.yaml の spacing.grid.pc を書き換えた（「1 段で最大 48rem、一覧の表は 1 段の幅に収める」をやめ、読む画面は reading 768px、
        本部の一覧の画面は wide 1280px。どちらも左右 24px）。spacing.grid.admin_web_narrow・spacing.content_width_px・spacing.wide_rules を足し、
        typography.max_line_length の注を合わせた。components.yaml に data_table（表）を足した（セルは単語の途中で折り返さない、見出し・数字・短い値は 1 行、
        列のあいだは spacing の段で md 16px、横スクロールは表の包みだけ）。patterns.yaml の common_layout.admin_web と list に幅と表の基準、
        accessibility.yaml の text-resize に表の包みの例外、lint に table-no-page-scroll を足した
      reason: >-
        本部の一覧の表が 48rem の枠（RoleGate の max-w-3xl と Section の padding で表は 550〜690px ほど）に押し込まれ、
        見出しや値が単語の途中で折り返し、列が py-1 の余白だけでくっついていた（#896）。既存の名前は消さず、grid.pc の値（文）だけを変えた。
        reading の 768px は今の 48rem と同じなので、読む画面の幅は変わらない
      affects: >-
        admin-web の本部の一覧の画面（screens.ts の hq-bookings*・hq-cancelled-bookings*・hq-students*・hq-coaches*・hq-lesson-menus*・hq-slot-supply*・
        hq-incomplete-coach-profiles*・hq-pending-video-reviews*・hq-returned-video-reviews*・hq-live-sessions*・hq-overdue-live-sessions*・hq-unanswered-messages* の表のある id。
        幅が広がり、表の行が 1 行になる）。表のセルの決まりは coach-* の表（予約枠・自分のメニュー・動画の添削）と本部の詳細の表にも効く（幅は reading のまま）。
        login・hq-home・フォームの画面・student-app は変わらない
      approved_by: 工場（新しい部品と should の基準、レイアウトの値の文の直し。must の追加と色の値の変更はない）
      migration:
        - admin-web の RoleGate（src/components/RoleGate.tsx）に幅の種類（reading・wide）を渡せるようにし、本部の一覧の画面は wide（max-w-[1280px]、左右 p-6。600px 未満は p-4）で包む。reading は今の max-w-3xl のまま
        - src/components/ui/ に DataTable（包み・table・th・td）を足し、各一覧の <table className="w-full text-left text-sm"> を置き換える。包みは overflow-x-auto、table は w-full min-w-max、セルは px-2 py-2 h-12 whitespace-nowrap（先頭の左と最後の右は 0）（long_text の列だけ whitespace-normal と word-break auto-phrase）、数字の列は text-right tabular-nums
        - 表の外の文（件数・説明・知らせ）は max-w-[40em]
        - 本部の一覧の前後のキャプチャ（幅 1280px と 360px）を PR に付ける。changelog.d/ に断片を書く（利用者に見える変更）
    - version: 0.4.0
      date: "2026-11-05"
      change: >-
        components.yaml に date_field（date・date_range。状態・誤りの文言の型・見本）を足し、text_field の not_for に書き足した。
        tokens.yaml に color.slot_state（open は info、booked は success、closed は neutral）・state_rules・info の比を足した。
        status_tag にスロットの状態の見本、lint に date-field-only・state-color-map、requests に checkbox（保留）を足した
      reason: >-
        #455 の画面の設計で部品が足りなかった。admin-web は 11 の部品が input type=date を直に書き、スロットの状態に色の対応がなかった。
        date_field は text_field の variant にせず別の部品にした（2 つの欄にまたがる誤りと既定の期間を読む loading があるため）。
        slot_state は Issue の仮の対応で決めた。誤りの文は今の periodError の文に「何が起きたか」を足した。既存の名前と値は消していない
      affects: >-
        admin-web の期間の欄のある画面（hq-bookings*・hq-cancelled-bookings*・hq-live-sessions*・hq-returned-video-reviews*・hq-slot-supply*・hq-coach-reviews*・
        hq-low-reviews*・hq-students*・hq-announcements*・hq-coach-overview・coach-slots*）と design-catalog
      approved_by: 工場（新しい部品・should の基準・対応の追加）
      migration:
        - admin-web に DateField を足して 11 の部品の input type=date を置き換え、periodError を date_field.errors の文にする（印の欄も返す）
        - 両アプリの status_tag に slot_state の対応を足し、PublishSlotForm の状態を StatusTag にする。/design に見本を足す
