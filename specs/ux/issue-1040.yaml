  more:
    copy:
      title: 入室前チェック
      no_mic: この端末にマイクが見つかりません。カメラとスピーカーは確かめられます。
      actions: 入室する・スピーカーを試す・試し音を止める・マイクを切る・マイクを入れる・カメラを切る・カメラを入れる・端末の設定を開く・もう一度確かめる（どれも動詞で終える）
