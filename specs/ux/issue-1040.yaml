      before_start: 開始時刻になると入室できます。
      speaker_fail: 試し音を鳴らせませんでした。端末の音量と、音の出る先を確かめてください。
      waiting_permission: カメラとマイクの許可を待っています／許可すると、ここに自分の映りが出ます。
    analytics: 行動イベントは足さない。入室の成功は今のまま call.started（サーバーが発火）。入室前チェックを開いた・許可を断ったの率を見たいなら
      events.yaml に足す別のタスク（open_questions の 4）
