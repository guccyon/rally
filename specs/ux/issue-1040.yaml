prd:
  goal: 生徒「レッスンが始まる前に、自分の映りと背景、声と音が届くかを確かめておきたい。最初の数分を『映っていますか』『聞こえますか』で失いたくない」。 コーチ「生徒を待たせずに、開始時刻ちょうどに、整った映りと音でレッスンを始めたい」。
  scope:
    in:
    - '生徒アプリ: 予約の確定の画面の「ビデオ通話で受ける」を開始 5 分前から押せるようにし、押すと入室前チェックを開く（今はすぐにビデオ通話の画面）'
    - '生徒アプリ: 入室前チェックの画面（新）'
    - 'コーチの画面: 「通話への参加」の一覧の「通話を開始」を「入室前チェック」に変え、開始 5 分前から押せるようにする'
    - 'コーチの画面: 入室前チェック（新。通話への参加のタブの中）。カメラ・マイク・スピーカーを選ぶ欄（2 つ以上あるときだけ）'
    - 入室したあとの画面に、入室前チェックで決めたカメラ・マイクの入・切を 1 行だけ出す
    - 足りない部品 5 つの案（design_system_gaps）。#1137 で specs/design/components.yaml と content.yaml の 0.7.0 に入った（media_toggle・camera_preview・level_meter・join_bar・content の datetime.countdown）
    out:
    - 入室したあとの通話の画面の作り直し（映像はモックのまま。自分の映りを通話中に出すことも今回はしない）
    - 本部の画面
    - 通話サービス（Twilio Video など）への接続と room_token の取得
    - カメラ・マイクの映像と音をサーバーに送る・残すこと
    - 「入室は開始時刻から」の例外や取り下げ、環境ごとの例外（#921 のとおり）
    - アプリのコードの実装（t3）
  source: 'Issue guccyon/rally#1040（窓口の相談 2、依頼者 builder。タスクのまとまりの t2）。ユーザーストーリー specs/stories/student-prejoin-check.yaml
    と coach-prejoin-check.yaml（#1039）。用語は specs/glossary.yaml の prejoin_check。
    入室を開始時刻からにする決まりは #899・#921（409 slot_not_started）、その文言は #1009。部品は #1137（デザインシステム 0.7.0）。PRD の文書は specs/ にない。'
  success: 生徒とコーチのどちらも、開始 5 分前から入室前チェックを開いて、端末の本物のカメラに映る自分（左右反転）・マイクの音の大きさ・ スピーカーの試し音を確かめられる。開始時刻の前は「入室する」を押せず、残り時間が見える。開いたまま開始時刻になると「入室する」が押せるようになり、
    押すとビデオ通話（相手の映像はモック）に入る。許可を断った・カメラやマイクがないときも、そのことと直し方が分かり、開始時刻からの入室は止まらない。
notes:
- 動くプロトタイプの入口は a.html。モックの下の「モックの注記」（点線の枠。製品には出さない）のリンクで、入口（a-entry）→ 許可（a-permission。「許可」で
  a、「許可しない」で a-denied）→ 開始時刻（a-ready）→ 入室中（a-joining）→ 入室できた（a-incall）／断られた（a-failed）とたどれる。a.html
  と各コマの「マイクを切る」「カメラを切る」「スピーカーを試す」は、HTML の中の小さなスクリプトで表示だけを切り替える（通信・保存なし）
- コーチの画面の入口は coach-list.html（「入室前チェック」で coach.html へ）。coach の案は desktop の 1280 幅で、縦に長いので撮る高さを
  1100 にした
- カメラの映りはモックでは人の形の図で代わりにした（本物のカメラはモックでは使わない）。サンプルの名前と時刻は架空（2026-11-08 の 12:00 開始、今は
  11:57:12 の想定）
- design_system_gaps の 5 つは、#1137 で正本に入った（components.yaml の media_toggle・camera_preview・level_meter・join_bar、content.yaml の
  notation.datetime.countdown・actions.verbs・errors.prejoin）。正本に入るときに決まった差（camera_preview の icon は 24px、試し音のボタンは
  media_toggle の speaker_test）はこの仕様にも合わせた。t3 はこの仕様と正本の部品で組み、画面に直書きしない
- PR の説明は tools/pr-body-check/template.json の見出し（概要 / 背景 / 問題 / 対応内容 / 影響範囲・互換性 /
  動作確認 / 補足 / 仮決め / 知見）で書く。ストーリー student-prejoin-check・coach-prejoin-check の known_gaps
  は、この仕様で 1〜5 がすべて埋まる（消すのは t3 の実装のとき）
