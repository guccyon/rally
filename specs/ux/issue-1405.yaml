judgments:
- kind: ui
  note: メールアドレスと確認コードを別の画面（2 段）にし、確認コードは text_field 1 つ・自動送信なし。1 画面 1 つの問い（patterns.onboarding）と、送り間違いを減らすため
  question: coach-app のログインの段の数と、確認コードの入れ方
- kind: error_handling
  note: 確認コードを確かめたあと（403 account_role_mismatch）だけ明かす。メールアドレスを入れた段では登録の有無も種類も変えずに 202
    を返す（調べられないように）。入口の下には、だれにでも出してよい静的な案内の文だけを置いた
  question: 生徒・本部のアカウントで coach-app に来た人に、いつ種類を明かすか
- kind: error_handling
  note: エラーで止めるだけでなく、知らせの中にコーチの入口へのリンクを置く。セッションは保存せず、入れた値は残す（patterns.form）
  question: 本部の入口にコーチのトークンを入れたとき
- kind: system_interface
  note: 利用者に選ばせず、admin-web は getMyAccount の role、coach-app は verifyCoachLoginCode
    の account.role で決める。保存するセッションの role はサーバーの答えから書く（今の session.ts の「ロールは利用者がログイン時に選ぶ」を変える）
  question: 役割をどこで決めるか
- kind: scope
  note: 画面の移行は後続のチケットなので、ホームは移行中の案内・PC で開くアドレス・ログアウトだけにした。チャットやお知らせを先に入れない
  question: coach-app のログインのあとに何を出すか
- kind: scope
  note: 本部の入口と分けた /coach/login を足し、中身は今のトークンのまま。消すまでの扱いは ADR に書く前提
  question: 移行中のコーチの PC の入口
- kind: aesthetic
  note: coach-app はコーチが見る新しいアプリだが、見た目は student-app のトークンと部品をそのまま写し、色・書体・写真の新しい決めごとはしない。だから
    false にし、見た目の案は作らなかった。アプリのアイコンとストアの見た目を決めるときは別のタスクで true にする
  question: brand_impact を true にするか
- kind: ui
  note: ロールの選択肢ではなく、区切り線の下の small の文とリンクにした。今 / をブックマークしているコーチが迷わないため。コーチの入口を消すときに文を短くする
  question: 本部の入口に、コーチ向けの案内を置くか
prototype: true
rationale:
  why: '#1374 の選び間違いは「1 つの画面でロールを選ぶ」形から起きている。案 a は本部・コーチの入口を URL ごと分け、どちらの入口も役割をサーバーの答え（getMyAccount）で
    確かめるので、選ぶ場面そのものがなくなり、違うアカウントで来た人には行き先を示せる。coach-app は student-app の画面の型と部品のまま
    （メールアドレス → 確認コード）にしたので、生徒と同じ形という条件を満たし、デザインシステムに足す部品もない。移行中の PC の入口は今の コーチの画面（守るストーリーの入室前チェックとチャット）を中身ごと残すので、回帰の範囲が戻り先の変更だけに収まる。'
  rejected:
  - idea: 案 b（admin-web は 1 つの入口のまま、ロールの選択だけをなくしてアカウントで行き先を決める）
    reason: 選び間違いはなくなるが、「本部は独立した Web の入口」の条件を弱くしか満たさない。コーチの入口を消すときに、本部の入口の文と流れをもう一度変えることになる
  - idea: 案 c（PC のログインを coach-app で承認する）
    reason: コーチには一番やさしいが、移行が終われば要らなくなる仕組みに新しい API・期限・画面が要る。3 画面の移行の順が決まってから考えても遅くない（open_questions）
  - idea: 生徒アプリと 1 つのアプリにして、ログインのあとロールで画面を分ける
    reason: Issue の判断（新しく残す ADR）でとらなかった案。生徒向けのストアの説明・通知・審査とコーチの業務の画面が混ざる
  - idea: coach-app のログインの画面で「生徒」「コーチ」を選ばせる、または入口の前に振り分けの画面を置く
    reason: ロールの選択を別の場所に移すだけで、#1374 と同じ選び間違いが起きる。アプリが入口を決め、違ったときだけ案内する
  - idea: メールアドレスを入れた時点で「このメールアドレスは生徒のアカウントです」と出す
    reason: だれでもメールアドレスの登録の有無と種類を調べられてしまう。確認コードを確かめたあと（本人と分かったあと）にだけ種類を明かす
  - idea: 確認コードを 6 つの箱に分けた入力
    reason: 読み上げ・貼り付け・端末のコードの候補で崩れやすく、デザインシステムに部品がない。text_field 1 つで足りる
  - idea: 確認コードを 6 桁入れたら自動でログインする
    reason: 間違いのまま送って 429 に早く届く。押す操作を 1 つ残す
  requirement_map:
  - how: 'coachLogin・coachLoginCode を student-app の画面の型（アプリバー・headline・text_field・primary
      56px）と同じ 2 段（メールアドレス → 確認コード）で組む。形は #1404 に合わせる（open_questions の 1）'
    requirement: 生徒とコーチが、同じ形の入口からモバイルアプリでログインできる
  - how: hqLogin（/）を本部だけの入口にし、coach-app と coachWebLogin（/coach/login）にはロールの選択を置かない。役割は
      getMyAccount と verifyCoachLoginCode の答えで決める
    requirement: 本部は admin-web の独立した入口からログインでき、コーチの入口にロールの選択が出ない
  - how: hqLogin からロールの radio をなくす。コーチのトークンは入れずに知らせで行き先を示す（frame a/hqcoach）。コーチ向けは選択肢ではなく、区切り線の下の案内の文とリンクだけ
    requirement: admin-web のログイン画面にコーチの選択肢がない
  - how: 画面に要る操作と項目を contract_needs に書いた（requestCoachLoginCode・verifyCoachLoginCode・getMyAccount・revokeCoachSession）。契約の本文は実装役が書く
    requirement: coach-app の API が契約にある
  - how: coachWebLogin を移行中だけの入口として足し、adminCoachHome の戻り先をそこにする。coachHome に PC で開くアドレスを出す。消す時期は
      ADR に書く（open_questions）
    requirement: コーチの 3 画面の移行が終わるまでの admin-web の扱い
  - how: 生徒の画面は変えない。コーチの PC の画面は中身を変えず、入口と戻り先だけを変える。ストーリーの entry「admin-web のコーチの画面」は
      coachWebLogin から入る形で続く
    requirement: 守るストーリー（student-subscription-persists・coach-prejoin-check・coach-replies-to-new-message）を壊さない
user_flow:
- to: coachLogin
  from: 端末のホーム画面
  action: coach-app を開く（ログインしていない）
- to: coachLoginCode
  from: coachLogin
  action: メールアドレスを入れて「確認コードを送る」を押す
- to: coachHome
  from: coachLoginCode
  action: メールに届いた 6 桁を入れて「ログインする」を押す（コーチのアカウント）
- to: coachLogin（アカウントの種類が違う案内）
  from: coachLoginCode
  action: 「ログインする」を押したが、生徒か本部のアカウントだった
- to: coachLogin（入れたメールアドレスを残す）
  from: coachLoginCode
  action: 「メールアドレスを変える」か戻る
- to: coachHome
  from: 端末のホーム画面
  action: coach-app を開く（ログインしたまま）
- to: coachLogin
  from: coachHome
  action: 「ログアウトする」を押す
- to: coachWebLogin
  from: coachHome
  action: 「アドレスをコピーする」を押し、PC のブラウザーで開く
- to: 本部の画面（/headquarters）
  from: PC のブラウザー（admin-web の / を開く）
  action: 本部のアクセストークンを入れて「ログインする」を押す
- to: hqLogin（コーチのアカウントだという知らせ）→「コーチの入口（PC）」で coachWebLogin
  from: hqLogin
  action: コーチのアクセストークンを入れて「ログインする」を押す
- to: adminCoachHome（/coach。今のコーチの画面）
  from: coachWebLogin
  action: コーチのアクセストークンを入れて「ログインする」を押す
- to: coachWebLogin
  from: adminCoachHome
  action: 「ログアウト」を押す、またはセッションが切れる
brand_impact: false
open_questions:
- 【いちばん見てほしい】生徒のログイン（#1404）の形がまだリポジトリにない。coach-app は「メールアドレス → 6 桁の確認コード」を仮に置いた（生徒の登録にパスワードがないため）。#1404
  がパスワードなど別の形にしたら、coach-app もそれに合わせて画面を直す
- 確認コードの有効期限 10 分・送り直しの待ち 60 秒・間違いの上限は仮の値。契約（coach-app の openapi）で決める
- アプリの名前「Rally コーチ」は仮。ストアの名前と、生徒向けの「Rally」との並べ方はプロダクトオーナーに決めてほしい
- admin-web の PC の入口は、移行中も Gen1 のモックのトークンのまま。coach-app と同じ確認コードにそろえるか（PC でも同じやり方）は、本物の認証を入れるときに決める。案
  c はその先の形
- 'コーチの入口（PC）を消す日: 3 画面が移り終わった日か、deprecated から 90 日のどちらか遅いほうを仮にした。ADR に書く'
- ログアウトでトークンを無効にする API（revokeCoachSession）を coach-app の契約に足すか。足さなければ端末から消すだけになる
- ログインのイベント（ログインした・確認コードを送った・役割が違った）が specs/analytics/events.yaml にない。#1374 の選び間違いが減ったかを見るなら、役割が違ったときのイベントを足すタスクを切る
- Issue の契約の差分は「admin-web の login operation の coach role を deprecated」とあるが、今の admin-web
  の契約にログインの操作はなく、ロールは画面で選んで保存しているだけ（getMyAccount はロールが合わないと 401）。何を deprecated にするかはアーキテクトに確かめてほしい
design_system_gaps: []
design_system_constraints:
- specs/design/ 0.8.0（rally-court・scoreboard）のトークンだけを使った。モックの値は out/rally.css に tokens.yaml
  の名前で写した（色・余白 4/8/16/24/40・角丸 6/12/999・影なし）
- '部品: button（primary・secondary・text）、text_field、notice（inline の danger・warning・info）、card（plain）、description_list（stacked）、loading（bar・spinner）、toast（notice
  の toast）。どれも trial の部品'
- '画面の型: coach-app は patterns.common_layout.student_app（アプリバー → headline → 欄）と patterns.form（欄は
  1 段・送るボタンは primary・誤りは欄の下の error_text・送るのに失敗しても値を残す）。admin-web は common_layout.admin_web
  の reading 768px'
- coach-app は Flutter のアプリになる前提で、student-app の見た目（RallyTheme・FlowScaffold のアプリバー・ボタン
  56px）をそのまま写した。coach-app 専用のトークンは作らない（生徒と同じ形の入口のため）
- 濃い面（inverse_surface）・score_panel・ライム（secondary）は使わない。ログインと移行の案内は行動の主役の数字がない画面なので、熱い場所を置かない（principles
  の clear-before-hype・admin-calm）
- admin-web の headline は 28px、ボタンは 48px・700（typography.admin_web・button.size）
- 文言は content.yaml（動詞で終えるボタン、誤りは何が起きたかとどうすればよいかの 2 文、admin-web は呼びかけと感嘆符なし）。glossary
  の語（コーチ・生徒・スロット・動画添削・ビデオ通話）を使い、lint の glossary-terms に合わせて「予約枠」を画面の文に使わない
- モックの admin-web のコマ（a-hq・a-hqcoach・a-webcoach）は、案 a のコマの撮影の幅（390px）に合わせて admin-web
  の 600px 未満の形（左右 md 16px）で描いた。PC の幅では b.html と同じ 768px の 1 段になる
- モックの下の点線の「モックの注記」はレビューでコマをたどるためのもので、製品には出さない（border_strong の点線はトークンの色だが、部品ではない）
variant:
  id: a
  axis: flow
  name: 入口を 3 つに分ける（coach-app・本部の Web・移行中のコーチの Web）
  frames:
  - id: code
    state: ふつう
    screen: coachLoginCode
    caption: 「確認コードを送る」を押したあと（確認コードを入れる）
  - id: codeerr
    state: コードが違う
    screen: coachLoginCode
    caption: 違う確認コードで「ログインする」を押したあと
  - id: busy
    state: 送信中
    screen: coachLoginCode
    caption: 正しい確認コードで「ログインする」を押した直後
  - id: home
    state: ふつう
    screen: coachHome
    caption: コーチのアカウントでログインできたあと
  - id: wrongrole
    state: アカウントの種類が違う
    screen: coachLogin
    caption: 生徒のアカウントのメールアドレスで確認コードまで進んだあと
  - id: hq
    state: ふつう
    screen: hqLogin
    caption: PC で admin-web の / を開いたとき（本部の入口）
  - id: hqcoach
    state: 役割が違う
    screen: hqLogin
    caption: 本部の入口にコーチのアクセストークンを入れて「ログインする」を押したあと
  - id: webcoach
    state: ふつう
    screen: coachWebLogin
    caption: 「コーチの入口（PC）」を開いたとき（移行中だけ）
  height: 960
  tradeoff: 本部とコーチの入口が URL から切れてロールの選び間違いが起きなくなり、coach-app は生徒と同じ形になるが、移行中は admin-web
    に入口が 2 つ並び、 コーチは PC でもう 1 回（トークンで）ログインする手間が残る。
  viewport: mobile
