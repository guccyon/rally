screens:
- id: coachLogin
  new: true
  more:
    copy:
      lead: コーチとして登録したメールアドレスに、ログインの確認コードを送ります。
      title: ログイン
      action: 確認コードを送る
      others: 生徒の方は Rally のアプリから、本部の方は PC のブラウザーで本部の管理画面からログインします。
    analytics: なし（specs/analytics/events.yaml にログインのイベントがない。足すなら別のタスク。open_questions）
    accessibility:
    - 見える「メールアドレス」のラベルを欄に結ぶ（placeholder で代えない）。helper と error_text は aria-describedby
    - 知らせ（アカウントの種類が違う・送れなかった）は role=alert。出たらフォーカスを知らせの先頭へ
    - 文字 200% でも横に動かない（ボタンの文言は折り返してよい）
    contract_needs:
    - 'coach-app.requestCoachLoginCode（POST）: request {email}。202（登録の有無で変えない）・422（形が違う）・429（回数が多い。Retry-After）'
  route: coach-app の最初の画面（ログインしていないとき）
  purpose: コーチがスマホで、生徒と同じ形の入口からログインを始める。1 段目でメールアドレスを入れて確認コードを受け取る。フローの入口で、 アカウントの種類が違ったときの戻り先も兼ねる。ロールは選ばない（アプリが入口を決める）。
  audience: コーチ（スマホ。iOS / Android）
  elements:
  - name: アプリバー
    note: 戻るのアイコンは出さない（入口なので）
    source: 固定（アプリ名は仮。open_questions）
    content: 「Rally コーチ」
    required: true
    component: patterns.common_layout.student_app のアプリバー
  - name: 見出し
    source: 固定
    content: 「ログイン」
    required: true
    component: 画面の見出し（headline 32px 900）
  - name: 説明
    source: 固定
    content: 「コーチとして登録したメールアドレスに、ログインの確認コードを送ります。」
    required: true
    component: 本文（body）
  - name: アカウントの種類が違う知らせ
    note: 確認コードを確かめたあとだけ出す（メールアドレスを持っている本人にだけ種類を明かす）。出ているときは説明と欄の代わりに、下の 2 つの操作を出す
    source: verifyCoachLoginCode の 403 account_role_mismatch の role
    content: '生徒: 「{メールアドレス} は生徒のアカウントです。このアプリはコーチ用です。生徒の方は Rally のアプリからログインしてください。」／本部:
      「{メールアドレス} は本部のアカウントです。本部の画面は、PC のブラウザーで本部の管理画面からログインします。」'
    required: false
    component: notice（inline・warning）
  - name: メールアドレス
    note: type=email・inputmode=email・autocomplete=email。前後の空白は送る前に除く。254 文字まで
    source: 入力。戻ってきたときは前の値
    content: ラベル「メールアドレス」・helper「コーチとして登録したメールアドレス」
    required: true
    component: text_field（single_line）
  - name: 確認コードを送る
    note: 画面の primary はこれ 1 つ（アカウントの種類が違う知らせが出ているときは「Rally のアプリを開く」が primary）
    source: 固定
    content: 「確認コードを送る」
    required: true
    component: button（primary・幅いっぱい・56px）
  - name: Rally のアプリを開く
    note: 生徒のアカウントのときだけ。本部のアカウントのときは出さない（PC の画面なので開く先がない）
    source: 固定
    content: 「Rally のアプリを開く」
    required: false
    component: button（primary）
  - name: ほかのメールアドレスでログインする
    note: アカウントの種類が違う知らせが出ているときだけ
    source: 固定
    content: 「ほかのメールアドレスでログインする」
    required: false
    component: button（text）
  - name: ほかの利用者への案内
    note: 押せるものにしない（行き先の URL を生徒・本部に見せる必要がない）。#1374 の選び間違いの手前で気づけるように置く
    source: 固定
    content: 「生徒の方は Rally のアプリから、本部の方は PC のブラウザーで本部の管理画面からログインします。」
    required: true
    component: 本文（small text_muted）
  behaviors:
  - action: 欄を離れる
    result: 輪郭 danger 2px と error_text「メールアドレスの形になっていません。name@example.com の形で入れてください。」。打っている途中には出さない。直すと消える
    target: メールアドレス
    condition: 空でなく、@ を含む name@domain の形でない
  - action: 押す
    result: error_text「メールアドレスが入っていません。コーチとして登録したメールアドレスを入れてください。」を出し、欄へフォーカス。送らない
    target: 確認コードを送る
    condition: メールアドレスが空
  - action: 押す
    result: ボタンを loading（spinner・押せない）にして requestCoachLoginCode を呼ぶ。サーバーは登録の有無にかかわらず受け付けたと返す（202）。
      受け付けたら coachLoginCode へ（メールアドレスを渡す）。二度押しでは 1 回だけ送る
    target: 確認コードを送る
    condition: メールアドレスの形が正しい
  - action: 押す
    result: ボタンの上に notice（inline・danger）でサーバーの文言（例「確認コードを送る回数が多すぎます。しばらく待ってから、もう一度送ってください。」）。入れた値は消さない
    target: 確認コードを送る
    condition: 429（同じメールアドレスに短い間に何度も送った）
  - action: 押す
    result: notice（inline・danger）「確認コードを送れませんでした。通信のよい場所で、もう一度「確認コードを送る」を押してください。」。入れた値は消さない。ボタンは押せるまま
    target: 確認コードを送る
    condition: 通信に失敗した・5xx
  - action: 押す
    result: student-app を開く（入っていなければストアのページ）。coach-app のトークンは保存していないので、戻ってもログインしていない
    target: Rally のアプリを開く
    condition: 生徒のアカウントの知らせが出ている
  - action: 押す
    result: 知らせを消し、メールアドレスを空にして欄へフォーカス
    target: ほかのメールアドレスでログインする
    condition: アカウントの種類が違う知らせが出ている
  - action: アプリを開く
    result: この画面を出さず coachHome へ（開き直すたびにログインし直させない。student-subscription-persists の
      known_gaps と同じ問題をコーチで起こさない）
    target: 画面
    condition: 端末に保存したトークンがあり、getMyAccount が coach を返す
  transitions:
    exits:
    - to: coachLoginCode
      data: メールアドレス
      action: 「確認コードを送る」が受け付けられた
    - to: student-app（入っていなければストア）。coach-app は coachLogin のまま
      action: 「Rally のアプリを開く」（生徒のアカウントのとき）
    - to: アプリを閉じる（戻る先はない）
      action: 端末の戻る
    entries:
    - data: なし
      from: アプリを開く
      condition: 端末にトークンがない、または getMyAccount が 401
    - data: 入れていたメールアドレス
      from: coachLoginCode の「メールアドレスを変える」・戻る
      condition: いつでも
    - data: メールアドレスと役割（案内の文に使う）。トークンは保存しない
      from: coachLoginCode の「ログインする」
      condition: 確認コードは正しいが、役割が student か headquarters
    - data: なし
      from: coachHome の「ログアウトする」
      condition: いつでも
- id: coachLoginCode
  new: true
  more:
    copy:
      sent: '{メールアドレス} に 6 桁の確認コードを送りました。届いてから 10 分のあいだ使えます。'
      title: 確認コード
      resent: 新しい確認コードを送りました
      expired: 確認コードの期限が切れました。「コードを送り直す」で新しいコードを受け取ってください。
      invalid: 確認コードが違います。メールに届いた 6 桁の数字を、もう一度入れてください。
    analytics: なし（ログインのイベントは events.yaml にない）
    accessibility:
    - 確認コードの欄は 1 つ（6 つの箱に分けない。読み上げと貼り付けで崩れない）
    - disabled の「コードを送り直す」は aria-disabled と aria-describedby で理由の文に結ぶ
    - 押せる部品は 48px 以上。「コードを送り直す」と「メールアドレスを変える」のあいだは sm 8px 以上
    contract_needs:
    - 'coach-app.verifyCoachLoginCode（POST）: request {email, code}。200 {access_token,
      account: {account_id, role, display_name}}。401 login_code_invalid / login_code_expired。429。403
      account_role_mismatch（body に role。コードが正しいときだけ）'
    - 'coach-app.getMyAccount（GET /me）: アプリを開いたときにトークンが使えるかと表示名を確かめる（admin-web の getMyAccount
      と同じ形）'
    microinteractions:
    - 'きっかけ: 端末がメールの確認コードを候補に出す。ルール: 選ぶと欄に入るだけで、自動では送らない（押し間違いの送信と 429 を避ける）。フィードバック:
      なし'
    - 'きっかけ: 送ってから 60 秒。ルール: 「コードを送り直す」を押せるようにする。フィードバック: role=status で 1 回。繰り返し:
      送り直すたびに 60 秒から'
  route: coach-app のログインの 2 段目
  purpose: メールに届いた確認コードを入れてログインを終える。フローの 2 段目で、ここで初めてアカウントの役割が分かる。
  audience: コーチ（スマホ）
  elements:
  - name: アプリバー
    source: 固定
    content: 戻るのアイコン（aria-label「戻る」）と「Rally コーチ」
    required: true
    component: patterns.common_layout.student_app のアプリバー
  - name: 見出し
    source: 固定
    content: 「確認コード」
    required: true
    component: 画面の見出し（headline）
  - name: 送った先
    source: 前の画面のメールアドレス。10 分は契約の有効期限（仮。open_questions）
    content: 「{メールアドレス} に 6 桁の確認コードを送りました。届いてから 10 分のあいだ使えます。」
    required: true
    component: 本文（body）
  - name: 確認コード
    note: inputmode=numeric・autocomplete=one-time-code（端末がメールから差し込める）。数字以外と空白は入れたときに除く。6
      桁まで。値は tnum
    source: 入力
    content: ラベル「確認コード」・helper「メールに届いた 6 桁の数字」
    required: true
    component: text_field（single_line）
  - name: ログインする
    source: 固定
    content: 「ログインする」
    required: true
    component: button（primary・幅いっぱい）
  - name: コードを送り直す
    note: 送ってから 60 秒は disabled（押せない理由を下の文で）。押せるようになったら文の「60 秒たつと」を消す
    source: 固定
    content: 「コードを送り直す」
    required: true
    component: button（text）
  - name: メールアドレスを変える
    source: 固定
    content: 「メールアドレスを変える」
    required: true
    component: button（text）
  - name: 届かないときの案内
    source: 固定
    content: 「メールが届かないときは、60 秒たつと送り直せます（迷惑メールのフォルダーも確かめてください）。」
    required: true
    component: 本文（small text_muted）
  - name: 読み込みの表示
    note: 「ログインする」を押してから 300ms を超えたときだけ
    source: 固定
    content: アプリバーの下の 4px の bar と「ログインしています…」（role=status）
    required: false
    component: loading（bar）
  behaviors:
  - action: 押す
    result: error_text「確認コードは 6 桁の数字です。メールに届いたコードを入れてください。」と欄へフォーカス。送らない
    target: ログインする
    condition: 確認コードが 6 桁でない（空を含む）
  - action: 押す
    result: ボタンを loading・欄を disabled にし verifyCoachLoginCode を呼ぶ。二度押しでは 1 回だけ送る。200
      で役割が coach なら、トークンを端末の安全な保存場所 （iOS の Keychain・Android の Keystore）に置き、coachHome
      へ置き換えて移る
    target: ログインする
    condition: 6 桁
  - action: 押す
    result: 欄の輪郭 danger 2px と error_text「確認コードが違います。メールに届いた 6 桁の数字を、もう一度入れてください。」（role=alert）。入れた値は残して全体を選んだ状態にする
    target: ログインする
    condition: 確認コードが違う（401 login_code_invalid）
  - action: 押す
    result: error_text「確認コードの期限が切れました。「コードを送り直す」で新しいコードを受け取ってください。」。「コードを送り直す」は 60
      秒を待たずに押せるようにする
    target: ログインする
    condition: 期限切れ（401 login_code_expired）
  - action: 押す
    result: notice（inline・danger）でサーバーの文言（例「確認コードを続けて間違えたため、このコードは使えなくなりました。新しいコードを送り直してください。」）。欄と「ログインする」は押せないままにし、「コードを送り直す」だけ押せる
    target: ログインする
    condition: 間違いが続いた（429）
  - action: 押す
    result: トークンを保存せず coachLogin へ戻し、アカウントの種類が違う知らせを出す
    target: ログインする
    condition: 役割が student か headquarters（403 account_role_mismatch）
  - action: 押す
    result: notice（inline・danger）「ログインできませんでした。通信のよい場所で、もう一度「ログインする」を押してください。」。コードは残す（期限の内ならそのまま使える）
    target: ログインする
    condition: 通信に失敗した・5xx
  - action: 押す
    result: requestCoachLoginCode をもう一度呼ぶ（ボタンを loading）。受け付けたら toast「新しい確認コードを送りました」（4
      秒・role=status）、前のコードは使えなくなる。欄を空にしてフォーカス。60 秒の待ちをやり直す
    target: コードを送り直す
    condition: 送ってから 60 秒たった、または期限切れ
  - action: 押す
    result: 押せない（disabled）。理由は下の文で出す。残りの秒は数えて見せない（読み上げがうるさくなるため。押せるようになったときだけ role=status
      で「コードを送り直せます」を 1 回）
    target: コードを送り直す
    condition: 60 秒の前
  - action: 押す
    result: coachLogin へ（メールアドレスを残す）。送ったコードは期限まで残るが、新しく送れば使えなくなる。確認はしない（取り消せる操作）
    target: メールアドレスを変える
    condition: いつでも
  transitions:
    exits:
    - to: coachHome
      data: トークン（端末の安全な保存場所へ）・表示名。戻る履歴は消す（戻るでログインの画面に戻らない）
      action: 「ログインする」・役割が coach
    - to: coachLogin
      data: メールアドレスと役割。トークンは保存しない
      action: 「ログインする」・役割が student か headquarters
    - to: coachLogin
      data: メールアドレス（残す）
      action: 「メールアドレスを変える」・アプリバーの戻る・端末の戻る
    - to: この画面のまま（戻ってきたら入れた値を残す）
      action: アプリを離れてメールを読む
    entries:
    - data: メールアドレス
      from: coachLogin の「確認コードを送る」
      condition: requestCoachLoginCode が 202
- id: coachHome
  new: true
  more:
