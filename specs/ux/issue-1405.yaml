    target: 画面
    condition: アプリを開いたとき（保存したトークンがある）
  - action: 開く
    result: 名前の行の代わりに notice（inline・danger）「アカウントを読み込めませんでした。「ホームを更新する」でもう一度読み込めます。」と
      button（secondary）「ホームを更新する」。PC の案内とログアウトは出す
    target: 画面
    condition: getMyAccount が通信の失敗・5xx
  - action: 押す
    result: アドレスを端末のクリップボードに入れ、toast「アドレスをコピーしました」（4 秒・role=status）。二度押しは同じ結果（害がない）
