    target: ログアウトする
    condition: いつでも
  transitions:
    exits:
    - to: coachLogin
      action: 「ログアウトする」
    - to: この画面のまま（PC で coachWebLogin を開くのは利用者）
      action: 「アドレスをコピーする」
    - to: coachLogin（「ログインの期限が切れました。もう一度ログインしてください。」を notice・warning で）
