prd:
  goal: コーチ「スマホのアプリから、生徒と同じやり方でログインしたい。本部用のロールを選ぶ画面で迷いたくない」。 本部「PC の管理画面に、本部だけの入口から入りたい。コーチ用の選択肢を間違えて選びたくない」。
  scope:
    in:
    - 'coach-app: ログイン（メールアドレス・確認コードの 2 段。新）'
    - 'coach-app: ログインしたあとのホーム（新。今は移行中の案内とログアウトだけ）'
    - 'coach-app: 生徒・本部のアカウントでログインしたときの案内（確認コードを確かめたあとに出す）'
    - 'admin-web: ログイン画面（/）を本部だけの入口にする。ロールの選択をなくし、アカウントの役割を getMyAccount で確かめる'
    - 'admin-web: コーチの入口（PC。/coach/login。新・移行中だけ）。コーチの画面のログアウトと権限がないときの戻り先をここにする'
    out:
    - 本部を別のバックエンド・別の DB にすること（ADR 0008 は見送りのまま）
    - スロットの公開・動画添削の返却・ビデオ通話・チャットなどのコーチの画面の coach-app への移行（後続のチケット）
    - 生徒のログインそのもの（#1404）。coach-app はその形に倣う
    - コーチのアカウント登録・メールアドレスの変更（今はない。本部かシードで作る前提のまま）
    - 本物の認証の基盤（Gen1 は admin-web はモックのトークンのまま）
    - ADR と契約の本文（実装役が同じ PR で書く。この仕様は画面に要る項目だけを contract_needs に書く）
  source: 'Issue guccyon/rally#1405（プランナーの要件とユーザーストーリー、Plan 14456）。関係: #1404（生徒のログイン）、#1374（ロールの選び間違い）、
    docs/adr/0002-gen1-open-questions.md の Q3、docs/adr/0008-backoffice-separation.md。守るストーリー
    specs/stories/student-subscription-persists.yaml・ coach-prejoin-check.yaml・coach-replies-to-new-message.yaml。今の画面は
    apps/admin-web/src/app/page.tsx・components/LoginForm.tsx・RoleGate.tsx・session/session.ts。
    PRD の文書は specs/ にない。'
  success: コーチが coach-app を開き、メールアドレスと確認コードでログインしてコーチのホームに着ける。 本部は admin-web の本部の入口からログインでき、そこにロールの選択もコーチの選択肢もない。コーチのトークンを本部の入口に入れても本部の画面には入らず、
    行き先（コーチの入口）が分かる。コーチの 3 画面（スロットの公開・動画添削の返却・ビデオ通話）は、移るまで PC の「コーチの入口」から今までどおり使える。
notes:
- 動くプロトタイプの入口は a.html。「確認コードを送る」→ a-code.html →「ログインする」→ a-busy.html →「ログインする」→ a-home.html。どのコマも下の点線の「モックの注記」（製品には出さない）から案
  a のほかのコマへ移れる。スクリプトは使っていない
- b.html は desktop（1280×900）、a と c は mobile（390 幅）。a のコマは縦に長いので撮る高さを 960 にした
- サンプルの名前・メールアドレス・トークン・URL（admin.rally.example）は架空
- '実装役へ: 守るストーリーの actors.yaml の coach の apps と note（admin-web にコーチのロールでログイン）は、coach-app
  を足して書き直す。coach-prejoin-check・coach-replies-to-new-message の entry は「コーチの入口（PC）からログインした
  admin-web のコーチの画面」と読める'
states:
- 'coachLogin ふつう: メールアドレスの欄と「確認コードを送る」（案 a の代表 a.html）'
- 'coachLogin 入力の誤り: 欄を離れたとき・送るときに error_text（形が違う・空）'
- 'coachLogin 送信中: 「確認コードを送る」に spinner、押せない'
- 'coachLogin 失敗: 通信の失敗・429 は notice（danger）。値は残す'
- 'coachLogin アカウントの種類が違う: 生徒か本部のアカウントで確認コードまで進んだ。notice（warning）と「Rally のアプリを開く」（生徒だけ）・「ほかのメールアドレスでログインする」（frame
  a/wrongrole）'
- 'coachLogin ログインの期限が切れた: coachHome から 401 で戻った。notice（warning）「ログインの期限が切れました。もう一度ログインしてください。」'
- 'coachLogin 読み込み中: アプリを開いて保存したトークンを確かめるあいだは、端末の起動の画面のまま（この画面を一瞬出さない）'
- 'coachLoginCode ふつう: 送った先・確認コードの欄・「ログインする」・待ち中の「コードを送り直す」（frame a/code）'
- 'coachLoginCode 送信中: bar と spinner、欄は disabled、「ログインしています…」（frame a/busy）'
- 'coachLoginCode コードが違う: error_text（frame a/codeerr）。期限切れ・間違いが続いた（429）は文を替える'
- 'coachLoginCode 送り直した: toast「新しい確認コードを送りました」、欄を空に'
- 'coachLoginCode 失敗: 通信の失敗は notice（danger）'
- 'coachHome ふつう: 名前・PC の管理画面で使うもの・ログアウト（frame a/home）'
- 'coachHome 読み込み中: bar（300ms を超えたときだけ）'
- 'coachHome 失敗: アカウントを読めない notice（danger）と「ホームを更新する」。ほかの欄は出す'
- 'coachHome 権限がない: 401 で coachLogin へ（期限切れの知らせ）'
- 'coachHome 空: 起きない（使える画面がまだないことを、案内の欄で常に示す）'
- 'coachHome 確認: 起きない（ログアウトは取り消せる操作なので確認しない）'
- 'hqLogin ふつう: ロールの選択なし（frame a/hq）'
- 'hqLogin 入力の誤り: 空・401 は error_text'
- 'hqLogin 送信中: 「ログインする」に spinner'
- 'hqLogin 役割が違う: コーチのトークン（frame a/hqcoach）・生徒のトークンは notice（danger）。値は残す'
- 'hqLogin 失敗: 通信の失敗は notice（danger）'
- 'hqLogin 読み込み中: 保存したセッションを読むあいだは何も出さない（今の useSession のまま）'
- 'coachWebLogin ふつう: 移行中の知らせ（info）とトークンの欄（frame a/webcoach）。誤り・送信中・役割が違う・失敗は hqLogin
  と同じ形'
- 'adminCoachHome 権限がない: RoleGate が「読み込み中…」のあと /coach/login へ'
- どの画面も 空のデータ・確認のダイアログ は起きない（ログインの画面は一覧を持たず、取り消せない操作がない）
ticket: guccyon/rally#1405
