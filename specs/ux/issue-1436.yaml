prd:
  goal: 生徒「予約やレッスンの途中でアプリを閉じたり、ほかの画面を見たりしても、ホームを開けば続きができるようにしたい。確定待ちのまま枠を押さえ続けたり、完了の記録や月額契約に進めなくなったりしたくない」
  scope:
    in:
    - '生徒アプリのホーム: 先頭に「次にやること」の欄（新）。中身は GET /me/next-actions（getMyNextActions）の順のまま'
    - '予約の確定待ち・予約が確定しました・レッスンの完了・添削結果: アプリの段に持っている予約や動画ではなく、ID からサーバーの記録を読み直して開く（読み込み中・失敗・もう状態が変わった、を持つ）'
    - '予約の確定待ち: 「この予約をキャンセルする」（確認のダイアログ）を足し、確定しない予約で枠を押さえ続けない道を作る'
    - 'プロフィール: 「月額契約」の欄（新）。契約がなければ「月額契約へ進む」の行'
    - 'ホームの「今月のビデオ通話」: 契約がないときに「月額契約へ進む」の文字のボタンを足す'
    - '自分の予約: 確定待ちの予約に「内容を確かめて確定する」を足す'
    - '契約: GET /me/next-actions と schema NextAction を足す（既存の操作は変えない）'
    out:
    - ログインし直し（#1404 の後）
    - 決済・月額契約の処理そのもの（月額契約の画面の中身は変えない）
    - コーチの画面・本部の画面
    - 入室前チェック（#1040）とビデオ通話の画面の中身
    - 確定待ちの予約に期限を設けてサーバーが自動で解放すること（open_questions の 3）
    - レッスンの評価を次にやることに入れること（open_questions の 6）
    - 下のタブへのナビゲーションの移し替え（patterns の navigation の proposed のまま）
  source: 'Issue guccyon/rally#1436（まとめる不具合 #1425・#1430・#1424・#1429・#1423・#1431）と、その中のプランナーの要件（factory-requirements
    v1・Plan 14640）。ユーザーストーリー specs/stories/student-books-after-first-lesson.yaml・student-prejoin-check.yaml・student-subscription-persists.yaml（守る・変える）と、新しく書く
    student-resumes-next-action。新しい ADR「生徒アプリの次の操作はサーバーの状態から出す」。PRD の文書は specs/ にない。'
  success: 予約の確定待ち・予約が確定しました・コーチが添削しています・レッスンの完了のどの画面を離れても、またアプリを開き直しても、ホームの「次にやること」から同じ次の操作に進める。月額契約へはホームとプロフィールから進める。その結果、登録
    → 体験予約 → 確定 → レッスン → 完了 → 月額契約の一周が、途中で離れても通る。
notes:
- 動くプロトタイプの入口は a.html。モックの下の「モックの注記」（点線の枠。製品には出さない）とボタンで、a → a-pending →（予約を確定する）a-confirmed
  →（アプリバーのホーム）a-join →（動画を送って添削を受ける）a-waiting → a-complete →（完了の記録へ進む）a-subscribe
  → a-profile とたどれる。a-pending の「この予約をキャンセルする」は HTML の中の小さなスクリプトで確認のダイアログを開閉するだけ（通信・保存なし）
- 入室前チェック・ビデオ通話・動画の送付・レッスンの完了・月額契約の画面は中身を変えないのでモックを作らず、注記で「今のまま」と書いてつないだ（a-join の「ビデオ通話で受ける」は通話を終えた後のホームの代わりに
  a-complete へつないだ）
- サンプルの名前と時刻は架空（体験予約は 10/28（水）12:00〜12:30、テニス、コーチ 山田 花子）
- '実装役へ: 新しいストーリー student-resumes-next-action は、states の studentHome の行（状態ごとに見えるもの）と
  user_flow を steps に、「段ごとの画面にしか次の操作がない」「開き直すと消える」を must_not に書くと QA の判定に使える'
states:
