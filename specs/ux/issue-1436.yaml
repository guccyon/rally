  a/subscribe）'
- 'studentHome 次にやることが 2 件以上: 1 件目をカード、2 件目からを list_row'
- 'studentHome 空（次にやることが 0 件）: 欄ごと出さない'
- 'studentHome 読み込み中: 欄に「次にやることを読み込んでいます…」。前に出した内容があれば読み直すあいだ残す'
