    - data: なし
      from: アプリバーの自分の予約・ホームの「予約をすべて見る」・お知らせ
      condition: 登録済み
summary: 生徒アプリのホームの先頭に「次にやること」の欄を足し、サーバーが返す次の操作（予約を確定する・ビデオ通話で受ける・完了の記録へ進む・月額契約へ進む）をいつでもそこから開けるようにします。続きの画面（予約の確定待ち・予約が確定しました・レッスンの完了）はアプリの段ではなくサーバーの予約・動画・通話セッションから読み直して開き、プロフィールと自分の予約にも入口を足します。
judgments:
- kind: ui
  note: あいさつのすぐ下に「次にやること」の欄。1 件目をカード、2 件目からを行。案 b・c と比べて案 a を推す（rationale）
  question: 次の操作をホームのどこに置くか
- kind: ui
  note: 次にやることのボタンだけを primary にし、「次のレッスンを予約する」「添削を依頼する」は secondary に落とす。添削待ちのように押す操作がないときも、ほかを
    primary に上げない（並びで画面が揺れないため）
  question: 主なボタンが 1 画面に 1 つの決まりと、今のホームの FilledButton 2 つ
- kind: system_interface
  note: サーバー（GET /me/next-actions）。アプリは返った順のまま出し、数え直さない（ADR 0006・新 ADR）。続きの画面は ID
    で今の API から読み直し、新しい API は next-actions の 1 つだけ
  question: 次の操作をどこで決めるか
- kind: system_interface
  note: 呼ばない。予約の確定待ちの画面へ移り、そこで確定する（回数を使う場合の説明を見せてから押す。確定の処理を 1 か所に保つ）
  question: ホームから確定を直接呼ぶか
- kind: error_handling
  note: 読み直して今の状態の画面に切り替える（確定済みなら予約が確定しました）。キャンセル済み・見つからないときは notice（info）と「ホームに戻る」。押したあとの
    409 も同じ扱い
  question: 開いた続きの画面の予約が、もうその状態でないとき
- kind: error_handling
  note: その欄だけに notice（danger）で「ホームを更新する」を案内し、ほかの欄は出す（patterns の states）。続きの画面の「完了の記録へ進む」は、読めないときは出さない（記録の二重を避ける）
  question: 次にやることを読めないとき
- kind: scope
  note: 予約の確定待ちの画面にキャンセル（confirm_dialog）を足す。期限での自動解放はサーバーの決まりの変更なので今回は入れない（open_questions
    の 3）
  question: 確定待ちの予約を確定しない生徒の枠をどう返すか
- kind: scope
  note: 受け入れ条件のホームとプロフィールに加え、ホームの「今月のビデオ通話」の契約なしの文の下にも文字のボタンを置く（ストーリー student-subscription-persists
    の入口の文と合わせる）。月額契約の画面の中身は変えない
  question: 月額契約の入口をどこに足すか
- kind: ui
  note: 入口のアイコン 7 つで題が入らないので、題を本文の headline に移す（アプリバーのアイコンは今のまま）。下のタブへの移し替えは patterns
    の proposed のままで、今回はしない
  question: 続きの画面のアプリバーの題
prototype: true
rationale:
  why: 不具合の根は「次の操作がその段の画面にしかない」ことで、直すには、どの状態の生徒にも決まった 1 か所の入口が要ります。案 a はホームの先頭を入口にし、中身はサーバーの
    GET /me/next-actions の順のまま出すので、どこから戻っても、開き直しても同じ操作に届きます（新しい ADR の決定どおり）。1 件目だけを大きくして主なボタンを
    1 つにするので、principles の next-move-first（次の一手を一番前に）にも合います。続きの画面は ID でサーバーから読み直すので、ホームから入っても直後に入っても同じ画面になります。見た目は今の部品とトークンだけで、新しい色や書体は決めていないので
    brand_impact は false です。
  rejected:
  - idea: '案 b: それぞれの欄の中に置く（b.html）'
    reason: 新しい語は増えないが、何を先にやるかを欄の並びが決めてしまい、サーバーの判断（優先の順）が画面に出ない。primary が欄ごとに出て 1
      画面 1 つにならない。月額契約や完了の記録は「これからの予約」のように置き場の欄がない
  - idea: '案 c: 開いたら「続きから」の画面を先に出す（c.html）'
    reason: '最も速いが、開くたびにホームの前に挟まり、閉じたことを覚えるには端末に状態を残すことになる（ADR の「とらなかった案: アプリ内の状態を端末に保存する」に当たる）。2
      件目以降が見えない'
  - idea: 段ごとに当て布をする（各画面の「戻る」先を直す・#1432 の延長）
    reason: プランナーの ADR でとらなかった案。開き直しで消え、同じ型の不具合がまた出る
  - idea: 次にやることを score_panel（濃い面）で見せる
    reason: 数字の主役ではなく、契約後は今月のビデオ通話の score_panel と濃い面が 2 つになり one-hot-spot に反する
  - idea: ホームから直接 confirmBooking を呼ぶ（「予約を確定する」をホームに置く）
    reason: 月額契約の生徒では確定でビデオ通話の枠を使うので、予約の中身と回数を見せた画面で押すほうが安全（patterns の confirm）。確定の処理も
      1 か所にまとまる
  - idea: お知らせの一覧を次の操作の入口にする
    reason: お知らせは出来事の記録で、操作が済んでも残る。今の状態から出す入口にはホームのほうが合う。お知らせの行の行き先は今のまま
  requirement_map:
  - how: ホームの次にやること（confirm_booking）の「内容を確かめて確定する」→ ID で読み直した studentBookingPending
      の「予約を確定する」。確定しないなら同じ画面の「この予約をキャンセルする」で枠を返す。自分の予約からも同じ画面へ（a.html → a-pending）
    requirement: 予約の確定待ちの画面を離れても、ホームから「予約を確定する」に進め、枠を止めたままにならない（#1425・#1430）
  - how: ホームの次にやること（join_live_lesson）の「ビデオ通話で受ける」（開始 5 分前から。#1040 の決まりのまま）と「動画を送って添削を受ける」（frame
      a/join）
    requirement: 「予約が確定しました」の画面を離れても、ホームから入室前チェック・ビデオ通話に進める（#1424・#1429）
  - how: 添削待ちは次にやることに「コーチが添削しています」、返却後は「完了の記録へ進む」（record_lesson_completion）。添削結果の画面のボタンもサーバーの記録で出す（frame
      a/waiting・a/complete）
    requirement: 「コーチが添削しています」を離れても、開き直しても、完了の記録へ進める（#1423）
  - how: ホームの次にやること（start_subscription）と今月のビデオ通話の欄の「月額契約へ進む」、プロフィールの月額契約の行（frame a/subscribe・a/profile）
    requirement: レッスンの完了を離れても、ホームとプロフィールから月額契約へ進める（#1431）
  - how: どの段で離れても、ホームの次にやることの 1 件目が次の段の画面を開く（user_flow）。プロトタイプは a.html から a-subscribe
      までつながる
    requirement: 一周（登録 → 体験予約 → 確定 → レッスン → 完了 → 月額契約）が途中で離れても通る
  - how: '次にやることは開くたびに API から読み、続きの画面は ID でサーバーから読み直す。端末にもアプリの段にも頼らない（ログインし直しは #1404
      の後）'
    requirement: アプリを開き直しても同じ
  - how: 'contract_needs の「決め方」と user_flow が、新しいストーリー student-resumes-next-action
      の steps の下書きになる（状態ごとに where: student-app ホーム・do・sees）'
    requirement: どの状態の利用者がどこから次の操作に入るかを specs/stories/ に書き、QA で通す
  - how: 入室前チェックの中身と 5 分前の決まりは変えない。「次のレッスンを予約する」は文言と出す条件を変えず secondary にするだけ。月額契約の画面の中身は変えず、入口を増やす
    requirement: '守る: student-prejoin-check・student-books-after-first-lesson、変える:
      student-subscription-persists'
user_flow:
- to: studentBookingPending
  from: studentSlotSearch
  action: スロットを選んで体験予約する（createBooking）
- to: 'studentHome（次にやること: 体験予約がまだ確定していません）'
  from: studentBookingPending
  action: 確定せずに離れる（アプリバーのホーム・アプリを閉じる）
- to: studentBookingPending（予約の ID でサーバーから読み直す）
  from: studentHome
  action: 「内容を確かめて確定する」を押す
- to: studentBookingConfirmed
  from: studentBookingPending
  action: 「予約を確定する」を押す（confirmBooking）
- to: studentHome（次にやることから消える）
  from: studentBookingPending
  action: 「この予約をキャンセルする」→ 確認で「キャンセルする」（cancelBooking）
- to: 'studentHome（次にやること: 体験予約のレッスンを受けましょう）'
  from: studentBookingConfirmed
  action: 受け方を選ばずに離れる
- to: studentPrejoinCheck（#1040 のまま）→ studentLiveLesson
  from: studentHome
  action: 開始 5 分前を過ぎてから「ビデオ通話で受ける」を押す
- to: studentVideoSubmit → studentVideoReview（コーチが添削しています）
  from: studentHome
  action: 「動画を送って添削を受ける」を押す
- to: 'studentHome（次にやること: コーチが添削しています。押す操作なし）'
  from: studentVideoReview
  action: 返却を待たずに離れる・アプリを開き直す
- to: 'studentHome（次にやること: 添削が返ってきました）'
  from: studentHome
  action: 添削が返ったあとに開く・「ホームを更新する」
- to: 'studentHome（次にやること: ビデオ通話が終わりました）'
  from: studentLiveLesson
  action: 通話を終えて完了を記録せずに離れる
- to: studentLessonCompletion（通話セッションか動画の ID を渡す）
  from: studentHome
  action: 「完了の記録へ進む」を押す
- to: 'studentHome（次にやること: 月額契約で、続けて教わりましょう）'
  from: studentLessonCompletion
  action: 「完了を記録する」のあと、月額契約へ進まずに離れる
- to: studentSubscription（今のまま）
  from: studentHome・studentProfile
  action: 「月額契約へ進む」を押す
- to: studentHome（次にやることから消え、今月のビデオ通話が残りの回数になる）
  from: studentSubscription
  action: 「月額契約を始める」のあとホームへ
brand_impact: false
open_questions:
- 1. 【とくに見てほしい】次にやることの優先の順。仮は サーバーで 確定待ち（confirm_booking）→ 入室前チェックを開ける時刻を過ぎた予約（join_live_lesson）→
  完了の記録がない（record_lesson_completion）→ まだ早い確定済みの予約（join_live_lesson）→ 添削待ち → 月額契約、の順で
  3 件まで。月額契約を「次のレッスンを予約する」より上に出す（1 件目の primary になる）ことも、事業として良いか決めてください
- 2. 欄の名前「次にやること」は glossary にない語です。glossary に next_action（ja「次にやること」、定義「サーバーの状態から決まる、生徒が次にできる操作」）を足す前提で書きました。別の語がよければ指示ください
- 3. 確定待ちの予約に期限を設け、確定されなければサーバーが自動で解放するか。仮は今回入れない（画面に確定とキャンセルの道を作るだけ）。入れるなら別のタスクで、カードに「10/27（火）18:00
  までに確定してください」を足す
- 4. 体験予約で「動画を送って添削を受ける」を選んだあとも、その予約の「ビデオ通話で受ける」を次にやることに出し続けるか。仮は、動画を送ったら添削の流れ（添削待ち
  → 完了の記録）を優先し、通話の予約は開始 5 分前を過ぎたときだけ出す（サーバーの決め方で吸収）
- '5. 「開き直しても同じ」の確かめ方。生徒アプリは今ログインの状態を端末に残さないので、仮は同じ生徒のまま画面を読み直したとき（アプリの段の状態を捨ててホームを開く）で確かめる。本当の開き直しは
  #1404 の後'
- 6. レッスンの評価（完了したのに評価していない）を次にやることに入れるか。仮は入れない（一周の外。今のまま完了の画面から）
- 7. 次にやることからの入口を計測するか。仮は行動イベントを足さない（進んだ先の今のイベントで足りる）。入口の効き目を見たいなら next_action.opened（kind
  つき）を events.yaml に足す
- 8. 予約の確定待ちの画面に「この予約をキャンセルする」を足すのは、「枠を止めたままにならない」のための小さな範囲の追加と判断しました。外すなら、キャンセルは自分の予約からだけになります
design_system_gaps: []
design_system_constraints:
- 色・余白・角丸・文字の段は specs/design/tokens.yaml（0.5.0）の名前だけを使った。out/rally.css はトークンと components.yaml
  の preview_css を写したもの
- 次にやることのカードは components の card（plain）の parts（status_tag・title・meta・action）で組んだ。カード全体は押せず、押せる場所はボタン
  1 つ（card の behavior）
- 主なボタン（primary）は 1 画面に 1 つ（button の rule）。そのため今のホームの「次のレッスンを予約する」「添削を依頼する」を secondary
  に落とす。添削待ちのときは primary を出さない
- ライム（secondary）は、これからの予約の次のレッスンの日付のコマだけ（usage_rules）。次にやることのカードには日付のコマを置かない。濃い面は契約後の
  score_panel だけ
- 状態は status_tag の点と glossary の呼び名（確定待ち・確定済み）。失敗は notice の inline（danger）、もう状態が変わったは
  notice（info）、キャンセルの確認は confirm_dialog（danger）
- 欄ごとの読み込み中・失敗は patterns の states（読めた欄はそのまま出す）。予約の確定待ちの画面の項目は description_list の stacked（600px
  未満）
- '文言は content.yaml: ボタンは動詞で終える、誤りは何が起きたかとどうすればよいかの 2 文、サーバーの文言は書き換えない、日時は「10/28（水）12:00〜12:30」'
- アプリバーの入口のアイコンは今の FlowScaffold のまま。題が入らない続きの画面は、題を本文の headline に置いた（common_layout
  の「画面の見出し headline 32px」）
- アイコンは iconography の Material Symbols の線の形を、モックでは同じ形の SVG を手で描いて代わりにした。書体は Noto Sans
  CJK JP と Barlow Condensed を font-family で指定するだけで、外の資源は読まない
variant:
  id: a
  axis: flow
  name: ホームの先頭に「次にやること」をまとめる
  frames:
  - id: pending
    state: 代表（確定待ち）
    screen: studentBookingPending
    caption: ホームの「内容を確かめて確定する」を押した（予約をサーバーから読み直した確定待ちの画面）
  - id: confirmed
    state: 5 分前より前
    screen: studentBookingConfirmed
    caption: 「予約を確定する」を押した（開始 5 分前より前）
  - id: join
    state: 確定済み・5 分前を過ぎた
    screen: studentHome
    caption: 確定の画面を離れ、開始 5 分前を過ぎてホームを開いた
  - id: waiting
    state: 添削待ち
    screen: studentHome
    caption: 「動画を送って添削を受ける」で動画を送り、返却を待たずにホームへ来た
  - id: complete
    state: 完了の記録がない
    screen: studentHome
    caption: コーチが添削を返したあとにホームを開いた
  - id: subscribe
    state: 月額契約がない
    screen: studentHome
    caption: 完了を記録したあと、月額契約へ進まずにホームへ来た
  - id: profile
    state: 契約なし
    screen: studentProfile
    caption: アプリバーのプロフィールを開いた（契約なし）
  - id: error
    state: 失敗
    screen: studentHome
    caption: ホームを開いたが、次にやることを読めなかった
  height: 1500
  tradeoff: どの段から離れても、ホームの同じ場所の 1 枚で続きに戻れ、順もサーバーが決めるので迷わないが、ホームに欄が 1 つ増え、同じ予約がカードと「これからの予約」に
    2 回出る
  viewport: mobile
