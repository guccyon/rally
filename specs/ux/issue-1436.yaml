    note: 主なボタンを 1 つにするため、FilledButton を secondary に変える（文言と出す条件は変えない。student-books-after-first-lesson
      を守る）
    source: listMyLessonCompletions（今のまま）
    content: 今の文言と「次のレッスンを予約する」
    required: false
    component: 欄・body・button（secondary）
  - name: これからの予約（今のまま）
    note: 次にやることのカードと同じ予約がここにも並ぶ（ここは一覧として残す）
    source: listMyBookings
    content: 今のまま
    required: true
    component: card（booking）
  - name: 今月のビデオ通話
    note: student-subscription-persists の入口（「まだ月額契約はありません」を見て契約の画面を開く）
    source: getMyEntitlement（404 は受講権なし）
    content: 契約がなければ今の文と、文字のボタン「月額契約へ進む」（新）。契約があれば今のまま
    required: true
    component: 欄・body・button（text）／score_panel
  - name: 動画の添削（今のまま）
    note: 主なボタンを 1 つにするため secondary に変える。押せないときの理由の文は今のまま
    source: listMessageThreads
    content: 「添削を依頼する」
    required: true
    component: 欄・body・button（secondary）
  behaviors:
  - action: 開く（起動・ホームへ戻る・アプリが前に戻る）
    result: GET /me/next-actions をほかの欄と並べて読む。前に出していた内容は読み直すまで残し、読み終えたら差し替える。端末には残さない（開き直しも同じ
      API の結果で出す）
    target: 画面
    condition: 登録済み
  - action: 読み込み中
    result: 見出しの下に「次にやることを読み込んでいます…」（loading の section_text・role=status）。300ms より速ければ出さない
    target: 次にやること
    condition: 最初に開いたとき（前の内容がない）
  - action: 読み込みに失敗
    result: 欄に notice（danger・role=alert）「次にやることを読み込めませんでした。「ホームを更新する」でもう一度読み込めます。」。ほかの欄はそのまま出す
    target: 次にやること
    condition: API が失敗した（通信・5xx）
  - action: 0 件
    result: 欄ごと出さない（ほかの欄がそれぞれの空の表示を持つ）
    target: 次にやること
    condition: サーバーが空の一覧を返した
  - action: 押す
    result: studentBookingPending へ移り、booking_id で予約を読み直す。API の確定はこの画面では呼ばない（回数を使うことがあるので、中身を見せた画面で押す）
    target: 内容を確かめて確定する
    condition: confirm_booking
  - action: 押す
    result: studentPrejoinCheck（#1040）へ booking_id を渡して移る
    target: ビデオ通話で受ける
    condition: 今の時刻（サーバーに合わせた時計）≥ 開始 5 分前
  - action: 押す
    result: 押せない（disabled）。読み上げはボタンと開ける時刻の文を続けて読む
    target: ビデオ通話で受ける
    condition: 開始 5 分前より前
  - action: 開いたまま待つ
    result: 開き直さずに押せるようにし、文を「入室前チェックでカメラとマイクを確かめてから…」に替え、「入室前チェックができるようになりました」を role=status
      で 1 回読む
    target: ビデオ通話で受ける
    condition: 開始 5 分前になった
  - action: 押す
    result: 動画の送付（今のまま）へ。送り先は予約のコーチ
    target: 動画を送って添削を受ける
    condition: join_live_lesson で is_trial
  - action: 押す
    result: studentLessonCompletion へ session_id か video_id を渡して移る（記録はその画面の「完了を記録する」）
    target: 完了の記録へ進む
    condition: record_lesson_completion
  - action: 押す
    result: studentSubscription（今のまま）へ
    target: 月額契約へ進む
    condition: start_subscription・今月のビデオ通話の欄
  - action: 続けて 2 回押す
    result: 2 回目は無視する（busy のあいだ押せない）。移った先の読み込みは 1 回だけ
    target: 次にやることのボタン・行
    condition: 移る途中・ほかの API を呼んでいる（busy）
  - action: 戻ってくる
    result: '開くたびに読み直すので、終えた操作は消え、次の操作が 1 件目になる（例: 確定 → 「体験予約のレッスンを受けましょう」）'
    target: 次にやること
    condition: 続きの画面で操作を終えた・やめた
  - action: 押す
    result: 次にやることを含む全部の欄を読み直す（今のまま）
    target: ホームを更新する
    condition: いつでも
  transitions:
    exits:
    - to: studentBookingPending
      data: booking_id
      action: 「内容を確かめて確定する」（confirm_booking）
    - to: studentPrejoinCheck
      data: booking_id
      action: 「ビデオ通話で受ける」（join_live_lesson。開始 5 分前を過ぎてから）
    - to: studentVideoSubmit
      data: booking_id
      action: 「動画を送って添削を受ける」（join_live_lesson で体験予約のとき）
    - to: studentVideoReview（読むだけ）
      data: video_id
      action: 「送った動画を見る」（video_review_in_progress）
    - to: studentLessonCompletion
      data: session_id か video_id
      action: 「完了の記録へ進む」（record_lesson_completion）
    - to: studentSubscription
      data: なし
      action: 「月額契約へ進む」（start_subscription・今月のビデオ通話の欄）
    - to: その行の種類の行き先（上と同じ）
      action: 2 件目からの行を押す
    - to: 今のまま
      action: ほかの欄・アプリバー
    entries:
    - data: なし。開くたびに GET /me/next-actions とほかの欄の API を読み直す
      from: 登録の完了・アプリの起動・アプリバーの「ホーム」・各画面を閉じたとき
      condition: 登録済み（アクセストークンがある）
- id: studentBookingPending
  new: false
  more:
    analytics: booking.confirmed・booking.cancelled（今のまま）
    contract_needs:
    - listMyBookings（ID で探す）・confirmBooking・cancelBooking（今のまま）
  route: student-app の FlowStep.bookingPending（予約の ID を持って開く）
  purpose: 確定待ちの予約の中身を確かめて確定する（または確定せずにキャンセルして枠を返す）。体験予約の直後と、ホーム・自分の予約から戻ってきたときの両方の着地点。
  audience: 生徒（その予約の本人）
  elements:
  - name: 見出し
    note: アプリバーの題は空にし、見出しを本文に置く（入口のアイコンが 7 つでアプリバーに題が収まらないため）
    source: Booking.is_trial
    content: 「体験予約」（体験でなければ「予約」）と「予約の確定待ち」
    required: true
    component: small 700 と headline
  - name: 予約の内容
    note: 値がない項目は「—」、名前がないときは「（名前を表示できません）」
    source: listMyBookings の該当の予約（MyBooking）
    content: 開始「10/28（水）12:00〜12:30」・スポーツ・レッスンメニュー（あれば）・コーチ・今の状態（status_tag 確定待ち）
    required: true
    component: description_list（stacked）
  - name: 案内の文
    note: 回数を使うことは本文の大きさで書く（patterns の confirm）
    source: 固定・getMyEntitlement
    content: 「予約はまだ確定していません。内容を確かめて確定してください。」。月額契約があり同期レッスンなら続けて「確定すると、今月のビデオ通話の枠を
      1 回使います（残り 2 回）。」
    required: true
    component: body
  - name: 予約を確定する
    note: 今のまま
    source: 固定
    content: 「予約を確定する」
    required: true
    component: button（primary）
  - name: この予約をキャンセルする（新）
    note: 確定待ちはキャンセル規定で回数を使わないので、そのことは書かない（使うときは自分の予約の今の文言を出す）
    source: 固定・予約の中身
    content: 題「予約をキャンセルしますか？」、本文「10/28（水）12:00〜12:30 のテニスの体験予約をキャンセルします。押さえていたスロットはほかの生徒も予約できるようになります。」、「やめる」「キャンセルする」
    required: true
    component: button（text）と confirm_dialog（danger）
  - name: 失敗の知らせ
    note: ボタンの上に出す
    source: API の誤り
    content: サーバーの文言（書き換えない）
    required: false
    component: notice（danger）
  behaviors:
  - action: ID で開く
    result: loading の bar と「予約を読み込んでいます…」。読めたら中身を出す
    target: 画面
    condition: ホーム・自分の予約から
  - action: 読み込みに失敗
    result: notice（danger）「予約を読み込めませんでした。「ホームに戻る」から、もう一度開けます。」と button（secondary）「ホームに戻る」
    target: 画面
    condition: 通信・5xx
  - action: 読み直したら確定待ちでない
    result: studentBookingConfirmed に切り替える（ほかの端末で確定していた）
    target: 画面
    condition: 確定済み
  - action: 読み直したら確定待ちでない
    result: notice（info）「この予約はもう確定待ちではありません。ホームで次にやることを確かめてください。」と「ホームに戻る」。確定とキャンセルのボタンは出さない
    target: 画面
    condition: キャンセル済み・見つからない（他人の予約・消えた）
  - action: 押す
    result: confirmBooking。押したら loading（spinner・押せない）。成功で studentBookingConfirmed
    target: 予約を確定する
    condition: 確定待ち
  - action: 続けて 2 回押す
    result: 2 回目は送らない（loading のあいだ押せない）。届いてしまっても 409 で、画面は読み直して確定済みを出す
    target: 予約を確定する
    condition: 送っているあいだ
  - action: 押す
    result: notice（danger）でサーバーの文言。予約は確定待ちのまま。キャンセルの道は残す
    target: 予約を確定する
    condition: 409 live_lesson_quota_exceeded
  - action: 押す
    result: 予約を読み直し、上の「確定待ちでない」の振る舞い
    target: 予約を確定する
    condition: 409 invalid_booking_state
  - action: 押す
    result: confirm_dialog を開く（フォーカスは題へ）
    target: この予約をキャンセルする
    condition: 確定待ち
  - action: 「やめる」・外を押す・戻る
    result: 閉じて元のボタンにフォーカスを戻す。何も送らない
    target: 確認のダイアログ
    condition: —
  - action: 「キャンセルする」
    result: cancelBooking。成功でホームへ戻り、toast「予約をキャンセルしました」。失敗はダイアログを閉じて notice（danger）でサーバーの文言
    target: 確認のダイアログ
    condition: —
  transitions:
    exits:
    - to: studentBookingConfirmed
      action: 「予約を確定する」が成功
    - to: studentHome
      action: 「この予約をキャンセルする」→ 確認で「キャンセルする」が成功
    - to: その画面（予約は確定待ちのまま。ホームの次にやることに残る）
      action: アプリバーのホーム・ほかの入口
    - to: その場で旨を出し、「ホームに戻る」で studentHome
      action: もう確定待ちでない（409 invalid_booking_state・読み直したら確定済みかキャンセル済み）
    entries:
    - data: 作った予約（Booking）
      from: createBooking の成功
      condition: 作った予約が確定待ち
    - data: booking_id。開いたら listMyBookings で読み直す
      from: studentHome の「内容を確かめて確定する」・studentMyBookings の同じボタン
      condition: その予約が確定待ち（サーバーの記録）
- id: studentBookingConfirmed
  new: false
  route: student-app の FlowStep.bookingPending（確定済みの表示）
  purpose: 確定した予約の初回レッスンの受け方を選ぶ（#1040 のまま）。今回は、ここを離れてもホームから同じ 2 つの操作に進めるようにするだけ。
  audience: 生徒（その予約の本人）
  elements:
  - name: 見出し・予約の内容
    note: studentBookingPending と同じ形にそろえる
    source: listMyBookings
    content: 「予約が確定しました」と予約の内容（状態は確定済み）
    required: true
    component: headline・description_list
  - name: ビデオ通話で受ける・開ける時刻の案内・動画を送って添削を受ける
    note: 変えない
    source: '#1040 のまま'
    content: '#1040 のまま'
    required: true
    component: button（primary・secondary）・small
  behaviors:
  - action: ID で開く
    result: studentBookingPending と同じ読み込み・失敗の振る舞い
    target: 画面
    condition: ホームから戻った
  - action: 押す・待つ
    result: '#1040 のまま（5 分前より前は押せず、開いたまま 5 分前になると押せる）'
    target: ビデオ通話で受ける
    condition: —
  transitions:
    exits:
    - to: studentPrejoinCheck
      action: 「ビデオ通話で受ける」（開始 5 分前から）
    - to: studentVideoSubmit
      action: 「動画を送って添削を受ける」
    - to: その画面。ホームの次にやることに「体験予約のレッスンを受けましょう」が残る
      action: 離れる
    entries:
    - data: 予約（サーバーから読み直したもの）
      from: studentBookingPending の確定の成功・ID で開いて確定済みだった
      condition: 予約が確定済み
- id: studentVideoReview
  new: false
  route: student-app の FlowStep.videoReview・myVideoReview
  purpose: 送った動画の添削を読む。添削が返っていて完了の記録がなければ、完了の記録へ進む（#1423 の残り）。
  audience: 生徒（動画を送った本人）
  elements:
  - name: 完了の記録へ進む
    note: アプリを開いているあいだの状態（myVideoReviewCompletesFlow）では決めない。どこから開いても、開き直しても同じ
    source: 出す条件は GET /me/next-actions にその video_id の record_lesson_completion があること
    content: 「完了の記録へ進む」
    required: false
    component: button（primary）
  - name: そのほか
    note: 変えない
    source: getVideoReview
    content: 今のまま
    required: true
    component: 今のまま
  behaviors:
  - action: 押す
    result: studentLessonCompletion へ video_id を渡す
    target: 完了の記録へ進む
    condition: 返却済みで完了の記録がない
  - action: 出さない
    result: ボタンを出さない（読めないときは添削は読めるまま）
    target: 完了の記録へ進む
    condition: 返却待ち・完了を記録済み・次にやることを読めない
  transitions:
    exits:
    - to: studentLessonCompletion
      data: video_id
      action: 「完了の記録へ進む」
    - to: 開いた画面
      action: 閉じる
    entries:
    - data: video_id。getVideoReview で読む
      from: 動画の送付の成功・自分の動画・ホームの返ってきた添削・ホームの「送った動画を見る」
      condition: 自分の動画
- id: studentLessonCompletion
