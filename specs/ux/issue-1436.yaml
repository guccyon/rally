    - 欄は section と aria-labelledby で「次にやること」。カードは状態のタグ・題・日時・ボタンの順に読む
    - 押せない「ビデオ通話で受ける」は aria-disabled と aria-describedby で開ける時刻の文と結ぶ
    - 失敗は role=alert、読み込み中と 5 分前になったことは role=status
    - ボタンは 56px・幅いっぱい。文字 200% でも題と日時は折り返し、横に動かさない
    contract_needs:
    - 'GET /me/next-actions（operationId getMyNextActions。生徒だけ。他人の分は返さない。401・403）→
      {next_actions: NextAction[]}。並びがそのまま優先の順（サーバーが決める）、3 件まで'
    - 'NextAction.kind: confirm_booking | join_live_lesson | video_review_in_progress
      | record_lesson_completion | start_subscription'
    - 'NextAction の項目（kind で持つものが変わる）: booking_id・video_id・session_id・lesson_type・is_trial・starts_at・ends_at・sport・lesson_menu（名前と
      1 回の時間の写し）・coach_display_name（null 可）・submitted_at・returned_at'
    - '決め方（サーバー）: 確定待ちの予約 → confirm_booking。確定済みで終わっていない同期レッスンの予約（いちばん近い 1 件）→ join_live_lesson。動画を送って返却待ち
      → video_review_in_progress。返却済みか通話セッションが終わっていて完了の記録がない → record_lesson_completion。完了したレッスンがあり受講権がない
      → start_subscription'
    - '続きの画面を開くための読み直しは今の操作で足りる: listMyBookings（予約の ID で探す）・getVideoReview・getMyEntitlement。完了の記録は
