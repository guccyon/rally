  new: false
  more:
    copy:
      terms: 予約（確定待ち・確定済み）・スロット・体験予約・ビデオ通話・入室前チェック・動画添削・完了したレッスン・月額（月額契約）は glossary
        と content の glossary_mapping の語
      buttons:
