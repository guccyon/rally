- 'studentHome 送信中: 起きない（次にやることのボタンは移るだけで API を送らない）。移るあいだは busy で押せない'
- 'studentHome 権限がない: 401 はアカウント登録へ（今のまま）。他人の分はサーバーが返さない'
- 'studentBookingPending 読み込み中（ID で開いた）: loading の bar と「予約を読み込んでいます…」'
- 'studentBookingPending 代表: 予約の内容・「予約を確定する」・「この予約をキャンセルする」（frame a/pending）'
- 'studentBookingPending 送信中: 「予約を確定する」に spinner、押せない'
- 'studentBookingPending 確認: 「この予約をキャンセルする」で confirm_dialog（danger）。キャンセルの送信中は「キャンセルする」に
  spinner'
- 'studentBookingPending 失敗（読めない）: notice（danger）と「ホームに戻る」'
- 'studentBookingPending 失敗（確定できない）: 409 live_lesson_quota_exceeded などサーバーの文言を notice（danger）。予約は確定待ちのまま'
- 'studentBookingPending もう確定待ちでない: 確定済みなら studentBookingConfirmed に切り替え、キャンセル済み・見つからないなら
  notice（info）と「ホームに戻る」'
- 'studentBookingPending 権限がない: 他人の予約は listMyBookings に出ないので「見つからない」と同じ。401 は登録へ'
- 'studentBookingConfirmed 代表（5 分前より前）: #1040 のまま（frame a/confirmed）。読み込み中・失敗は studentBookingPending
  と同じ'
- 'studentVideoReview 返却済み・完了の記録なし: 「完了の記録へ進む」（どこから開いても、開き直しても）。返却待ち・記録済みは出さない'
- 'studentLessonCompletion 記録済みだった（409）: サーバーの文言と、記録済みの表示（評価・月額契約への入口）'
- 'studentProfile 契約なし: 月額契約の行「月額契約へ進む」（frame a/profile）。契約あり: 「月額契約」とプラン・開始の日'
- 'studentProfile 月額契約を読み込み中・失敗: 「月額契約を読み込んでいます…」／error_text。表示名は使えるまま'
- 'studentMyBookings 確定待ちの予約: カードに「内容を確かめて確定する」'
ticket: guccyon/rally#1436
