      load_failed: 次にやることを読み込めませんでした。「ホームを更新する」でもう一度読み込めます。
      section_title: 次にやること（glossary に語がないので、next_action を足す提案。open_questions の 2）
    analytics: 新しい行動イベントは足さない。進んだ先で今のイベント（booking.confirmed・booking.cancelled・call.started・video.submitted・lesson.completed・subscription.started）が今までどおり出る。入口ごとの計測は
      open_questions の 7
