prd:
  goal: 本部の担当者（運営）として、コーチがお休みするときに、その期間の予約を 1 件ずつ探して生徒に連絡し、枠を片づける手作業をやめたい。 期間を入れて
    1 回確かめれば、影響する生徒にもれなく知らせて片づけが終わるようにしたい。
  scope:
    in:
    - 本部の画面「コーチのお休み」（期間の入力・影響の一覧・生徒への一言・確認・結果）
    - コーチの様子の「このコーチで開く画面」のリンクの並びに「お休み」を足す
    - 本部による予約のまとめてのキャンセル、生徒ごとのお知らせ、期間の枠の取り下げ（新しい API。contract_needs）
    out:
    - ほかのコーチへの振替（代わりのコーチを探して予約し直す）。生徒が自分で探す（お知らせの本文で案内する）
    - コーチ自身がお休みを申し出る画面（coach ロール）。今回はコーチから本部へ連絡が来る前提
    - お休みの期間中にコーチが新しく枠を公開できないようにする仕組み（open_questions の 2）
    - 受付の停止（期限のない停止は今の「コーチの受付」のまま。お休みは期間で区切る）
    - お休みの取り消し（キャンセルした予約は元に戻せない）と、お休みの記録の一覧の画面
    - 動画添削（非同期レッスン）の返却待ちの扱い。期間のある予約ではないので対象外（open_questions の 4）
  source: 'Issue guccyon/rally#455「コーチがお休みするとき、毎回手作業で大変なんだけど」（要求者 ops-1。本文はこの 1 文だけで、
    受け入れ条件はない。手作業の中身は今の製品から読み取った: 本部は受付を止められるが予約と枠はそのまま残り （openapi admin-web の suspendCoach）、本部は予約をキャンセルできず（今キャンセルできるのは生徒だけ。listCancelledBookings
    の説明）、 枠の取り下げはコーチ本人だけ（withdrawMySlot）、お知らせは生徒全員かスポーツごとにしか送れない（sendAnnouncement））。
    PRD の文書は specs/ にない。'
  success: '本部がコーチの様子からこの画面を開き、お休みの期間を入れて、期間の予約（確定待ち・確定済み）と枠を画面で確かめ、 「お休みにする」を 1 回確かめて押すだけで、(1)
    期間の予約がすべて本部のキャンセルになり（生徒のビデオ通話の枠を使わない）、 (2) 予約した生徒全員にお知らせが届き、(3) 期間の枠がすべて取り下げられて生徒の検索に出なくなる。
    どの予約をキャンセルしたかは「キャンセルされた予約」（キャンセルした人: 本部）であとからたどれる。'
notes:
- 案は admin-web（PC の管理画面）なので desktop で撮った。今の本部の画面は幅 48rem の 1 段で、狭い幅でも同じ並びで縦に伸びる
- 動くプロトタイプの入口は a.html。a-overview.html（コーチの様子）の「お休み」→ a.html の「お休みにする」→ a-confirm.html
  の「キャンセルしてお休みにする」→ a-done.html → 「コーチの様子へ戻る」でひと回りする。a-loading・a-invalid・a-empty・a-sending・a-failed
  は状態のコマ
- 送信中（a-sending）の後ろの画面は案 a の代表と同じ中身を描いている。コマの中の「モックの注記」の文と、入口のリンクの薄い青の面はモックだけのもの
- サンプルの名前・日時は架空（2026-11-05 を今日とした）
states:
- 'hqCoachLeave コーチの読み込み中: 「読み込み中…」（frame loading とは別。コーチの欄だけ）'
- 'hqCoachLeave コーチが見つからない（coach_id なし・コーチでない ID）: 「このコーチは見つかりません。コーチの一覧から選び直してください。」入力欄は出さない'
- 'hqCoachLeave 期間がまだ空: 期間の欄と「期間の予約と枠を確かめる」だけ。「お休みにする」は押せない'
- 'hqCoachLeave 入力の誤り: 日付の欄の下に error_text（frame invalid）'
- 'hqCoachLeave 期間の予約と枠の読み込み中: ボタンの spinner と「期間の予約と枠を読み込んでいます…」・画面の上の bar（frame loading）'
- 'hqCoachLeave 中身あり: 期間の予約と枠の一覧・お知らせの見本・一言・知らせ・「お休みにする」（案 a の代表）'
- 'hqCoachLeave 空（期間に予約も公開中の枠もない）: empty_state（frame empty）'
- 'hqCoachLeave 一覧の読み込みの失敗: 欄の中に notice（danger）。期間は残す'
- 'hqCoachLeave 期間を変えたあと: 一覧は残し、「お休みにする」を押せなくして読み直しを促す'
- 'hqCoachLeave 確認: confirm_dialog（frame confirm）'
- 'hqCoachLeave 送信中: confirm の spinner、「やめる」も押せない、「お休みにしています…」（frame sending）'
- 'hqCoachLeave お休みにした: 結果の知らせ（success）とキャンセル済み・終了の一覧、次のリンク（frame done）'
- 'hqCoachLeave 送る失敗（確かめたあとに予約が変わった・重なるお休み・そのほか）: 画面の上に notice（danger）。何も変えていないことを書き、入れた値は残す（frame
  failed）'
- 'hqCoachLeave 権限がない（本部以外・未ログイン）: RoleGate がログイン画面へ戻す。API の 401・403 は失敗の文言'
- 'hqCoachOverview: 既存の状態のまま（「お休み」のリンクは読み込みを待たずに出る）'
ticket: guccyon/rally#455
changes:
- kind: new
  after: 新しい画面。コーチ 1 人（URL の ?coach_id=）とお休みの期間（始まりの日・終わりの日）を入れて「期間の予約と枠を確かめる」と、 期間の予約と予約のない枠が出る。生徒への一言（任意）を書き、「お休みにする」→
    確認のダイアログで、予約のキャンセル・ 生徒へのお知らせ・枠の取り下げをまとめて行い、結果を同じ画面に出す。
  screen: hqCoachLeave
- kind: changed
  after: 同じ並びの最後に「お休み」を足し、/headquarters/coaches/leave?coach_id=<コーチ ID> へ移る。ほかは変えない。
  before: コーチの様子（/headquarters/coach-overview）の上の「このコーチで開く画面」に、評価・低い評価・レッスンメニュー・予約のリンクが並ぶ。
    お休みの手続きの入り口はない（受付の停止はコーチの一覧の行から）。
  screen: hqCoachOverview
screens:
- id: hqCoachLeave
  new: true
  more:
    copy:
    - 画面の名前「コーチのお休み」。「お休み」は glossary にまだない語で、仮に使う（open_questions の 1。足すなら coach_leave「コーチのお休み」）
    - 予約・スロット（画面では「枠」。今の admin-web と同じ）・確定待ち・確定済み・キャンセル済み・公開中・終了・受付中・停止中・お知らせ・ビデオ通話は
      glossary と今の画面の語
    - ボタンは動詞で終える（「期間の予約と枠を確かめる」「お休みにする」「キャンセルしてお休みにする」「やめる」）。admin-web なので感嘆符は使わない
    - 日時は content.yaml の形（「11/10（火）19:00〜19:30」「11/10（火）〜11/16（月）」）。日本時間
    - 生徒に届くお知らせの文面の正本はサーバー（notification の本文）。画面は見本を出すだけ
    analytics:
    - 行動イベントは新しく足さない（本部の運営の操作で、suspendCoach と同じ扱い）
    - キャンセルした予約ごとに booking.cancelled が要るか、slot.withdrawn を本部の取り下げでも発火するかは、actor が
      student / coach に決まっているので決めきれない（open_questions の 6）。KPI「コーチの予約枠充足率」の分母に効く
    accessibility:
    - 日付の欄・一言の欄に見えるラベル。誤りは aria-invalid と aria-describedby で欄に結ぶ
    - 一覧は ul に aria-label（「期間の予約の一覧」）。行は「日時、生徒、状態」を 1 つの文で読む
    - 状態は色と文字（確定待ち・確定済み・キャンセル済み・公開中・終了）とアイコン
    - 確認のダイアログは role=dialog・aria-modal。開いたら題へフォーカス、閉じたら「お休みにする」へ戻す
    - 読み込み中・送信中・成功は role=status、失敗は role=alert
    contract_needs:
    - '1. GET /coaches/{coach_id}/leave-preview?from=YYYY-MM-DD&to=YYYY-MM-DD（本部だけ。照会だけ）。応答:
      coach（coach_id・display_name・sports・acceptance_status）、 bookings（期間に始まる pending・confirmed
      の予約。booking_id・slot_id・starts_at・ends_at・status・is_trial・lesson_menu の名前・student_id・student_display_name。開始の早い順）、
      open_slots（期間に始まる open で有効な予約のない枠。slot_id・starts_at・ends_at・capacity・lesson_menu
      の名前）、 slot_count（取り下げる枠の数。予約のある枠を含む）、student_count（知らせる生徒の人数。同じ生徒は 1 人）、notification_preview（題と本文の見本）。
      期間の規則は listBookings と同じ（31 日まで・日本時間）に加え、from は明日以降（違えば 422 validation_failed）'
    - '2. POST /coaches/{coach_id}/leaves（本部だけ）。本文: from・to・note（0〜200 文字）・expected_booking_ids。
      全部か何もしないかで、期間の有効な予約をすべて本部のキャンセル（cancelled_by: headquarters。キャンセル規定で回数を使わない＝BookingCancelled
      の consumes_quota を false）にし、 予約した生徒ごとにお知らせ（notification の新しい種類。open_questions
      の 7）を作ってプッシュ通知（受け取り設定に従う）、期間の枠をすべて取り下げる（closed）。 お休みの記録（期間・note・本部のアカウント・時刻・件数）を
      1 件残す。応答: 記録と cancelled_booking_count・notified_student_count・withdrawn_slot_count。
      409 leave_preview_outdated（今の期間の有効な予約の ID が expected_booking_ids と違う）、409 coach_leave_overlaps（期間の重なるお休みがある）、404（コーチでない）、422（期間・note）'
    - 3. 境界間イベント BookingCancelled（scheduling → entitlement）に本部のキャンセルを載せ、回数を使わないことを判定は
      scheduling の 1 か所で決める（不変条件 3・ADR 0002）
    microinteractions:
    - loops: 押すたびに読み直す。自動では読み直さない
      rules: 期間を確かめてから 1 回読む。期間を変えたら一覧は残し、送るボタンを止める
      trigger: 「期間の予約と枠を確かめる」
      feedback: ボタンの spinner と欄の「読み込んでいます…」。300ms より速く終わるときは出さない
    - loops: なし（同じ期間の 2 回目はサーバーが断る）
      rules: 1 回だけ送る。送るのは確かめた予約の ID の一覧と期間と一言
      trigger: 「キャンセルしてお休みにする」
      feedback: confirm の spinner と「お休みにしています…」、終わったら結果の知らせ（消えない）
  route: /headquarters/coaches/leave?coach_id=<コーチ ID>
  purpose: コーチのお休みの期間を決め、その期間の予約と枠を見て確かめてから、まとめて片づける画面。コーチの様子から入り、 終わったらキャンセルされた予約かコーチの様子へ戻る。片づけの流れの中心で、ほかの画面を回らずにここだけで終える。
  audience: 本部（admin-web に本部のロールでログインした人）。PC で見る
  elements:
  - name: 外枠
    note: 今の本部の画面と同じ
    source: session
    content: 見出し「Rally 管理画面（本部）」とログアウト
    required: true
    component: RoleGate（既存）
  - name: 戻るリンク
    note: コーチの様子の画面の「コーチの一覧へ戻る」「本部の画面へ戻る」と同じ並び
    source: coach_id
    content: 「コーチの様子へ戻る」「本部の画面へ戻る」
    required: true
    component: 文字のリンク（navigation.admin_web）
  - name: 画面の見出しと説明
    note: 説明は 2 行まで
    source: 固定の文言
    content: 「コーチのお休み」と、何ができるかの 1 文
    required: true
    component: 見出し（headline 24px）と本文 text_muted
  - name: お休みにするコーチ
    note: 停止中のコーチもお休みにできる（停止中でも入っている予約は残るため）
    source: getCoachOverview（display_name・acceptance_status）と listCoaches のスポーツ（contract_needs
      の 1 で 1 回にまとめてよい）
    content: 表示名・スポーツ・受付の状態（受付中／停止中）
    required: true
    component: Section と定義の並び（CoachOverview の dl の写し）、status_tag
  - name: 始まりの日・終わりの日
    note: 明日から選べる（今日を含めない。今日のうちに始まる予約は個別に扱う。open_questions の 3）。終わりの日は始まりの日と同じか後。
      期間は 31 日まで（listBookings と同じ上限）。helper「明日から 31 日までの期間を選べます。始まりの日と終わりの日を含みます。」
    source: 入力
    content: YYYY-MM-DD。開いたときは空
    required: true
    component: text_field の日付（input type=date。design_system_gaps の date_field）
  - name: 期間の予約と枠を確かめるボタン
    note: 画面の primary は「お休みにする」なので secondary
    source: 入力した期間
    content: 「期間の予約と枠を確かめる」
    required: true
    component: button secondary
  - name: 期間の予約
    note: 並べ方は API の順（開始の早い順）のまま。キャンセル済みは出さない。グループレッスンの枠は生徒ごとに 1 行。行は予約の詳細へのリンク
    source: GET /coaches/{coach_id}/leave-preview の bookings（contract_needs の 1）
    content: '見出し「期間の予約（n 件）」、説明 1 文、行ごとに 題＝枠の日時（「11/10（火）19:00〜19:30」）・補足＝「生徒: 表示名」と体験予約かメニュー名・状態（確定待ち／確定済み）'
    required: true
    component: Section・list_row・status_tag
  - name: 期間の予約のない枠
    note: 0 件ならこの欄ごと出さない。予約のある枠は予約の欄に出ているので重ねて出さない（取り下げはする）
    source: leave-preview の open_slots
    content: 見出し「期間の予約のない枠（n 件）」、行ごとに 枠の日時・定員とメニュー・状態「公開中」
    required: true
    component: Section・list_row・status_tag
  - name: 生徒へのお知らせの見本
    note: 1 件目の予約の日時で見せ、「日時は予約ごとに入ります」と添える
    source: leave-preview の notification_preview（文面の正本はサーバー。画面で組み立てない）
    content: 題「コーチのお休みで予約をキャンセルしました」と本文（コーチの表示名・予約の日時・枠を使わないこと・ほかの枠やコーチを探せること）
    required: true
    component: card（Section の中の白い面）
  - name: 生徒への一言
    note: 0〜200 文字（コードポイントで数える。受付の停止の理由と同じ数え方）。counter「n / 200」。改行はそのまま
    source: 入力
    content: 任意の一言。お知らせの本文の後ろに付く
    required: false
    component: text_field multi_line（TextArea）
  - name: 取り消せないことの知らせ
    note: 一覧が出ているときだけ
    source: 固定の文言
    content: 「キャンセルした予約は元に戻せません。生徒の今月のビデオ通話の枠は使いません（キャンセル規定の回数にも数えません）。期間の外の予約と枠はそのままです。」
    required: true
    component: notice inline（warning）
  - name: お休みにするボタン
    note: 期間を確かめる前と、確かめたあとに期間を変えたときは押せない（disabled。近くに「期間を確かめると押せます。」）
    source: —
    content: 「お休みにする」
    required: true
    component: button primary（1 画面に 1 つ）
  - name: 確認のダイアログ
    note: cancel「やめる」（text）を左、confirm「キャンセルしてお休みにする」（danger）を右
    source: leave-preview の件数
    content: 題「山田 健 コーチをお休みにしますか？」、本文に期間・予約の件数・生徒の人数・取り下げる枠の件数・元に戻せないこと・ビデオ通話の枠を使わないこと
    required: true
    component: confirm_dialog（ConfirmDialog）
  - name: 結果の知らせ
    note: 画面の上に出し、消さない。失敗の文言は behaviors
    source: POST /coaches/{coach_id}/leaves の応答（contract_needs の 2）
    content: 成功「山田 健 コーチを 11/10（火）〜11/16（月）のお休みにしました。予約 5 件をキャンセルして生徒 5 人にお知らせを送り、枠
      6 件を取り下げました。」
    required: true
    component: notice inline（success。role=status）か（danger。role=alert）
  - name: 結果のあとのリンク
    note: お休みにしたあとだけ。期間の入力と一言の欄は消し、一覧はキャンセル済み・終了の状態で残す
    source: coach_id
    content: 「キャンセルされた予約を見る」「コーチの様子へ戻る」
    required: true
    component: button secondary・button text
  behaviors:
  - action: 開く
    result: getCoachOverview を 1 回読み、コーチの欄を出す。読み込み中は「読み込み中…」。404 なら「このコーチは見つかりません。コーチの一覧から選び直してください。」、ほかの失敗はサーバーの文言を
      notice（danger）で出す
    target: 画面
    condition: coach_id がある
  - action: 欄を離れる・確かめるボタンを押す
    result: 欄の下に error_text を出し、API は呼ばない。文言は「始まりの日を選んでください。」「始まりの日は明日より後の日にしてください。」
      「終わりの日は始まりの日と同じか、それより後の日にしてください。」「お休みの期間は 31 日までにしてください。」。 打っている途中には出さない。確かめるボタンを押したときは最初の誤りの欄へフォーカスを移す
    target: 始まりの日・終わりの日
    condition: 空・今日以前・終わりが始まりより前・32 日以上
  - action: 押す
    result: GET /coaches/{coach_id}/leave-preview?from=&to= を読む。読んでいるあいだはボタンを loading（spinner。押せない）、欄に「期間の予約と枠を読み込んでいます…」。読めたら一覧・お知らせの見本・一言の欄・知らせ・「お休みにする」を出す
    target: 期間の予約と枠を確かめるボタン
    condition: 期間が正しい
  - action: 読み込み中にもう一度押す・期間を変えて押す
    result: 読み込み中は押せない。期間を変えて押し直したら、前の結果が遅れて返っても捨て、最後に押した期間の結果だけを出す（CoachAcceptanceList
      と同じ番号の扱い）
    target: 期間の予約と枠を確かめるボタン
    condition: —
  - action: 読み終わる
    result: empty_state（screen）「<期間> に、<コーチ> コーチの予約と公開中の枠はありません。キャンセルや取り下げは要りません。」と、「しばらく新しい予約を受けたくないときは、コーチの一覧で受付を止めてください。」。「お休みにする」は出さない
    target: 期間の予約と枠
    condition: 予約も公開中の枠も 0 件
  - action: 読み終わる
    result: 欄の中に notice（danger）でサーバーの文言（「期間の予約を読み込めませんでした。「期間の予約と枠を確かめる」でもう一度読み込めます。」の形）。入れた期間は消さない
    target: 期間の予約と枠
    condition: 失敗
  - action: 一覧が出たあとに変える
    result: 一覧は残したまま「お休みにする」を押せなくし、「期間を変えました。「期間の予約と枠を確かめる」で読み直してください。」を出す（見ている一覧と送る期間をいつも一致させる）
    target: 始まりの日・終わりの日
    condition: —
  - action: 押す
    result: 予約の詳細（/headquarters/bookings/detail?booking_id=）へ移る
    target: 期間の予約の行
    condition: —
  - action: 打つ
    result: counter を「201 / 200」にし、欄を離れたときに「一言は 200 文字までにしてください。」を出す。「お休みにする」を押したらこの欄へフォーカスを移し、送らない
    target: 生徒への一言
    condition: 200 文字を超える
  - action: 押す
    result: 確認のダイアログを開き、フォーカスを題へ移す（ダイアログの中に閉じ込める）
    target: お休みにするボタン
    condition: 一覧が出ていて、期間を変えておらず、一言が 200 文字まで
  - action: 「やめる」・外を押す・Esc
    result: 閉じて何も送らない。フォーカスを「お休みにする」へ戻す
    target: 確認のダイアログ
    condition: 送っていない
  - action: 「キャンセルしてお休みにする」を押す
    result: POST /coaches/{coach_id}/leaves（from・to・note・確かめた予約の ID の一覧 expected_booking_ids）を
      1 回送る。 送っているあいだは confirm を loading、「やめる」も押せなくし、「お休みにしています…」を role=status で出す（二度押しで
      2 回送らない。 サーバーも同じコーチ・同じ期間の 2 回目を 409 で断る）
    target: 確認のダイアログ
    condition: —
  - action: 送り終わる
    result: ダイアログを閉じ、画面の上に結果の知らせ（success）。一覧の予約を「キャンセル済み」、枠を「終了」にして残し、期間の入力・一言・「お休みにする」を消して「キャンセルされた予約を見る」「コーチの様子へ戻る」を出す。フォーカスは結果の知らせへ
    target: 確認のダイアログ
    condition: 成功（201）
  - action: 送り終わる
    result: ダイアログを閉じ、画面の上に notice（danger）「期間の予約が確かめたあとに変わったため、お休みにできませんでした。予約も枠も変えていません。「期間の予約と枠を確かめる」で読み直してから、もう一度「お休みにする」を押してください。」。入れた期間と一言は消さない
    target: 確認のダイアログ
    condition: 409 leave_preview_outdated（確かめたあとに期間の予約が増えた・減った）
  - action: 送り終わる
    result: notice（danger）「この期間に重なるお休みがもうあります。期間を変えて確かめ直してください。」。何も変えていない
    target: 確認のダイアログ
    condition: 409 coach_leave_overlaps（同じコーチの期間の重なるお休みがもうある）
  - action: 送り終わる
    result: notice（danger）にサーバーの文言（errorMessage.ts の文言）と「予約も枠も変えていません。」。入れた値は消さない。もう一度「お休みにする」から送れる（サーバーは全部か何もしないかで処理する）
    target: 確認のダイアログ
    condition: 422・500・通信の失敗
  - action: 開く・送る
    result: RoleGate がログイン画面へ戻す。API の 401・403 は失敗の文言として notice（danger）で出す
    target: 画面
    condition: 本部のロールでない・トークンが切れた
  - action: 押す
    result: そのまま移る（何も送っていないので確かめない。open_questions の 5）
    target: 戻るリンク
    condition: 一覧を確かめたあと・お休みにする前
  transitions:
    exits:
    - to: /headquarters/coach-overview?coach_id=<コーチ ID>
      note: 確かめた一覧や書いた一言は残さない（何も送っていないので失うものは入力だけ。open_questions の 5）
      action: 「コーチの様子へ戻る」
    - to: /headquarters
      action: 「本部の画面へ戻る」
    - to: /headquarters/bookings/detail?booking_id=<予約 ID>
      action: 期間の予約の行を押す
    - to: 同じ画面（何も送らない。フォーカスは「お休みにする」へ戻す）
      action: 確認のダイアログで「やめる」・外を押す・Esc
    - to: /headquarters/cancelled-bookings?coach_id=<コーチ ID>（キャンセルした日付は今日）
      action: お休みにした結果の「キャンセルされた予約を見る」
    - to: ログイン画面（/。RoleGate）
      action: 本部のロールでない・ログインしていない
    entries:
    - data: coach_id（URL のクエリ）
      from: hqCoachOverview の「お休み」
      condition: 本部のロールでログインしている
    - data: coach_id（任意）
      from: URL を直に開く
      condition: coach_id がない・コーチでない ID のときは「このコーチは見つかりません。コーチの一覧から選び直してください。」を出し、入力欄は出さない（CoachOverview
        と同じ）
- id: hqCoachOverview
  new: false
  route: /headquarters/coach-overview?coach_id=<コーチ ID>
  purpose: コーチ 1 人の様子を見る既存の画面。お休みの手続きへの入り口を足す（変えるのは「このコーチで開く画面」の並びだけ）。
  audience: 本部
  elements:
  - name: このコーチで開く画面のリンクの並び
    note: 「お休み」は最後に置く。見た目はほかのリンクと同じ（モックの薄い青の面は差分の目印だけ）
    source: coach_id
    content: 評価・低い評価・レッスンメニュー・予約・お休み（足す）
    required: true
    component: CoachRelatedLinks（既存。文字のリンクの並び）
  behaviors:
  - action: 押す
    result: /headquarters/coaches/leave?coach_id=<コーチ ID> へ移る（コーチの様子の読み込みを待たない。ほかのリンクと同じ）
    target: 「お休み」
    condition: —
  transitions:
    exits:
    - to: /headquarters/coaches/leave?coach_id=<コーチ ID>
      action: 「お休み」
    entries:
    - data: coach_id
      from: コーチの一覧の表示名（既存）
      condition: 本部のロール
summary: 本部の admin-web に「コーチのお休み」の画面（/headquarters/coaches/leave）を新しく作る。コーチとお休みの期間を選ぶと、
  期間の予約と枠が一覧で出て、1 回の確認で予約のまとめてのキャンセル・生徒へのお知らせ・枠の取り下げまでを終えられるようにする。
judgments:
- kind: scope
  note: 今の製品で本部ができないこと（予約のキャンセル・生徒 1 人ずつへの知らせ・枠の取り下げ）を引き受け、受付の停止はそのまま、振替は外した。Issue
    に受け入れ条件がないので、今の契約から手作業を読み取って決めた
  question: 「手作業で大変」のうち、どこまでを画面で引き受けるか（予約のキャンセル・生徒への連絡・枠の取り下げ・受付の停止・振替）
- kind: ui
  note: 手数ともれの少なさで案 a。予約ごとに選ぶ必要は「期間を分ける」で代えられる
  question: 体験の案のうちどれを推すか（1 画面でまとめて／ステップで選ぶ／行ごと）
- kind: ui
  note: お休みはコーチ 1 人の話なので、コーチの様子の「このコーチで開く画面」に足した。本部のホームには足さない（コーチを選ぶ手間が増えるだけなので）
  question: どこから入るか
- kind: system_interface
  note: 確かめた予約の ID を送り、違えば 409 で全部を断る（全部か何もしないか）。部分的な成功の状態を画面に作らないで済む
  question: 一覧を確かめてから送るまでに予約が変わったらどうするか
- kind: error_handling
  note: 何が起きたかと「予約も枠も変えていません」を必ず書き、入れた期間と一言は残す。もう一度押せばよいかどうかを文言で伝える
  question: 送るのに失敗したとき、何を見せるか
- kind: system_interface
  note: コーチの都合なので使わない（キャンセル規定で回数を使わない）。判定は scheduling の 1 か所（不変条件 3）。contract_needs
    の 3
  question: 本部のキャンセルでビデオ通話の枠を使うか
- kind: ui
  note: 決まった文面（日時は予約ごと）をサーバーが作り、本部は任意の一言だけを足す。書き忘れ・日時の書き間違いを防ぐ
  question: 生徒へのお知らせの文面を本部が全部書くか
- kind: aesthetic
  note: 一覧の下に notice の warning、確認のボタンだけ danger。画面全体を赤くしない
  question: 取り消せないことをどう強めるか
- kind: ui
  note: 上限は listBookings と同じ 31 日、始まりは明日から（open_questions の 3）
  question: 期間の上限と始まり
prototype: true
rationale:
  why: 今の手作業は、受付の停止（コーチの一覧）→ 予約の一覧でコーチと期間を絞って探す → 生徒に 1 人ずつ連絡する（本部は生徒 1 人にお知らせを送れない）→
    生徒かコーチにキャンセルや取り下げを頼む、と 4 つの画面と画面の外をまたぐ。案 a はこれを「期間を入れる → 一覧で確かめる → 1 回の確認」に縮め、
    対象を期間で決めるので知らせのもれが起きない。送る前に一覧で全件を見せ、確認の本文に件数と元に戻せないことを書くので、まとめて処理しても 何が起きるかが押す前に分かる。確かめた予約の
    ID を一緒に送り、そのあとに予約が変わっていれば断るので、見ていない予約を消すこともない。 画面は今の本部の画面の型（Section の 1 段・一覧・確認のダイアログ）だけで組め、新しく要る部品は日付の欄の正式化だけ。
  rejected:
  - idea: 案 b（3 ステップで予約ごとに選ぶ）
    reason: お休みは「その期間は受けない」ことなので、予約ごとに選ぶ場面は少ない。手順が増え、選び忘れのもれが戻ってくる。残したい予約がある場合は、期間を分けて
      2 回に分ければ案 a でも足りる
  - idea: 案 c（予約の一覧に行ごとの「本部でキャンセルする」）
    reason: 本部がキャンセルできるようにはなるが、件数だけ押す手作業は残り、予約のない枠は残るので、お休みの期間に新しい予約が入りうる。Issue の「毎回手作業」を解かない
  - idea: 受付の停止（suspendCoach）を広げ、止めたときに予約もキャンセルする
    reason: 受付の停止は「入っている予約はそのまま」と契約で決まっており、問題のあるコーチを止める用途とも混ざる。期間のないお休みになり、再開を忘れる心配もある
  - idea: 代わりのコーチへの振替を同じ画面で行う
    reason: 生徒の同意と代わりのコーチの枠が要り、本部が決めきれない。今回はお知らせで生徒自身が探す案内にとどめ、要るなら別の Issue にする
  - idea: お休みの期間を予約し、期間が来たら自動で片づける
    reason: 予約が入るたびに自動でキャンセルされると生徒が混乱する。今回は「今、期間の分を片づける」にし、期間中の新しい枠の公開は open_questions
      の 2 で決める
  requirement_map:
  - how: hqCoachLeave の期間の欄と「期間の予約と枠を確かめる」で、期間の予約と予約のない枠を 1 回で一覧にする
    requirement: コーチがお休みするときの手作業（予約を探す）をなくす
  - how: お休みにすると、期間の予約をした生徒全員にお知らせを作る（お知らせの見本・生徒への一言の欄で中身を見てから送る）
    requirement: 影響する生徒にもれなく知らせる
  - how: 期間の予約を本部のキャンセルにし、ビデオ通話の枠を使わない（確認の本文と warning の知らせで押す前に示す）
    requirement: 予約を片づける（生徒に不利にしない）
  - how: 期間の枠をすべて取り下げる（予約のある枠もキャンセルのあとに）。期間中に新しく公開された枠の扱いは open_questions の 2
    requirement: お休みのあいだに新しい予約が入らない
  - how: '送る前の一覧と confirm_dialog（danger）、確かめた予約の ID での照合、結果からキャンセルされた予約（キャンセルした人:
      本部）へ移れる'
    requirement: 誤って片づけない・あとからたどれる
user_flow:
- to: hqCoachOverview
  from: 本部のホーム（/headquarters）
  action: 「コーチの受付」からコーチの一覧を開き、お休みするコーチの表示名を押す
- to: hqCoachLeave（期間が空の状態）
  from: hqCoachOverview
  action: 「このコーチで開く画面」の「お休み」を押す
- to: hqCoachLeave（期間の予約と枠の一覧。0 件なら空の表示で終わり）
  from: hqCoachLeave
  action: 始まりの日と終わりの日を入れ、「期間の予約と枠を確かめる」を押す
- to: 予約の詳細（/headquarters/bookings/detail。既存。戻るとこの画面へ）
  from: hqCoachLeave
  action: 一覧を見て、必要なら行から予約の詳細を開いて確かめる
- to: 確認のダイアログ
  from: hqCoachLeave
  action: 生徒への一言（任意）を書いて「お休みにする」を押す
- to: hqCoachLeave（お休みにした結果）
  from: 確認のダイアログ
  action: 「キャンセルしてお休みにする」を押す（「やめる」なら一覧に戻る）
- to: キャンセルされた予約（/headquarters/cancelled-bookings。既存）か hqCoachOverview
  from: hqCoachLeave（お休みにした結果）
  action: 「キャンセルされた予約を見る」か「コーチの様子へ戻る」を押す
brand_impact: false
open_questions:
- 1. 用語「お休み」（コーチが期間を決めてレッスンを受けないこと）は glossary にない。coach_leave「コーチのお休み」として足すか、受付の停止（coach_acceptance）の一種として扱うかを決めてほしい。仮に「お休み」で書いた
- 2. お休みの期間中に、コーチが新しく枠を公開できてしまう（今の publishSlot に止める規則はない）。仮に今回は扱わず、要るなら publishSlot
  に 409 coach_on_leave を足す別のタスクにする。運営として、期間中の公開は止めたいか
- 3. 期間は明日からにした（今日のうちに始まる・通話中の予約を巻き込まないため）。当日の急なお休みはこの画面で扱わず、今までどおり個別に対応する、で良いか
- 4. 返却待ちの動画添削（非同期レッスン）は期間のある予約ではないので対象外にした。お休みのあいだに返却が遅れる生徒への知らせも要るか
- 5. 一覧を確かめたあとに戻るリンクを押しても確かめずに移る（何も送っていないため）。一言を長く書いたあとに失うのが困るなら、戻る前の確認を足す
- ? 6. 本部のキャンセルと取り下げで、行動イベント booking.cancelled（actor student）と slot.withdrawn（actor
    coach）を発火するか。KPI「コーチの予約枠充足率」の分母と分子に効くので、データの担当に決めてほしい（仮
  : 発火せず、境界間イベント BookingCancelled だけ）
- 7. 生徒へのお知らせは notification の新しい種類（例 booking_cancelled_by_headquarters）にし、行から自分の予約へ移れる形を仮にした。本部からのお知らせ（announcement）として送るほうが良いか（一覧の取り下げなどが効くかわりに、予約に結びつかない）
- 8. コーチ本人への知らせは今回入れていない（コーチから連絡が来て本部が操作する前提）。コーチの画面のお知らせに「お休みにしました」を出すか
design_system_gaps:
- id: date_field
  need: 日付の欄（期間の始まりと終わり）。components.yaml の text_field には日付の種類がなく、今の admin-web も input
    type=date を各画面で直に書いている（CancelledBookingList・CoachAcceptanceHistory・Announcements）
  proposal: text_field に variant date（と期間の 2 つ並び date_range）を足し、誤りの文言の型（終わりが始まりより前・31
    日を超える）も決める
- id: slot_state_colors
  need: スロットの状態（公開中・予約済み・終了）の色。tokens.yaml の booking_state にあたる対応がない
  proposal: color.slot_state（open は info、booked は success、closed は neutral を仮）を足す
- id: checkbox
  need: 案 b（予約ごとに選ぶ）で使う選択の部品。推す案 a では使わない
  proposal: 案 b を選ぶときだけ、checkbox（と「すべて選ぶ」）を components.yaml に足すタスクを切る
design_system_constraints:
- specs/design/ の rally-court（tokens.yaml・components.yaml・patterns.yaml・content.yaml・accessibility.yaml）に従った。out/rally-admin.css
  は tokens.yaml の値と admin-web の globals.css（@theme）の名前、components.yaml の preview_css
  の部品のクラスを写したもので、トークンにない色・余白・角丸は使っていない
- 画面の型は common_layout.admin_web（headline 24px → Section を 40px あけて 1 段、最大 48rem・左右
  24px）、list（並べ方は API の順・1 行は題・日時・状態まで）、form（欄を離れたときと送るときに確かめる・失敗しても入れた値を消さない）、confirm（相手に知らせが届く取り消せない操作なので
  confirm_dialog、ボタンは danger）、states、feedback（失敗は notice inline で消さない）、no_permission（RoleGate）
- 部品は button（primary は「お休みにする」の 1 つ、ほかは secondary・text・確認の中だけ danger）・text_field（日付と一言）・list_row・status_tag・card・notice（warning・success・danger）・empty_state（screen）・loading（bar・section_text・spinner）・confirm_dialog
- 予約の状態の色は booking_state（確定待ち warning・確定済み success・キャンセル済み neutral）。スロットの「公開中」は info、「終了」は
  neutral にした（tokens.yaml に slot の状態の色の対応はなく、意味の近い status を当てた。gaps に書いた）
- 外枠・戻るリンク・コーチの定義の並び・「このコーチで開く画面」のリンクの並びは、今の admin-web の RoleGate・CoachOverviewHome・CoachOverview・CoachRelatedLinks
  の見た目を写した
- admin-web なので score_panel と濃い面は使わない。文言は admin-web の決まり（呼びかけず事実を短く・感嘆符なし）
variant:
  id: a
  axis: flow
  name: 1 画面で確かめてまとめて片づける
  frames:
  - id: overview
    state: 既存の中身あり
    screen: hqCoachOverview
    caption: 入口。コーチの一覧から表示名を押してコーチの様子を開いたところ（「お休み」を足した）
  - id: loading
    state: 読み込み中
    screen: hqCoachLeave
    caption: 期間を入れて「期間の予約と枠を確かめる」を押した直後
  - id: invalid
    state: 入力の誤り
    screen: hqCoachLeave
    caption: 終わりの日を始まりの日より前にして確かめようとしたとき
  - id: empty
    state: 空
    screen: hqCoachLeave
    caption: 予約も公開中の枠もない期間を確かめたとき
  - id: confirm
    state: 確認
    screen: hqCoachLeave
    caption: 一覧を見て「お休みにする」を押したとき
  - id: sending
    state: 送信中
    screen: hqCoachLeave
    caption: 確認で「キャンセルしてお休みにする」を押し、送っているあいだ
  - id: done
    state: お休みにした
    screen: hqCoachLeave
    caption: 送り終わり、お休みにできたとき
  - id: failed
    state: 送る失敗
    screen: hqCoachLeave
    caption: 確かめたあとに生徒が予約を入れたなどで、送るのを断られたとき
  height: 2200
  tradeoff: 期間を入れて 1 回確かめれば予約・お知らせ・枠が全部片づき、もれがなくなるが、一部の予約だけを残すような細かい扱いはできない。
  viewport: desktop
