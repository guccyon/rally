type: UserStory
id: student-logs-out
title: "生徒が自分でログアウトし、次に同じブラウザーを開いた人には前の生徒の予約・相談・契約が見えず、登録の画面が出る"
actor: student
goal: "家族の端末や学校の PC のように、ほかの人も使うブラウザーで生徒アプリを使っても、予約・コーチへの相談の本文・月額契約を次の人に見られず、次の人に自分としてメッセージを送られない。次の人は自分のアカウントを作って使い始められる"
reader: [student]
entry: "Web 版の生徒アプリで登録した生徒が、体験予約・月額契約・担当コーチとのチャットの相談がある状態で、ホームを開いている"
exit: "同じブラウザーで生徒アプリを開き直すと登録の画面が出て、別の人が別の表示名で登録すると、その人のホームが出る（前の生徒の予約・相談・契約は出ない）"
preconditions:
  - "生徒は Web 版（ブラウザー）の生徒アプリで登録していて、登録の結果がブラウザーに残っている（開き直すと同じ生徒のホームが出る）"
  - "生徒には予約・月額契約・担当コーチとのチャットのメッセージがある"
time:
  - "ログアウトのあと、タブを閉じて同じブラウザーで生徒アプリを開き直す"
  - "ログアウトの前から同じブラウザーの別のタブで生徒アプリ（チャットのスレッドなど）を開いたままにしていて、ログアウトと次の人の登録のあとにそのタブに戻る"
steps:
  - where: "student-app ホーム"
    do: "アプリバーの「プロフィール」を押す"
    sees: "表示名・スポーツ・月額契約の欄の下に、「ログアウト」の欄と「ログアウトする」の行（ほかの人も使う端末では使い終わったらログアウトする旨）"
  - where: "student-app プロフィール"
    do: "「ログアウトする」を押す"
    sees: "「ログアウトしますか？」の確かめ。この生徒の予約・チャット・月額契約をこの端末に出さないようにして登録の画面に戻ること、ログインの画面はまだないのでログアウトするとこのアカウントには戻れないことが書いてある。確定待ちの予約（まだ始まっていないもの）がサーバーにあれば、その頭に予約の日時と、ログアウトするとこの予約を確定できなくなるためキャンセルしてからログアウトすることが書いてある（今キャンセルするとビデオ通話の枠を使うなら、その旨も）。「やめる」と「ログアウトする」"
  - where: "student-app プロフィール（ログアウトの確かめ）"
    do: "「ログアウトする」を押す"
    sees: "登録の画面（アカウント登録）。前の生徒の表示名・予約・チャット・契約は出ない。確定待ちの予約があったなら、それはキャンセル済みになっていて、コーチの予約の一覧に確定待ちとして残らず、そのスロットはほかの生徒が予約できる"
  - where: "student-app（同じブラウザーで開き直す）"
    do: "タブを閉じ、別の人が同じブラウザーで生徒アプリの URL を開く"
    sees: "登録の画面。前の生徒のホーム（「〇〇さん、こんにちは」）・チャットの本文・月額契約は出ない"
  - where: "student-app 登録"
    do: "別の人が自分のメールアドレス・別の表示名・スポーツで登録する"
    sees: "その人の表示名のホーム。予約・チャット・月額契約の欄はその人のもの（サーバーから読み直したもの。ADR 0010）"
  - where: "student-app（ログアウトの前から開いていた別のタブ。チャットのスレッド「担当コーチ」を開いていた）"
    do: "ログアウトと次の人の登録のあと、開いたままだった別のタブに戻る（ログアウトのあと、次の人の登録の前に一度そのタブを見て登録の画面になっていても同じ）"
    sees: "次の人の表示名のホーム（サーバーから読み直したもの。ADR 0010）。前の生徒のチャットの本文・メッセージ欄・ホームの予約・プランは出ない（ログアウトしたタブと同時に、前の生徒の状態とトークンを捨てて登録の画面になり、次の人が登録したときに次の人のホームに変わっている）"
must_not:
  - "ログアウトしたあと、開き直すと前の生徒のホーム・チャットの本文・月額契約が出る"
  - "ログアウトしたあと、前の生徒としてメッセージを送れる（前の生徒のトークンを使い続ける）"
  - "ログアウトしたあとの登録で、前の生徒の予約・チャット・契約・お知らせがアプリの中に残って出る"
  - "ログアウトしたあと、ログアウトの前から開いていた別のタブに前の生徒のチャットの本文・予約・契約が出たままになる"
  - "ログアウトしたあと、開いたままだった別のタブから前の生徒としてメッセージを送れる"
  - "別のタブで次の人が登録したとき、開いたままだったタブが次の人の登録の結果を消す（次の人がログアウトされる）"
  - "別のタブで次の人が登録したあとも、ログアウトで登録の画面になったタブが登録の画面のまま残り、そこで別の人が登録して次の人の登録の結果を置き換える（次の人が知らせなしにログアウトされ、ログインの画面がないので次の人は自分のホームと月額契約に戻れない）"
  - "確かめずにログアウトする（ログインの画面がないので、押し間違えるとアカウントに戻れない）"
  - "確定待ちの予約を残したままログアウトする（誰も確定もキャンセルもできず、スロットが開始まで押さえられ続ける）"
  - "予約を読めなかった・確定待ちの予約をキャンセルできなかったのにログアウトする、または失敗を知らせない"
  - "ログアウトしないかぎり、開き直したときに同じ生徒のホームと契約が出なくなる（student-subscription-persists を壊さない）"
touches:
  apps: [student-app]
  contexts: [identity, scheduling]
  terms: [student, booking, slot]
  operations:
    - student-app.registerAccount
    - student-app.getMyStudentProfile
    - student-app.listMyBookings
    - student-app.cancelBooking
  events: [account.registered]
origin:
  issues: ["guccyon/rally#1588", "guccyon/rally#1587", "guccyon/rally#1669", "guccyon/rally#1718", "guccyon/rally#1730", "guccyon/rally#1805"]
  note: "出荷の関門の探索（チャーター other-user・guccyon/rally@0.32.0）で、Web 版は登録の結果をブラウザーに残すのにログアウトがなく、同じブラウザーを開いた別の人に前の生徒の予約・相談・契約が見えると分かった。guccyon/rally@0.37.0 の探索で、ログアウトしても開いていた別のタブには前の生徒の画面が残り、前の生徒として送れると分かった（#1669）。guccyon/rally@0.46.0 の探索で、確定待ちの予約を持ったままログアウトすると、その予約を誰も確定もキャンセルもできず、スロットが開始まで押さえられ続けると分かった（#1718）。guccyon/rally@0.48.0 の探索で、staging のように予約の応答がフレームをまたぐと「ログアウトする」を押しても確かめが出ず、ログアウトできないと分かった（#1730）。guccyon/rally@0.55.0 の探索で、ログアウトで登録の画面になった別のタブが次の人の登録のあとも登録の画面のままで、そこで別の人が登録すると、次の人が知らせなしにログアウトされ月額契約に戻れないと分かった（#1805）"
known_gaps:
  - step: 3
    note: "ログアウトは端末の登録の結果を消すだけで、サーバーのトークンは失効させない（失効の API はない）。ログインの画面もないので、ログアウトした生徒は同じアカウントに戻れない"
status: active
