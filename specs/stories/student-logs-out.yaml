type: UserStory
id: student-logs-out
title: "生徒が自分でログアウトし、次に同じブラウザーを開いた人には前の生徒の予約・相談・契約が見えず、登録の画面が出る"
actor: student
goal: "家族の端末や学校の PC のように、ほかの人も使うブラウザーで生徒アプリを使っても、予約・コーチへの相談の本文・月額契約を次の人に見られず、次の人に自分としてメッセージを送られない。次の人は自分のアカウントを作って使い始められる"
reader: [student]
entry: "Web 版の生徒アプリで登録した生徒が、体験予約・月額契約・担当コーチとのチャットの相談がある状態で、ホームを開いている"
exit: "同じブラウザーで生徒アプリを開き直すと登録の画面が出て、別の人が別の表示名で登録すると、その人のホームが出る（前の生徒の予約・相談・契約は出ない）"
preconditions:
  - "生徒は Web 版（ブラウザー）の生徒アプリで登録していて、登録の結果がブラウザーに残っている（開き直すと同じ生徒のホームが出る）"
  - "生徒には予約・月額契約・担当コーチとのチャットのメッセージがある"
time:
  - "ログアウトのあと、タブを閉じて同じブラウザーで生徒アプリを開き直す"
steps:
  - where: "student-app ホーム"
    do: "アプリバーの「プロフィール」を押す"
    sees: "表示名・スポーツ・月額契約の欄の下に、「ログアウト」の欄と「ログアウトする」の行（ほかの人も使う端末では使い終わったらログアウトする旨）"
  - where: "student-app プロフィール"
    do: "「ログアウトする」を押す"
    sees: "「ログアウトしますか？」の確かめ。この生徒の予約・チャット・月額契約をこの端末に出さないようにして登録の画面に戻ること、ログインの画面はまだないのでログアウトするとこのアカウントには戻れないことが書いてある。「やめる」と「ログアウトする」"
  - where: "student-app プロフィール（ログアウトの確かめ）"
    do: "「ログアウトする」を押す"
    sees: "登録の画面（アカウント登録）。前の生徒の表示名・予約・チャット・契約は出ない"
  - where: "student-app（同じブラウザーで開き直す）"
    do: "タブを閉じ、別の人が同じブラウザーで生徒アプリの URL を開く"
    sees: "登録の画面。前の生徒のホーム（「〇〇さん、こんにちは」）・チャットの本文・月額契約は出ない"
  - where: "student-app 登録"
    do: "別の人が自分のメールアドレス・別の表示名・スポーツで登録する"
    sees: "その人の表示名のホーム。予約・チャット・月額契約の欄はその人のもの（サーバーから読み直したもの。ADR 0010）"
must_not:
  - "ログアウトしたあと、開き直すと前の生徒のホーム・チャットの本文・月額契約が出る"
  - "ログアウトしたあと、前の生徒としてメッセージを送れる（前の生徒のトークンを使い続ける）"
  - "ログアウトしたあとの登録で、前の生徒の予約・チャット・契約・お知らせがアプリの中に残って出る"
  - "確かめずにログアウトする（ログインの画面がないので、押し間違えるとアカウントに戻れない）"
  - "ログアウトしないかぎり、開き直したときに同じ生徒のホームと契約が出なくなる（student-subscription-persists を壊さない）"
touches:
  apps: [student-app]
  contexts: [identity]
  terms: [student]
  operations:
    - student-app.registerAccount
    - student-app.getMyStudentProfile
  events: [account.registered]
origin:
  issues: ["guccyon/rally#1588", "guccyon/rally#1587"]
  note: "出荷の関門の探索（チャーター other-user・guccyon/rally@0.32.0）で、Web 版は登録の結果をブラウザーに残すのにログアウトがなく、同じブラウザーを開いた別の人に前の生徒の予約・相談・契約が見えると分かった"
known_gaps:
  - step: 3
    note: "ログアウトは端末の登録の結果を消すだけで、サーバーのトークンは失効させない（失効の API はない）。ログインの画面もないので、ログアウトした生徒は同じアカウントに戻れない"
status: active
