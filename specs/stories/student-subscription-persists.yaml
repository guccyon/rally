type: UserStory
id: student-subscription-persists
title: "生徒が月額契約を始め、翌日アプリを開き直しても契約が残っている"
actor: student
goal: "お金を払った契約が消えないと安心して、ビデオ通話の予約に進める。契約が消えると問い合わせと解約につながる"
reader: [student]
entry: "月額契約のない生徒が、生徒アプリのホームで「まだ月額契約はありません」と「月額契約へ進む」を見る（完了したレッスンがあれば、「次にやること」にも「月額契約で、続けて教わりましょう」と「月額契約へ進む」が出る）"
exit: "翌日、生徒がアプリを開き直すと、ホームに契約したプランと今月のビデオ通話の残りの回数が出ている"
preconditions:
  - "生徒はゴルフ以外のスポーツで登録していて、月額契約はまだない"
time:
  - "契約したあと、サーバーの再起動をはさむ"
  - "翌日（日本時間の日付が変わったあと）にアプリを開き直す"
steps:
  - where: "student-app ホーム"
    do: "「次にやること」か今月のビデオ通話の欄の「月額契約へ進む」を押して契約の画面を開く（プロフィールの月額契約の欄の「月額契約へ進む」からも同じ画面が開く）"
    sees: "スポーツと、動画とチャットは送り放題・ビデオ通話はプランの回数まで、の説明。プランごとのビデオ通話の回数"
  - where: "student-app 月額契約"
    do: "プランを選んで「月額契約を始める」を押す"
    sees: "「月額契約を開始しました」と、選んだプラン・開始の日時・今月のビデオ通話の回数"
  - where: "student-app ホーム"
    do: "ホームに戻る"
    sees: "契約したプランと今月のビデオ通話の残りの回数。「次にやること」と今月のビデオ通話の欄から「月額契約へ進む」が消え、プロフィールの月額契約の欄はプランと開始の日になる"
  - where: "student-app（翌日、アプリを開き直す）"
    do: "アプリを開き、同じ生徒として使い始める"
    sees: "ホームに前日と同じプランと残りの回数が出ている。契約の画面に戻されない"
must_not:
  - "再起動や日付の変わり目で契約が消える、またはプランが変わる"
  - "同じ生徒に月額契約が 2 つできる"
  - "ほかの生徒の契約や残りの回数が見える"
  - "決済がモックなのに請求が起きたように見える文言を出す"
  - "月額契約への入口がレッスンの完了の画面にしかなく、その画面を離れると契約の画面に進めない（入口はサーバーの状態から出す。ADR 0010）"
  - "契約したあとも、ホームやプロフィールに「月額契約へ進む」を出す"
touches:
  apps: [student-app]
  contexts: [entitlement, identity]
  terms: [subscription, subscription_plan, entitlement]
  operations:
    - student-app.listSubscriptionPlans
    - student-app.startSubscription
    - student-app.getMyEntitlement
    - student-app.getMyNextActions
  events: [subscription.started]
origin:
  issues: ["guccyon/rally#1431", "guccyon/rally#1436"]
  note: "2026-11-04 のデモの準備で、月額契約がバックエンドのメモリにしかないことが見つかった（factory-engine の ADR 0028 の文脈）。#1436 で、月額契約への入口をホームの「次にやること」・今月のビデオ通話の欄・プロフィールに足した（#1431。画面は specs/ux/issue-1436.yaml）"
  retro: true
known_gaps:
  - step: 1
    note: "ホームの「次にやること」の「月額契約へ進む」はある（#1439）が、今月のビデオ通話の欄とプロフィールの「月額契約へ進む」はまだない（#1436 の後続のタスクで実装する）"
  - step: 4
    note: "生徒アプリはログインの状態を端末に残さず、ログインの画面もない（登録だけ）。アプリを開き直すと同じ生徒として戻れない"
status: active
