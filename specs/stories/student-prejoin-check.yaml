type: UserStory
id: student-prejoin-check
title: "生徒が、開始 5 分前から入室前チェックでカメラの映りと背景・マイク・スピーカーを確かめ、開始時刻からビデオ通話に入れる"
actor: student
goal: "レッスンの最初の数分を「映っていますか」「聞こえますか」で失わない。自分の映りや背景を先に確かめておけると、安心してコーチの前に出られる"
reader: [student, coach]
entry: "生徒が生徒アプリで、確定したビデオ通話の予約（予約の確定のあとの「ビデオ通話で受ける」）から通話の入口を開く。予約したスロットの開始 5 分前を過ぎている"
exit: "生徒が、開始時刻になってから作り物の通話（映像はモック）に入っていて、通話セッションは開始時刻より後に始まっている。カメラ・マイクの映像と音は端末の外に出ていない"
preconditions:
  - "生徒は月額契約を持ち、同期レッスン（ビデオ通話）の予約が確定している"
  - "端末にカメラ・マイク・スピーカーがある（ないときの振る舞いは must_not に書く）"
time:
  - "予約したスロットの開始 5 分前から開始時刻までをまたぐ（端末の時計ではなく、スロットの開始時刻と今の時刻で判断する）"
steps:
  - where: "student-app 予約の確定（ビデオ通話の入口）"
    do: "開始 5 分前を過ぎてから「ビデオ通話で受ける」を押す"
    sees: "入室前チェックの画面が開く。予約の開始時刻と「開始時刻から入室できます」、カメラとマイクを使う許可を求める端末のダイアログ"
  - where: "student-app 入室前チェック"
    do: "カメラとマイクの許可を出す"
    sees: "端末の本物のカメラに映る自分の姿と背景が、鏡のように左右を反転して出る。カメラを切る・入れるの切り替えがある"
  - where: "student-app 入室前チェック"
    do: "声を出す"
    sees: "端末の本物のマイクの音の大きさに合わせて、マイクの音量の表示が動く。マイクを切る・入れるの切り替えがある"
  - where: "student-app 入室前チェック"
    do: "「スピーカーを試す」を押す"
    sees: "端末のスピーカー（イヤホンをつないでいればイヤホン）から試し音が鳴る"
  - where: "student-app 入室前チェック"
    do: "開始時刻まで待つ"
    sees: "開始時刻の前は「開始時刻になると入室できます」と開始時刻（残りの時間）が出て、入室のボタンは押せない。開始時刻になると入室のボタンが押せるようになる"
  - where: "student-app 入室前チェック"
    do: "「入室する」を押す"
    sees: "ビデオ通話の画面に移り、通話セッションが始まる（startLiveLessonSession）。相手の映像は作り物（モック）で、チェックで選んだカメラ・マイクの入・切がそのまま引き継がれている"
must_not:
  - "開始時刻より前に通話セッションを始める（#921。開始時刻より前の startLiveLessonSession は 409 slot_not_started で、画面も開始時刻の前は入室のボタンを押せなくする）"
  - "入室前チェックのために通話サービス（Twilio Video など）につなぐ、または接続情報（room_token）を取る"
  - "カメラ・マイクの映像や音をサーバーに送る・端末やサーバーに残す（チェックの映像と音は端末の中で見せて聞かせるだけ）"
  - "開始 5 分前より早いのに入室前チェックの画面を開ける（開始 5 分前より早いときは、入口に「開始 5 分前から入室前チェックができます」と開ける時刻を出し、チェックの画面は開かない）"
  - "カメラやマイクの許可を断った・端末にカメラやマイクがない・音が出ないことを理由に、開始時刻からの入室を止める（断ったときは「カメラ（マイク）が使えません。端末の設定で許可すると確かめられます」と出し、入室のボタンは開始時刻から押せる）"
  - "画面を開いたまま開始時刻を過ぎても入室のボタンが押せるようにならない（開き直さないと入れない）"
  - "環境（開発・デモ・本番）ごとに 5 分前・開始時刻の決まりを変える"
  - "5 分という値を画面ごと・場所ごとに書き散らす（値は 1 か所の定数で持つ。glossary の prejoin_check）"
touches:
  apps: [student-app]
  contexts: [live-lesson, scheduling]
  terms: [prejoin_check, live_lesson_session, live_lesson, booking, slot]
  operations:
    - student-app.listMyBookings
    - student-app.startLiveLessonSession
origin:
  issues: ["guccyon/rally#1039", "guccyon/rally#899", "guccyon/rally#921", "guccyon/rally#1009"]
  note: "窓口の相談 2（依頼者 builder）。Google Meet の入室前の体験を手本にする。通話はモックのまま、カメラ・マイク・スピーカーは端末の本物を使う"
  retro: false
known_gaps:
  - step: 1
    note: "入室前チェックの画面がない。「ビデオ通話で受ける」は開始時刻と関係なく、すぐにビデオ通話の画面（映像はモック）を開く"
  - step: 2
    note: "生徒アプリはカメラ・マイクを使っていない（許可の求めも映像の表示もない）"
  - step: 3
    note: "マイクの音量の表示がない"
  - step: 4
    note: "スピーカーの試し音がない"
  - step: 5
    note: "開始時刻の前でも「通話を開始する」を押せ、押してから 409 slot_not_started の文言（#1009）で知る"
status: active
