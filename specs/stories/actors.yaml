# ユーザーストーリーの利用者の種類（actor と reader に使う id）
# 型は factory-engine の definitions/user_story.yaml。ストーリーは同じフォルダに 1 本 1 ファイル。
# glossary.yaml に語があるものは glossary の id を term に書く。

actors:
  - id: student
    ja: "生徒"
    term: student
    apps: [student-app]
    note: "生徒アプリ（iOS / Android）を使う"
  - id: coach
    ja: "コーチ"
    term: coach
    apps: [coach-app, admin-web]
    note: "coach-app（モバイル）に生徒と同じ形の入口（メールアドレスと確認コード）でログインする。予約枠の登録・添削の返却・通話・チャットなどのコーチの画面が coach-app に移るまでは、admin-web のコーチの入口（PC。/coach/login。移行中だけ）からログインして使う（docs/adr/0011）"
  - id: headquarters
    ja: "本部（運営）"
    term: null
    apps: [admin-web]
    note: "admin-web に本部のロールでログインし、コーチ・予約・評価などを見て運営する人"
  - id: cs
    ja: "カスタマーサポート（CS）"
    term: null
    apps: [admin-web]
    note: "生徒やコーチからの問い合わせに答える人。Gen1 は CS 専用のロールがなく、本部のロールで本部の画面を使う"
