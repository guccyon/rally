type: UserStory
id: student-opens-prejoin-from-reminder
title: "生徒が、レッスンのリマインドのお知らせから予約の入口を開き、入室前チェックに進める。リマインドが要らなければ通知の設定で切れる"
actor: student
goal: "予約したビデオ通話のレッスンを忘れずに受ける。リマインドに気づいたら、予約を探し直さずにその予約の入口から入室前チェックへ進める。リマインドが要らない生徒は、自分で止められる"
reader: [student, coach]
entry: "生徒が月額契約を持ち、確定したビデオ通話の予約がある。その予約の開始 1 時間前を過ぎ、サーバーがレッスンのリマインド（lesson_reminder）のお知らせを作っている（ADR 0013）"
exit: "生徒が、リマインドから開いた予約の入口の「ビデオ通話で受ける」で入室前チェックに入っている。通知の設定でレッスンのリマインドを切ったあとの予約には、リマインドのお知らせが届かない"
preconditions:
  - "生徒はゴルフ以外のスポーツで登録していて、月額契約を持つ"
  - "同期レッスン（ビデオ通話）の予約が確定していて、ほかにも確定した予約が 1 件以上ある（リマインドが別の予約を開かないことを確かめる）"
  - "通知の受け取り設定のレッスンのリマインドはオン（既定）"
time:
  - "予約したスロットの開始 1 時間前から開始 5 分前・開始時刻をまたぐ（リマインドの窓も入室前チェックの開ける時刻もサーバーの時刻で判断する。触れる環境では CLOCK_OFFSET_SECONDS で時計を進める）"
  - "設定を切ったあと、次の予約の開始の前日（24 時間前）と開始 1 時間前をまたぐ"
steps:
  - where: "student-app ホーム"
    do: "開始 1 時間前を過ぎてからホームを開く"
    sees: "アプリバーの「お知らせ」に未読の点のしるしが付いている"
  - where: "student-app お知らせ"
    do: "アプリバーの「お知らせ」を押す"
    sees: "お知らせの一覧の先頭に、目覚まし時計のアイコンと「予約したレッスンが 1 時間以内に始まります」・「新着」と作った時刻・押せる印（右向きの矢印）。前日のリマインドがあれば「予約したレッスンが近づいています」も同じ形で出る"
  - where: "student-app お知らせ"
    do: "リマインドの行を押す"
    sees: "そのリマインドが結び付く予約（booking_id）の画面が、サーバーの記録（listMyBookings）から読み直して開く。「予約が確定しました」・開始の日時・メニュー・「ビデオ通話で受ける」。開始 5 分前より前は「ビデオ通話で受ける」が押せず、入室前チェックができる時刻が出る。ほかの予約の中身は出ない"
  - where: "student-app 予約（確定済み）"
    do: "開いたまま開始 5 分前を過ぎ、「ビデオ通話で受ける」を押す"
    sees: "開き直さなくても押せるようになり、押すと入室前チェック（student-prejoin-check のまま）が開く。開始時刻からビデオ通話に入れる"
  - where: "student-app 通知の設定"
    do: "アプリバーの「通知の設定」を開き、「レッスンの前日と開始 1 時間前」のスイッチを切る"
    sees: "ほかの種類と並んでレッスンのリマインドのスイッチがあり、切るとすぐに保存される（updateMyNotificationSettings の lesson_reminder だけ）。閉じて開き直してもオフのまま。保存に失敗したらスイッチは元に戻り、失敗の文言が出る"
  - where: "student-app お知らせ（次の予約の前日・1 時間前を過ぎた）"
    do: "設定を切ったあとに確定した予約の開始の前日と 1 時間前を過ぎてから、お知らせを開く"
    sees: "その予約のリマインドのお知らせはない（プッシュ通知も届かない）。予約の確定・添削の返却などほかの種類のお知らせは、設定にかかわらず残る。切る前に届いていたリマインドは一覧に残り、押せばその予約を開ける"
must_not:
  - "リマインドの行から、結び付く予約と別の予約を開く（予約の ID で開き、端末に残っていた別の予約の中身を出さない）"
  - "端末に残っていた予約の状態で予約の入口を出す（開いた時点のサーバーの記録から決める。ADR 0010。キャンセル済み・見つからない予約なら「この予約はもう確定待ちではありません。ホームで次にやることを確かめてください。」と「ホームに戻る」だけを出し、入室・動画の送付の道は出さない）"
  - "リマインドから開いたことを理由に、開始 5 分前より早く入室前チェックを開ける、または開始時刻より前に入室できる（student-prejoin-check の決まりのまま）"
  - "レッスンのリマインドを切ったあとに、リマインドのお知らせやプッシュ通知を作る（設定 false では作らない。ADR 0013 の決定 5）"
  - "切っていた間に届くはずだったリマインドを、あとでオンに戻したときに作り直す"
  - "同じ予約の同じ時点のリマインドを 2 件出す"
touches:
  apps: [student-app]
  contexts: [notification, scheduling, live-lesson]
  terms: [notification, notification_settings, booking, slot, prejoin_check, live_lesson]
  operations:
    - student-app.listMyNotifications
    - student-app.markMyNotificationsRead
    - student-app.listMyBookings
    - student-app.getMyNotificationSettings
    - student-app.updateMyNotificationSettings
origin:
  issues: ["guccyon/rally#1463", "guccyon/rally#1475", "guccyon/rally#1476", "guccyon/rally#1477"]
  note: "レッスンの前にリマインドを送る（生徒とコーチに、前日と開始 1 時間前）。生徒の側の入口（お知らせからの予約の入口と、通知の設定の切り替え）"
  retro: false
known_gaps:
  - step: 3
    note: "リマインドから開いた予約の画面を離れるとホームに戻り、お知らせの画面には戻らない（ホームの「次にやること」から予約を開いたときと同じ）"
  - step: 1
    note: "Gen1 のプッシュ通知はモックで、端末に届いたプッシュ通知そのものを押して予約を開く道はない。入口はアプリのお知らせの一覧だけ"
status: active
