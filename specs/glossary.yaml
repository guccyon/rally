# ドメイン用語（Blueprint v0.4 の domain_glossary の骨格）
# 前提は product-context.md、context は context-map.yaml の id を使う。用語の網羅は後続の Issue で行う。
# 各項目の context は 1 つ（context:）。複数のコンテキストが発行する語だけ contexts:（id の配列）で列挙する（docs/adr/0006）。
# 任意で code:（その語を表すコード・契約・イベントの名前）と note:（定義を補う事実・ほかの語との関係・未定のこと）を持てる。
# 状態を持つ語は任意で states:（契約の enum の値 → 画面とエラー文言で使う呼び名）を持てる。両アプリと backend の文言はこれに揃える。
schema_version: "0.1"
status: draft
terms:
  - id: student
    ja: "生徒"
    definition: "コーチからテニス・ゴルフ・野球・サッカー・バスケットボール・水泳のオンラインレッスンを受ける利用者。"
    context: identity
  - id: coach
    ja: "コーチ"
    definition: "予約枠を公開し、同期レッスンの通話や非同期レッスンの動画添削で生徒を指導する利用者。"
    context: identity
  - id: lesson
    ja: "レッスン種別"
    definition: "スポーツごとにコーチが提供するレッスンのメニューで、同期レッスンと非同期レッスンの別を持つ。"
    context: catalog
  - id: lesson_completion
    ja: "完了したレッスン"
    definition: "生徒が同期レッスンの通話セッションまたは非同期レッスンの動画添削を受け終えた事実で、元の通話セッション・動画の集約が発行する（docs/adr/0006）。"
    contexts: [live-lesson, async-lesson]
    code: [LessonCompletion, LessonCompletionId]
  - id: live_lesson
    ja: "同期レッスン"
    definition: "ビデオ通話によるマンツーマンのレッスンで、月額契約では契約プランで決まる暦月の上限までの枠を消費する。"
    context: live-lesson
  - id: async_lesson
    ja: "非同期レッスン"
    definition: "生徒が動画を送り、コーチが添削して返すレッスン。"
    context: async-lesson
  - id: booking
    ja: "予約"
    definition: "生徒がコーチのスロットを確保することで、体験予約もこれに含む。"
    context: scheduling
    states:
      pending: "確定待ち"
      confirmed: "確定済み"
      cancelled: "キャンセル済み"
  - id: slot
    ja: "スロット"
    definition: "コーチが公開する予約枠。"
    context: scheduling
    states:
      open: "公開中"
      booked: "予約済み"
      closed: "終了"
  - id: entitlement
    ja: "受講権"
    definition: "契約種別（月額 / ワンショット）と利用権（残回数・送り放題）の総称で、月額では予約のたびに消費されず、消費されるのはビデオ通話の暦月の枠（上限は契約プランで決まる）だけである。"
    context: entitlement
  - id: subscription
    ja: "月額"
    definition: "ゴルフ以外のスポーツの契約種別で、動画とチャットは送り放題、ビデオ通話は契約プランで決まる暦月の上限までの定額課金。"
    context: entitlement
  - id: subscription_plan
    ja: "契約プラン"
    definition: "月額契約ごとに選ぶプランで、ビデオ通話の暦月の上限を決め、スタンダード（standard、暦月 2 回。既定）とプラス（plus、暦月 4 回）がある（変更シナリオ cs-003）。"
    context: entitlement
  - id: one_shot
    ja: "ワンショット"
    definition: "ゴルフだけの契約種別で、動画添削 1 回ごとの都度課金。"
    context: entitlement
  - id: video_review
    ja: "動画添削"
    definition: "生徒が送った動画をコーチが添削して返すことで、ゴルフではワンショット決済が確定した動画にしか着手できない。"
    context: async-lesson
  - id: ai_feedback
    ja: "AI の一次フィードバック"
    definition: "生徒が送った動画に、コーチの添削の前に AI が返す短い文で、動画添削とは別の項目として持ち、添削の着手条件には関わらない（変更シナリオ cs-006）。"
    context: async-lesson
  - id: cancellation_policy
    ja: "キャンセル規定"
    definition: "開始 24 時間前以降のキャンセルは回数を消費するという規定で、判定は scheduling、回数の消費の実行は entitlement が行う（docs/adr/0002 Q2）。"
    context: scheduling
  - id: lesson_review
    ja: "レッスンの評価"
    definition: "生徒が完了したレッスン（lesson_completion）1 件につき 1 回だけ付ける 1〜5 の点と一言で、評価されるのはそのレッスンのコーチであり、コーチごとの件数と平均がコーチ品質の指標になる。"
    context: review
  - id: message_thread
    ja: "スレッド"
    definition: "生徒と担当コーチの 1 対 1 のチャットで、生徒とコーチの組に 1 つあり、Gen1 では予約が確定したときか、添削依頼・添削の返却をスレッドに流すときにまだなければ開く。"
    context: messaging
  - id: message
    ja: "メッセージ"
    definition: "スレッドの中の 1 通で、本文・添削依頼・添削の返却・スタンプの種類があり、送り手（生徒・担当コーチ・システム）と送信時刻と既読を持ち、月額の生徒は本文とスタンプを送り放題である。"
    context: messaging
  - id: stamp
    ja: "スタンプ"
    definition: "チャットで当事者（生徒・担当コーチ）が本文の代わりに送る、決まった 8 種類のどれかの絵柄のメッセージで、本文は持たない。"
    context: messaging
  - id: notification_settings
    ja: "通知の受け取り設定"
    definition: "アカウントごとに、プッシュ通知の種類（予約の確定・添削の依頼・添削の返却・メッセージの受信）ごとに受け取るかを決める設定で、既定はすべて受け取る。"
    context: notification
  - id: notification
    ja: "お知らせ"
    definition: "送ったプッシュ通知（予約の確定・添削の依頼・添削の返却・メッセージの受信）を、受け取った人があとで一覧で見られるように残したもので、種類・作った時刻・既読かを持ち、通知の受け取り設定でオフの種類も残る。"
    context: notification
    code: [Notification, NotificationId, notification.notifications]
    note: >-
      通知の受け取り設定（notification_settings）のオフが止めるのはプッシュ通知だけで、お知らせは止めない。
      表示する本文はサーバーの境界（interface）が種類と中身から決め、保存しない。
      context-map の notification（コンテキスト）とは別の id（こちらは用語）。
      受け取るのは生徒とコーチで、生徒には予約の確定・添削の返却・コーチからのメッセージ、コーチには新しい予約（種類は予約の確定）・
      添削の依頼・生徒からのメッセージが届く（D114）。生徒は student-app、コーチは admin-web の同じ操作で一覧と既読を扱う。
  - id: lesson_menu
    ja: "レッスンメニュー"
    definition: "コーチが自分の提供スポーツのどれかについて作るレッスンのメニューで、スポーツ・同期 / 非同期の別（同期なら 1 回の時間。15〜120 分の 15 分刻み）・名前（1〜40 文字）・説明（0〜400 文字）・公開中かを持ち、作る・直す・非公開にするのはそのコーチだけで、公開中でないメニューは生徒に見せない。"
    context: catalog
    code: [LessonMenu, LessonMenuId, LessonMenuContent, LessonFormat, LessonDuration, catalog.lesson_menus]
    note: >-
      同期のメニューはコーチの枠に任意で結び付けられ（枠のコーチ自身の・公開中の・同期の・スポーツが枠と同じ・1 回の時間が枠の長さと同じもの。
      docs/adr/0004 の D61）、非同期のメニューは生徒が動画を送るときに任意で選べる。
      既存の用語 lesson（レッスン種別）との関係: コード（catalog の LessonMenu）と docs/adr/0004 の catalog.lesson_menus は、レッスンメニューを
      lesson を実装したものとして扱い、lesson の定義の「スポーツごと・同期 / 非同期の別」はメニューも持つ。
      lesson をレッスンメニューにまとめるか（lesson の id・ja・定義の書き換えを含む）、メニューより大きな「種別」の単位が別にあるのかは未定。
      契約（student-app）の Lesson は完了したレッスン（lesson_completion）を表し、どちらとも別である。
  - id: lesson_menu_snapshot
    ja: "メニューの写し"
    definition: "予約と、非同期レッスンで送った動画が、予約した・送った時点のレッスンメニューから写して持つメニューの ID と名前（予約は同期の 1 回の時間も）で、後でメニューが直されたり非公開になったりしても変わらない。"
    contexts: [scheduling, async-lesson]
    code: [BookingLessonMenu, VideoLessonMenu, ReviewLessonMenu]
    note: >-
      予約が写すのは、予約したスロットに結び付いたメニューが予約の時点で公開中のときだけで、そうでなければメニューなしの予約にする（予約は断らない。
      Booking::with_lesson_menu）。動画が写すのは生徒が選んだメニューで、送り先のコーチの・公開中の・非同期の・動画と同じスポーツのものでなければ
      送付を断る（Video::submit_with_lesson_menu）。メニューを選ばない予約・動画もある。
      評価（review）は写しを持たず、評価の一覧に添えるメニュー（ID・名前）は完了したレッスンの元（同期レッスンは予約、非同期レッスンは動画）が
      持つ写しを読む。枠の一覧に添える枠のメニュー（契約の SlotLessonMenu）は写しではなく今のメニューである。
  - id: slot_capacity
    ja: "定員"
    definition: "1 つのスロットに入れる有効な予約（未確定と確定。キャンセルした予約は数えない）の数の上限で、1〜6 の整数（公開で省いたときは 1）であり、1 はマンツーマン、2 以上はグループレッスンである（変更シナリオ cs-004）。"
    context: scheduling
    code: [SlotCapacity, SlotSeats, capacity, remaining_seats]
    note: >-
      残りの席は定員から有効な予約の数を引いた数（SlotSeats::remaining、契約の remaining_seats）。同じ生徒が同じ枠を 2 回は予約できない。
  - id: live_lesson_session
    ja: "通話セッション"
    definition: "同期レッスンの 1 回の通話で、開始したときに確定していた同じスロットの予約をすべて結び付け（マンツーマンの枠では 1 つ、グループレッスンの枠では人数分）、参加者はコーチと結び付いた予約の生徒たちで、終了すると接続品質の指標を記録する。"
    context: live-lesson
    code: [LiveLessonSession, SessionId, SessionBooking, SessionStatus, startLiveLessonSession, call.started, call.ended]
    note: >-
      開始・終了できるのは参加者だけで、確定した予約にしか開始できず、同じ予約のセッションは 1 つ。グループレッスンの通話中のセッションには、
      結び付いた予約の生徒が同じセッションに入る。完了したレッスン（lesson_completion）は結び付いた予約の生徒ごとに 1 つで、終了したセッションにだけ記録できる。
  - id: video_review_request
    ja: "添削の依頼"
    definition: "非同期レッスンで生徒がコーチに動画を送り添削を求めることで、送った動画は添削待ちになり、その生徒とコーチのスレッドに添削依頼のメッセージが流れる。"
    context: async-lesson
    code: [Video::submit, VideoStatus::Submitted, VideoReviewRequested, MessageKind::VideoReviewRequest, submitVideo, video.submitted]
    note: >-
      送付の回数は数えない（月額は送り放題）。送った時点のレッスンメニューの写し（lesson_menu_snapshot）を任意で持つ。
      送付の直後に AI の一次フィードバック（ai_feedback）が付くことがある。
  - id: video_review_return
    ja: "添削の返却"
    definition: "送り先のコーチが、添削の依頼で送られた動画に添削を返すことで、動画 1 本につき 1 回、送付の後にだけでき、着手できない動画（ゴルフでワンショット決済が確定していないもの）は返せず、返すとその生徒とコーチのスレッドに添削の返却のメッセージが流れる。"
    context: async-lesson
    code: [Video::return_review, VideoReview, VideoStatus::Reviewed, VideoReviewReturned, MessageKind::VideoReviewReturn, returnVideoReview, video_review.returned]
    note: >-
      返した添削そのものは動画添削（video_review）。非同期レッスンの完了したレッスンは、添削を返した動画にだけ記録できる。
