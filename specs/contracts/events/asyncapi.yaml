# 境界づけられたコンテキスト間のドメインイベント（初版）。行動イベント（specs/analytics/events.yaml）とは別物。
# 発行元・購読先（x-publisher / x-subscribers）は context-map.yaml の id、属性名は analytics/events.yaml と揃える。
# ペイロードは必須属性だけ（event_id・occurred_at・関係する student_id / coach_id・対象の id と、購読側が判断に要る事実）。メッセージ基盤は選定しない。
asyncapi: 3.0.0
info:
  title: Rally Domain Events
  version: 0.1.0
  description: 境界づけられたコンテキスト間のドメインイベントの契約（draft）。
defaultContentType: application/json

channels:
  BookingConfirmed:
    address: BookingConfirmed
    description: |
      予約が確定した。entitlement はこれを購読し、月額の生徒のビデオ通話の暦月の枠を 1 回使う（不変条件 1。
      暦月は occurred_at で決める。docs/adr/0005）。枠が残っているかは scheduling が確定の前に entitlement に問い合わせる。
      messaging はこれを購読し、その生徒とコーチのチャットのスレッドを開く（生徒とコーチの組に 1 つ。Gen1 は matching が
      ないので、確定した予約のコーチを担当コーチとみなす）。
    x-publisher: [scheduling]
    x-subscribers: [entitlement, messaging, notification, analytics]
    messages:
      BookingConfirmed:
        $ref: '#/components/messages/BookingConfirmed'
  BookingCancelled:
    address: BookingCancelled
    description: |
      予約がキャンセルされた。回数（ビデオ通話の暦月の枠）を消費するかはキャンセル規定に従って scheduling が判定し、
      consumes_quota に載せる。消費の実行は entitlement が行う（docs/adr/0002 Q2。購読側は判定し直さない）。
      entitlement は consumes_quota が true ならその予約で枠を使ったことにし（確定で使っていればそのまま）、
      false なら確定で使った枠を戻す（docs/adr/0005）。
    x-publisher: [scheduling]
    x-subscribers: [entitlement, notification, analytics]
    messages:
      BookingCancelled:
        $ref: '#/components/messages/BookingCancelled'
  LessonCompleted:
    address: LessonCompleted
    description: レッスンの完了が記録された（同期レッスン・非同期レッスンの両方）。
    x-publisher: [live-lesson, async-lesson]
    x-subscribers: [billing, review, analytics]
    messages:
      LessonCompleted:
        $ref: '#/components/messages/LessonCompleted'
  SubscriptionStarted:
    address: SubscriptionStarted
    description: 生徒の月額契約が始まった。
    x-publisher: [entitlement]
    x-subscribers: [billing, analytics]
    messages:
      SubscriptionStarted:
        $ref: '#/components/messages/SubscriptionStarted'
  VideoReviewRequested:
    address: VideoReviewRequested
    description: |
      生徒が動画を添削依頼として送った（動画の送付）。messaging はこれを購読し、その生徒とコーチのチャットのスレッドに
      （なければ開いて）添削依頼のメッセージを足す（チャットは会話でありレッスンのログでもある。docs/adr/0009 の答え合わせ）。
      同じ動画の添削依頼はスレッドに 1 通。添削の有無・回数・状態は async-lesson だけが持ち、ここには載せない。
      送付の計測は行動イベント video.submitted が担う。
    x-publisher: [async-lesson]
    x-subscribers: [messaging]
    messages:
      VideoReviewRequested:
        $ref: '#/components/messages/VideoReviewRequested'
  VideoReviewReturned:
    address: VideoReviewReturned
    description: |
      コーチが動画の添削を返却した。notification はこれを購読し、動画を送った生徒にプッシュ通知を送る。
      messaging はこれを購読し、その生徒とコーチのスレッドに（なければ開いて）添削の返却のメッセージを足す（同じ動画の返却は 1 通）。
      返却のリードタイムの計測は行動イベント video_review.returned が担い、ここには載せない。
    x-publisher: [async-lesson]
    x-subscribers: [notification, messaging]
    messages:
      VideoReviewReturned:
        $ref: '#/components/messages/VideoReviewReturned'
  MessageSent:
    address: MessageSent
    description: |
      生徒と担当コーチのチャットのスレッドでメッセージが送られた（docs/adr/0007）。notification はこれを購読し、
      受け手（送り手でない側の当事者。sender_role が student ならコーチ、coach なら生徒）にプッシュ通知を送る。
      本文は載せない。
    x-publisher: [messaging]
    x-subscribers: [notification]
    messages:
      MessageSent:
        $ref: '#/components/messages/MessageSent'

components:
  messages:
    BookingConfirmed:
      name: BookingConfirmed
      title: 予約の確定
      payload:
        $ref: '#/components/schemas/BookingConfirmedPayload'
    BookingCancelled:
      name: BookingCancelled
      title: 予約のキャンセル
      payload:
        $ref: '#/components/schemas/BookingCancelledPayload'
    LessonCompleted:
      name: LessonCompleted
      title: レッスンの完了記録
      payload:
        $ref: '#/components/schemas/LessonCompletedPayload'
    SubscriptionStarted:
      name: SubscriptionStarted
      title: 月額契約の開始
      payload:
        $ref: '#/components/schemas/SubscriptionStartedPayload'
    VideoReviewRequested:
      name: VideoReviewRequested
      title: 添削依頼
      payload:
        $ref: '#/components/schemas/VideoReviewRequestedPayload'
    VideoReviewReturned:
      name: VideoReviewReturned
      title: 添削の返却
      payload:
        $ref: '#/components/schemas/VideoReviewReturnedPayload'
    MessageSent:
      name: MessageSent
      title: メッセージの送信
      payload:
        $ref: '#/components/schemas/MessageSentPayload'

  schemas:
    EventId:
      type: string
      description: イベント 1 件ごとの一意な id。購読側の重複排除に使う。
    OccurredAt:
      type: string
      format: date-time
      description: 出来事が発生した時刻。
    BookingConfirmedPayload:
      type: object
      required: [event_id, occurred_at, student_id, coach_id, booking_id]
      properties:
        event_id: { $ref: '#/components/schemas/EventId' }
        occurred_at: { $ref: '#/components/schemas/OccurredAt' }
        student_id: { type: string }
        coach_id: { type: string }
        booking_id: { type: string }
    BookingCancelledPayload:
      type: object
      required: [event_id, occurred_at, student_id, coach_id, booking_id, consumes_quota, cancelled_at]
      properties:
        event_id: { $ref: '#/components/schemas/EventId' }
        occurred_at: { $ref: '#/components/schemas/OccurredAt' }
        student_id: { type: string }
        coach_id: { type: string }
        booking_id: { type: string }
        consumes_quota:
          type: boolean
          description: このキャンセルで回数を消費するか（scheduling のキャンセル規定による判定）
        cancelled_at:
          type: string
          format: date-time
          description: キャンセルした時刻
    LessonCompletedPayload:
      type: object
      required: [event_id, occurred_at, student_id, coach_id, lesson_id]
      properties:
        event_id: { $ref: '#/components/schemas/EventId' }
        occurred_at: { $ref: '#/components/schemas/OccurredAt' }
        student_id: { type: string }
        coach_id: { type: string }
        lesson_id: { type: string }
    SubscriptionStartedPayload:
      type: object
      required: [event_id, occurred_at, student_id, subscription_id]
      properties:
        event_id: { $ref: '#/components/schemas/EventId' }
        occurred_at: { $ref: '#/components/schemas/OccurredAt' }
        student_id: { type: string }
        subscription_id: { type: string }
    VideoReviewRequestedPayload:
      type: object
      required: [event_id, occurred_at, student_id, coach_id, video_id]
      properties:
        event_id: { $ref: '#/components/schemas/EventId' }
        occurred_at: { $ref: '#/components/schemas/OccurredAt' }
        student_id: { type: string }
        coach_id: { type: string }
        video_id: { type: string }
    VideoReviewReturnedPayload:
      type: object
      required: [event_id, occurred_at, student_id, coach_id, video_id, review_id]
      properties:
        event_id: { $ref: '#/components/schemas/EventId' }
        occurred_at: { $ref: '#/components/schemas/OccurredAt' }
        student_id: { type: string }
        coach_id: { type: string }
        video_id: { type: string }
        review_id: { type: string }
    MessageSentPayload:
      type: object
      required: [event_id, occurred_at, student_id, coach_id, thread_id, message_id, sender_role]
      properties:
        event_id: { $ref: '#/components/schemas/EventId' }
        occurred_at: { $ref: '#/components/schemas/OccurredAt' }
        student_id: { type: string }
        coach_id: { type: string }
        thread_id: { type: string }
        message_id: { type: string }
        sender_role:
          type: string
          enum: [student, coach]
          description: 送り手がスレッドのどちらの当事者か（行動イベント message.sent の sender_role と同じ値）
