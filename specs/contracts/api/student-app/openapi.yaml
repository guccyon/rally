openapi: 3.1.0
info:
  title: Rally student-app API
  version: 0.1.0
  description: |
    student-app（生徒アプリ。iOS / Android、ゴルフ以外）が Gen1 の一周シナリオ
    「体験予約 → 初回レッスン（通話 or 動画送付）→ 完了記録」で呼ぶ最小の API。契約ファーストで先に固定し、
    実装（P1 Walking Skeleton の段 2〜5）はこの契約に合わせる。

    - 用語・スキーマ名は `specs/glossary.yaml` の id に揃える（booking → Booking など）
    - 各操作の `x-context` は `specs/context-map.yaml` の context id。複数のコンテキストが発行する事実を扱う操作だけ id の配列にする（glossary の `contexts` と同じ規約）
    - 各操作が発火する行動イベントは `x-analytics-events` に `specs/analytics/events.yaml` の name で書く
    - 外部連携（Stripe / Twilio Video / S3 直接アップロード）は Gen1 ではモックだが、契約は本物と同じ形で書く
    - 認証はモックのトークンを `bearerAuth` として置く（不透明なトークン。`components.securitySchemes.bearerAuth`）

    ## 互換ポリシー

    `.factory-config/manifest.yaml` の `compat.api` と一致させる（`specs/contracts/README.md`）。

    - N-2: モバイルアプリは最新から 2 つ前の版まで（N-2）をこの API が支える。
      支える版のアプリが送るリクエスト・読むレスポンスを壊す変更（必須項目の追加、項目の削除・改名・型変更、
      enum の値の削除）はしない
    - 90 日: 廃止する操作・項目は `deprecated: true` を付けてから 90 日は残す
servers:
  - url: /
    description: ホストは環境ごとに決める（P1 はローカルの Docker Compose、本番相当の環境は P2）
security:
  - bearerAuth: []
tags:
  - name: identity
    description: アカウント・権限
  - name: scheduling
    description: 予約（スロット・予約・キャンセル）
  - name: entitlement
    description: 受講権（契約種別と利用権）
  - name: live-lesson
    description: 同期レッスン（通話セッション）
  - name: async-lesson
    description: 非同期レッスン（動画送付・添削）
  - name: catalog
    description: レッスン（完了記録）
  - name: review
    description: 評価（レッスンの評価）
  - name: messaging
    description: メッセージ（生徒と担当コーチのチャット）
  - name: notification
    description: 通知（プッシュ通知の受け取り設定）

paths:
  /accounts:
    post:
      operationId: registerAccount
      summary: アカウント登録（生徒）
      tags: [identity]
      x-context: identity
      x-analytics-events: [account.registered]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAccountRequest"
      responses:
        "201":
          description: 登録した生徒と、モックのアクセストークン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterAccountResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /slots:
    get:
      operationId: searchSlots
      summary: スロットの検索
      description: |
        コーチが公開している予約枠のうち、まだ予約されていないものを返す。
        各枠には、そのコーチの表示名 `coach_display_name` と自己紹介文 `coach_bio` を任意の項目として添える（自己紹介文を書いていないコーチは `coach_bio` を載せない）。
      tags: [scheduling]
      x-context: scheduling
      parameters:
        - name: sport
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Sport"
        - name: coach_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: starts_after
          in: query
          required: false
          description: この時刻以降に始まるスロットに絞る（省略時は現在時刻）
          schema:
            type: string
            format: date-time
        - name: starts_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: 前のページの `next_cursor`
          schema:
            type: string
      responses:
        "200":
          description: スロットの一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /bookings:
    post:
      operationId: createBooking
      summary: 予約の作成（体験予約を含む）
      description: |
        スロットを確保する。体験予約は `is_trial: true`。作成直後の状態は `pending` で、確定は `confirmBooking`。
        予約できるのは公開中のスロットだけ（閉じたスロットはないスロットと同じく 404）で、1 つのスロットに有効な
        （キャンセルされていない）予約は 1 件まで（409 `slot_already_booked`）。体験予約はその生徒の初回の予約だけ
        （キャンセルされていない予約があれば 409 `trial_already_used`）。生徒だけが呼べる（それ以外の役割は 403）。予約（作成）では受講権を消費しない。
        月額契約の生徒のビデオ通話の暦月 2 回の枠（不変条件 1）は、確定（`confirmBooking`）で確かめて使う。
      tags: [scheduling]
      x-context: scheduling
      x-analytics-events: [booking.created]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: 作成した予約
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /bookings/me:
    get:
      operationId: listMyBookings
      summary: 自分の予約の一覧
      description: |
        認証した生徒の予約を、キャンセル済みも含めてすべて返す（状態は各予約の `status`）。並びは予約したスロットの開始時刻の
        新しい順で、同じ開始時刻は予約の作成の新しい順。予約がなければ空。照会だけで何も変えない。生徒だけが呼べる（それ以外の役割は 403）。
        各項目には予約したスロット（日時・スポーツ）を添え、スロットにはそのコーチの表示名 `coach_display_name` と
        自己紹介文 `coach_bio` を `searchSlots` と同じく任意の項目として載せる。
      tags: [scheduling]
      x-context: scheduling
      x-analytics-events: []
      responses:
        "200":
          description: 生徒の予約の一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyBookingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /bookings/{booking_id}/confirm:
    post:
      operationId: confirmBooking
      summary: 予約の確定
      description: |
        自分の `pending` の予約を確定し、スロットを予約済みにする。境界間イベント `BookingConfirmed` を発行する。
        別の生徒の予約は 404、`pending` でない予約は 409 `invalid_booking_state`。生徒だけが呼べる（それ以外の役割は 403）。
        月額契約の生徒のビデオ通話は暦月 2 回まで（不変条件 1）。その暦月の枠が残っていなければ確定せず 409 `live_lesson_quota_exceeded`
        （3 回目は予約できない。暦月は日本時間で区切り、翌月には再び確定できる）。確定すると entitlement が枠を 1 回使い
        （`BookingConfirmed` の購読）、`getMyEntitlement` の `live_lesson_quota.used` が増える。受講権のない生徒（月額契約の前）は枠の制約を受けない。
      tags: [scheduling]
      x-context: scheduling
      x-analytics-events: [booking.confirmed]
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: 確定した予約
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /bookings/{booking_id}/cancel:
    post:
      operationId: cancelBooking
      summary: 予約のキャンセル
      description: |
        自分の予約（`pending` / `confirmed`）をキャンセルする。`confirmed` ならスロットを公開中（`open`）に戻す。
        回数を消費するかはキャンセル規定（glossary の cancellation_policy）に従って scheduling が判定し、境界間イベント
        `BookingCancelled` の `consumes_quota` で entitlement に渡す（docs/adr/0002 Q2）。このレスポンスには含めない。
        月額契約の生徒なら、開始 24 時間前以降のキャンセルはその予約で枠を使ったことになり（確定前の予約でも `used` が増える）、
        それより前のキャンセルは確定で使った枠が戻る（docs/adr/0005）。
        別の生徒の予約は 404、キャンセル済みの予約は 409 `invalid_booking_state`。生徒だけが呼べる（それ以外の役割は 403）。
        本文の `reason` は任意で、Gen1 では保存しない。
      tags: [scheduling]
      x-context: scheduling
      x-analytics-events: [booking.cancelled]
      parameters:
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelBookingRequest"
      responses:
        "200":
          description: キャンセルした予約
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /subscriptions:
    post:
      operationId: startSubscription
      summary: 月額契約の開始
      description: |
        認証した生徒の月額契約を開始し、それによる受講権（今の暦月のまだ使っていないビデオ通話の枠）を作る。境界間イベント
        `SubscriptionStarted` を発行する。生徒だけが呼べる（それ以外の役割は 403）。受講権がすでにあれば 409 `subscription_already_active`
        （受講権は生徒ごとに 1 つ）。ゴルフは 422（月額はゴルフ以外）。決済（Stripe）は Gen1 ではモックで、`payment_method_token` は
        受け取るだけで使わない（billing は Gen1 の範囲外）。ワンショットは golf-app の契約で扱い、student-app では開始しない。
      tags: [entitlement]
      x-context: entitlement
      x-analytics-events: [subscription.started]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSubscriptionRequest"
      responses:
        "201":
          description: 開始した月額契約と、それによる受講権
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartSubscriptionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /entitlements/me:
    get:
      operationId: getMyEntitlement
      summary: 自分の受講権の照会
      description: |
        認証した生徒の受講権（契約種別と利用権）を返す。照会だけで、枠を消費しない。生徒だけが呼べる（それ以外の役割は 403）。
        受講権がまだない（月額契約を開始していない）なら 404。`live_lesson_quota` は照会した時点の暦月の枠で、
        前の月の枠を使っていても月をまたげば `used` は 0 から数える。
      tags: [entitlement]
      x-context: entitlement
      responses:
        "200":
          description: 生徒の受講権
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /live-lesson-sessions:
    post:
      operationId: startLiveLessonSession
      summary: 通話セッションの開始
      description: |
        確定した予約の通話を始める。通話（Twilio Video）は Gen1 ではモックで、接続情報（`room_token`）もモックが返す。
        呼べるのは予約の参加者（生徒・コーチ）だけで、それ以外のアカウントには予約がないのと同じ 404 を返す（役割では絞らない）。
        確定前・キャンセル済みの予約は 409 `invalid_booking_state`、その予約のセッションがすでにあれば（終了済みを含む）
        409 `invalid_session_state`（同じ予約のセッションは 1 つ）。`booking_id` が UUID でなければ 422。
      tags: [live-lesson]
      x-context: live-lesson
      x-analytics-events: [call.started]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartLiveLessonSessionRequest"
      responses:
        "201":
          description: 開始した通話セッション
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveLessonSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /live-lesson-sessions/{session_id}/end:
    post:
      operationId: endLiveLessonSession
      summary: 通話セッションの終了
      description: |
        接続品質の生の指標はモックがサーバー側で生成し、行動イベント `call.ended` に載せる（このレスポンスには含めない）。
        通話品質スコアは指標からセマンティック層で計算するので（docs/adr/0002 Q1）、この API はスコアを返さない。
        呼べるのは予約の参加者（生徒・コーチ）だけで、それ以外のアカウントと UUID でない ID には 404。
        終了済みのセッションは 409 `invalid_session_state`。終了後の `room_token` は null。
      tags: [live-lesson]
      x-context: live-lesson
      x-analytics-events: [call.ended]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 終了した通話セッション
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveLessonSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /videos:
    post:
      operationId: submitVideo
      summary: 動画の送付
      description: |
        添削を受ける動画を送る。動画本体は S3 への直接アップロード（Gen1 ではモック）で、
        レスポンスの `upload_url` に PUT する。月額契約では送り放題（送付の回数は数えない）。
        生徒の役割のトークンだけが呼べる（それ以外は 403）。送る生徒はトークンのアカウント。
        `sport` がゴルフ（golf-app の範囲）・`coach_id` が UUID でない・`content_type` が enum にない・`note` が長すぎる場合は 422。
        Gen1 は動画本体のアップロードの完了を受け取らないので、レスポンスの `status` は `awaiting_upload`。`note` は Gen1 では保存しない。
      tags: [async-lesson]
      x-context: async-lesson
      x-analytics-events: [video.submitted]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitVideoRequest"
      responses:
        "201":
          description: 受け付けた動画と、アップロード先
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /videos/{video_id}/review:
    get:
      operationId: getVideoReview
      summary: 添削結果の取得
      description: |
        コーチがまだ返却していなければ `status` は `in_progress`（未返却）で、`review_id`・`comment`・`returned_at` は null。
        `ai_feedback` は動画の送付の直後に AI（Gen1 はモック）が返した一次フィードバックで、コーチの添削とは別の項目
        （返却で上書きされない）。AI が作れなかったときは null（送付は成功している）。
        呼べるのは動画の当事者（送った生徒・送り先のコーチ）だけで、それ以外のアカウントと UUID でない ID には 404
        （動画があることも知らせない）。返却は admin-web の `returnVideoReview`（コーチ）。
      tags: [async-lesson]
      x-context: async-lesson
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 動画の添削
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /lessons/completions:
    post:
      operationId: recordLessonCompletion
      summary: レッスンの完了記録
      description: |
        同期レッスン（通話セッション）または非同期レッスン（添削が返却された動画）の完了を記録する。
        完了記録は live-lesson の通話セッション・async-lesson の動画のそれぞれの集約が発行する（docs/adr/0006）。
        `x-context` は glossary の lesson_completion と同じく live-lesson と async-lesson の両方（docs/adr/0006）。
        `is_first_lesson` はサーバーが判定する（その生徒の完了記録が同期・非同期あわせて 0 件のときだけ true）。
        呼べるのは元のセッション・動画の当事者（生徒・コーチ）だけで、それ以外のアカウントとない ID には 404
        （あることも知らせない）。`session_id` / `video_id` が UUID でない、`lesson_type` に合わない ID を指定したときは 422。
        終了していない通話セッションは 409 `invalid_session_state`、添削が返されていない動画は 409 `invalid_video_state`、
        同じセッション・動画の 2 回目は 409 `lesson_already_completed`。記録すると行動イベント `lesson.completed` を
        発火し、境界間イベント `LessonCompleted` を発行する。
      tags: [catalog]
      x-context: [live-lesson, async-lesson]
      x-analytics-events: [lesson.completed]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordLessonCompletionRequest"
      responses:
        "201":
          description: 完了を記録したレッスン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"


  /lesson-reviews:
    post:
      operationId: submitLessonReview
      summary: レッスンの評価（生徒）
      description: |
        完了したレッスン（`recordLessonCompletion` が返した `lesson_id`）に、そのレッスンの生徒が評価（1〜5 の点と一言）を付ける。
        評価されるのはそのレッスンのコーチ（サーバーが完了記録から決める）。生徒の役割のトークンだけが呼べる（それ以外は 403）。
        評価は完了したレッスン 1 件につき 1 回で、2 回目は 409 `lesson_already_reviewed`（編集・削除はできない）。
        ない `lesson_id` と、自分が生徒でないレッスンには 404（あることも知らせない）。`lesson_id` が UUID でない、
        `rating` が 1〜5 の整数でない、`comment` が空（空白だけ）か長すぎるときは 422。
        評価すると行動イベント `review.submitted` を発火する。コーチごとの件数と平均は admin-web の `getCoachReviewSummary`。
      tags: [review]
      x-context: review
      x-analytics-events: [review.submitted]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitLessonReviewRequest"
      responses:
        "201":
          description: 付けた評価
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /message-threads:
    get:
      operationId: listMessageThreads
      summary: スレッドの一覧
      description: |
        認証したアカウントが当事者（生徒・担当コーチ）のチャットのスレッドを、最後の出来事（最後のメッセージの送信、
        なければスレッドを開いた時刻）の新しい順に返す。同じ時刻はスレッド ID の順。当事者のスレッドがなければ空。
        スレッドは予約が確定したときに、その生徒とコーチの組に 1 つ開く（境界間イベント `BookingConfirmed` を
        messaging が購読する。Gen1 は matching がないので、確定した予約のコーチを担当コーチとみなす）。
        `unread_count` は呼んだアカウントにとっての未読（相手から届いてまだ読んでいない）メッセージの数。
        admin-web の `listMessageThreads`（コーチ）と同じ操作・同じ形。
      tags: [messaging]
      x-context: messaging
      responses:
        "200":
          description: 当事者のスレッド
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageThreadList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /message-threads/{thread_id}/messages:
    get:
      operationId: listMessages
      summary: メッセージの一覧
      description: |
        スレッドのメッセージを送った順に返す（読むだけで既読にはしない。既読は `markMessageThreadRead`）。
        呼べるのはスレッドの当事者（生徒・担当コーチ）だけで、それ以外のアカウントと UUID でない ID には 404
        （スレッドがあることも知らせない）。
      tags: [messaging]
      x-context: messaging
      parameters:
        - $ref: "#/components/parameters/MessageThreadId"
      responses:
        "200":
          description: スレッドのメッセージ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: sendMessage
      summary: メッセージの送信
      description: |
        スレッドの当事者（生徒・担当コーチ）がメッセージを送る。送ったアカウントはトークンのアカウント。
        生徒が送れるのは、チャットが送り放題の受講権（月額）を持つときだけで、送り放題なので送信の回数は数えない
        （受講権を消費しない）。受講権のない生徒（月額契約の前）は 403 `chat_not_entitled`。コーチの送信は生徒の
        契約に左右されない。当事者でないアカウントと UUID でない ID には 404。`body` が空（空白だけ）か長すぎれば 422。
        送ると行動イベント `message.sent` を発火する。通知（プッシュ）と添付ファイルは扱わない。
      tags: [messaging]
      x-context: messaging
      x-analytics-events: [message.sent]
      parameters:
        - $ref: "#/components/parameters/MessageThreadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: 送ったメッセージ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /message-threads/{thread_id}/read:
    post:
      operationId: markMessageThreadRead
      summary: 既読にする
      description: |
        スレッドの当事者が、相手から届いたメッセージをすべて既読にする（`read_at` はサーバーの現在時刻）。
        自分が送ったメッセージと既読のメッセージは変えない（最初に読んだ時刻のまま。何度呼んでもよい）。
        当事者でないアカウントと UUID でない ID には 404。既読にしたあとのスレッド（`unread_count` は 0）を返す。
      tags: [messaging]
      x-context: messaging
      parameters:
        - $ref: "#/components/parameters/MessageThreadId"
      responses:
        "200":
          description: 既読にしたあとのスレッド
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageThread"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /notification-settings/me:
    get:
      operationId: getMyNotificationSettings
      summary: 自分の通知の受け取り設定の照会
      description: |
        認証した生徒の通知の受け取り設定（プッシュ通知の種類ごとに受け取るか）を返す。まだ変えていなければすべて true
        （既定はすべて受け取る）。照会だけで、何も保存しない。生徒だけが呼べる（それ以外の役割は 403）。
      tags: [notification]
      x-context: notification
      x-analytics-events: []
      responses:
        "200":
          description: 生徒の通知の受け取り設定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateMyNotificationSettings
      summary: 自分の通知の受け取り設定の変更
      description: |
        認証した生徒の通知の受け取り設定を変え、変えたあとの設定を返す。リクエストに書いた種類だけを変え、
        書かなかった種類は今の設定のまま（空のオブジェクトなら何も変えない）。生徒だけが呼べる（それ以外の役割は 403）。
        値が真偽値でないときは 422。受け取るかは通知を送る時点の設定で決まり、false の種類の通知は送らない。
        送らなかった通知は、あとで true に戻しても送り直さない。
      tags: [notification]
      x-context: notification
      x-analytics-events: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationSettingsRequest"
      responses:
        "200":
          description: 変えたあとの通知の受け取り設定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        アカウント ID と役割を載せた不透明なトークン（`RegisterAccountResponse.access_token`）。
        クライアントは中身を解釈しない。Gen1 は署名なしのモックで、本番では署名付きの方式に差し替える
        （形式が変わってもクライアントへの影響はない）。トークンがない・無効なら 401、役割が操作に合わなければ 403。

  parameters:
    BookingId:
      name: booking_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageThreadId:
      name: thread_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: トークンがない、または無効
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 受講権がない、または役割が操作に合わない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 対象が存在しない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 現在の状態では実行できない（予約済みのスロット、ビデオ通話の暦月 2 回の枠の超過など）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: リクエストの内容が不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Sport:
      type: string
      description: student-app が扱うスポーツ。ゴルフは golf-app の範囲のため含めない。
      enum: [tennis, baseball, soccer, basketball, swimming]

    Student:
      type: object
      description: glossary の student
      required: [student_id, display_name, sport, created_at]
      properties:
        student_id:
          type: string
          format: uuid
        display_name:
          type: string
        sport:
          $ref: "#/components/schemas/Sport"
        created_at:
          type: string
          format: date-time

    RegisterAccountRequest:
      type: object
      required: [email, display_name, sport]
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
          minLength: 1
          maxLength: 50
        sport:
          $ref: "#/components/schemas/Sport"

    RegisterAccountResponse:
      type: object
      required: [student, access_token]
      properties:
        student:
          $ref: "#/components/schemas/Student"
        access_token:
          type: string
          description: "モックのトークン。以後のリクエストで `Authorization: Bearer <access_token>` に使う"

    Slot:
      type: object
      description: glossary の slot（コーチが公開する予約枠）
      required: [slot_id, coach_id, sport, starts_at, ends_at]
      properties:
        slot_id:
          type: string
          format: uuid
        coach_id:
          type: string
          format: uuid
        sport:
          $ref: "#/components/schemas/Sport"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        coach_display_name:
          type: string
          minLength: 1
          maxLength: 50
          description: コーチの表示名。コーチのアカウントが引けなければ載らない
        coach_bio:
          type: string
          minLength: 1
          maxLength: 400
          description: コーチの自己紹介文（書いたとおり）。自己紹介文を書いていない（空の）コーチと、コーチのアカウントが引けないときは載らない

    SlotPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Slot"
        next_cursor:
          type: [string, "null"]
          description: 次のページがなければ null

    BookingStatus:
      type: string
      enum: [pending, confirmed, cancelled]

    Booking:
      type: object
      description: glossary の booking（生徒によるスロットの確保。体験予約を含む）
      required: [booking_id, slot_id, student_id, coach_id, is_trial, status, starts_at, created_at]
      properties:
        booking_id:
          type: string
          format: uuid
        slot_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        coach_id:
          type: string
          format: uuid
        is_trial:
          type: boolean
          description: 体験予約なら true
        status:
          $ref: "#/components/schemas/BookingStatus"
        starts_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: [string, "null"]
          format: date-time
        cancelled_at:
          type: [string, "null"]
          format: date-time

    MyBooking:
      type: object
      description: 自分の予約の一覧の 1 件。予約（glossary の booking）と、予約したスロット（glossary の slot）
      required: [booking, slot]
      properties:
        booking:
          $ref: "#/components/schemas/Booking"
        slot:
          $ref: "#/components/schemas/Slot"

    MyBookingList:
      type: object
      required: [bookings]
      properties:
        bookings:
          type: array
          description: 予約したスロットの開始時刻の新しい順（同じ開始時刻は予約の作成の新しい順）。キャンセル済みも含む
          items:
            $ref: "#/components/schemas/MyBooking"

    CreateBookingRequest:
      type: object
      required: [slot_id, is_trial]
      properties:
        slot_id:
          type: string
          format: uuid
        is_trial:
          type: boolean

    CancelBookingRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500

    ContractType:
      type: string
      description: 契約種別。Gen1 で実装するのは subscription（月額）のみで、one_shot（ワンショット）は型として持つ。
      enum: [subscription, one_shot]

    Entitlement:
      type: object
      description: |
        glossary の entitlement（契約種別と利用権の総称）。月額では予約のたびに消費されず、
        消費されるのはビデオ通話の暦月 2 回の枠だけ。
      required: [entitlement_id, student_id, contract_type, sport]
      properties:
        entitlement_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        contract_type:
          $ref: "#/components/schemas/ContractType"
        sport:
          type: string
          description: 月額は Sport のいずれか。ワンショットは golf
        unlimited_video_and_chat:
          type: boolean
          description: 動画とチャットが送り放題か（月額は true）
        live_lesson_quota:
          oneOf:
            - $ref: "#/components/schemas/LiveLessonQuota"
            - type: "null"
          description: ビデオ通話の暦月の枠（月額のみ）
        remaining_video_reviews:
          type: [integer, "null"]
          minimum: 0
          description: 残りの動画添削回数（ワンショットのみ。月額は null）

    LiveLessonQuota:
      type: object
      description: ビデオ通話の暦月の枠（月額は暦月 2 回まで）
      required: [month, limit, used, remaining]
      properties:
        month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
          description: 暦月（YYYY-MM）
        limit:
          type: integer
          const: 2
        used:
          type: integer
          minimum: 0
          maximum: 2
        remaining:
          type: integer
          minimum: 0
          maximum: 2

    SubscriptionStatus:
      type: string
      enum: [active, cancelled]

    Subscription:
      type: object
      description: glossary の subscription（月額。ゴルフ以外）
      required: [subscription_id, student_id, sport, status, started_at]
      properties:
        subscription_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        sport:
          $ref: "#/components/schemas/Sport"
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        started_at:
          type: string
          format: date-time

    StartSubscriptionRequest:
      type: object
      required: [sport, payment_method_token]
      properties:
        sport:
          $ref: "#/components/schemas/Sport"
        payment_method_token:
          type: string
          description: 決済手段のトークン（Stripe 相当。Gen1 はモック）

    StartSubscriptionResponse:
      type: object
      required: [subscription, entitlement]
      properties:
        subscription:
          $ref: "#/components/schemas/Subscription"
        entitlement:
          $ref: "#/components/schemas/Entitlement"

    LiveLessonSessionStatus:
      type: string
      enum: [in_progress, ended]

    LiveLessonSession:
      type: object
      description: 同期レッスン（glossary の live_lesson）の通話セッション
      required: [session_id, booking_id, student_id, coach_id, status, started_at]
      properties:
        session_id:
          type: string
          format: uuid
        booking_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        coach_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/LiveLessonSessionStatus"
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
        duration_sec:
          type: [integer, "null"]
          minimum: 0
          description: 終了するまでは null
        room_token:
          type: [string, "null"]
          description: 通話に参加するためのトークン（Twilio Video 相当。Gen1 はモック）。終了後は null

    StartLiveLessonSessionRequest:
      type: object
      required: [booking_id]
      properties:
        booking_id:
          type: string
          format: uuid
          description: 確定した予約

    VideoStatus:
      type: string
      enum: [awaiting_upload, submitted]

    Video:
      type: object
      description: 非同期レッスン（glossary の async_lesson）で生徒が送る動画
      required: [video_id, student_id, coach_id, sport, status, created_at]
      properties:
        video_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        coach_id:
          type: string
          format: uuid
        sport:
          $ref: "#/components/schemas/Sport"
        status:
          $ref: "#/components/schemas/VideoStatus"
        upload_url:
          type: [string, "null"]
          format: uri
          description: 動画本体の PUT 先（S3 の署名付き URL 相当。Gen1 はモック）。アップロード後は null
        created_at:
          type: string
          format: date-time

    SubmitVideoRequest:
      type: object
      required: [coach_id, sport, content_type]
      properties:
        coach_id:
          type: string
          format: uuid
        sport:
          $ref: "#/components/schemas/Sport"
        content_type:
          type: string
          enum: [video/mp4, video/quicktime]
        note:
          type: string
          maxLength: 1000
          description: コーチへの相談内容

    VideoReviewStatus:
      type: string
      enum: [in_progress, returned]

    AiFeedback:
      type: object
      description: |
        glossary の ai_feedback（生徒が送った動画に、コーチの添削の前に AI が返す一次フィードバック）。
        コーチの添削（`VideoReview` の `comment`）とは別の項目で、添削の返却で上書きされない。Gen1 の AI はモック
      required: [comment, created_at]
      properties:
        comment:
          type: string
          minLength: 1
          description: AI の一次フィードバックの短い文
        created_at:
          type: string
          format: date-time
          description: 一次フィードバックを作った時刻（動画の送付の直後）

    VideoReview:
      type: object
      description: glossary の video_review（生徒が送った動画をコーチが添削して返すこと）
      required: [video_id, student_id, coach_id, status]
      properties:
        review_id:
          type: [string, "null"]
          format: uuid
          description: 返却されるまでは null
        video_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        coach_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/VideoReviewStatus"
        comment:
          type: [string, "null"]
          description: コーチの添削コメント。返却されるまでは null
        returned_at:
          type: [string, "null"]
          format: date-time
        ai_feedback:
          description: AI の一次フィードバック。まだない（AI が作れなかった）ときは null。コーチの添削とは別の項目
          oneOf:
            - $ref: "#/components/schemas/AiFeedback"
            - type: "null"

    LessonType:
      type: string
      description: 同期レッスン（live_lesson）または非同期レッスン（async_lesson）
      enum: [live_lesson, async_lesson]

    Lesson:
      type: object
      description: glossary の lesson（コーチが生徒に提供する指導の単位）
      required: [lesson_id, student_id, coach_id, lesson_type, is_first_lesson, completed_at]
      properties:
        lesson_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        coach_id:
          type: string
          format: uuid
        lesson_type:
          $ref: "#/components/schemas/LessonType"
        session_id:
          type: [string, "null"]
          format: uuid
          description: 同期レッスンの通話セッション（非同期なら null）
        video_id:
          type: [string, "null"]
          format: uuid
          description: 非同期レッスンの動画（同期なら null）
        is_first_lesson:
          type: boolean
          description: その生徒にとって初回のレッスンか（サーバーが判定）
        completed_at:
          type: string
          format: date-time

    RecordLessonCompletionRequest:
      description: 同期レッスンは session_id、非同期レッスンは video_id を指定する
      oneOf:
        - $ref: "#/components/schemas/LiveLessonCompletion"
        - $ref: "#/components/schemas/AsyncLessonCompletion"
      discriminator:
        propertyName: lesson_type
        mapping:
          live_lesson: "#/components/schemas/LiveLessonCompletion"
          async_lesson: "#/components/schemas/AsyncLessonCompletion"

    LiveLessonCompletion:
      type: object
      description: 同期レッスンの完了記録（終了した通話セッションを指定）
      required: [lesson_type, session_id]
      properties:
        lesson_type:
          type: string
          const: live_lesson
        session_id:
          type: string
          format: uuid
      additionalProperties: false

    LessonReview:
      type: object
      description: glossary の lesson_review（生徒が完了したレッスン 1 件につき 1 回だけ付ける評価）
      required: [review_id, lesson_id, student_id, coach_id, rating, comment, submitted_at]
      properties:
        review_id:
          type: string
          format: uuid
        lesson_id:
          type: string
          format: uuid
          description: 評価した完了したレッスン（`Lesson.lesson_id`）
        student_id:
          type: string
          format: uuid
        coach_id:
          type: string
          format: uuid
          description: 評価されたコーチ（そのレッスンのコーチ）
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          description: 一言
        submitted_at:
          type: string
          format: date-time

    SubmitLessonReviewRequest:
      type: object
      required: [lesson_id, rating, comment]
      properties:
        lesson_id:
          type: string
          format: uuid
          description: 完了したレッスン（`Lesson.lesson_id`）
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: 1（低い）〜5（高い）
        comment:
          type: string
          minLength: 1
          maxLength: 200
          description: 一言（空白だけは不可）

    AsyncLessonCompletion:
      type: object
      description: 非同期レッスンの完了記録（添削が返却された動画を指定）
      required: [lesson_type, video_id]
      properties:
        lesson_type:
          type: string
          const: async_lesson
        video_id:
          type: string
          format: uuid
      additionalProperties: false

    MessageSenderRole:
      type: string
      description: "student: スレッドの生徒が送った / coach: スレッドの担当コーチが送った"
      enum: [student, coach]

    Message:
      type: object
      description: glossary の message（チャットのスレッドの中の 1 通。送信時刻と既読を持つ）
      required: [message_id, thread_id, sender_id, sender_role, body, sent_at]
      properties:
        message_id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
          description: 送ったアカウント（スレッドの生徒か担当コーチ）
        sender_role:
          $ref: "#/components/schemas/MessageSenderRole"
        body:
          type: string
        sent_at:
          type: string
          format: date-time
        read_at:
          type: [string, "null"]
          format: date-time
          description: 受け取った側が読んだ時刻（既読）。読むまでは null

    MessageThread:
      type: object
      description: glossary の message_thread（生徒と担当コーチの 1 対 1 のチャットのスレッド。生徒とコーチの組に 1 つ）
      required: [thread_id, student_id, coach_id, opened_at, unread_count]
      properties:
        thread_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        coach_id:
          type: string
          format: uuid
        opened_at:
          type: string
          format: date-time
          description: スレッドを開いた時刻（その生徒とコーチの最初の予約が確定した時刻）
        last_message:
          description: 最後のメッセージ。まだなければ null
          oneOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"
        unread_count:
          type: integer
          minimum: 0
          description: 呼んだアカウントにとっての未読（相手から届いてまだ読んでいない）メッセージの数

    MessageThreadList:
      type: object
      required: [threads]
      properties:
        threads:
          type: array
          description: 最後の出来事の新しい順
          items:
            $ref: "#/components/schemas/MessageThread"

    MessageList:
      type: object
      required: [thread_id, messages]
      properties:
        thread_id:
          type: string
          format: uuid
        messages:
          type: array
          description: 送った順
          items:
            $ref: "#/components/schemas/Message"

    SendMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: 本文（空白だけは不可）

    NotificationSettings:
      type: object
      description: |
        glossary の notification_settings（プッシュ通知の種類ごとに受け取るか。既定はすべて true）。
        種類は追加しうる（項目が増える）。
      required: [student_id, booking_confirmed, video_review_returned, message_received]
      properties:
        student_id:
          type: string
          format: uuid
        booking_confirmed:
          type: boolean
          description: 予約が確定したときの通知を受け取るか
        video_review_returned:
          type: boolean
          description: 動画の添削が返却されたときの通知を受け取るか
        message_received:
          type: boolean
          description: 担当コーチからチャットのメッセージが届いたときの通知を受け取るか

    UpdateNotificationSettingsRequest:
      type: object
      description: 変える種類だけを書く。書かなかった種類は今の設定のまま
      properties:
        booking_confirmed:
          type: boolean
          description: 予約が確定したときの通知を受け取るか
        video_review_returned:
          type: boolean
          description: 動画の添削が返却されたときの通知を受け取るか
        message_received:
          type: boolean
          description: 担当コーチからチャットのメッセージが届いたときの通知を受け取るか

    ErrorCode:
      type: string
      description: |
        機械可読のエラー種別。値は追加しうる（クライアントは未知の値を汎用エラーとして扱う）。
      enum:
        - unauthorized
        - forbidden
        - not_found
        - validation_failed
        - email_already_registered
        - slot_already_booked
        - trial_already_used
        - invalid_booking_state
        - live_lesson_quota_exceeded
        - subscription_already_active
        - invalid_session_state
        - invalid_video_state
        - lesson_already_completed
        - chat_not_entitled
        - lesson_already_reviewed

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: 人間向けの説明（表示用ではない）
