openapi: 3.1.0
info:
  title: Rally admin-web API
  version: 0.1.0
  description: |
    admin-web（最小の管理画面）が呼ぶ API。本部とコーチが同じアプリに役割で同居し、画面は役割で出し分ける
    （ADR 0002 Q3）。コーチ側の最小操作（予約枠の登録・添削の返却・通話参加）もここに載せる。
    Gen1 の P1 で実装済みの操作だけを書き、残りは実装する段で足す。通話への参加（`startLiveLessonSession` /
    `endLiveLessonSession`）は student-app と同じ操作・同じ形で、予約の参加者であるコーチが呼ぶ。

    - 用語・スキーマ名は `specs/glossary.yaml` の id に揃える（slot → Slot など）
    - 各操作の `x-context` は `specs/context-map.yaml` の context id
    - 各操作が発火する行動イベントは `x-analytics-events` に `specs/analytics/events.yaml` の name で書く
    - 認証は student-app と同じモックのトークンを `bearerAuth` として置く（不透明なトークン）

    ## 互換ポリシー

    `.factory-config/manifest.yaml` の `compat.api` と一致させる（`specs/contracts/README.md`）。

    - N-2: モバイルアプリは最新から 2 つ前の版まで（N-2）を API が支える（admin-web は Web なので
      配信と同時に最新になるが、同じ API を共有するクライアントのために同じ規則で変更する）。
      リクエスト・レスポンスを壊す変更（必須項目の追加、項目の削除・改名・型変更、enum の値の削除）はしない
    - 90 日: 廃止する操作・項目は `deprecated: true` を付けてから 90 日は残す
servers:
  - url: /
    description: ホストは環境ごとに決める（P1 はローカルの Docker Compose、本番相当の環境は P2）
security:
  - bearerAuth: []
tags:
  - name: scheduling
    description: 予約（スロット）
  - name: live-lesson
    description: 同期レッスン（通話への参加）
  - name: async-lesson
    description: 非同期レッスン（動画添削の返却）
  - name: review
    description: 評価（コーチごとの評価の集計）

paths:
  /slots:
    post:
      operationId: publishSlot
      summary: スロットの公開（コーチ）
      description: |
        認証したコーチの予約枠を公開する。コーチの役割のトークンだけが呼べる（それ以外は 403）。
        開始は終了より前（違えば 422）。期間は開始を含み終了を含まない。同じコーチの、時間を占める枠
        （`open` / `booked`）と期間が重なれば 409 `slot_overlaps`。Gen1 の枠の定員は 1（マンツーマン）。
        公開すると行動イベント `slot.published`（KPI「コーチの予約枠充足率」の入力）を発火する。
      tags: [scheduling]
      x-context: scheduling
      x-analytics-events: [slot.published]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishSlotRequest"
      responses:
        "201":
          description: 公開したスロット
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Slot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /slot-supply:
    get:
      operationId: getSlotSupply
      summary: スポーツごとの予約枠の需給（本部）
      description: |
        スポーツごとに、公開した予約枠が予約しようとした生徒の数に対して足りているか（`sufficient` / `insufficient`）と、
        判定に使った数を返す。コーチの採用計画（どのスポーツのコーチを募集するか）に使う。本部の役割のトークンだけが
        呼べる（それ以外は 403）。スポーツは `Sport` の 5 種類すべてを、`Sport` の enum の順で返す。

        判定の式と期間はここが正本（実装は backend の domain `SlotSupply` の 1 か所）。

        - 期間: 集計した時刻（サーバーの現在時刻）の 30 日前（含む）から集計した時刻（含まない）まで。
          枠の開始時刻（`starts_at`）がこの期間に入る枠だけを数える（`window_start` / `window_end`）
        - `published_slots`（公開した枠の数）: そのスポーツの、期間に開始する枠のうち `open` か `booked` のもの。
          コーチが閉じた枠（`closed`）は数えない
        - `booking_students`（予約しようとした生徒の数）: そのスポーツの、期間に開始する枠（`closed` を含む）に
          予約を作った生徒の数。予約の状態（未確定・確定・キャンセル）を問わず、同じ生徒は 1 人と数える。
          スロットの検索は記録していないので数に入らない
        - 判定: `booking_students >= 1` かつ `booking_students >= published_slots × 0.6` なら `insufficient`、
          それ以外は `sufficient`（予約しようとした生徒がいなければ、枠が 0 でも `sufficient`）。
          0.6 は仮の初期値（2026-10-27、合成シードで見て決めた。実データでの見直しが前提。工場の judge が人に回し、builder が委任の範囲で仮置きとした）

        行動イベントは発火しない。
      tags: [scheduling]
      x-context: scheduling
      x-analytics-events: []
      responses:
        "200":
          description: スポーツごとの予約枠の需給
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotSupplyReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /coaches/{coach_id}/review-summary:
    get:
      operationId: getCoachReviewSummary
      summary: コーチの評価の件数と平均（本部・コーチ）
      description: |
        コーチ 1 人が受けたレッスンの評価（student-app の `submitLessonReview`。完了したレッスン 1 件につき 1 回）の件数と、
        点（1〜5）の平均を返す。本部はどのコーチの分も読め、コーチは自分の分だけを読める（他のコーチの分は 403）。
        生徒の役割のトークンは 403。

        数え方と丸めはここが正本（実装は backend の domain `CoachReviewSummary` の 1 か所）。

        - `review_count`: そのコーチへの評価の件数（期間で絞らない。これまでのすべて）
        - `average_rating`: 点の平均を小数第 3 位で四捨五入し、小数第 2 位までにした値。評価が 0 件なら null

        `coach_id` に評価がなければ（コーチでないアカウントや、ない ID を含む）`review_count` は 0、`average_rating` は null。
        `coach_id` が UUID でなければ 404。行動イベントは発火しない。
      tags: [review]
      x-context: review
      x-analytics-events: []
      parameters:
        - name: coach_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: コーチの評価の件数と平均
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachReviewSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /live-lesson-sessions:
    post:
      operationId: startLiveLessonSession
      summary: 通話セッションの開始（コーチ）
      description: |
        確定した予約の通話を始める。student-app の `startLiveLessonSession` と同じ操作で、admin-web ではコーチが呼ぶ。
        通話（Twilio Video）は Gen1 ではモックで、接続情報（`room_token`）もモックが返す。
        呼べるのは予約の参加者（生徒・コーチ）だけで、それ以外のアカウントには予約がないのと同じ 404 を返す（役割では絞らない）。
        確定前・キャンセル済みの予約は 409 `invalid_booking_state`、その予約のセッションがすでにあれば（終了済みを含む）
        409 `invalid_session_state`（同じ予約のセッションは 1 つ）。`booking_id` が UUID でなければ 422。
      tags: [live-lesson]
      x-context: live-lesson
      x-analytics-events: [call.started]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartLiveLessonSessionRequest"
      responses:
        "201":
          description: 開始した通話セッション
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveLessonSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /live-lesson-sessions/{session_id}/end:
    post:
      operationId: endLiveLessonSession
      summary: 通話セッションの終了（コーチ）
      description: |
        student-app の `endLiveLessonSession` と同じ操作で、admin-web ではコーチが呼ぶ。
        接続品質の生の指標はモックがサーバー側で生成し、行動イベント `call.ended` に載せる（このレスポンスには含めない）。
        呼べるのは予約の参加者（生徒・コーチ）だけで、それ以外のアカウントと UUID でない ID には 404。
        終了済みのセッションは 409 `invalid_session_state`。終了後の `room_token` は null。
      tags: [live-lesson]
      x-context: live-lesson
      x-analytics-events: [call.ended]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 終了した通話セッション
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveLessonSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /videos/{video_id}/review:
    post:
      operationId: returnVideoReview
      summary: 添削の返却（コーチ）
      description: |
        生徒が送った動画（student-app の `submitVideo`）に、認証したコーチが添削を返す。コーチの役割のトークンだけが
        呼べる（それ以外は 403）。返せるのは自分に送られた動画だけで、それ以外の動画と UUID でない ID には 404
        （動画があることも知らせない）。返却は動画 1 本につき 1 回で、返却済みなら 409 `invalid_video_state`。
        ゴルフの動画はワンショット決済が確定するまで添削に着手できない（不変条件 2）。Gen1 はワンショットの決済を
        実装しないので、ゴルフの動画には常に 409 `review_payment_not_confirmed`。月額（ゴルフ以外）の動画は常に返せる。
        `comment` が空（空白だけ）か長すぎれば 422。返却すると行動イベント `video_review.returned`（KPI「添削の返却
        リードタイム」の入力。動画の送付の時刻 `submitted_at` も載せる）を発火する。
        生徒は student-app の `getVideoReview` で同じ形の `VideoReview` を読む。
      tags: [async-lesson]
      x-context: async-lesson
      x-analytics-events: [video_review.returned]
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnVideoReviewRequest"
      responses:
        "200":
          description: 返却した添削
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        アカウント ID と役割を載せた不透明なトークン（student-app の `RegisterAccountResponse.access_token` と同じ方式）。
        クライアントは中身を解釈しない。Gen1 は署名なしのモックで、本番では署名付きの方式に差し替える。
        トークンがない・無効なら 401、役割が操作に合わなければ 403。

  responses:
    Unauthorized:
      description: トークンがない、または無効
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 役割が操作に合わない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 対象が存在しない（または、そのアカウントには扱えないので存在を知らせない）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 現在の状態では実行できない（同じコーチの枠と期間が重なる、添削が返却済み、予約が未確定など）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: リクエストの内容が不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Sport:
      type: string
      description: Blueprint のスポーツ 5 種類。コーチはゴルフの枠も公開できる（ゴルフの生徒は golf-app の範囲）。
      enum: [tennis, golf, baseball, soccer, basketball]

    SlotStatus:
      type: string
      description: |
        open: 公開中で未予約（生徒の検索に出る）/ booked: 予約で埋まっている / closed: コーチが閉じた（時間を占めない）。
      enum: [open, booked, closed]

    Slot:
      type: object
      description: glossary の slot（コーチが公開する予約枠）
      required: [slot_id, coach_id, sport, starts_at, ends_at, status]
      properties:
        slot_id:
          type: string
          format: uuid
        coach_id:
          type: string
          format: uuid
        sport:
          $ref: "#/components/schemas/Sport"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/SlotStatus"

    PublishSlotRequest:
      type: object
      required: [sport, starts_at, ends_at]
      properties:
        sport:
          $ref: "#/components/schemas/Sport"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          description: 開始より後（期間は終了を含まない）

    SlotSupplyStatus:
      type: string
      description: |
        sufficient: 公開した枠が足りている / insufficient: 足りていない。判定の式は `getSlotSupply` の説明。
      enum: [sufficient, insufficient]

    SlotSupply:
      type: object
      description: スポーツ 1 つの予約枠の需給（期間と数え方は `getSlotSupply` の説明）
      required: [sport, status, published_slots, booking_students]
      properties:
        sport:
          $ref: "#/components/schemas/Sport"
        status:
          $ref: "#/components/schemas/SlotSupplyStatus"
        published_slots:
          type: integer
          minimum: 0
          description: 期間に開始する、そのスポーツの公開した枠（open / booked）の数
        booking_students:
          type: integer
          minimum: 0
          description: 期間に開始する、そのスポーツの枠に予約を作った生徒の数（予約の状態を問わない。同じ生徒は 1 人）

    SlotSupplyReport:
      type: object
      required: [window_start, window_end, sports]
      properties:
        window_start:
          type: string
          format: date-time
          description: 数えた期間の始まり（含む。集計した時刻の 30 日前）
        window_end:
          type: string
          format: date-time
          description: 数えた期間の終わり（含まない。集計した時刻）
        sports:
          type: array
          description: スポーツ 5 種類すべて（`Sport` の enum の順）
          items:
            $ref: "#/components/schemas/SlotSupply"

    CoachReviewSummary:
      type: object
      description: コーチ 1 人の、glossary の lesson_review（レッスンの評価）の件数と平均（数え方は `getCoachReviewSummary` の説明）
      required: [coach_id, review_count, average_rating]
      properties:
        coach_id:
          type: string
          format: uuid
        review_count:
          type: integer
          minimum: 0
          description: 評価の件数
        average_rating:
          type: [number, "null"]
          minimum: 1
          maximum: 5
          description: 点（1〜5）の平均。小数第 3 位で四捨五入した小数第 2 位まで。評価が 0 件なら null

    LiveLessonSessionStatus:
      type: string
      description: student-app の LiveLessonSessionStatus と同じ値
      enum: [in_progress, ended]

    LiveLessonSession:
      type: object
      description: 同期レッスン（glossary の live_lesson）の通話セッション。student-app の LiveLessonSession と同じ形
      required: [session_id, booking_id, student_id, coach_id, status, started_at]
      properties:
        session_id:
          type: string
          format: uuid
        booking_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        coach_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/LiveLessonSessionStatus"
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
        duration_sec:
          type: [integer, "null"]
          minimum: 0
          description: 終了するまでは null
        room_token:
          type: [string, "null"]
          description: 通話に参加するためのトークン（Twilio Video 相当。Gen1 はモック）。終了後は null

    StartLiveLessonSessionRequest:
      type: object
      required: [booking_id]
      properties:
        booking_id:
          type: string
          format: uuid
          description: 確定した予約

    VideoReviewStatus:
      type: string
      description: "in_progress: コーチがまだ返却していない（未返却） / returned: 返却した"
      enum: [in_progress, returned]

    VideoReview:
      type: object
      description: glossary の video_review（生徒が送った動画をコーチが添削して返すこと）。student-app の VideoReview と同じ形
      required: [video_id, student_id, coach_id, status]
      properties:
        review_id:
          type: [string, "null"]
          format: uuid
          description: 返却されるまでは null
        video_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        coach_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/VideoReviewStatus"
        comment:
          type: [string, "null"]
          description: コーチの添削コメント。返却されるまでは null
        returned_at:
          type: [string, "null"]
          format: date-time

    ReturnVideoReviewRequest:
      type: object
      required: [comment]
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 4000
          description: コーチの添削コメント（空白だけは不可）

    ErrorCode:
      type: string
      description: |
        機械可読のエラー種別。値は追加しうる（クライアントは未知の値を汎用エラーとして扱う）。
      enum:
        - unauthorized
        - forbidden
        - not_found
        - validation_failed
        - slot_overlaps
        - invalid_booking_state
        - invalid_session_state
        - invalid_video_state
        - review_payment_not_confirmed

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: 人間向けの説明（表示用ではない）
