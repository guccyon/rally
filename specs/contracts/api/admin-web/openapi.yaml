openapi: 3.1.0
info:
  title: Rally admin-web API
  version: 0.1.0
  description: |
    admin-web（最小の管理画面）が呼ぶ API。本部とコーチが同じアプリに役割で同居し、画面は役割で出し分ける
    （ADR 0002 Q3）。コーチ側の最小操作（予約枠の登録・添削の返却・通話参加）もここに載せる。
    Gen1 の P1 で実装済みの操作だけを書き、残りは実装する段で足す。通話への参加（`startLiveLessonSession` /
    `endLiveLessonSession`）は student-app と同じ操作・同じ形で、予約の参加者であるコーチが呼ぶ。参加する予約は
    コーチの自分の予約の一覧（`listMyCoachBookings`）から選ぶ。添削を返す動画は、コーチに届いた動画の一覧
    （`listMyCoachVideos`）から選ぶ。公開した枠は、コーチの自分の枠の一覧（`listMyCoachSlots`）で見て、予約の入っていない
    まだ始まっていない枠は取り下げられる（`withdrawMySlot`）。
    生徒と担当コーチのチャット（`listMessageThreads` / `listMessages` / `sendMessage` / `markMessageThreadRead`）も
    student-app と同じ操作・同じ形で、スレッドの当事者であるコーチが呼ぶ。
    コーチへのお知らせ（新しい予約・添削の依頼・生徒からのメッセージのプッシュ通知を残したもの）の一覧と既読
    （`listMyNotifications` / `markMyNotificationsRead`）も student-app と同じ操作・同じ形で、コーチが自分の分を呼ぶ。
    コーチのレッスンメニュー（catalog）は、コーチが自分の分を作り（`createMyLessonMenu`）・直し・非公開にし
    （`updateMyLessonMenu`）・一覧する（`listMyLessonMenus`）。生徒は student-app の `listCoachLessonMenus` で公開中のものを読む。
    本部はすべてのコーチのメニューを横断で読む（`listLessonMenus`）。
    本部は生徒の一覧（スポーツ・受講権の契約種別と契約プラン・最後に予約した時刻・登録した時刻）を読む（`listStudents`）。
    本部は直近 30 日の★2 以下の評価をコーチを問わず横断で読む（`listLowRatedLessonReviews`）。
    コーチは自分が受けた評価 1 件に返信を 1 つだけ付けられ、付け直すと上書きする（`replyToLessonReview`）。返信は
    評価の一覧（`listCoachReviews`・`listLowRatedLessonReviews`）の評価ごとに載る。
    コーチは自分の今月と先月の完了したレッスンの数と評価の件数と平均を読む（`getMyLessonStats`。金額は返さない）。
    本部はすべてのコーチの枠への予約を、開始する日付（日本時間）で絞って読む（`listBookings`。確定待ちのまま残っていないかを見る）。
    本部はコーチの受付（新しい予約を受け付けるか）を止め（`suspendCoach`）・再開する（`resumeCoach`）。受付の状態は
    本部のコーチの一覧（`listCoaches`）の 1 件ごとに載る。停止中のコーチは student-app の `searchSlots`・
    `listCoachesForStudent` に出ず、`createBooking` は 409 `coach_not_accepting_bookings`（入っている予約はそのまま）。
    本部はコーチ 1 人の表示名・受付の状態・評価の件数と平均・今月と先月のレッスンの実績・公開中のレッスンメニューの数を
    1 回で読む（`getCoachOverview`）。

    - 用語・スキーマ名は `specs/glossary.yaml` の id に揃える（slot → Slot など）
    - 各操作の `x-context` は `specs/context-map.yaml` の context id。複数のコンテキストの事実を扱う操作だけ id の配列にする（student-app と同じ規約）
    - 各操作が発火する行動イベントは `x-analytics-events` に `specs/analytics/events.yaml` の name で書く
    - 認証は student-app と同じモックのトークンを `bearerAuth` として置く（不透明なトークン）

    ## 互換ポリシー

    `.factory-config/manifest.yaml` の `compat.api` と一致させる（`specs/contracts/README.md`）。

    - N-2: モバイルアプリは最新から 2 つ前の版まで（N-2）を API が支える（admin-web は Web なので
      配信と同時に最新になるが、同じ API を共有するクライアントのために同じ規則で変更する）。
      リクエスト・レスポンスを壊す変更（必須項目の追加、項目の削除・改名・型変更、enum の値の削除）はしない
    - 90 日: 廃止する操作・項目は `deprecated: true` を付けてから 90 日は残す
servers:
  - url: /
    description: ホストは環境ごとに決める（P1 はローカルの Docker Compose、本番相当の環境は P2）
security:
  - bearerAuth: []
tags:
  - name: scheduling
    description: 予約（スロット）
  - name: live-lesson
    description: 同期レッスン（通話への参加）
  - name: async-lesson
    description: 非同期レッスン（コーチに届いた動画の一覧と、動画添削の返却）
  - name: review
    description: 評価（コーチごとの評価の集計と一覧・本部が見る低い評価の一覧・コーチの評価への返信）
  - name: identity
    description: アカウント（ログイン中の本人のアカウント・本部が見る生徒の一覧）
  - name: profile
    description: プロフィール（コーチの自己紹介文・本部が見るコーチの一覧）
  - name: messaging
    description: メッセージ（生徒と担当コーチのチャット）
  - name: catalog
    description: カタログ（コーチのレッスンメニュー）
  - name: notification
    description: 通知（コーチへのお知らせ）
  - name: entitlement
    description: プラン（受講権。本部が見る生徒の一覧に添える契約種別と契約プラン）

paths:
  /slots:
    post:
      operationId: publishSlot
      summary: スロットの公開（コーチ）
      description: |
        認証したコーチの予約枠を公開する。コーチの役割のトークンだけが呼べる（それ以外は 403）。
        開始は終了より前（違えば 422）。期間は開始を含み終了を含まない。同じコーチの、時間を占める枠
        （`open` / `booked`）と期間が重なれば 409 `slot_overlaps`。定員 `capacity` は 1〜6（範囲外は 422）で、省けば 1
        （マンツーマン）。2 以上はグループレッスンの枠（変更シナリオ cs-004）で、定員まで生徒の予約を受ける。
        任意の `lesson_menu_id` で、枠を自分のレッスンメニュー（`listMyLessonMenus`）に結びつけられる（省けばメニューのない枠で、今までと同じ）。
        結びつけられるのは、自分の・公開中の（`is_published`）・同期レッスン（`live_lesson`）のメニューで、`sport` が枠と同じで、
        `duration_minutes` が枠の長さ（終了 − 開始）と同じもの。満たさないか、メニューがなければ 422 `validation_failed`
        （`message` に理由）で、枠は保存しない。応答の `Slot` には `lesson_menu` を載せない（結びついたメニューの名前と時間は
        `listMyCoachSlots` で見る）。予約（`createBooking`）は枠のメニューを引き継がない。
        公開すると行動イベント `slot.published`（KPI「コーチの予約枠充足率」の入力）を発火する。
      tags: [scheduling]
      x-context: scheduling
      x-analytics-events: [slot.published]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishSlotRequest"
      responses:
        "201":
          description: 公開したスロット
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Slot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /slot-supply:
    get:
      operationId: getSlotSupply
      summary: スポーツごとの予約枠の需給（本部）
      description: |
        スポーツごとに、公開した予約枠が予約しようとした生徒の数に対して足りているか（`sufficient` / `insufficient`）と、
        判定に使った数を返す。コーチの採用計画（どのスポーツのコーチを募集するか）に使う。本部の役割のトークンだけが
        呼べる（それ以外は 403）。スポーツは `Sport` の 6 種類すべてを、`Sport` の enum の順で返す。

        判定の式と期間はここが正本（実装は backend の domain `SlotSupply` の 1 か所）。

        - 期間: 集計した時刻（サーバーの現在時刻）の 30 日前（含む）から集計した時刻（含まない）まで。
          枠の開始時刻（`starts_at`）がこの期間に入る枠だけを数える（`window_start` / `window_end`）
        - `published_slots`（公開した枠の数）: そのスポーツの、期間に開始する枠のうち `open` か `booked` のもの。
          コーチが閉じた枠（`closed`）は数えない
        - `booking_students`（予約しようとした生徒の数）: そのスポーツの、期間に開始する枠（`closed` を含む）に
          予約を作った生徒の数。予約の状態（未確定・確定・キャンセル）を問わず、同じ生徒は 1 人と数える。
          スロットの検索は記録していないので数に入らない
        - 判定: `booking_students >= 1` かつ `booking_students >= published_slots × 0.6` なら `insufficient`、
          それ以外は `sufficient`（予約しようとした生徒がいなければ、枠が 0 でも `sufficient`）。
          0.6 は仮の初期値（2026-10-27、合成シードで見て決めた。実データでの見直しが前提。工場の judge が人に回し、builder が委任の範囲で仮置きとした）

        行動イベントは発火しない。
      tags: [scheduling]
      x-context: scheduling
      x-analytics-events: []
      responses:
        "200":
          description: スポーツごとの予約枠の需給
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotSupplyReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /bookings:
    get:
      operationId: listBookings
      summary: 予約の一覧を日付で見る（本部）
      description: |
        すべてのコーチの枠への予約（glossary の booking。体験予約を含む）のうち、開始する日付（日本時間）が `from` から `to` まで
        （両端を含む）のものを返す。本部が、その日にどの予約が入っていて、確定待ち（`pending`）のまま残っていないかを見るのに使う。
        本部の役割のトークンだけが呼べる（コーチ・生徒は 403）。

        - 期間: `from` の日本時間 0 時（含む）から `to` の翌日の日本時間 0 時（含まない）までに、予約されたスロットが開始する予約。
          `from` を省けば今日（サーバーの現在時刻の日本時間の日付）、`to` を省けば `from` から 7 日目（`from` を含めて 7 日）。
          応答の `from` / `to` は省いたときに決めた日付を含めて、実際に使った期間
        - 期間は 1 日以上 31 日まで（`from` と `to` を含めて数える）。`to` が `from` より前・31 日を超える・`from` / `to` が
          `YYYY-MM-DD` の日付でないときは 422 `validation_failed`（`message` に理由）。`to` だけを付けて今日より前の日付なら
          `from`（今日）より前なので 422
        - 予約の状態（未確定・確定・キャンセル済み）を問わず返す（状態は各予約の `status`）。絞り込み・ページングはしない。
          予約がなければ `bookings` は空の配列（404 にはしない）
        - 並べ方: 予約されたスロットの開始時刻の古い順。同じ開始時刻は予約の作成の新しい順（キャンセルされた枠を取り直した予約が、
          キャンセル済みの予約より上）、それも同じなら `booking_id` の順
        - 各項目には予約（`Booking`。予約した時点のレッスンメニュー `lesson_menu` と体験予約か `is_trial` を含む）と、
          コーチの表示名 `coach_display_name`・予約した生徒の表示名 `student_display_name` を載せる。アカウントが引けないときは
          その表示名を載せない
        - 照会だけで、何も保存しない

        行動イベントは発火しない。
      tags: [scheduling]
      x-context: scheduling
      x-analytics-events: []
      parameters:
        - name: from
          in: query
          required: false
          description: 期間の始まりの日付（日本時間。含む）。省けば今日
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: 期間の終わりの日付（日本時間。含む）。省けば `from` から 7 日目
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 期間に開始する予約の一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeadquartersBookingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /me:
    get:
      operationId: getMyAccount
      summary: ログイン中の本人のアカウント（本部・コーチ）
      description: |
        トークンが示す本人のアカウントの ID・役割・表示名を返す。admin-web がトークンの中身を読まずに、本人のアカウント ID
        （コーチなら自分の評価を出すときの `coach_id`）と役割を知るのに使う。役割では絞らず、有効なトークンなら誰でも呼べる（403 はない）。
        コーチのときだけ、自己紹介文 `bio`（`updateMyCoachProfile` で書いたもの。書いていなければ空文字列）も返す。

        - トークンがない・無効なら 401。トークンが示すアカウントが存在しないときと、アカウントの役割がトークンの役割と
          合わないときも、無効なトークンとして 401
        - 照会だけで、何も保存しない

        行動イベントは発火しない。
      tags: [identity]
      x-context: identity
      x-analytics-events: []
      responses:
        "200":
          description: 本人のアカウント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/profile:
    put:
      operationId: updateMyCoachProfile
      summary: 自分の自己紹介文の変更（コーチ）
      description: |
        トークンが示す本人（コーチ）の自己紹介文を `bio` に置き換え、置き換えたあとの本人のアカウント（`getMyAccount` と
        同じ形。`bio` を含む）を返す。コーチの役割のトークンだけが呼べる（本部・生徒は 403）。

        - `bio` は 0〜400 文字（Unicode のコードポイントで数える）。空文字列で消せる。書いたとおりに保存する（前後の空白も削らない）
        - `bio` がない・文字列でない・400 文字を超えるときは 422 `validation_failed`。そのときは何も変えない
        - トークンがない・無効なら 401。トークンが示すコーチのアカウントが存在しないときも、無効なトークンとして 401

        行動イベントは発火しない。
      tags: [profile]
      x-context: profile
      x-analytics-events: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCoachProfileRequest"
      responses:
        "200":
          description: 自己紹介文を置き換えたあとの本人のアカウント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /coaches:
    get:
      operationId: listCoaches
      summary: コーチの一覧（本部）
      description: |
        コーチの役割のアカウントをすべて、アカウントの ID と表示名と受付の状態 `acceptance_status`（受付中 `accepting` /
        停止中 `suspended`。`suspendCoach`・`resumeCoach`）で返す。受付を止めているコーチも載せる。本部がコーチを選ぶ
        （評価の件数と平均・一覧を見る、受付を止める・再開するなど）のに使う。本部の役割のトークンが呼べる（コーチは 403）。生徒の役割のトークンには、同じパスで
        student-app の `listCoachesForStudent`（スポーツでコーチを探す）の形で返す（student-app の契約）。

        - 並べ方: 表示名の Unicode のコードポイントの順（言語ごとの照合はしない）。同じ表示名は `coach_id` の順
        - 絞り込み・ページングはしない。コーチがいなければ `coaches` は空の配列

        受付の状態は scheduling の持ち物で、1 件ごとに scheduling から読んで添える（`x-context` が 2 つなのはそのため）。
        行動イベントは発火しない。
      tags: [profile]
      x-context: [profile, scheduling]
      x-analytics-events: []
      responses:
        "200":
          description: コーチの一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /coaches/{coach_id}/review-summary:
    get:
      operationId: getCoachReviewSummary
      summary: コーチの評価の件数と平均（本部・コーチ・生徒）
      description: |
        コーチ 1 人が受けたレッスンの評価（student-app の `submitLessonReview`。完了したレッスン 1 件につき 1 回）の件数と、
        点（1〜5）の平均を返す。本部はどのコーチの分も読め、コーチは自分の分だけを読める（他のコーチの分は 403）。
        生徒の役割のトークンもどのコーチの分も読める（コーチを選ぶ手がかり。student-app の同じ操作）。

        数え方と丸めはここが正本（実装は backend の domain `CoachReviewSummary` の 1 か所）。

        - `review_count`: そのコーチへの評価の件数（期間で絞らない。これまでのすべて）
        - `average_rating`: 点の平均を小数第 3 位で四捨五入し、小数第 2 位までにした値。評価が 0 件なら null

        `coach_id` に評価がなければ（コーチでないアカウントや、ない ID を含む）`review_count` は 0、`average_rating` は null。
        `coach_id` が UUID でなければ 404。行動イベントは発火しない。
      tags: [review]
      x-context: review
      x-analytics-events: []
      parameters:
        - name: coach_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: コーチの評価の件数と平均
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachReviewSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /coaches/{coach_id}/reviews:
    get:
      operationId: listCoachReviews
      summary: コーチが受けた評価の一覧（本部・コーチ・生徒）
      description: |
        コーチ 1 人が受けたレッスンの評価（student-app の `submitLessonReview`。完了したレッスン 1 件につき 1 回）の
        点と一言を、送った時刻の新しい順に返す（同じ時刻は `review_id` の順）。期間で絞らず、これまでのすべてを返す
        （ページングはしない）。本部はどのコーチの分も読め、コーチは自分の分だけを読める（他のコーチの分は 403）。
        生徒の役割のトークンもどのコーチの分も読める（コーチを選ぶ手がかり。student-app の同じ操作）。
        各評価には、評価した生徒を特定できる項目（`student_id` など）を載せない。評価した完了したレッスンのレッスンメニュー
        `lesson_menu`（ID・名前。`ReviewLessonMenu`）を載せる。中身はレッスンの元（同期は予約、非同期は動画）が持つ
        メニューの写しで、元にメニューがなければ null。評価されたコーチの返信 `reply`（`LessonReviewReply`。
        `replyToLessonReview`。付け直していれば最後の返信だけ）も載せ、返信がなければ null。

        `coach_id` に評価がなければ（コーチでないアカウントや、ない ID を含む）`reviews` は空の配列。
        `coach_id` が UUID でなければ 404。行動イベントは発火しない。
      tags: [review]
      x-context: review
      x-analytics-events: []
      parameters:
        - name: coach_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: コーチが受けた評価の一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachReviewList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /lesson-reviews/low:
    get:
      operationId: listLowRatedLessonReviews
      summary: 低い評価の一覧（本部）
      description: |
        直近の期間に付いた低い点のレッスンの評価（glossary の lesson_review）を、コーチを問わず横断で返す。本部が
        レッスンの品質の問題に早く気づくための一覧。本部の役割のトークンだけが呼べる（コーチ・生徒は 403）。

        しきい値と期間はここが正本（実装は backend の domain `LowRatedReviewCriteria` の 1 か所）。レスポンスの
        `max_rating` と `period_days` にも同じ値を載せる。

        - 低い評価: 点 `rating` が 2 以下（★2 以下）
        - 期間: 照会した時刻の 30 日前（30 × 24 時間前。含む）から照会した時刻（含む）までに送られた評価（`submitted_at`）。暦日では区切らない
        - 並べ方: 送った時刻 `submitted_at` の新しい順。同じ時刻は `review_id` の順
        - 各評価には、評価されたコーチと評価した生徒の ID と表示名、評価した完了したレッスンのレッスンメニュー
          `lesson_menu`（ID・名前。`ReviewLessonMenu`。レッスンの元（同期は予約、非同期は動画）が持つ写しで、元にメニューがなければ null）を載せる。
          表示名は今のアカウントの表示名で、引けないとき（アカウントがない）は載らない
        - 各評価には、評価されたコーチの返信 `reply`（`LessonReviewReply`。`replyToLessonReview`）も載せる。返信がなければ null
        - 絞り込み・ページング・件数の上限はない。該当する評価がなければ `reviews` は空の配列
        - 照会だけで、何も保存しない（評価の非表示・削除はしない）

        パスパラメータもクエリも受けないので 404・422 はない。行動イベントは発火しない。
      tags: [review]
      x-context: [review, profile]
      x-analytics-events: []
      responses:
        "200":
          description: 低い評価の一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LowRatedLessonReviewList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /lesson-reviews/{review_id}/reply:
    put:
      operationId: replyToLessonReview
      summary: 評価への返信（コーチ）
      description: |
        コーチが自分の受けたレッスンの評価（glossary の lesson_review）1 件に、感謝やフォローの短い返信（glossary の
        lesson_review_reply）を付け、付けたあとの返信を返す。評価 1 件に返信は 1 つで、2 回目からは文と時刻を丸ごと
        置き換える（上書き。前の返信は残さない）。返信の削除はない。点と一言は変えない。

        - コーチの役割のトークンだけが呼べる（本部・生徒は 403）。返信できるのは評価されたコーチ（評価したレッスンの
          コーチ）だけで、他のコーチの評価は 403（評価は `listCoachReviews` で誰でも読めるので、あることは隠さない）
        - 評価がないとき・`review_id` が UUID でないときは 404
        - `comment` は空（空白だけを含む）でなく、200 文字まで。不正な入力では 422 で、何も変えない
        - `replied_at` は返信を付けた（付け直したなら最後に付け直した）時刻

        付けた返信は評価の一覧（`listCoachReviews`・`listLowRatedLessonReviews`、student-app の `listCoachReviews`）の
        評価ごとの `reply` に載る。行動イベントは発火しない。
      tags: [review]
      x-context: review
      x-analytics-events: []
      parameters:
        - name: review_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyToLessonReviewRequest"
      responses:
        "200":
          description: 付けた（置き換えた）あとの返信
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonReviewReply"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /coaches/{coach_id}/suspend:
    post:
      operationId: suspendCoach
      summary: コーチの受付の停止（本部）
      description: |
        コーチ 1 人の受付（glossary の coach_acceptance。新しい予約を受け付けるか）を止め、停止中（`suspended`）にした受付を返す。
        問題のあるコーチや休業中のコーチの新しい予約を止めるのに使う。本部の役割のトークンだけが呼べる（コーチ・生徒は 403）。
        リクエストの本文は読まない。

        - 停止中のコーチの枠は生徒の検索（student-app の `searchSlots`）に出ず、コーチは生徒のコーチを探す一覧
          （student-app の `listCoachesForStudent`）に出ない。そのコーチの枠への予約の作成（student-app の `createBooking`）は
          409 `coach_not_accepting_bookings`
        - 入っている予約（未確定・確定）と枠はそのまま（確定・キャンセル・通話は今までどおり。予約のキャンセルやコーチへの
          通知はしない）。コーチは枠の公開・取り下げも今までどおりできる（公開した枠は再開するまで検索に出ない）
        - `coach_id` がコーチでないアカウント・ないアカウント・UUID でないときは 404 `not_found`
        - すでに停止中のコーチは 409 `coach_already_suspended`（何も変えない）
        - 本部のコーチの一覧（`listCoaches`）の `acceptance_status` が `suspended` になる。一度も止めていないコーチは受付中

        受付の状態は scheduling の持ち物で、matching・profile はそれを読むだけなので境界間イベントは発行しない。
        本部の運営の操作で、KPI の入力でもないので行動イベントも発火しない。
      tags: [scheduling]
      x-context: scheduling
      x-analytics-events: []
      parameters:
        - name: coach_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 停止中にしたコーチの受付
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachAcceptance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /coaches/{coach_id}/resume:
    post:
      operationId: resumeCoach
      summary: コーチの受付の再開（本部）
      description: |
        `suspendCoach` で止めたコーチの受付を再開し、受付中（`accepting`）に戻した受付を返す。本部の役割のトークンだけが
        呼べる（コーチ・生徒は 403）。リクエストの本文は読まない。

        - 再開したコーチの公開中の枠は、また生徒の検索（`searchSlots`）に出て予約できる。コーチを探す一覧
          （`listCoachesForStudent`）にも戻る
        - `coach_id` がコーチでないアカウント・ないアカウント・UUID でないときは 404 `not_found`
        - 停止中でない（受付中の）コーチは 409 `coach_not_suspended`（何も変えない）

        境界間イベント・行動イベントは発火しない（`suspendCoach` と同じ）。
      tags: [scheduling]
      x-context: scheduling
      x-analytics-events: []
      parameters:
        - name: coach_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 受付中に戻したコーチの受付
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachAcceptance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /coaches/{coach_id}/overview:
    get:
      operationId: getCoachOverview
      summary: コーチ 1 人の様子（本部）
      description: |
        コーチ 1 人について、表示名・受付の状態・評価の件数と平均・今月と先月の完了したレッスンの数・公開中のレッスンメニューの
        数を 1 回の照会で返す。本部がコーチの様子をまとめて見るのに使う。本部の役割のトークンだけが呼べる（コーチ・生徒は 403）。
        照会だけで、何も保存しない。

        各項目は持ち主の操作と同じ数え方で、ここでは計算し直さない（実装は backend の既存のユースケースを組み合わせる）。

        - `acceptance_status`: `listCoaches` の 1 件と同じ受付の状態（一度も止めていないコーチは `accepting`）
        - `review_count` / `average_rating`: `getCoachReviewSummary` と同じ（期間で絞らない、これまでのすべての評価。0 件なら
          `average_rating` は null）
        - `current_month` / `previous_month`: `getMyLessonStats` の同じ名前の項目と同じ（日本時間の暦月。月ごとの評価の件数と
          平均も載る）。金額は返さない
        - `published_lesson_menu_count`: 公開中のレッスンメニューの数（student-app の `listCoachLessonMenus` で生徒に見える
          メニューの数。スポーツで絞らず、ゴルフのメニューも数える）
        - `coach_id` がコーチでないアカウント・ないアカウント・UUID でないときは 404 `not_found`

        行動イベントは発火しない。
      tags: [profile]
      x-context: [profile, scheduling, review, live-lesson, async-lesson, catalog]
      x-analytics-events: []
      parameters:
        - name: coach_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: コーチ 1 人の様子
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /coaches/me/bookings:
    get:
      operationId: listMyCoachBookings
      summary: 自分の予約の一覧（コーチ）
      description: |
        トークンが示す本人（コーチ）のスロットに入った予約を、キャンセル済みも含めてすべて返す（状態は各予約の `status`）。
        通話への参加（`startLiveLessonSession`）で予約を選ぶのに使う。コーチの役割のトークンだけが呼べる（本部・生徒は 403）。

        - 並べ方: 予約されたスロットの開始時刻の古い順（これからの予約が上に来るように、日時の早い順）。同じ開始時刻は
          予約の作成の新しい順（キャンセルされた枠を取り直した予約が、キャンセル済みの予約より上）
        - 各項目には予約（`Booking`。student-app の `Booking` と同じ形）と、予約されたスロット（日時・スポーツ・状態）と、
          予約した生徒の表示名 `student_display_name` を載せる。生徒のアカウントが引けないときは `student_display_name` を載せない
        - 各項目の予約には、予約した時点のレッスンメニュー `lesson_menu`（ID・名前・1 回の時間。`BookingLessonMenu`。なければ null）を
          載せる。生徒が予約したときに枠に結びついていた公開中のメニューの写しで、その後にメニューを直しても変わらない
        - 期間で絞らず、ページングもしない。予約がなければ `bookings` は空の配列
        - 照会だけで、何も保存しない

        行動イベントは発火しない。
      tags: [scheduling]
      x-context: scheduling
      x-analytics-events: []
      responses:
        "200":
          description: コーチの予約の一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachBookingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /coaches/me/slots:
    get:
      operationId: listMyCoachSlots
      summary: 自分の枠の一覧（コーチ）
      description: |
        トークンが示す本人（コーチ）が公開した予約枠（`publishSlot`）を、状態（`open` / `booked` / `closed`）を問わず、
        開始時刻が過ぎた枠（終わった枠）も含めてすべて返す。管理画面の「予約枠」に、自分の枠と予約が入っているかを出すのに使う。
        コーチの役割のトークンだけが呼べる（本部・生徒は 403）。

        - 並べ方: 枠の開始時刻 `starts_at` の古い順。同じ開始時刻は `slot_id` の順
        - 各項目には枠（`Slot`）と、その枠に有効な予約（未確定 `pending` か確定 `confirmed`）が入っているか `has_active_booking` を載せる。
          キャンセル済みの予約しかない枠は `false`。予約の中身は自分の予約の一覧（`listMyCoachBookings`）で見る
        - 各項目の枠には、結びついたレッスンメニュー `lesson_menu`（ID・名前・1 回の時間。`SlotLessonMenu`）を必ず載せる。
          メニューのない枠は null。メニューは今の中身で、非公開にしたメニューも載せる
        - 期間で絞らず、ページングもしない。枠がなければ `slots` は空の配列
        - 照会だけで、何も保存しない

        行動イベントは発火しない。
      tags: [scheduling]
      x-context: scheduling
      x-analytics-events: []
      responses:
        "200":
          description: コーチの枠の一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachSlotList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /coaches/me/slots/{slot_id}/withdraw:
    post:
      operationId: withdrawMySlot
      summary: 公開した枠の取り下げ（コーチ）
      description: |
        トークンが示す本人（コーチ）が公開した予約枠（`publishSlot`）を取り下げ、閉じた枠（`status` が `closed`）を返す。
        予定が変わったときや、間違えて公開したときに戻すのに使う。コーチの役割のトークンだけが呼べる（本部・生徒は 403）。
        リクエストの本文は読まない。

        - 取り下げられるのは、自分の・公開中（`open`）の・有効な予約（未確定 `pending` か確定 `confirmed`）が 1 件もない・
          まだ始まっていない（開始時刻 `starts_at` より前の）枠だけ。キャンセル済みの予約しかない枠は取り下げられる
        - 枠がないとき・他のコーチの枠のとき・`slot_id` が UUID でないときは 404 `not_found`（他のコーチの枠はあることも知らせない）
        - 有効な予約が入っている枠（予約済み `booked` の枠も）は 409 `slot_has_active_booking`。予約の入った枠のキャンセルはこの操作ではできない
        - 開始時刻を過ぎた枠（開始時刻ちょうどを含む）は 409 `slot_already_started`
        - すでに閉じた枠（`closed`）は 409 `slot_already_closed`
        - 判定は上の順（他のコーチの枠 → 閉じた枠 → 予約 → 開始）。失敗したときは何も変えない
        - 閉じた枠は生徒の検索（student-app の `searchSlots`）に出ず、予約できない。時間を占めないので、同じ時間に新しい枠を
          公開できる（`publishSlot`）。自分の枠の一覧（`listMyCoachSlots`）には `closed` のまま残る。閉じた枠を公開中に戻す操作はない
        - 応答の `Slot` には `lesson_menu` を載せない（`publishSlot` と同じ）

        取り下げると行動イベント `slot.withdrawn`（KPI「コーチの予約枠充足率」の入力。取り下げた枠を分母から除く）を発火する。
        予約の入っていない枠だけを閉じるので、境界間イベントは発行しない。
      tags: [scheduling]
      x-context: scheduling
      x-analytics-events: [slot.withdrawn]
      parameters:
        - name: slot_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 取り下げた（閉じた）スロット
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Slot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /coaches/me/videos:
    get:
      operationId: listMyCoachVideos
      summary: 自分に届いた動画の一覧（コーチ）
      description: |
        トークンが示す本人（コーチ）に生徒が送った動画（student-app の `submitVideo`）を、添削待ちも返却済みも含めてすべて返す。
        添削の返却（`returnVideoReview`）で動画を選ぶのに使う。コーチの役割のトークンだけが呼べる（本部・生徒は 403）。

        - 並べ方: 添削待ち（`review_status` が `in_progress`）を送られた時刻 `submitted_at` の古い順で先に（待たせている動画が上）、
          その後に返却済み（`returned`）を返却した時刻 `returned_at` の新しい順。同じ時刻は動画 ID の順
        - 各項目には動画の ID と、送った生徒の表示名 `student_display_name` と、送られた時刻と、添削の状態と、返却した時刻を載せる。
          生徒のアカウントが引けないときは `student_display_name` を載せない。添削待ちの動画には `returned_at` を載せない
        - 各項目の `ai_feedback` は、動画の送付の直後に AI（Gen1 はモック）が返した一次フィードバック（文と作った時刻）。
          コーチの添削とは別の項目で、返却で上書きされない。AI が作れなかったときは null
        - 各項目の `lesson_menu` は、生徒が動画を送った時点で選んだ自分の非同期レッスンのレッスンメニュー（ID・名前の写し。
          `VideoLessonMenu`）。メニューの今の中身ではない。メニューを選ばずに送られた動画は null
        - 期間で絞らず、ページングもしない。動画がなければ `videos` は空の配列
        - 照会だけで、何も保存しない

        行動イベントは発火しない。
      tags: [async-lesson]
      x-context: async-lesson
      x-analytics-events: []
      responses:
        "200":
          description: コーチに届いた動画の一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachVideoList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /coaches/me/lesson-stats:
    get:
      operationId: getMyLessonStats
      summary: 自分の今月と先月のレッスンの実績（コーチ）
      description: |
        トークンが示す本人（コーチ）の、今月と先月の完了したレッスン（glossary の lesson_completion）の数を同期レッスン（通話）と
        非同期レッスン（動画添削）に分けて返し、同じ月に受けた評価（glossary の lesson_review）の件数と平均を添える。
        コーチの役割のトークンだけが呼べる（本部・生徒は 403）。金額（支払い額・手数料）は返さない（billing の持ち物）。

        数え方はここが正本（実装は backend の domain `CoachLessonCount`・`CoachReviewSummary` と、暦月を区切る
        `application::entitlement::calendar_month` の 1 か所）。

        - 暦月は日本時間（UTC+9）で区切る。今月は呼んだ時刻を含む暦月、先月はその前の暦月（1 月の先月は前の年の 12 月）
        - `live_lesson_count` / `async_lesson_count`: その月に完了したレッスンの数（完了を記録した時刻の暦月で数える）。
          グループレッスンの通話は、完了したレッスン（結び付いた予約の生徒ごとに 1 つ）の数だけ数える
        - `review_count` / `average_rating`: その月に受けた評価の件数と平均（評価を送った時刻の暦月で数える。評価した
          レッスンが完了した月ではない）。平均の丸めは `getCoachReviewSummary` と同じ（小数第 3 位で四捨五入）。0 件なら null
        - 完了したレッスンも評価もない月は、数がすべて 0 で `average_rating` は null
        - 照会だけで、何も保存しない

        行動イベントは発火しない。
      tags: [live-lesson, async-lesson, review]
      x-context: [live-lesson, async-lesson, review]
      x-analytics-events: []
      responses:
        "200":
          description: コーチの今月と先月のレッスンの実績
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachLessonStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

