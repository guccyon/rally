openapi: 3.1.0
info:
  title: Rally admin-web API
  version: 0.1.0
  description: |
    admin-web（最小の管理画面）が呼ぶ API。本部とコーチが同じアプリに役割で同居し、画面は役割で出し分ける
    （ADR 0002 Q3）。コーチ側の最小操作（予約枠の登録・添削の返却・通話参加）もここに載せる。
    Gen1 の P1 で実装済みの操作だけを書き、残りは実装する段で足す。通話への参加（`startLiveLessonSession` /
    `endLiveLessonSession`）は student-app と同じ操作・同じ形で、予約の参加者であるコーチが呼ぶ。参加する予約は
    コーチの自分の予約の一覧（`listMyCoachBookings`）から選ぶ。
    生徒と担当コーチのチャット（`listMessageThreads` / `listMessages` / `sendMessage` / `markMessageThreadRead`）も
    student-app と同じ操作・同じ形で、スレッドの当事者であるコーチが呼ぶ。

    - 用語・スキーマ名は `specs/glossary.yaml` の id に揃える（slot → Slot など）
    - 各操作の `x-context` は `specs/context-map.yaml` の context id
    - 各操作が発火する行動イベントは `x-analytics-events` に `specs/analytics/events.yaml` の name で書く
    - 認証は student-app と同じモックのトークンを `bearerAuth` として置く（不透明なトークン）

    ## 互換ポリシー

    `.factory-config/manifest.yaml` の `compat.api` と一致させる（`specs/contracts/README.md`）。

    - N-2: モバイルアプリは最新から 2 つ前の版まで（N-2）を API が支える（admin-web は Web なので
      配信と同時に最新になるが、同じ API を共有するクライアントのために同じ規則で変更する）。
      リクエスト・レスポンスを壊す変更（必須項目の追加、項目の削除・改名・型変更、enum の値の削除）はしない
    - 90 日: 廃止する操作・項目は `deprecated: true` を付けてから 90 日は残す
servers:
  - url: /
    description: ホストは環境ごとに決める（P1 はローカルの Docker Compose、本番相当の環境は P2）
security:
  - bearerAuth: []
tags:
  - name: scheduling
    description: 予約（スロット）
  - name: live-lesson
    description: 同期レッスン（通話への参加）
  - name: async-lesson
    description: 非同期レッスン（動画添削の返却）
  - name: review
    description: 評価（コーチごとの評価の集計と一覧）
  - name: identity
    description: アカウント（ログイン中の本人のアカウント・コーチの自己紹介文・本部が見るコーチの一覧）
  - name: messaging
    description: メッセージ（生徒と担当コーチのチャット）

paths:
  /slots:
    post:
      operationId: publishSlot
      summary: スロットの公開（コーチ）
      description: |
        認証したコーチの予約枠を公開する。コーチの役割のトークンだけが呼べる（それ以外は 403）。
        開始は終了より前（違えば 422）。期間は開始を含み終了を含まない。同じコーチの、時間を占める枠
        （`open` / `booked`）と期間が重なれば 409 `slot_overlaps`。Gen1 の枠の定員は 1（マンツーマン）。
        公開すると行動イベント `slot.published`（KPI「コーチの予約枠充足率」の入力）を発火する。
      tags: [scheduling]
      x-context: scheduling
      x-analytics-events: [slot.published]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishSlotRequest"
      responses:
        "201":
          description: 公開したスロット
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Slot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /slot-supply:
    get:
      operationId: getSlotSupply
      summary: スポーツごとの予約枠の需給（本部）
      description: |
        スポーツごとに、公開した予約枠が予約しようとした生徒の数に対して足りているか（`sufficient` / `insufficient`）と、
        判定に使った数を返す。コーチの採用計画（どのスポーツのコーチを募集するか）に使う。本部の役割のトークンだけが
        呼べる（それ以外は 403）。スポーツは `Sport` の 5 種類すべてを、`Sport` の enum の順で返す。

        判定の式と期間はここが正本（実装は backend の domain `SlotSupply` の 1 か所）。

        - 期間: 集計した時刻（サーバーの現在時刻）の 30 日前（含む）から集計した時刻（含まない）まで。
          枠の開始時刻（`starts_at`）がこの期間に入る枠だけを数える（`window_start` / `window_end`）
        - `published_slots`（公開した枠の数）: そのスポーツの、期間に開始する枠のうち `open` か `booked` のもの。
          コーチが閉じた枠（`closed`）は数えない
        - `booking_students`（予約しようとした生徒の数）: そのスポーツの、期間に開始する枠（`closed` を含む）に
          予約を作った生徒の数。予約の状態（未確定・確定・キャンセル）を問わず、同じ生徒は 1 人と数える。
          スロットの検索は記録していないので数に入らない
        - 判定: `booking_students >= 1` かつ `booking_students >= published_slots × 0.6` なら `insufficient`、
          それ以外は `sufficient`（予約しようとした生徒がいなければ、枠が 0 でも `sufficient`）。
          0.6 は仮の初期値（2026-10-27、合成シードで見て決めた。実データでの見直しが前提。工場の judge が人に回し、builder が委任の範囲で仮置きとした）

        行動イベントは発火しない。
      tags: [scheduling]
      x-context: scheduling
      x-analytics-events: []
      responses:
        "200":
          description: スポーツごとの予約枠の需給
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotSupplyReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /me:
    get:
      operationId: getMyAccount
      summary: ログイン中の本人のアカウント（本部・コーチ）
      description: |
        トークンが示す本人のアカウントの ID・役割・表示名を返す。admin-web がトークンの中身を読まずに、本人のアカウント ID
        （コーチなら自分の評価を出すときの `coach_id`）と役割を知るのに使う。役割では絞らず、有効なトークンなら誰でも呼べる（403 はない）。
        コーチのときだけ、自己紹介文 `bio`（`updateMyCoachProfile` で書いたもの。書いていなければ空文字列）も返す。

        - トークンがない・無効なら 401。トークンが示すアカウントが存在しないときと、アカウントの役割がトークンの役割と
          合わないときも、無効なトークンとして 401
        - 照会だけで、何も保存しない

        行動イベントは発火しない。
      tags: [identity]
      x-context: identity
      x-analytics-events: []
      responses:
        "200":
          description: 本人のアカウント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/profile:
    put:
      operationId: updateMyCoachProfile
      summary: 自分の自己紹介文の変更（コーチ）
      description: |
        トークンが示す本人（コーチ）の自己紹介文を `bio` に置き換え、置き換えたあとの本人のアカウント（`getMyAccount` と
        同じ形。`bio` を含む）を返す。コーチの役割のトークンだけが呼べる（本部・生徒は 403）。

        - `bio` は 0〜400 文字（Unicode のコードポイントで数える）。空文字列で消せる。書いたとおりに保存する（前後の空白も削らない）
        - `bio` がない・文字列でない・400 文字を超えるときは 422 `validation_failed`。そのときは何も変えない
        - トークンがない・無効なら 401。トークンが示すコーチのアカウントが存在しないときも、無効なトークンとして 401

        行動イベントは発火しない。
      tags: [identity]
      x-context: identity
      x-analytics-events: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCoachProfileRequest"
      responses:
        "200":
          description: 自己紹介文を置き換えたあとの本人のアカウント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /coaches:
    get:
      operationId: listCoaches
      summary: コーチの一覧（本部）
      description: |
        コーチの役割のアカウントをすべて、アカウントの ID と表示名で返す。本部がコーチを選ぶ（評価の件数と平均・一覧を
        見るなど）のに使う。本部の役割のトークンだけが呼べる（コーチ・生徒は 403）。

        - 並べ方: 表示名の Unicode のコードポイントの順（言語ごとの照合はしない）。同じ表示名は `coach_id` の順
        - 絞り込み・ページングはしない。コーチがいなければ `coaches` は空の配列

        行動イベントは発火しない。
      tags: [identity]
      x-context: identity
      x-analytics-events: []
      responses:
        "200":
          description: コーチの一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /coaches/{coach_id}/review-summary:
    get:
      operationId: getCoachReviewSummary
      summary: コーチの評価の件数と平均（本部・コーチ）
      description: |
        コーチ 1 人が受けたレッスンの評価（student-app の `submitLessonReview`。完了したレッスン 1 件につき 1 回）の件数と、
        点（1〜5）の平均を返す。本部はどのコーチの分も読め、コーチは自分の分だけを読める（他のコーチの分は 403）。
        生徒の役割のトークンは 403。

        数え方と丸めはここが正本（実装は backend の domain `CoachReviewSummary` の 1 か所）。

        - `review_count`: そのコーチへの評価の件数（期間で絞らない。これまでのすべて）
        - `average_rating`: 点の平均を小数第 3 位で四捨五入し、小数第 2 位までにした値。評価が 0 件なら null

        `coach_id` に評価がなければ（コーチでないアカウントや、ない ID を含む）`review_count` は 0、`average_rating` は null。
        `coach_id` が UUID でなければ 404。行動イベントは発火しない。
      tags: [review]
      x-context: review
      x-analytics-events: []
      parameters:
        - name: coach_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: コーチの評価の件数と平均
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachReviewSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /coaches/{coach_id}/reviews:
    get:
      operationId: listCoachReviews
      summary: コーチが受けた評価の一覧（本部・コーチ）
      description: |
        コーチ 1 人が受けたレッスンの評価（student-app の `submitLessonReview`。完了したレッスン 1 件につき 1 回）の
        点と一言を、送った時刻の新しい順に返す（同じ時刻は `review_id` の順）。期間で絞らず、これまでのすべてを返す
        （ページングはしない）。本部はどのコーチの分も読め、コーチは自分の分だけを読める（他のコーチの分は 403）。
        生徒の役割のトークンは 403。

        `coach_id` に評価がなければ（コーチでないアカウントや、ない ID を含む）`reviews` は空の配列。
        `coach_id` が UUID でなければ 404。行動イベントは発火しない。
      tags: [review]
      x-context: review
      x-analytics-events: []
      parameters:
        - name: coach_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: コーチが受けた評価の一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachReviewList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /coaches/me/bookings:
    get:
      operationId: listMyCoachBookings
      summary: 自分の予約の一覧（コーチ）
      description: |
        トークンが示す本人（コーチ）のスロットに入った予約を、キャンセル済みも含めてすべて返す（状態は各予約の `status`）。
        通話への参加（`startLiveLessonSession`）で予約を選ぶのに使う。コーチの役割のトークンだけが呼べる（本部・生徒は 403）。

        - 並べ方: 予約されたスロットの開始時刻の古い順（これからの予約が上に来るように、日時の早い順）。同じ開始時刻は
          予約の作成の新しい順（キャンセルされた枠を取り直した予約が、キャンセル済みの予約より上）
        - 各項目には予約（`Booking`。student-app の `Booking` と同じ形）と、予約されたスロット（日時・スポーツ・状態）と、
          予約した生徒の表示名 `student_display_name` を載せる。生徒のアカウントが引けないときは `student_display_name` を載せない
        - 期間で絞らず、ページングもしない。予約がなければ `bookings` は空の配列
        - 照会だけで、何も保存しない

        行動イベントは発火しない。
      tags: [scheduling]
      x-context: scheduling
      x-analytics-events: []
      responses:
        "200":
          description: コーチの予約の一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachBookingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /live-lesson-sessions:
    post:
      operationId: startLiveLessonSession
      summary: 通話セッションの開始（コーチ）
      description: |
        確定した予約の通話を始める。student-app の `startLiveLessonSession` と同じ操作で、admin-web ではコーチが呼ぶ。
        通話（Twilio Video）は Gen1 ではモックで、接続情報（`room_token`）もモックが返す。
        呼べるのは予約の参加者（生徒・コーチ）だけで、それ以外のアカウントには予約がないのと同じ 404 を返す（役割では絞らない）。
        確定前・キャンセル済みの予約は 409 `invalid_booking_state`、その予約のセッションがすでにあれば（終了済みを含む）
        409 `invalid_session_state`（同じ予約のセッションは 1 つ）。`booking_id` が UUID でなければ 422。
      tags: [live-lesson]
      x-context: live-lesson
      x-analytics-events: [call.started]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartLiveLessonSessionRequest"
      responses:
        "201":
          description: 開始した通話セッション
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveLessonSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /live-lesson-sessions/{session_id}/end:
    post:
      operationId: endLiveLessonSession
      summary: 通話セッションの終了（コーチ）
      description: |
        student-app の `endLiveLessonSession` と同じ操作で、admin-web ではコーチが呼ぶ。
        接続品質の生の指標はモックがサーバー側で生成し、行動イベント `call.ended` に載せる（このレスポンスには含めない）。
        呼べるのは予約の参加者（生徒・コーチ）だけで、それ以外のアカウントと UUID でない ID には 404。
        終了済みのセッションは 409 `invalid_session_state`。終了後の `room_token` は null。
      tags: [live-lesson]
      x-context: live-lesson
      x-analytics-events: [call.ended]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 終了した通話セッション
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveLessonSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /videos/{video_id}/review:
    post:
      operationId: returnVideoReview
      summary: 添削の返却（コーチ）
      description: |
        生徒が送った動画（student-app の `submitVideo`）に、認証したコーチが添削を返す。コーチの役割のトークンだけが
        呼べる（それ以外は 403）。返せるのは自分に送られた動画だけで、それ以外の動画と UUID でない ID には 404
        （動画があることも知らせない）。返却は動画 1 本につき 1 回で、返却済みなら 409 `invalid_video_state`。
        ゴルフの動画はワンショット決済が確定するまで添削に着手できない（不変条件 2）。Gen1 はワンショットの決済を
        実装しないので、ゴルフの動画には常に 409 `review_payment_not_confirmed`。月額（ゴルフ以外）の動画は常に返せる。
        `comment` が空（空白だけ）か長すぎれば 422。返却すると行動イベント `video_review.returned`（KPI「添削の返却
        リードタイム」の入力。動画の送付の時刻 `submitted_at` も載せる）を発火する。
        生徒は student-app の `getVideoReview` で同じ形の `VideoReview` を読む。
      tags: [async-lesson]
      x-context: async-lesson
      x-analytics-events: [video_review.returned]
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnVideoReviewRequest"
      responses:
        "200":
          description: 返却した添削
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /message-threads:
    get:
      operationId: listMessageThreads
      summary: スレッドの一覧
      description: |
        認証したアカウントが当事者（生徒・担当コーチ）のチャットのスレッドを、最後の出来事（最後のメッセージの送信、
        なければスレッドを開いた時刻）の新しい順に返す。同じ時刻はスレッド ID の順。当事者のスレッドがなければ空。
        スレッドは予約が確定したときに、その生徒とコーチの組に 1 つ開く（境界間イベント `BookingConfirmed` を
        messaging が購読する。Gen1 は matching がないので、確定した予約のコーチを担当コーチとみなす）。
        `unread_count` は呼んだアカウントにとっての未読（相手から届いてまだ読んでいない）メッセージの数。
        student-app の `listMessageThreads`（生徒）と同じ操作・同じ形で、admin-web ではコーチが呼ぶ。
      tags: [messaging]
      x-context: messaging
      responses:
        "200":
          description: 当事者のスレッド
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageThreadList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /message-threads/{thread_id}/messages:
    get:
      operationId: listMessages
      summary: メッセージの一覧
      description: |
        スレッドのメッセージを送った順に返す（読むだけで既読にはしない。既読は `markMessageThreadRead`）。
        呼べるのはスレッドの当事者（生徒・担当コーチ）だけで、それ以外のアカウントと UUID でない ID には 404
        （スレッドがあることも知らせない）。
      tags: [messaging]
      x-context: messaging
      parameters:
        - $ref: "#/components/parameters/MessageThreadId"
      responses:
        "200":
          description: スレッドのメッセージ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: sendMessage
      summary: メッセージの送信
      description: |
        スレッドの当事者（生徒・担当コーチ）がメッセージを送る。送ったアカウントはトークンのアカウント。
        生徒が送れるのは、チャットが送り放題の受講権（月額）を持つときだけで、送り放題なので送信の回数は数えない
        （受講権を消費しない）。受講権のない生徒（月額契約の前）は 403 `chat_not_entitled`。コーチの送信は生徒の
        契約に左右されない。当事者でないアカウントと UUID でない ID には 404。`body` が空（空白だけ）か長すぎれば 422。
        送ると行動イベント `message.sent` を発火する。通知（プッシュ）と添付ファイルは扱わない。
      tags: [messaging]
      x-context: messaging
      x-analytics-events: [message.sent]
      parameters:
        - $ref: "#/components/parameters/MessageThreadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: 送ったメッセージ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /message-threads/{thread_id}/read:
    post:
      operationId: markMessageThreadRead
      summary: 既読にする
      description: |
        スレッドの当事者が、相手から届いたメッセージをすべて既読にする（`read_at` はサーバーの現在時刻）。
        自分が送ったメッセージと既読のメッセージは変えない（最初に読んだ時刻のまま。何度呼んでもよい）。
        当事者でないアカウントと UUID でない ID には 404。既読にしたあとのスレッド（`unread_count` は 0）を返す。
      tags: [messaging]
      x-context: messaging
      parameters:
        - $ref: "#/components/parameters/MessageThreadId"
      responses:
        "200":
          description: 既読にしたあとのスレッド
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageThread"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        アカウント ID と役割を載せた不透明なトークン（student-app の `RegisterAccountResponse.access_token` と同じ方式）。
        クライアントは中身を解釈しない。Gen1 は署名なしのモックで、本番では署名付きの方式に差し替える。
        トークンがない・無効なら 401、役割が操作に合わなければ 403。

  parameters:
    MessageThreadId:
      name: thread_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: トークンがない、または無効
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 役割が操作に合わない（チャットの送信では、生徒がチャットの送り放題の受講権を持たない）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 対象が存在しない（または、そのアカウントには扱えないので存在を知らせない）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 現在の状態では実行できない（同じコーチの枠と期間が重なる、添削が返却済み、予約が未確定など）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: リクエストの内容が不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Sport:
      type: string
      description: Blueprint のスポーツ 5 種類。コーチはゴルフの枠も公開できる（ゴルフの生徒は golf-app の範囲）。
      enum: [tennis, golf, baseball, soccer, basketball]

    SlotStatus:
      type: string
      description: |
        open: 公開中で未予約（生徒の検索に出る）/ booked: 予約で埋まっている / closed: コーチが閉じた（時間を占めない）。
      enum: [open, booked, closed]

    Slot:
      type: object
      description: glossary の slot（コーチが公開する予約枠）
      required: [slot_id, coach_id, sport, starts_at, ends_at, status]
      properties:
        slot_id:
          type: string
          format: uuid
        coach_id:
          type: string
          format: uuid
        sport:
          $ref: "#/components/schemas/Sport"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/SlotStatus"

    PublishSlotRequest:
      type: object
      required: [sport, starts_at, ends_at]
      properties:
        sport:
          $ref: "#/components/schemas/Sport"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          description: 開始より後（期間は終了を含まない）

    BookingStatus:
      type: string
      description: "student-app の BookingStatus と同じ値。pending: 未確定 / confirmed: 確定 / cancelled: キャンセル済み"
      enum: [pending, confirmed, cancelled]

    Booking:
      type: object
      description: glossary の booking（生徒によるスロットの確保。体験予約を含む）。student-app の Booking と同じ形
      required: [booking_id, slot_id, student_id, coach_id, is_trial, status, starts_at, created_at]
      properties:
        booking_id:
          type: string
          format: uuid
        slot_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        coach_id:
          type: string
          format: uuid
        is_trial:
          type: boolean
          description: 体験予約なら true
        status:
          $ref: "#/components/schemas/BookingStatus"
        starts_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: [string, "null"]
          format: date-time
        cancelled_at:
          type: [string, "null"]
          format: date-time

    CoachBooking:
      type: object
      description: コーチの自分の予約の一覧の 1 件。予約（glossary の booking）と、予約されたスロット（glossary の slot）と、予約した生徒の表示名
      required: [booking, slot]
      properties:
        booking:
          $ref: "#/components/schemas/Booking"
        slot:
          $ref: "#/components/schemas/Slot"
        student_display_name:
          type: string
          minLength: 1
          maxLength: 50
          description: 予約した生徒のアカウントの表示名。生徒のアカウントが引けないときは載らない

    CoachBookingList:
      type: object
      description: コーチの自分の予約の一覧（並べ方は `listMyCoachBookings` の説明）
      required: [bookings]
      properties:
        bookings:
          type: array
          description: 予約されたスロットの開始時刻の古い順（同じ開始時刻は予約の作成の新しい順）。キャンセル済みも含む
          items:
            $ref: "#/components/schemas/CoachBooking"

    SlotSupplyStatus:
      type: string
      description: |
        sufficient: 公開した枠が足りている / insufficient: 足りていない。判定の式は `getSlotSupply` の説明。
      enum: [sufficient, insufficient]

    SlotSupply:
      type: object
      description: スポーツ 1 つの予約枠の需給（期間と数え方は `getSlotSupply` の説明）
      required: [sport, status, published_slots, booking_students]
      properties:
        sport:
          $ref: "#/components/schemas/Sport"
        status:
          $ref: "#/components/schemas/SlotSupplyStatus"
        published_slots:
          type: integer
          minimum: 0
          description: 期間に開始する、そのスポーツの公開した枠（open / booked）の数
        booking_students:
          type: integer
          minimum: 0
          description: 期間に開始する、そのスポーツの枠に予約を作った生徒の数（予約の状態を問わない。同じ生徒は 1 人）

    SlotSupplyReport:
      type: object
      required: [window_start, window_end, sports]
      properties:
        window_start:
          type: string
          format: date-time
          description: 数えた期間の始まり（含む。集計した時刻の 30 日前）
        window_end:
          type: string
          format: date-time
          description: 数えた期間の終わり（含まない。集計した時刻）
        sports:
          type: array
          description: スポーツ 5 種類すべて（`Sport` の enum の順）
          items:
            $ref: "#/components/schemas/SlotSupply"

    AccountRole:
      type: string
      description: "アカウントの役割。student: 生徒 / coach: コーチ / headquarters: 本部（admin-web の画面を使うのはコーチと本部）"
      enum: [student, coach, headquarters]

    Account:
      type: object
      description: ログイン中の本人のアカウント（`getMyAccount`）。画面の出し分けと、本人の ID を使う操作に要る項目だけを持つ
      required: [account_id, role, display_name]
      properties:
        account_id:
          type: string
          format: uuid
          description: アカウントの ID（コーチなら他の操作の `coach_id` と同じ値）
        role:
          $ref: "#/components/schemas/AccountRole"
        display_name:
          type: string
          minLength: 1
          maxLength: 50
          description: アカウントの表示名
        bio:
          type: string
          maxLength: 400
          description: コーチの自己紹介文（コーチのときだけ載る。書いていなければ空文字列）。本部・生徒には載らない

    UpdateCoachProfileRequest:
      type: object
      description: 自分の自己紹介文の変更（`updateMyCoachProfile`）。今の自己紹介文を丸ごと置き換える
      required: [bio]
      properties:
        bio:
          type: string
          maxLength: 400
          description: 自己紹介文（0〜400 文字。空文字列で消す）

    Coach:
      type: object
      description: glossary の coach（コーチの役割のアカウント）。本部がコーチを選ぶのに要る項目だけを持つ
      required: [coach_id, display_name]
      properties:
        coach_id:
          type: string
          format: uuid
          description: コーチのアカウントの ID（他の操作の `coach_id` と同じ値）
        display_name:
          type: string
          minLength: 1
          maxLength: 50
          description: アカウントの表示名

    CoachList:
      type: object
      description: コーチの一覧（並べ方は `listCoaches` の説明）
      required: [coaches]
      properties:
        coaches:
          type: array
          description: 表示名のコードポイントの順（同じ表示名は `coach_id` の順）
          items:
            $ref: "#/components/schemas/Coach"

    CoachReviewSummary:
      type: object
      description: コーチ 1 人の、glossary の lesson_review（レッスンの評価）の件数と平均（数え方は `getCoachReviewSummary` の説明）
      required: [coach_id, review_count, average_rating]
      properties:
        coach_id:
          type: string
          format: uuid
        review_count:
          type: integer
          minimum: 0
          description: 評価の件数
        average_rating:
          type: [number, "null"]
          minimum: 1
          maximum: 5
          description: 点（1〜5）の平均。小数第 3 位で四捨五入した小数第 2 位まで。評価が 0 件なら null

    CoachReview:
      type: object
      description: |
        コーチが受けた glossary の lesson_review（レッスンの評価）1 件。student-app の `LessonReview` から、
        評価した生徒（`student_id`）と、一覧の `coach_id` と同じ値の `coach_id` を除いた形
      required: [review_id, lesson_id, rating, comment, submitted_at]
      properties:
        review_id:
          type: string
          format: uuid
        lesson_id:
          type: string
          format: uuid
          description: 評価された完了したレッスン
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          description: 一言
        submitted_at:
          type: string
          format: date-time
          description: 評価を送った時刻

    CoachReviewList:
      type: object
      description: コーチ 1 人が受けた評価の一覧（並べ方は `listCoachReviews` の説明）
      required: [coach_id, reviews]
      properties:
        coach_id:
          type: string
          format: uuid
        reviews:
          type: array
          description: 送った時刻の新しい順（同じ時刻は `review_id` の順）
          items:
            $ref: "#/components/schemas/CoachReview"

    LiveLessonSessionStatus:
      type: string
      description: student-app の LiveLessonSessionStatus と同じ値
      enum: [in_progress, ended]

    LiveLessonSession:
      type: object
      description: 同期レッスン（glossary の live_lesson）の通話セッション。student-app の LiveLessonSession と同じ形
      required: [session_id, booking_id, student_id, coach_id, status, started_at]
      properties:
        session_id:
          type: string
          format: uuid
        booking_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        coach_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/LiveLessonSessionStatus"
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
        duration_sec:
          type: [integer, "null"]
          minimum: 0
          description: 終了するまでは null
        room_token:
          type: [string, "null"]
          description: 通話に参加するためのトークン（Twilio Video 相当。Gen1 はモック）。終了後は null

    StartLiveLessonSessionRequest:
      type: object
      required: [booking_id]
      properties:
        booking_id:
          type: string
          format: uuid
          description: 確定した予約

    VideoReviewStatus:
      type: string
      description: "in_progress: コーチがまだ返却していない（未返却） / returned: 返却した"
      enum: [in_progress, returned]

    VideoReview:
      type: object
      description: glossary の video_review（生徒が送った動画をコーチが添削して返すこと）。student-app の VideoReview と同じ形
      required: [video_id, student_id, coach_id, status]
      properties:
        review_id:
          type: [string, "null"]
          format: uuid
          description: 返却されるまでは null
        video_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        coach_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/VideoReviewStatus"
        comment:
          type: [string, "null"]
          description: コーチの添削コメント。返却されるまでは null
        returned_at:
          type: [string, "null"]
          format: date-time

    ReturnVideoReviewRequest:
      type: object
      required: [comment]
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 4000
          description: コーチの添削コメント（空白だけは不可）

    MessageSenderRole:
      type: string
      description: "student: スレッドの生徒が送った / coach: スレッドの担当コーチが送った"
      enum: [student, coach]

    Message:
      type: object
      description: glossary の message（チャットのスレッドの中の 1 通。送信時刻と既読を持つ）。student-app の同名のスキーマと同じ形
      required: [message_id, thread_id, sender_id, sender_role, body, sent_at]
      properties:
        message_id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
          description: 送ったアカウント（スレッドの生徒か担当コーチ）
        sender_role:
          $ref: "#/components/schemas/MessageSenderRole"
        body:
          type: string
        sent_at:
          type: string
          format: date-time
        read_at:
          type: [string, "null"]
          format: date-time
          description: 受け取った側が読んだ時刻（既読）。読むまでは null

    MessageThread:
      type: object
      description: glossary の message_thread（生徒と担当コーチの 1 対 1 のチャットのスレッド。生徒とコーチの組に 1 つ）。student-app の同名のスキーマと同じ形
      required: [thread_id, student_id, coach_id, opened_at, unread_count]
      properties:
        thread_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        coach_id:
          type: string
          format: uuid
        opened_at:
          type: string
          format: date-time
          description: スレッドを開いた時刻（その生徒とコーチの最初の予約が確定した時刻）
        last_message:
          description: 最後のメッセージ。まだなければ null
          oneOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"
        unread_count:
          type: integer
          minimum: 0
          description: 呼んだアカウントにとっての未読（相手から届いてまだ読んでいない）メッセージの数

    MessageThreadList:
      type: object
      required: [threads]
      properties:
        threads:
          type: array
          description: 最後の出来事の新しい順
          items:
            $ref: "#/components/schemas/MessageThread"

    MessageList:
      type: object
      required: [thread_id, messages]
      properties:
        thread_id:
          type: string
          format: uuid
        messages:
          type: array
          description: 送った順
          items:
            $ref: "#/components/schemas/Message"

    SendMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: 本文（空白だけは不可）

    ErrorCode:
      type: string
      description: |
        機械可読のエラー種別。値は追加しうる（クライアントは未知の値を汎用エラーとして扱う）。
      enum:
        - unauthorized
        - forbidden
        - not_found
        - validation_failed
        - slot_overlaps
        - invalid_booking_state
        - invalid_session_state
        - invalid_video_state
        - review_payment_not_confirmed
        - chat_not_entitled

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: 人間向けの説明（表示用ではない）
