# Rally 工場の manifest（憲法レベルの設定）
# この工場が「どこまで自分でやってよいか」「いくら使ってよいか」を機械可読で持つ。
# 正本の Blueprint: ~/work/自律型ソフトウェア事業部/10_blueprint-rally.yaml（autonomy / budgets / compat_policy）
# このファイルの変更は常に builder（オーナー）の承認が要る（change_type: constitution）。
#
# 由来: アカウントスキル pr-merge-criteria（2026-10-21 版）の基準を「環境 × 変更種別」の表に変換した初版。
#       2026-10-26 に オーナー とマージ基準を確定: CI が通れば承認なしでマージ。承認が要るのは「外部入力がシェル実行や
#       エージェントのプロンプトにつながる経路を作る・変える変更」と「憲法の変更」。運用開始後は「公開・デプロイ」と「戻しにくい変更」も。
#       2026-10-27 戦略会議 D4: 運用開始は「プロダクトを利用者に出した時点」と定義し直した（工場の置き場所とは切り離す）。
#       この表は人間（builder）と工場の両方のマージ権限。工場の実行権限（pr_create まで）は phase_grants が別に縛る。

schema_version: "0.1"
status: draft                          # オーナー の署名で approved にする
engine:
  repo: guccyon/factory-engine
  version: null                        # P0 は base を手で置く。版付き配布は P0a 以降

phase: P0

# ---------------------------------------------------------------------
# autonomy: 環境（操作）× 変更種別
# 値: auto | shadow（判定して記録するが実行しない）| human_approve | forbidden
# ---------------------------------------------------------------------
autonomy:
  actions: [pr_create, merge, deploy_test, deploy_prod]

  # 変更種別。PR 成果物の change_types に入る。1 つの PR が複数に当たるときは最も厳しい値を使う
  change_types:
    docs_only:
      ja: "文書だけの変更"
      match: "docs・README・CHANGELOG・エージェント向けルール（CLAUDE.md 等）だけを変え、コード・設定・テストを変えない。後追いの文書も含む"
      source: "pr-merge-criteria「承認なしでよい（確定）: 文書だけの変更」"
    design_decision:
      ja: "設計の相談・アーキテクチャを決める変更"
      match: "設計・アーキテクチャの判断を含む（ADR、契約・スキーマの方針、文書だけでも設計を決める・変える内容）"
      source: "pr-merge-criteria「必ず承認が要る」"
      approval_via: "chat_summary"      # 要点（何を決めたか・なぜか・選ばなかった案）をチャットに数行。PR 画面での確認は求めない
    large_integration:
      ja: "大規模な開発をまとめて main に入れる"
      match: "複数の PR・コミットを積んだ統合ブランチから既定ブランチへのマージ"
      source: "pr-merge-criteria「必ず承認が要る」（判断の記録 2026-10-20）"
      approval_via: "local_verification" # builder が手元で動作確認してから
    dependency_update:
      ja: "依存パッケージの更新"
      match: "dependabot 等による依存の更新。破壊的変更の確認・最新 main での検証・CI 成功の 3 点が前提（rubric SAFE-002）"
      source: "自動メモリ merge-policy（2026-10-24）。pr-merge-criteria には未反映"
    code_change:
      ja: "通常のコード変更"
      match: "上記以外のコード・テスト・文書を含む変更（三位一体、rubric PR-001）"
      source: "pr-merge-criteria「それ以外の PR は…決まりがなければ承認を待つ」"
    factory_rule:
      ja: "工場のルール変更"
      match: ".factory-config/overlay/ と evals/ の変更（ルールの追加・昇格・廃止）"
      source: "憲章 05 節。ルール変更 PR は工場自身のパイプラインを通る"
    constitution:
      ja: "憲法の変更"
      match: "この manifest.yaml（autonomy・承認ゲート）、base/ の差し替え、Blueprint の autonomy・budgets、Engine の知財・利用許諾に関わる記述"
      source: "憲章 08 節「憲法の管理」は builder の署名。2026-10-26 マージ基準"
    untrusted_input_path:
      ja: "外部入力がシェル実行やエージェントのプロンプトにつながる経路を作る・変える変更"
      match: "Issue 本文・Webhook・PR コメント・利用者入力などの外部入力が、シェルのコマンド・環境変数・エージェントのプロンプトに流れ込む箇所の追加・変更（例: ワーカーのプロンプト組み立て、Webhook 受け口、ワーカーに渡す引数）"
      source: "2026-10-26 オーナー「サーバーで動かす以上、プロンプトインジェクションや任意コード実行のリスクがある変更はチェックしたい」"
      approval_via: "chat_summary"
    irreversible:
      ja: "戻しにくい変更"
      match: "破壊的スキーマ、データ移行、外部サービスの設定変更など、巻き戻しが難しいもの"
      source: "2026-10-26 オーナー。開発中は回してよく、運用開始（利用者に出した時点。D4）で承認制へ"

  # 開発中（P0〜運用開始前）の表。merge の値は builder（人間の手元の Claude）が PR をマージするときの権限。
  # 工場（ヘッドレスワーカー）の merge は phase_grants の P0（human_approve）が優先し、P0b 完了まで shadow 判定の記録だけ行う。
  matrix:
    docs_only:            { pr_create: auto, merge: auto,          deploy_test: forbidden, deploy_prod: forbidden }
    design_decision:      { pr_create: auto, merge: auto,          deploy_test: forbidden, deploy_prod: forbidden, note: "事後報告（要点をチャットに）" }
    large_integration:    { pr_create: auto, merge: auto,          deploy_test: forbidden, deploy_prod: forbidden, note: "事後報告" }
    dependency_update:    { pr_create: auto, merge: auto,          deploy_test: forbidden, deploy_prod: forbidden }
    code_change:          { pr_create: auto, merge: auto,          deploy_test: forbidden, deploy_prod: forbidden }
    irreversible:         { pr_create: auto, merge: auto,          deploy_test: forbidden, deploy_prod: forbidden, note: "運用開始時に human_approve へ" }
    untrusted_input_path: { pr_create: auto, merge: human_approve, deploy_test: forbidden, deploy_prod: forbidden }
    factory_rule:         { pr_create: shadow, merge: forbidden,   deploy_test: forbidden, deploy_prod: forbidden }   # P0 は自己進化を動かさない
    constitution:         { pr_create: human_approve, merge: human_approve, deploy_test: forbidden, deploy_prod: forbidden }
  # 運用開始 ＝ プロダクトを利用者（合成でない人）に出した時点（2026-10-27 戦略会議 D4）。
  # 工場をサーバー（EC2 など）に移しただけでは発動しない。切り替えは builder が宣言し、この表の変更と同じく承認付き PR で行う
  on_operation_start:
    irreversible: { merge: human_approve }
    always_human_approve: { note: "always_human_approve の各項目は運用開始から効く（開発中は承認不要。2026-10-27 オーナー）" }
    release: { deploy_test: human_approve, deploy_prod: human_approve, note: "公開・デプロイは改めて承認制" }

  # 次の Phase への解放（Blueprint autonomy.phase_grants と同じ。実績で次へ進む）
  phase_grants:
    P0:  { pr_create: auto, merge: human_approve, deploy_test: forbidden, deploy_prod: forbidden }
    P1:  { pr_create: auto, merge: shadow,        deploy_test: auto,      deploy_prod: forbidden }
    P2:  { pr_create: auto, merge: auto,          deploy_test: auto,      deploy_prod: canary_human_approve }
    P3+: { pr_create: auto, merge: auto,          deploy_test: auto,      deploy_prod: auto_with_rollback }
  release_conditions:
    merge_auto: "工場（ヘッドレス）の自動マージは P0b 完了（直近 20 PR の結果紐付け・健康レポート 4 週・Golden Set 30 件）かつ shadow 判定と人間判断の一致の実績。builder の手元のマージは上の matrix のとおり開発中は auto"
    first_candidates: [docs_only, dependency_update]   # 人間の手元ではすでに自動マージしている種別から解放する

  # 運用開始後は環境・Phase を問わず常に人間承認（変更種別より優先）。
  # 2026-10-27 オーナー「アプリ側は一旦承認なしでいい」: 開発中（運用開始前）は rally の PR はすべて承認なしでマージする。各項目は from: operation_start
  always_human_approve:
    - { id: identity,           ja: "認証・権限の変更", from: operation_start, note: "2026-10-27 オーナー: 開発中（運用開始前）は承認不要。運用開始で承認制に戻る" }
    - { id: payment_logic,      ja: "決済・支払い（billing / entitlement の金額に触れる変更）", from: operation_start }
    - { id: destructive_schema, ja: "破壊的スキーマ変更（列・テーブルの削除、型の縮小）", from: operation_start }
    - { id: secrets_iam,        ja: "秘密情報・権限設定（IAM、シークレット、CI の権限、ruleset）", from: operation_start }
    - { id: store_submit,       ja: "ストア審査への提出", from: operation_start }
    - { id: infra_cost,         ja: "インフラ月額コストの増分 > 30,000 円", from: operation_start }
    - { id: external_write,     ja: "実機・本番・外部サービスへの破壊的な書き込み", source: "手元の運用ルール（外部への書き込みは同意を得てから。rubric SAFE-001）", from: operation_start }

  rollback:
    operator_one_click: true
    target_seconds: 60
    operations: [image_switchback, flag_kill, ota_halt]

  unanswered_default: hold             # 承認が得られないときは進めない
  notify_on_auto: true                 # auto で実行したものは結果を知らせる（pr-merge-criteria の手順 2）

# ---------------------------------------------------------------------
budgets:
  tokens_per_ticket: 2_000_000
  tokens_per_month: 300_000_000
  cloud_jpy_month: 30000
  model_tiers: { cheap: tier-small, strong: tier-large, judge: tier-judge }
  concurrency: { llm_max_parallel: 4 }

compat:
  api: { min_supported_mobile_version: "N-2", deprecation_period_days: 90 }
