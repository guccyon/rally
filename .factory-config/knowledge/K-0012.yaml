id: K-0012
theme: 6
kind: causal
statement: >-
  採用した PR 本文の指摘を直す body_fix（本文だけの直し）が終わる前に supervisor が承認（inspector_approved）を出し、
  直した本文の再検査をマージの条件に入れないと、PR は直していない本文か、直したが再検査していない本文のままマージされうる。
  直しが漏れたり失敗したりしていても、マージの前に止める段がない（根拠の 2 件では、直し漏れが残った記録はまだない）。
scope:
  work: [dev.describe, dev.review.inspect]
  artifacts: [PR.body]
  roles: [supervisor, body_fix]
acts_on: engine
confidence: hypothesis
evidence:
  - case: C-0006
  - pr: 821
  - event: "case.analyzed:370935"
  - case: C-0005
  - pr: 659
  - event: "case.analyzed:274379"
status: active
verified_at: 2026-11-07
review_by: 2026-12-07
confidentiality: product
related: [K-0004, K-0006]
invalidate_when:
  - "supervisor.merged が、採用した PR 本文の指摘を直す body_fix の終わりと、直した本文の再検査（少なくとも見出しの機械的な確認）を待つようになった"
  - "本文だけの直し（pr.body_amended）もマージ前の必須チェックで確かめられるようになった"
enforcement:
  level: deterministic
  solutions:
    - kind: test
      what: >-
        議決 D-0033（Issue #1053 の起票時の番号は D-0032。PR #1051）の test の案を入れた。tools/pr-body-check/recheck.mjs が、古い順の制御プレーンのイベント列で、
        同じ PR の supervisor.merged より前に pr.body_amended があり、そのあと本文の検査（gate.evaluated。gate は問わず、検査役の rubric も
        gate: "pr-body-check" で記録した決定論の検査も数える）がないまま来たら merged_without_body_recheck、積んだ本文の直し（job.enqueued の kind が body_fix）が
        終わる（pr.body_amended か pr.body_amend_failed。job_id で結ぶ）前に来たら merged_before_body_fix_finished で落とす。
        直しが失敗で終わり（pr.body_amend_failed）、そのあと直しが成功しないまま来たら merged_after_body_fix_failed で落とす（人の判断で足した。終了コード 1。読めなければ 2）。
        recheck.test.mjs で、C-0006（PR #821）の記録の順（inspector_approved 14:25:02、body_amended 14:25:04、merged 14:25:06）を組み直した列が
        merged_without_body_recheck で、C-0005（PR #659）の記録の順（body_fix の job 3308 を積み、merged 20:08:43 のあと body_amended 20:08:50）を組み直した列が
        merged_before_body_fix_finished で落ち、直しの終わりと再検査を待ってからマージした列は通ることを確かめた。C-0005 はマージが直しの終わりより前なので、
        案の「pr.body_amended のあと」の線だけでは引っかからず、直しの終わりを待たないマージも外れにした。それぞれの線を外す書き換えでテストが落ちることも確かめた。
        列は事例の記録に書かれた時刻・job・順をイベントの形にしたもので、本物のイベント列では走らせていない。recheck.mjs は CI からも Engine の
        supervisor からも呼んでおらず、recheck.test.mjs を走らせる CI もまだないので、配線されておらず効き目は確かめていない
      issue: 1053
      at: 2026-11-08
      decided_by: committee:D-0033
      wired: false
      verified: false
    - kind: ci_check
      what: >-
        議決 D-0050 の ci_check の案（D-0033 の ci_check の案と同じ線）を入れた。別の検査は作らず、K-0006 の #906 と同じ tools/pr-body-check/check.mjs を
        1 つのマージ前の必須チェックにまとめた。ひな形 tools/pr-body-check/ci/pr-body-check.yml（ジョブとチェックの名前 pr-body-check）は pull_request の
        opened・synchronize・reopened に加えて edited でも走り、head_sha の変わらない本文だけの直し（pr.body_amended）のあとの本文も照らす。
        必須のチェックだけでは、直しのジョブが終わってから edited のチェックが始まるまでの間に前の本文で通ったチェックのままマージでき、Engine の今の
        body_fix_pending は検査役の承認の中で直しの順番待ちと作業中しか見ないので、Engine の supervisor に入れる差分 tools/pr-body-check/engine/pr-body-recheck.patch を足した。
        merge_step がマージの前に body_fix_pending と body_recheck_pending を待ち、body_recheck_pending は最後の body_fix のジョブが成功で終わっていれば、
        そのジョブが走り始めたより後に始まった pr-body-check が success で終わるまで待って supervisor.body_rechecked を残し、失敗か取り消しで終わっていれば
        停止（body_recheck:<PR の URL>、human）を開いて待つ。直しの終わりは pr.body_amended ではなくジョブの状態で見る。recheck.mjs は supervisor.body_rechecked も再検査に数える。
        engine.test.mjs の (11) で、Engine（/work/engine の 57069a8）の写しに差分を当て、C-0006（PR #821）の記録の順（body_fix の job 4299 を 14:24:41 に積み、
        マージ 14:25:06）を入力に、直しが走っている間・直しのあとに pr-body-check が走っていない・実行中・落ちた間は待ち、通ったら supervisor.body_rechecked を残して
        その列が recheck.mjs に通ること、直しの失敗では人に回すこと、直しのない PR とワークフローを持たない製品では待たないことを確かめた。
        merge_step の待ちを外す・直しのあとに始まったかを見ない・失敗を通す書き換えで (11) が落ちることも確かめた。ci.test.mjs でひな形の形
        （edited を含む types、絞り込み・if:・continue-on-error がない、本文を env で渡す、名前が Engine の待つものと合う）を見張る。
        GitHub の実行は時刻と結果を真似たもので、本物のイベント列や本物の PR では走らせていない。ワークフローの写し（.github/workflows/pr-body-check.yml）と
        必須のチェック、Engine への差分の取り込みは建設者の権限なのでまだ入っておらず、配線されておらず効き目は確かめていない
      issue: 1122
      at: 2026-11-08
      decided_by: committee:D-0050
      wired: false
      verified: false
decided_by: committee:D-0033
