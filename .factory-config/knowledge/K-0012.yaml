        この知見の issue 1122・1196 の解決策と K-0006 の issue 906 の解決策を挙げ、.github/workflows/pr-body-check.yml の pull_request でも走るジョブから
        tools/pr-body-check/check.mjs を呼ぶ項目がないと wired: true にできないようにした（3 つとも同じ写しの同じジョブで揃う）。この知見の 2 つは、
        新しく足した REQUIRED_PR_ALSO で .github/workflows/pr-body-engine.yml の pull_request でも走るジョブから tools/pr-body-check/engine.test.mjs
        （(12) が merge_step の待ちを確かめる）を呼ぶ項目も求め、REQUIRED_ENGINE_WAIT で、その写しの ENGINE_REF の版の Engine の
        orchestrator/dispatcher/supervisor.py で merge_step が body_recheck_pending を呼んでいることを構文木で照らし、呼んでいなければ engine_unwired、
        Engine のチェックアウト・写し・版がなく照らせなければ engine_unverifiable で落とす（ワークフローの写しだけで wired にし、Engine が待たないままの
        状態を止める）。Engine の merge_step は wired_by の形（workflow・job・runs）では書けないので、wired_by には 2 つのジョブを書き、Engine の道は
        この照合で確かめる。test_check.py の PrBodyRecheckWiringTest が、2 つのひな形をそのまま写したジョブと待つ Engine で通り、pr-body-check の項目がない・
        別の名前のワークフロー・pull_request を外した写し・check.mjs を呼ばない写し・engine-test の項目がない・merge_step が待たない Engine
        （関数がない・呼ばない・別の関数でだけ呼ぶ）・照らせない Engine で落ちることと、手元の Engine（9f8f6b4）の supervisor.py が差分を当てる前は待たず、
        当てると待つと読めることを確かめた。差分はその Engine の先頭に当たる。写すこと・必須のチェックに登録すること・差分を Engine に入れて ENGINE_REF を
        上げること・wired を true にして wired_by を書くことは建設者が行うので（tools/pr-body-check/README.md の「マージ前の必須チェック（建設者）」）、
        まだ配線されておらず効き目は確かめていない
