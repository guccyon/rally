      what: >-
        議決 D-0050（Issue #1131 の起票時の番号は D-0048。PR #1128）の 1 つ目の ci_check の案を入れた。recheck.test.mjs に事例 C-0003（PR #396）の列を足した。
        2 回目の検査（job 570、14:21:30）のあと最後の本文の直し（job 572）を積んで終わり、head_sha が変わらないまま検査をもう一度通さずに
        14:23:30 にマージした列が merged_without_body_recheck で落ち、job 572 の直しがなければ（1 回目の直しの job 563 は job 570 で再検査済み）通り、
        job 572 のあとに再検査すれば通ることを確かめた。job 572 の積みと終わり・承認の時刻は記録にないので、記録の順を崩さない範囲で置いた。
        recheck.test.mjs は、CI のひな形 tools/pr-body-check/ci/pr-body-engine.yml の engine-test（tools/pr-body-check で道を渡さずに走らせる node --test）で
        走るテストに入っていて、ひな形の側の絞り込み（道・名前・NODE_OPTIONS）は既存の ci.test.mjs が見張る。ファイルの側で外す直し（skip・todo・only、
        C-0003・C-0005・C-0006 の列のテストを消す）も ci.test.mjs で落とすようにした。ワーカーは .github/workflows/ を変えられないので、ひな形はまだ
        .github/workflows/pr-body-engine.yml に写されておらず、PR ごとには走っていない。建設者が写して engine-test を必須のチェックにしたら、
        wired: true にして wired_by に {workflow: .github/workflows/pr-body-engine.yml, job: engine-test, runs: tools/pr-body-check/recheck.test.mjs} を書く。
        テストの列は事例の記録から組み直したもので、本物のイベント列では確かめていない
