id: K-0006
theme: 6
kind: causal
statement: >-
  差し戻しの直しで PR 本文を末尾への追記だけで直し、テンプレートの順に本文全体を組み直す持ち主がいないと、
  見出しの順と階層が崩れて新しい差し戻しを生む。同じ本文を複数のジョブ（body_fix と続きの implement）が並列に書き換えると、
  この崩れは重くなる（並列は主な原因ではなく、悪化させる条件）。主張は持ち主がいないことに絞る。続きのジョブの報告の見出しの階層が
  下がらないことは K-0001、採用済みの指摘と本文の決まりが続きのジョブの入力に渡らないことは K-0009 の主張。
scope:
  work: [dev.describe]
  artifacts: [PR.body]
  request_form: [ticket]
  roles: [judge, body_fix, implement]
acts_on: context
confidence: confirmed
evidence:
  - case: C-0003
  - pr: "396"
  - event: "case.analyzed:40381"
  - case: C-0005
  - pr: 659
  - event: "case.analyzed:274379"
status: active
verified_at: 2026-11-08
review_by: 2027-02-06
confidentiality: product
related: [K-0001, K-0005, K-0009, K-0012]
decided_by: committee:D-0006
enforcement:
  level: deterministic
  solutions:
    - kind: ci_check
      what: >-
        PR 本文の ## 見出しを 1 つの定義（tools/pr-body-check/template.json。CLAUDE.md の PR の説明の見出しに仮決めを足した順）と照らし、
        必須の見出し（概要・対応内容）の欠け、定義の順の違い、同じ ## 見出しの重複、定義の外の見出し（工場の記録・続きのジョブの報告など）が
        定義の見出しの最後より前にあることを見る決定論の検査（K-0001 向けの tools/pr-body-check/check.mjs を広げた）。
        pull_request の edited や pr.body_amended でも起動させて、head_sha の変わらない本文だけの直しもマージ前の必須チェックにする想定。
        ワークフローと必須チェックの配線は建設者の権限なのでまだ入っておらず、効き目はまだ確かめていない。
        Issue #906 は起票したときの番号で「K-0004 を ci_check で決定論にする」（議決 D-0004、PR #570）として開かれたが、案は議決 D-0006（PR #570）の
        K-0006 の ci_check の案で、記録したときの番号ではこの知見（K-0006）と議決 D-0006 にあたる（PR #930 でマージ。K-0004 の担保ではない）。
        本文だけの直しをマージ前の必須チェックにする部分は K-0012 の invalidate_when の 2 つ目と同じ担保なので、K-0012 の enforcement.solutions にも
        issue 906 の項目を置いた。片方を直すときは両方を直す
      issue: 906
      at: 2026-11-05
      decided_by: committee:D-0006
