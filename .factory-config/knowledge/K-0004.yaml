id: K-0004
theme: 6
kind: causal
statement: supervisor が差し戻し（sendback）を「直っていない採用欠陥（defect が null でなく、verdict が adopt）があるか」ではなく adopt の件数で起こすと、直すもののない差し戻しが記録される。
scope:
  roles: [supervisor]
confidence: hypothesis
evidence:
  - case: C-0002
  - pr: 395
  - event: "case.analyzed:40376"
status: active
verified_at: 2026-11-01
review_by: 2026-12-01
confidentiality: product
related: [K-0003]
enforcement:
  level: deterministic
  solutions:
    - kind: test
      what: >-
        差し戻しか続きのジョブを起こすのは、直っていない採用欠陥（defect が null でなく verdict が adopt）か、
        まだ入っていない仮決めの差し替えが 1 件以上あるときだけ、という判定の線をテストにした（tools/sendback-check/check.test.mjs）。
        PR #395 と同じ入力（仮決めの adopt 3 件、欠陥の reject 2 件、マージ済み）では起こさないこと、
        直っていない採用欠陥があればマージの前後に関わらず起こすこと、
        inspector_approved の basis に欠陥の採用数と仮決めの承認数を分けて書くことを確かめる。
        PR の記録を照らす検査（tools/sendback-check/check.mjs）も付けた。Engine の basis は今も adopt の合計だけを書くので外れる。
        Engine の判定と basis の文をこの線に合わせることと呼び出しの配線はまだ入っていないので、効き目はまだ確かめていない
      issue: 902
      at: 2026-11-05
      decided_by: committee:D-0004
    - kind: ci_check
      what: >-
        tools/sendback-check/check.mjs に、制御プレーンのイベント列（supervisor.judge_enqueued で head を区切り、judgment.judged と
        Judgment、sendback.filed、continue.enqueued、body_fix の job.enqueued、supervisor.inspector_approved）から PR と head ごとの記録を組む
        入口（--events・--pr）と、GitHub Actions の ::error と要約（--summary）を足し、PR ごと（か supervisor が差し戻し・続きのジョブを起こしたとき）に走らせて
        落とす検査にした。直っていない採用欠陥も差し替えもないのに差し戻しか続きのジョブが起きた head（PR #395 の記録の流れ）と、
        basis が adopt の合計だけの承認で外れる。.github/workflows/ の配線と制御プレーンからイベントを出す経路は建設者が足すので、効き目はまだ確かめていない
      issue: 934
      at: 2026-11-05
      decided_by: committee:D-0009
    - kind: test
      what: >-
        tools/sendback-check/engine.test.mjs に、check.test.mjs と同じ 3 つの場合を Engine の本物の判定で確かめるテストを置いた。
        engine_harness.py が Engine のチェックアウトから judgment.record_judged・dispatcher.act_on_judgment（と file_sendback・enqueue_body_fix・is_body_only）・
        supervisor.inspector_approved を中身を変えずに取り出し、DB と GitHub を差し替えて動かして、起きた後続と basis を check.mjs の線に照らす。
        PR #395 と同じ入力では起こさないこと、直っていない採用欠陥があればマージの前（review_fix）でも後（sendback）でも起こすことは今の Engine で通り、
        Engine が adopt の件数で起こすように変わると落ちる。basis を分けて書く場合は今の Engine では外れる（採用 N の合計だけ）ので todo にしてあり、
        Engine の basis の文を直すのと、CI で Engine を固定の版で取って ENGINE_DIR を向ける配線は建設者が入れる。それまで basis の担保は効いていない
      issue: 935
      at: 2026-11-05
      decided_by: committee:D-0009
    - kind: test
      what: >-
        議決 D-0010 の test の案（Engine の supervisor の判定と inspector_approved の basis に、check.test.mjs と同じ 3 つの場合のテストを置き、
        ci_check の配線より先に入れる）は、Issue #935 で置いた tools/sendback-check/engine.test.mjs と engine_harness.py で満たすので、新しいテストは作らず
        その担保として記録した。今の Engine で走らせ、PR #395 と同じ入力では起こさないこと、直っていない採用欠陥があればマージの前（review_fix）でも
        後（sendback）でも起こすことは通り、basis を分けて書く場合は外れる（採用 N の合計だけ）ので todo のままにした。todo のうちに check.mjs の
        ci_check を配線するとすべての承認が basis_not_split で落ちるので、Engine の basis を直して todo を外し、engine.test.mjs を CI に配線してから
        ci_check を配線する順序を engine.test.mjs と README に書いた。CI の配線はまだなので効き目は確かめていない
      issue: 944
      at: 2026-11-05
      decided_by: committee:D-0010
    - kind: ci_check
      what: >-
        tools/sendback-check/engine.test.mjs を、ENGINE_DIR を渡したときと CI（CI=true）では Engine のチェックアウトがなくても飛ばさずに落とすようにし、
        engine_harness.py に --check（record_judged・act_on_judgment・file_sendback・enqueue_body_fix・is_body_only・inspector_approved を
        すべて取り出せるかだけを見る）を足して、取り出せなければ落ちる (0) のテストにした。Engine を固定の版（ENGINE_REF のコミット）でチェックアウトして
        ENGINE_DIR を向け、engine.test.mjs を PR ごとに走らせるワークフローを tools/sendback-check/ci/sendback-engine.yml に置いた。
        .github/workflows/ に写すのは建設者なので、写すまで PR ごとには走っておらず効き目はまだ確かめていない。basis を分けて書く場合は今も todo のまま
      issue: 948
      at: 2026-11-05
      decided_by: committee:D-0011
    - kind: ci_check
      what: >-
        議決 D-0010 の ci_check の案のうち、ワーカーの権限で入れられるイベントの経路の分を入れた。engine_harness.py が Engine の記録したイベントを
        README の「制御プレーンから出すときの例」の SQL と同じ形（judgment.judged に Judgment を添える）で返し、engine.test.mjs がそれを ci_check と同じ呼び方
        （check.mjs --events --pr --summary、GITHUB_ACTIONS=true）で渡して、Engine の形のイベント列が 1 つの head に組めて後続の判定が線に合うことと、
        PR #395 と同じ入力のイベント列に Engine の形の sendback.filed を足した流れが followup_without_defect で落ちることを確かめた。
        Engine の正しい判定のイベント列が通ること（ci_check を配線してよい合図）は、今の Engine の basis が adopt の合計だけで basis_not_split で落ちるので todo にした。
        Engine の basis の直しと .github/workflows/ の配線と制御プレーンからイベントを出す手順は建設者が入れるので（順序は README）、
        本物の PR #395 のイベント列では確かめておらず、効き目はまだ確かめていない
      issue: 945
      at: 2026-11-05
      decided_by: committee:D-0010
decided_by: committee:D-0004
