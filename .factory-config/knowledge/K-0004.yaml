    - kind: schema
      what: >-
        議決 D-0015 の schema の案のうち、ワーカーの権限で入れられる分を入れた。enforcement.solutions の各項目に wired（CI や呼び出しに配線済みか）と
        verified（本物の記録で効き目を確かめたか）の真偽の項目を足し、この知見の解決策にはすべて wired: false・verified: false を書いた
        （どの検査も .github/workflows/ からはまだ走っていない）。tools/knowledge-enforcement-check/check.py が、wired・verified が真偽でないとき、
        wired でないのに verified が true のときに落とし、担保の表示を出す。level が deterministic でも wired の解決策が 1 件もなければ
        「未配線」、wired はあるが wired かつ verified が 1 件もなければ「deterministic（未確認）」と出し、deterministic とは出さない（この知見は「未配線」）。
        test_check.py でその場合分けとこのリポジトリの記録を確かめる。Engine は別のリポジトリで、definitions/knowledge.yaml に項目を足すことと、
        core-gates/knowledge_check.py の INDEX.md の担保の列を同じ表示にすること（check.py の label() を移す）は建設者が入れるので、
        INDEX.md の担保の列は今も deterministic のまま。check.py を PR ごとに走らせる配線（ci/knowledge-enforcement.yml を .github/workflows/ に写す）も建設者で、
        この解決策も未配線・未確認
