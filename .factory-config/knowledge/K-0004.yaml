    - kind: ci_check
      what: >-
        議決 D-0014 の ci_check の案のうち、ワーカーの権限で入れられる分を入れた。tools/sendback-check/ci/sendback-engine.yml の engine-test の
        最初の手順（どのチェックアウトよりも前）で ENGINE_REF が 40 桁のコミット SHA（小文字の 16 進）かを確かめ、ブランチ名・タグ・短い SHA なら
        engine_ref_not_sha の ::error で Engine を取らずに落とすようにした（今の ENGINE_REF は 9fee9c2b3d8d2dd22db63e8989d839cd982fd046）。
        tools/sendback-check/ci.test.mjs がその手順をワークフローから取り出して bash で動かし、通る・落ちる場合を確かめる。wiring-order のジョブで
        ci.test.mjs も走らせ、.github/workflows/sendback-engine.yml の写しが ENGINE_REF の行のほかでひな形とずれたら落とすようにした。
        .github/workflows/ に写して branch protection の必須チェックにすること、PR #395 と同じ入力で本物の判定が起こさないことが CI で通った記録を
        issue 948 に残すことは建設者が行うので、まだ PR ごとには走っておらず効き目はまだ確かめていない。basis を分けて書く場合は今も todo のまま
      issue: 960
