id: K-0004
theme: 6
kind: causal
statement: supervisor が差し戻し（sendback）を「直っていない採用欠陥（defect が null でなく、verdict が adopt）があるか」ではなく adopt の件数で起こすと、直すもののない差し戻しが記録される。
scope:
  roles: [supervisor]
confidence: hypothesis
evidence:
  - case: C-0002
  - pr: 395
  - event: "case.analyzed:40376"
status: active
verified_at: 2026-11-01
review_by: 2026-12-01
confidentiality: product
related: [K-0003]
enforcement:
  level: deterministic
  solutions:
    - kind: test
      what: >-
        差し戻しか続きのジョブを起こすのは、直っていない採用欠陥（defect が null でなく verdict が adopt）か、
        まだ入っていない仮決めの差し替えが 1 件以上あるときだけ、という判定の線をテストにした（tools/sendback-check/check.test.mjs）。
        PR #395 と同じ入力（仮決めの adopt 3 件、欠陥の reject 2 件、マージ済み）では起こさないこと、
        直っていない採用欠陥があればマージの前後に関わらず起こすこと、
        inspector_approved の basis に欠陥の採用数と仮決めの承認数を分けて書くことを確かめる。
        PR の記録を照らす検査（tools/sendback-check/check.mjs）も付けた。Engine の basis は今も adopt の合計だけを書くので外れる。
        Engine の判定と basis の文をこの線に合わせることと呼び出しの配線はまだ入っていないので、効き目はまだ確かめていない
      issue: 902
      at: 2026-11-05
      decided_by: committee:D-0004
    - kind: ci_check
      what: >-
        tools/sendback-check/check.mjs に、制御プレーンのイベント列（supervisor.judge_enqueued で head を区切り、judgment.judged と
        Judgment、sendback.filed、continue.enqueued、body_fix の job.enqueued、supervisor.inspector_approved）から PR と head ごとの記録を組む
        入口（--events・--pr）と、GitHub Actions の ::error と要約（--summary）を足し、PR ごと（か supervisor が差し戻し・続きのジョブを起こしたとき）に走らせて
        落とす検査にした。直っていない採用欠陥も差し替えもないのに差し戻しか続きのジョブが起きた head（PR #395 の記録の流れ）と、
        basis が adopt の合計だけの承認で外れる。.github/workflows/ の配線と制御プレーンからイベントを出す経路は建設者が足すので、効き目はまだ確かめていない
      issue: 934
      at: 2026-11-05
      decided_by: committee:D-0009
    - kind: test
      what: >-
        tools/sendback-check/engine.test.mjs に、check.test.mjs と同じ 3 つの場合を Engine の本物の判定で確かめるテストを置いた。
        engine_harness.py が Engine のチェックアウトから judgment.record_judged・dispatcher.act_on_judgment（と file_sendback・enqueue_body_fix・is_body_only）・
        supervisor.inspector_approved を中身を変えずに取り出し、DB と GitHub を差し替えて動かして、起きた後続と basis を check.mjs の線に照らす。
        PR #395 と同じ入力では起こさないこと、直っていない採用欠陥があればマージの前（review_fix）でも後（sendback）でも起こすことは今の Engine で通り、
        Engine が adopt の件数で起こすように変わると落ちる。basis を分けて書く場合は今の Engine では外れる（採用 N の合計だけ）ので todo にしてあり、
        Engine の basis の文を直すのと、CI で Engine を固定の版で取って ENGINE_DIR を向ける配線は建設者が入れる。それまで basis の担保は効いていない
      issue: 935
      at: 2026-11-05
      decided_by: committee:D-0009
decided_by: committee:D-0004
