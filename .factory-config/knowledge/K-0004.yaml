        シンボリックリンクや空白・日本語の入った道から起動すると main が走らずに終了コード 0 で抜けていた。tools/sendback-check/order.mjs の checkOrder に
        running（GITHUB_WORKFLOW_REF と GITHUB_JOB から組む在りか）を足して、渡されたら動いていること自体を配線と数えて engine_test_todo・engine_test_not_wired を見るようにし、
        check.mjs の main はそれを記録を読む前に走らせ、記録を読めなかったとき（終了コード 2）もその ::error を出すようにした。起動の判定は check.mjs と order.mjs の両方で
        実の道で比べる isMainModule にした。tools/sendback-check/order.test.mjs に、静的な辿りでは見つからない呼び方のワークフローの写しに、todo が残る・未配線・
        ワークフローがない・手順かジョブに continue-on-error: true か if: を付けた状態と順序を守った状態を組み、絶対と相対の道・引数の順序と --events=・npm run・
        npm --prefix・シェルの eval・node の子のプロセス・シンボリックリンク・空白と日本語の入った道のシンボリックリンクの 9 とおりの起動で、外れた状態は
        その rule の ::error と終了コード 1、順序を守った状態は 0 になることと、配線の順序の ::error が記録の外れより先に出ることを確かめるテストを足した。
