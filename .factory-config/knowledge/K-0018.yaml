id: K-0018
theme: 6
kind: causal
statement: >-
  契約（specs/contracts）の変更と 2 つ以上のアプリ（apps/*）をまたぐ機能のチケットを起こすときに、契約の変更を先行の子チケットにし、
  各アプリの実装をそれに依存させるという順番の規約がないと、契約と複数のアプリを 1 枚のチケットにまとめて書きやすく、
  1 ジョブのターン予算の近くの大きさのチケットが生まれる（推測）。領域をまたがないチケットの起こし方には広げない。
  C-0009 の例のチケットは 4 領域（admin-web・backend・student-app・specs/contracts）にまたがったが、チケットの本文は材料になく、
  まとめて書かれた理由が規約のなさだったかは確かめていない。束のほかの 36 件がこの型かも確かめていない（分析役の見込みも「繰り返しそう: いいえ」）。
