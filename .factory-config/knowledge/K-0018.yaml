id: K-0018
theme: 6
kind: causal
statement: >-
  チケットを起こすときに、契約（specs/contracts）の変更を先行の子チケットにし、各アプリの実装をそれに依存させるという順番の規約がないと、
  契約と複数のアプリ（apps/*）を 1 つの機能として 1 枚のチケットにまとめて書きやすく、1 ジョブに収まらない大きさのチケットが生まれる（推測）。
  C-0009 の例のチケットは 4 領域（admin-web・backend・student-app・specs/contracts）にまたがったが、チケットの本文は材料になく、
  まとめて書かれた理由が規約のなさだったかは確かめていない。束のほかの 36 件がこの型かも確かめていない。
