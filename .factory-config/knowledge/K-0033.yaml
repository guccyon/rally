id: K-0033
theme: 6
kind: causal
statement: >-
  admin-web の契約ファイル（specs/contracts/api/admin-web/openapi.yaml）のような共有の契約ファイルに触る複数のチケットを、
  ファイルの重なりを見ずに並列に投入すると、同じ契約ファイルに複数の PR が同時に変更を入れ、衝突の続きのジョブが
  チケットごとに積まれる（C-0015 では 10 チケット・12 件・19.58 USD の新しい束で、#497 と #499 が 1 時間のうちに続けて衝突した）。
  投入のときに触る契約ファイルを見て同じファイルの PR を同時に 1 本までにすること、契約だけの小さなチケットを先に出してすぐ
  マージすることが分析役の提案の向きである。ただし Engine にはすでに、よく衝突するファイルに触る見込みのタスクを並べて投入する段
  （K-0024 が書く serialize.py）があり、この束の窓でその段がこのファイルを見ていたか、見込みのファイルが外れたのかは材料にない。
  投入規則が重なりを見なかったというのは分析役の推測である。根拠はこの束 1 つだけ。
scope:
