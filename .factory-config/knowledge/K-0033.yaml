id: K-0033
theme: 4
kind: causal
statement: >-
  衝突の解消のような付随作業をした続きのジョブ（continue、reason=conflict）の報告を、PR のコメントや handoff ではなく PR 本文に書かせると、
  1 回の衝突の解消でも本文に「## 概要」などの見出しの組が重なり、付随作業だけの報告（「コミットはしていません」など）が PR 全体の説明と
  食い違って読めて、検査・判定の本文の指摘と本文の手直しのジョブを呼ぶ（C-0014 では PR #301 の衝突の解消の job 347 の報告が本文の末尾に
  そのまま足され、判定役の指摘で本文の手直しの job 353（約 0.08 USD）が走った）。本文の見出しの重なりは K-0001、取り込みの記録を本文の外に
  置き本文をその時点の要約として書き直す向きは K-0030 が書き、この知見の主張は、付随作業の報告は本文の外にだけ書き、続きのジョブは本文を
  書き換えない（必要なら本文の「## 工場の記録」に 1 行だけ足す）という向きに絞る。K-0030（続きのジョブが本文を書き直す）、
  K-0001 の担保（記録を「## 工場の記録」の下の ### に置かせる）とは、本文に誰がどこまで手を入れるかが違う。
  報告がどの経路で本文に入ったか（実装役の書き方か、Engine の組み込みか）は、session.txt と handoff が残っておらず確かめていない。
  根拠はこの 1 つの PR だけ。
scope:
  work: [dev.describe]
  artifacts: [PR.body]
  request_form: [ticket]
  roles: [implement, body_fix, judge]
acts_on: engine
confidence: hypothesis
evidence:
  - case: C-0014
  - pr: 301
  - event: "case.analyzed:775818"
status: draft
verified_at: 2026-11-11
review_by: 2026-12-11
confidentiality: product
related: [K-0001, K-0006, K-0009, K-0030]
invalidate_when:
  - "続きのジョブへの指示が、付随作業の報告を PR のコメントか handoff にだけ書き、PR 本文を書き換えないよう求めるようになった"
  - "K-0001 の関所（記録を「## 工場の記録」の下の ### に置かせる）が配線されたあと、衝突の解消のあとの本文の指摘と body_fix が出なくなった（本文の外に出さなくても足りた）"
