id: K-0033
theme: 4
kind: causal
statement: >-
  同じ「PR 本文」でも、実装役は自分が書いた文、検査役と判定役は handoff の summary.md から作られた文を見ていて、
  その 2 つが食い違うことを判定役が知る入力がないと、受け渡しの欠陥が実装役の欠陥として記録され、受け渡しの側の直しにつながらないおそれがある
  （C-0015 では実装役の最後の文に ## 概要 から ## 補足 までの見出しがそろっていたのに、summary.md は ## 補足 の後の箇条書きから始まり、
  検査役と判定役は欠けた本文を前提に PR-002 を adopt した。この adopt と body_fix による本文の直しはどちらも正しく、
  C-0015 では責任の置き場所の取り違えによる害はまだ観察していない。観察したのは、判定役が見る文と実装役の文が食い違っていたことまで）。分析役の提案の向きは、判定役の入力に実装役の最後の文と実際の PR 本文の
  両方を渡し、食い違いは受け渡しの欠陥として分類させること。まだ試しておらず、どこで落ちたかも確かめていない。
  本文が欠ける仕組みそのものは K-0025・K-0016 が書く。この知見は、食い違いを判定役が受け渡しの欠陥として分けられるかに絞る。
