id: K-0010
theme: 6
kind: causal
statement: >-
  既定ブランチとの衝突のたびに、上限なしで、セッションを引き継ぐ（agent_resumed）tier-large の続きのジョブを積み直すと、
  衝突が機械的（CHANGELOG だけなど）で作業が数ターンで終わっても、引き継いだ文脈の分だけ 1 回ごとのコストが増え続け、
  回数とともに PR 本文の追記も重なる。
scope:
  roles: [supervisor, implement]
confidence: hypothesis
evidence:
  - case: C-0005
  - pr: 659
  - event: "case.analyzed:274379"
status: active
verified_at: 2026-11-05
review_by: 2026-12-05
confidentiality: product
related: [K-0002, K-0001]
invalidate_when:
  - "conflict の続きのジョブに回数の上限か、セッションの引き継ぎの打ち切りが入った"
  - "CHANGELOG だけのような機械的な衝突が tier-small か機械的な解消に回るようになった"
enforcement:
  level: deterministic
  solutions:
    - kind: config
      what: >-
        conflict の続きのジョブの積み方を .factory-config/continuation.yaml の conflict に設定の線として置いた（同じ PR で 3 回まで、
        超えたら積まずに衝突の停止（ci:）を開いて人の判断待ち、セッションを引き継いでよいのは 1 回目まで、衝突したファイルが
        CHANGELOG.md と changelog.d/ だけならエージェントを使わずに両方の行を残して機械的に解く、ほかも衝突したら tier-large）。
        tools/conflict-check/ の policy.py が線を読み、test_policy.py で C-0005 と同じ 20 回の衝突では 3 回だけ積んで 4 回目は人へ回すこと、
        2 回目以降は引き継がないこと、CHANGELOG だけの衝突の tier が none（機械的）になることを確かめる。test_engine.py は engine_harness.py で
        Engine の本物の supervisor の conflict_step・ci_failure_step と continuation.enqueue、worker の entrypoint.sh の機械的な解消の手順と
        STATE_ARGS の行を動かして線に照らす。今の Engine では、2 回目以降を引き継がないことと CHANGELOG.md だけの衝突を機械的に解くことは通り、
        回数の上限（6 回の衝突で 6 回積む）と changelog.d/ を含む衝突の機械的な解消は外れるので、Engine が今の形のときだけ todo にした。
        Engine が continuation.yaml を読むことと上限・機械的な解消の広げ、CI の配線は建設者が入れるので、効き目はまだ確かめていない
      issue: 954
      at: 2026-11-05
      decided_by: committee:D-0013
      wired: false
      verified: false
    - kind: test
      what: >-
        議決 D-0023（Issue #972 の起票時の番号は D-0018。PR #970）の test の案を入れた。tools/conflict-check/events.py が制御プレーンのイベント列
        （pr.conflicted と continue.enqueued の reason=conflict に、job_id で job.started・job.finished・conflict.files を結ぶ）から PR ごとに
        conflict の続きのジョブの回数・agent_resumed・tier・衝突したファイルを組み、policy.py の線（continuation.yaml の conflict）に照らして、
        同じ PR で 4 回目が積まれた（over_limit）、2 回目以降で agent_resumed=true（resumed_after_limit）、CHANGELOG.md と changelog.d/ だけの衝突で
        tier-large で解いた（agent_for_mechanical）のどれかがあれば終了コード 1 で落とす。test_events.py で、C-0005 の流れ（PR #659 の 20 回の衝突。
        事例記録の事実だけを Engine のイベントの形に組み直した fixtures/c0005-pr659-events.json）が 3 つの rule のすべてで落ち、線どおりの積み方は通ることを確かめた。
        今の Engine は agent_resumed を制御プレーンの events に載せず（ワーカーのログと ticket.json だけ）、機械的に解いた回の tier も費用 0 でしか分からないので、
        記録がない項目は照らさずに件数を出す。job.finished に agent_resumed と解き方の tier を足すこと、イベントを出してこの検査を PR ごとか supervisor の周期ごとに
        走らせる配線は建設者が入れるので、本物の PR #659 のイベント列では確かめておらず、効き目はまだ確かめていない
      issue: 972
      at: 2026-11-07
      decided_by: committee:D-0023
      wired: false
      verified: false
    - kind: ci_check
      what: >-
        議決 D-0030（Issue #1034 の起票時の番号は D-0029。PR #1033）の ci_check の案を入れた。tools/conflict-check/watch.py が、supervisor の周期ごと
        （または conflict の続きのジョブを積むたび）に制御プレーンのイベント列を events.py で照らし、over_limit・resumed_after_limit・agent_for_mechanical の
        どれかが出た PR ごとに、Engine の stoppage.open_stoppage で衝突の停止（ci:<PR の URL>、category は ticket）を開いて人の判断待ちにする（同じ key は開き直さない）。
        test_watch.py で C-0005 の流れ（fixtures/c0005-pr659-events.json）で PR #659 に停止を 1 つ開き、線どおりの積み方と照らせないだけの PR には開かないことを、
        test_engine.py の (4) で Engine の本物の open_stoppage に渡して開き、次の周期で開き直さないことを確かめた。あわせて PR ごとの CI のひな形
        tools/conflict-check/ci/conflict-check.yml を置き、ENGINE_REF（2490db6）の Engine で test_events.py・test_engine.py・test_watch.py・test_policy.py を
        CI=true と ENGINE_DIR を渡して走らせる（fixtures や Engine の取り出しに失敗したら飛ばさずに落とす）。ひな形の形は test_ci.py が見る。
        supervisor の merge_step から watch を呼ぶ配線（ci_failure_step が同じ ci: の停止を閉じる・conflict_step が ci: の停止を見ずに積むことの扱いも含む）と、
        ひな形を .github/workflows/conflict-check.yml に写して必須のチェックにするのは建設者なので、本物のイベント列では確かめておらず、効き目はまだ確かめていない
      issue: 1034
      at: 2026-11-07
      decided_by: committee:D-0030
      wired: false
      verified: false
decided_by: committee:D-0013
