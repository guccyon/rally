id: K-0005
theme: 4
kind: causal
statement: >-
  PR 本文の見出しの定義が、実装役の報告の型・検査役の rubric（Engine の PR-002・OV-001）・リポジトリの決まり（CLAUDE.md の PR の説明の見出し）の
  3 か所に分かれていて 1 つに揃っていないと、決まりに沿って書いた本文に rubric にだけある見出し（背景・問題）の欠けの指摘が出て、
  同じ種類の指摘が PR によって採られたり退けられたりして判断が割れる。実装役の報告の型だけを rubric に合わせても解けない（どれを正本にするかを先に決める）。
  主張は見出しの定義が 3 か所に分かれていることに絞る。判定役の入力に rubric の本文が渡らないことは K-0011 の主張。
scope:
  work: [dev.describe, dev.review.inspect, dev.review.judge]
  artifacts: [PR.body]
  roles: [implement, inspect, judge]
acts_on: process
confidence: hypothesis
evidence:
  - case: C-0003
  - case: C-0001
  - pr: "396"
  - event: "case.analyzed:40381"
  - case: C-0005
  - pr: 659
  - event: "case.analyzed:274379"
  - case: C-0006
  - pr: 821
  - event: "case.analyzed:370935"
status: active
verified_at: 2026-11-11
review_by: 2026-12-11
confidentiality: product
related: [K-0001, K-0006, K-0011]
invalidate_when:
  - "実装役の報告の型・Engine の PR-002 と OV-001 の check・CLAUDE.md の見出しが、見出しの正本（tools/pr-body-check/template.json。Issue #936 でオーナーが決めた）にすべて揃った"
  - "見出しの定義が揃ったあとも、背景・問題の欠けの指摘が PR によって採られたり退けられたりした（判断が割れる原因は定義の分かれではなかった）"
enforcement:
  level: deterministic
  solutions:
    - kind: config
      what: >-
        PR 本文の見出しの正本を tools/pr-body-check/template.json の 1 つとし（オーナーが Issue #936 で決めた）、それに合わせる側を
        tools/pr-body-check/followers.json に書いた（CLAUDE.md の「PR の説明は … の見出しで」と「必須は …」、Engine の core-gates/rubric.yaml の
        PR-002 の check の「テンプレートの見出し（…）」）。tools/pr-body-check/followers.mjs が合わせる側から一覧をちょうど 1 か所で取り出し、
        template.json の見出しを定義の順に同じ区切りでつないだものと比べ、食い違ったら落とす（headings_mismatch・required_mismatch。
        一覧を取り出せなければ照らさずに終了コード 2）。followers.test.mjs で、今の CLAUDE.md が通り、順・名前・数・必須を変えると落ち、
        template.json だけを変えると両方の合わせる側が落ち、Issue #1121 の時点の Engine の PR-002（影響範囲の名前と、仮決め・知見がない）が
        headings_mismatch で落ちることを確かめた。照らすのは CI で、followers.test.mjs は ci/pr-body-engine.yml の node --test の中で
        ENGINE_DIR の Engine の rubric を照らす（ENGINE_DIR を渡したときと CI=true では飛ばさない）。手元の Engine（57069a8）の PR-002 は
        まだ食い違うが、PR-002 が Issue #1121 の時点の形のままのときだけ todo にして CI を止めない（ほかの形の食い違いや読めない rubric は落とす。
        PR-002 を合わせた Engine の写しでは todo が外れて通ることを確かめた）。Engine の PR-002 を template.json に合わせて ENGINE_REF を上げること、ci/pr-body-engine.yml を
        .github/workflows/ に写して必須のチェックにすることは建設者が行うので、まだ配線されておらず効き目は確かめていない。
        種類を config にしたのは Issue #1121（委員会の週 1 の定例の決定）の解決策の種類に従ったためで、担保の中心は正本と合わせる側を
        followers.json の設定で決めたことにあり、followers.test.mjs はその設定を CI で照らす手段。議決 D-0006 の案（solution_kind は test）とは
        種類が違い、D-0006 に config の案はないので decided_by は書いていない（書くと knowledge-enforcement-check の decision_mismatch で落ちる）。
        D-0006 の案は実装役の報告の型と判定役が参照する決まりも照らす対象にしているが、followers.json に入れたのは CLAUDE.md（判定役が参照する
        リポジトリの決まり）と rubric の PR-002 だけで、実装役の報告の型（Engine 側）はまだ照らしていない。担保はこの範囲にとどまるので、
        confidence は hypothesis のまま
      issue: 1121
      at: 2026-11-08
      wired: false
      verified: false
    - kind: config
      what: >-
        議決 D-0071 の config の案のうち、ワーカーの権限で入れられる分を入れた。tools/pr-body-check/followers.json に、実装役の報告の型
        （Engine の orchestrator/worker/entrypoint.sh の約束の「最後の出力を次の見出しだけで構成する」の次から続く「## …」の行）を合わせる側
        implementer-report として足した。見出しの間に注釈（「（1〜3 文）」など）が挟まるので、followers.mjs の一覧の取り出し方に任意の item を足し、
        pattern で捕まえた範囲から item の組を順に拾って separator でつなぎ、template.json の見出しをつないだものと比べる（1 つも拾えなければ読めなかったことにする）。
        followers.test.mjs で、template.json に合わせた報告の型が通り、Issue #1194 の時点の Engine の報告の型（背景・問題がない）と、順・名前・数を変えた形が
        headings_mismatch で落ち、注釈だけを変えた形は通り、節がない・2 か所ある・見出しの行がない形は照らさずに読めなかったことになり、template.json だけを変えると
        合わせる側の 3 つがすべて落ちることを確かめた。手元の Engine（9f8f6b4）では PR-002 と報告の型の両方が headings_mismatch で食い違うので、本物の Engine の照合は
        Engine の食い違いがどれも Issue #1121・#1194 の時点の形のときだけ todo にし（ほかの形の食い違いや読めない Engine は落とす）、両方を template.json に合わせた
        Engine の写しでは todo が外れて通ることを確かめた。案の残り（ci/pr-body-engine.yml を .github/workflows/ に写して必須のチェックにし、wired_by を書く）は、
        この Issue が特権のライン（factory:privileged）でなく .github/workflows/ を変えられないので入れていない（CLAUDE.md の「やってはいけないこと」、Engine ADR 0041）。
        議決 D-0071 の dissent の票のとおり、Engine の PR-002 と報告の型を合わせて ENGINE_REF を上げる前に必須にすると関係のない PR まで止まる順の問題もある。
        建設者が Engine を合わせて写すまで配線されておらず効き目は確かめていない。Engine の報告の型を照らす対象に入れたので D-0006 の案の 3 つはそろったが、
        配線と確認がまだなので confidence は hypothesis のまま
      issue: 1194
      at: 2026-11-08
      decided_by: committee:D-0071
      wired: false
      verified: false
decided_by: committee:D-0006
