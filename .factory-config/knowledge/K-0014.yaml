        載せるようにすること、ひな形を写して CONFLICT_FILES_SINCE を書きシークレットを置くこと、wired: true にして wired_by
        （job conflict-record・runs tools/conflict-check/events.py）を書くこと、C-0007 と同じ形の衝突で落ちないことを事例記録で確かめて
        verified: true にすることは建設者が行う（tools/conflict-check/README.md の「直近の窓に積まれた衝突の続きのジョブの定期の照合」）。
        まだ配線されておらず、本物のイベント列では確かめていない
