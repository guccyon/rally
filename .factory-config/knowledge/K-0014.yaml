        wired_by にそのジョブを書いて wired: true にする。そのあと C-0007 と同じ形の衝突で落ちないことを事例記録で確かめて verified: true にする）のうち、
        ワーカーの権限で入れられる分を入れた。issue 1207 の解決策の定期のワークフローのひな形 tools/conflict-check/ci/conflict-schema.yml に
        ジョブ conflict-record を足し、制御プレーンの events から直近の窓（差分を当てた時刻 CONFLICT_FILES_SINCE と直近 8 日の始まりの遅いほうから後）に
        積まれた continue.enqueued(reason=conflict) と、同じ job_id の job.started・job.finished・conflict.files を引く tools/conflict-check/record-events.sql を
        読んで、events.py --record-only --since で照らすようにした。events.py に、record_check だけを出して K-0010 の線（check）を照らさない --record-only と、
        schema.py と同じ線で occurred_at が差分を当てた時刻より前のイベントを組まない --since（occurred_at がない・読めなければ終了コード 2）を足した。
        CONFLICT_FILES_SINCE とシークレット CONFLICT_EVENTS_DATABASE_URL は conflict-schema と分け合い、時刻が空か形が違う・シークレットがない・
