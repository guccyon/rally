        field_error 1 つにまとめてあり、events.py の missing_conflict_files（_inline_files）はそれを呼んでいるので、関数のまとめは足さず、案のもう 1 つの
        テストを足した。test_events.py の ConflictFilesShapeParityTest が、conflict_files の形の組 20 件（通る: 空でない文字列の列で 1 件以上。
        落ちる: 欄がない・null・空の列・空の文字列や空白だけの要素・文字列でない要素・文字列や真偽や数やオブジェクトの値）を、continue.enqueued(reason=conflict) に
        載せてほかの記録を置かない列で schema.py の check（bad_field・missing_field）と events.py の record_check（missing_conflict_files）の両方に通し、
        通る・落ちるがそろって期待どおりであることを、関数の呼び出しとコマンド（schema.py --json と events.py --record-only --json が落とす PR の組）の両方で
        確かめる。field_error を共有していても、片方の入口（schema.check の null の扱い、events._inline_files の読み方）だけが直されると 2 つの解決策が
        食い違うので、関数ではなく両方の検査の結果で照らす。手元で events._inline_files を空でない列なら通すように変える・field_error の空白だけの判定を
        外す誤りでは、どちらもこのテストが落ちることを確かめた。テストは tools/conflict-check/ci/conflict-check.yml の unittest discover で走るが、
        ワーカーは .github/workflows/ を変えられないので、ひな形を .github/workflows/conflict-check.yml に写して必須のチェックにするのは建設者が行う
        （tools/conflict-check/README.md の「CI への組み込み」）。まだ配線されておらず、本物のイベント列では確かめていない
      issue: 1297
      at: 2026-11-09
      decided_by: committee:D-0112
      requires_check:
        - runs: tools/conflict-check/test_events.py
          workflow: .github/workflows/conflict-check.yml
      wired: false
      verified: false
    - kind: test
      what: >-
        議決 D-0113（PR #1298）の test の案を入れた。--since の判定は、issue 1214 の解決策ですでに tools/conflict-check/schema.py の parse_time
        （時差つきの時刻の読み方）と before（occurred_at が差分を当てた時刻より前のイベントを外し、ない・読めなければ EventsError）にまとめてあり、
        events.py の main はそれを呼んでいる（issue 1214 の解決策の PR #1298 で events.py に --since を足したときから、events.py は自前の判定を持たず
        schema.parse_time・schema.before を呼ぶ。issue 1214 の項目の「schema.py と同じ線」はこの共有を指す）ので、関数のまとめは足さず、案のもう 1 つのテストを足した。test_events.py の SinceParityTest が、
        同じイベント列と --since の時刻の組を schema.py --since（conflict-schema のジョブ）と events.py --record-only --since（conflict-record のジョブ）の
        両方にコマンドで通し、外すイベントの件数（標準出力の「より前の N 件は照らさない」）・落とす PR の組（--json）・終了コードがそろって期待どおりで
        あることを確かめる。組は、同じ時刻の書き方違いの --since 4 通りと、時差を直すと字面の大小と前後が逆になる時刻・ちょうど・1 秒前・1 ミリ秒前・
        前後に空白のある occurred_at の 9 本の PR、occurred_at がない・null・数・空・日付だけ・時差がない・時刻でない列（どちらも終了コード 2。--since が
        なければどちらも見ずに照らす）、時差つきの時刻でない・値がない --since（どちらも終了コード 2）。関数を共有していても、片方の入口（main での --since の
        読み方、before の結果の使い方）だけが直されると 2 つのジョブの窓が食い違うので、関数ではなく両方のコマンドの結果で照らす。手元で events.py の外し方を
        字面の比べ方にする・events.py が読めない --since を黙って捨てる・schema.py が occurred_at のないイベントを外して「ちょうど」も外す・events.py が
        読めない occurred_at で絞らずに照らす誤りでは、どれもこのテストが落ちることを確かめた。テストは tools/conflict-check/ci/conflict-check.yml の
        unittest discover で走るので、requires_check にその写しの .github/workflows/conflict-check.yml の test_events.py を書いた。ワーカーは
        .github/workflows/ を変えられないので、ひな形を写して必須のチェックにし、wired: true にして wired_by を書くのは建設者が行う
        （tools/conflict-check/README.md の「CI への組み込み」）。まだ配線されておらず、本物のイベント列では確かめていない
      issue: 1299
      at: 2026-11-09
      decided_by: committee:D-0113
      requires_check:
        - runs: tools/conflict-check/test_events.py
          workflow: .github/workflows/conflict-check.yml
      wired: false
      verified: false
    - kind: ci_check
      what: >-
        議決 D-0135（PR #1341）の ci_check の案と、同じ知見の議決 D-0139（PR #1346）の ci_check の案を入れた。issue 1295 の解決策（conflict-sql のジョブの
        WindowSqlTest・RecordSqlTest）と issue 1297 の解決策（ConflictFilesShapeParityTest）の requires_check は、それぞれ
        tools/conflict-check/test_schema_ci.py・test_events.py と .github/workflows/conflict-check.yml ですでに書いてあったが、test_schema_ci.py は
        conflict-check のジョブの unittest discover でも走る（Postgres がなく SQL の組は飛ぶ）ので、そのジョブを指すだけで wired: true にできた。
        tools/knowledge-enforcement-check/check.py の requires_check の項目に env（環境変数の名前 → 値の文字列）を足し、issue 1295 の項目に
        env: {CONFLICT_SQL_REQUIRED: "true"} を書いて、その値を渡して呼ぶ手順（手順・ジョブ・ワークフローの env か、行の中の NAME=値）を指す
        wired_by の項目がなければ requires_check_unwired で落とすようにした。あわせて、unittest discover は -p（既定は test*.py）にファイル名が
        当たるときだけそのテストを呼ぶ側に数えるようにし、-p 'test_schema_ci.py' の conflict-sql のジョブを issue 1297 の test_events.py の配線と
        読ませないようにした。D-0139 の案の後半として、--base を渡した check.py が、kind が test・ci_check で what に PR ごとのひな形
        （tools/*/ci/*.yml のうち on.pull_request のあるもの）を挙げた解決策を、PR の差分で足したり直したりしたときに requires_check が空の列 [] でも
        requires_check_missing で落とすようにした（欄がないものは議決 D-0116 の線ですでに落ちる。requires_schedule を書いた定期の解決策は見ない）。
        test_check.py の ConflictSqlPullRequestTest で、ひな形をそのまま写した conflict-sql のジョブなら issue 1295 が、conflict-check のジョブなら
        issue 1297 が通り、conflict-check のジョブを指す issue 1295・CONFLICT_SQL_REQUIRED を外すか値を変えた写し・pull_request を外した写し・
        別の名前のワークフロー・conflict-sql のジョブを指す issue 1297 は落ちることを、RequiresCheckTest で env と -p の読み方と env の形の誤りを、
        RequiresCheckDeclaredTest で空の列の線を確かめた。ワーカーは .github/workflows/ を変えられないので、ひな形を
        .github/workflows/conflict-check.yml に写して conflict-check・conflict-sql を必須のチェックにし、issue 1295・1297 の項目を wired: true にして
        wired_by を書くのは建設者が行う（tools/conflict-check/README.md の「CI への組み込み」）。この解決策そのものは PR ごとの
        knowledge-enforcement のジョブの test_check.py で走る。まだ配線されておらず、本物の記録では確かめていない
      issue: 1344
      at: 2026-11-11
      decided_by: committee:D-0135
      requires_check:
        - runs: tools/knowledge-enforcement-check/test_check.py
          workflow: .github/workflows/knowledge-enforcement.yml
      wired: false
      verified: false
    - kind: lint
      what: >-
        議決 D-0141（PR #1350）の lint の案を入れた。議決 D-0116 の線（Issue #1304）の requires_check_missing は、PR の差分で足したり直したりした
        ci_check・test の解決策しか見ておらず、同じファイルのほかの解決策を直す PR でも、前からある欄のない解決策（この知見の issue 1135 の test）が
        黙って残っていた（議決 D-0141 の enforcement の票）。tools/knowledge-enforcement-check/check.py の check_requires_check_declared を、
        --base と HEAD の分かれ目の版から中身が変わったか、その版になかった知見のファイルなら、その中の kind が ci_check・test の解決策すべてに、
        直したかどうかにかかわらず requires_check の欄（PR ごとに走らないものは []）を求め、なければ requires_check_missing で落とすように広げた。
        触れていないファイルは見ない。PR ごとのひな形を挙げた解決策の空の列 []（議決 D-0139）は、これまでどおり足したり直したりした解決策だけを見る。
        先にこの知見の issue 1135 の解決策に、MissingConflictFilesTest を走らせる PR ごとのジョブの requires_check
        （tools/conflict-check/test_events.py、.github/workflows/conflict-check.yml。issue 1208・1297 と同じ）を書き足した。issue 1214 の解決策は
        schedule で走る ci_check で、すでに requires_check: [] と requires_schedule を書いてあるのでそのままにした。test_check.py の
        RequiresCheckDeclaredTest に、欄を書いた解決策を足す・同じファイルのほかの解決策だけを直す・並べ替える・解決策でない欄だけを直す変更で、
        触れていない欄のない解決策が落ちることと、触れていないファイルは見ないことを確かめる組を足した。この解決策そのものは PR ごとの
        knowledge-enforcement のジョブの test_check.py で走るが、ワーカーは .github/workflows/ を変えられず、ひな形 ci/knowledge-enforcement.yml の写しは
        建設者が置くので、まだ配線されておらず、本物の記録では確かめていない
