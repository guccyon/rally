        --record-only で missing_conflict_files の 4 件だけで落ち、同じ形の衝突でも continue.enqueued に conflict_files を載せた列は通ること、--since の絞り方を、
        test_schema_ci.py の RecordTemplateTest でジョブの形と手順の振る舞いを、RecordSqlTest で SQL を Postgres の使い捨ての schema で走らせて
        差分の前・窓の外・衝突でない続きを出さず、出した列を events.py が組めることを確かめた。あわせて tools/knowledge-enforcement-check/check.py の
        REQUIRED_SCHEDULE・REQUIRED_SCHEDULE_WORKFLOW にこの解決策を挙げ、.github/workflows/conflict-schema.yml の schedule でも走るジョブから
        events.py を呼ぶ wired_by の項目がないと wired: true にできないようにした（test_check.py の ConflictRecordScheduleTest）。ワーカーは
