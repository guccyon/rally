id: K-0014
theme: 4
kind: causal
statement: >-
  衝突を解く続きのジョブを積むときに、衝突したファイルを記録しない（pr.conflicted・continue.enqueued・handoff に載せない）と、
  同じファイルの衝突が繰り返している型が集計で見えない（C-0007 では、衝突解消ジョブの samples の detail がすべて null で、
  CHANGELOG.md だけの衝突の束として数えるには事後の backfill（conflict.files）が要った）。
  ただし、記録の欠けが手を打つ時期を遅らせたかは確かめていない。型が見えた日と手を打った日の差は材料になく、
  CHANGELOG.md の衝突は記録がないままの窓の中で C-0001 から K-0002 として見つかり、断片方式（at 2026-11-03）という手が打たれている（反例になりうる）。
scope:
  work: [dev.build]
  roles: [supervisor]
acts_on: engine
confidence: hypothesis
evidence:
  - case: C-0007
  - pr: 290
  - event: "case.analyzed:370939"
status: active
verified_at: 2026-11-08
review_by: 2026-12-08
confidentiality: product
related: [K-0010, K-0001]
invalidate_when:
  - "pr.conflicted か continue.enqueued(reason=conflict) に、衝突したファイルがその場で（backfill ではなく）載るようになった"
  - "衝突したファイルがその場で記録されるようになったあとも、同じファイルの衝突の束が集計で見えなかった（原因は記録の欠けではなかった）"
  - "記録の欠けが手を打つ時期を遅らせたかを確かめる: 同じファイルの衝突の束ごとに、束が集計で最初に見えた日（conflict.files が数えられた日）と手を打った日（担保の at）を並べ、記録のある束とない束で差がなかった"
enforcement:
  level: deterministic
  solutions:
    - kind: schema
      what: >-
        議決 D-0049 の schema の案を入れた。衝突したファイルの列 conflict_files（空でない文字列の列で 1 件以上）を、pr.conflicted ではいつも、
        continue.enqueued では reason=conflict のとき、handoff.saved では continue_reason=conflict のときに必須の欄とする定義を
        tools/conflict-check/conflict-files.yaml（Engine の definitions/events.yaml の events と同じ形の抜き書き）に置き、
        tools/conflict-check/schema.py がイベント列をその定義で照らして、欄がない・null（missing_field）、空の列・文字列の列でない（bad_field）イベントがあれば
        終了コード 1 で落とす。Engine の定義に同じ欄を足す差分を tools/conflict-check/engine/conflict-files.patch に置き、test_schema.py で、
        C-0005 の流れ（fixtures/c0005-pr659-events.json。今の Engine の形どおりイベントに衝突したファイルが載らない）が落ち、載せた列は通ること、
        衝突でない続きのジョブには要らないこと、手元の Engine のチェックアウトの写しに差分が当たり Engine の定義が conflict-files.yaml とそろうことを確かめた。
        差分を Engine に当てること、Engine が衝突したファイルを求めてこの欄を載せ、欄がない・空のイベントを出さないこと（pr.conflicted は GitHub の
        mergeable_state からしか衝突を知らないので、その手順も要る）、schema.py を周期ごとか PR ごとに走らせる配線は建設者が入れるので、
        本物のイベント列では確かめておらず、未配線・未確認
      issue: 1136
      at: 2026-11-08
      decided_by: committee:D-0049
      wired: false
      verified: false
decided_by: committee:D-0049
