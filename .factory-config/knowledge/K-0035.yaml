id: K-0035
theme: 6
kind: causal
statement: >-
  Issue に貼られたデザインの正本の版（C-0015 では 0.3.0）が、リポジトリの specs/design/ の版（0.4.0。date_field・slot_state）と合っているかを
  plan の時点で照らさないと、版の番号と範囲を実装役が仮決めすることになる（C-0015 では仮決めが 8 件出た）。design_system.handed_off（11-05）から
  implement（11-06）までの間に、Issue の正本と specs/design/ の現在の版を突き合わせる段階がない。Issue の正本を書いた後に 0.4.0 が入ったのが
  食い違いの原因という見方は実装役の解釈で、推測を含む。分析役の提案の向きは、planner の定義に正本の版の照合を足すこと。
  分析役の見込みは「繰り返しそう: いいえ」で、根拠はこの 1 件だけ。差し戻しの直接の原因ではない（直接の原因は本文の受け渡しで、K-0025 が書く）。
  1 段の plan が小さく見積もられた（undersized）点は、大きさを測って分ける線の K-0017 に C-0015 の evidence として足したので、この知見には入れない。
