id: K-0008
theme: 6
kind: causal
statement: >-
  人の判断待ち（factory:needs-judgment）の停止中に PR が main と衝突（pr.conflicted）しても、衝突を解く continue が判断の後に enqueue されると、
  判断の後に衝突の解消の待ちが足される（C-0004 では enqueue から job の開始まで約 26 分で、痛さは大きくない）。
  judge の推奨が「PR のまま」のときに限り、衝突の解消を判断待ちと並行して起こせば、この待ちを減らせると見られる。
  ただし判断待ちの間も main が速く進むと、並行で解いてもまた衝突し、continue を繰り返す費用が待ちの短縮を上回るおそれがある。
  判断の後まで continue が起きなかった理由（supervisor の仕組み）は確かめていない。
  K-0010 の担保（.factory-config/continuation.yaml の conflict）との関係: 判断待ちと並行して解く回も、エージェントを呼び出して解けば
  同じ PR につき 3 回までの上限（max_attempts_per_pr。機械的に解いた回は数えない）に数える。並行で解いたあとにまた衝突すると上限に早く届き、
  衝突の停止（人の判断待ち）に上がって、待ちを減らすねらいと逆の結果になりうる（どちらが勝つかは確かめていない）。
