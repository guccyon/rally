statement: >-
  判定役（judge）のジョブの入力に、検査役の指摘が根拠として引く rubric（PR-002・OV-001 など）の本文が入っていないと、
  判定役は指摘の根拠を確かめられず、手元にあるリポジトリの決まり（CLAUDE.md など）だけで裁いて、rubric にだけある要求
  （PR 本文の背景・問題など）を、rubric の本文を読まないまま決まりの外として退ける。主張は判定役に rubric の本文が渡らないことに絞る。
  見出しの定義が 3 か所に分かれていること自体は K-0005 の主張。
