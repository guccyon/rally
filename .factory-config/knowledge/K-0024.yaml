id: K-0024
theme: 6
kind: causal
statement: >-
  よく衝突するファイル（apps/backend/README.md・apps/backend/crates/server/src/lib.rs・specs/contracts/api/student-app/openapi.yaml など）を
  共有するチケットを、依存も順番もなく（deps=[]）並列に投入すると、ほかのチケットのマージのたびに同じチケットで衝突が戻ってくる
  （C-0011 では #348 が 2 回衝突した）。
  ただし Engine にはすでに、よく衝突するファイル（7 日に 3 回以上・解消の費用 5 USD 以上。CHANGELOG.md は除く）に触る見込みのタスクを並べて
  投入する段（ADR 0027 の 2、orchestrator/dispatcher/serialize.py、plan.serialized）がある。README の束（17 件・49.17 USD）はその閾値を超えるが、
  窓（2026-10-29〜11-05）の中でその段が効いていたか、効いていたのに見込みのファイル（Plan の expected_files とチケットの本文のパス）が
  README などを外したのかは材料にない。投入の段が重なりを見なかったというのは分析役の推測。
scope:
  work: [plan.workflow, dev.build]
  artifacts: [Plan]
  files: [apps/backend/README.md, apps/backend/crates/server/src/lib.rs, specs/contracts/api/student-app/openapi.yaml]
  request_form: [ticket]
  roles: [supervisor]
acts_on: engine
confidence: hypothesis
evidence:
  - case: C-0011
  - pr: 345
  - event: "case.analyzed:644407"
status: active
verified_at: 2026-11-11
review_by: 2026-12-11
confidentiality: product
related: [K-0013, K-0020, K-0022, K-0017]
invalidate_when:
  - "窓の中の README・lib.rs・openapi.yaml の衝突の束のチケットについて plan.serialized を確かめ、並べ方が効いていたのに衝突が繰り返していた（原因は投入の並べ方ではなく、ファイルの作りか解く時機だった）"
  - "投入のときに見込みのファイルでよく衝突するファイルを共有するチケットを並べるようになったあと、同じチケットの衝突の繰り返しが減らなかった"
  - "見込みのファイル（expected_files）が README などの共有ファイルを外さなくなり、並べ方の後の窓で同じファイルの衝突の束が出なくなった"
decided_by: committee:D-0149
