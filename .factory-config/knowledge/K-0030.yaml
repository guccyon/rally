invalidate_when:
  - "続きのジョブへの指示が、PR 本文を追記せずその時点の要約として書き直し、取り込みの記録を handoff か PR コメントに残すよう求めるようになった"
  - "K-0001 の関所（記録を「## 工場の記録」の下の ### に置かせる）が配線されたあと、衝突の解消のたびの本文の指摘と body_fix が出なくなった（本文の外に出さなくても足りた）"
