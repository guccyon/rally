id: K-0016
theme: 4
kind: causal
statement: >-
  実装役の報告（handoff の summary.md）から PR 本文を組み立てる受け渡しで、本文の頭（## 概要 と ## 対応内容）が欠けたり、
  ## 概要 の前に余計な文が混じったりしても、組み立てたあとに本文の先頭が決まりの見出しで始まるかを確かめる段がないと、
  崩れた本文がそのまま PR に載り、検査・判定で本文の並びの指摘と本文の直しを生む（C-0008 では報告が箇条書きの途中の文から始まり、
  C-0006 でも冒頭の段落と ## 対応内容 が抜けていた）。どこで欠けたか（実装役の書き出しか、Engine の組み立てか）は、どちらの事例でも記録で確かめられていない。
scope:
  work: [dev.describe]
  artifacts: [PR.body]
  request_form: [ticket]
  roles: [implement, body_fix, judge]
acts_on: engine
confidence: hypothesis
evidence:
  - case: C-0008
  - pr: 678
  - event: "case.analyzed:370961"
  - case: C-0006
  - pr: 821
  - event: "case.analyzed:370935"
  - case: C-0009
  - pr: 247
  - event: "case.analyzed:522825"
status: active
verified_at: 2026-11-08
review_by: 2026-12-08
confidentiality: product
related: [K-0001, K-0005, K-0006, K-0009]
invalidate_when:
  - "summary.md から本文を組み立てたあとに、先頭が ## 概要 で始まるか、その前に文が混じっていないかを機械で確かめるようになった"
  - "実装役の会話の記録と summary.md を突き合わせ、欠けが実装役の書き出しの側だと分かった（その場合は Engine の組み立てではなく実装役への指示の知見に直す）"
enforcement:
  level: deterministic
  solutions:
    - kind: ci_check
      what: >-
        議決 D-0078（Issue #1219 の起票時の番号は D-0077。PR #1212）の ci_check の案を入れた。tools/pr-body-check/check.mjs に head_not_first_heading を足し、本文の先頭（空行と、
        Closes #N・Refs #N の行と、途中終了の **未完了**: の行を除く）の最初の行が template.json の最初の見出し（## 概要）でなければ落とす
        （見出しのない文・箇条書き・ほかの見出し・### 概要・コードブロックのどれから始まっても外れ）。K-0001 の関所 tools/pr-body-check/gate.mjs は
        checkBody を使うので、続きのジョブの本文でも同じく落ち、body_fix の指摘（PR-002、「PR 本文 N 行目」）になる。
        Engine に当てる差分 tools/pr-body-check/engine/pr-body-gate.patch を広げ、worker/entrypoint.sh が報告（summary.md）から組んだ最初の本文（PR_BODY）を
        gh pr create の前に関所に照らし、外れたら作業を失わないよう組んだ本文のまま PR を作って、作った PR の URL に直した body_fix の入力を
        FACTORY_RESULT の body_gate（new_pr: true）と引き継ぎに残し、dispatcher の run_job が続きのジョブでない結果の body_gate も act_on_body_gate に回して
        判定役を待たずに body_fix を積むようにした（2・3 は人に回す）。tools/pr-body-check/k0016.mjs が事例 C-0008（job 3324 の「  - テストで次を確かめます。」から
        始まる報告、Closes の直後に見出しのない箇条書きが来て ## 概要 が後ろにある本文、job 3873 の ## 概要 の前に 1 文が付いた報告）と C-0006（冒頭の段落と
        ## 対応内容 が欠けた報告）の形を組み、gate.test.mjs で、それから組んだ最初の本文（未完了の印と Refs の形も）が head_not_first_heading で落ち
        （job 3873 の形はほかの rule では落ちない）、CLI が 1 を返し、## 概要 から始まる本文は通ることを確かめた。engine.test.mjs の (14)(15) で、
        差分を当てた手元の Engine（9f5f0be）の写しの新しい PR の作成の節を偽の gh で動かし、4 つの形で関所が 1 を返して PR を 1 回作り body_fix が積まれること、
        ## 概要 から始まる本文では関所が 0 を返して body_gate を残さないことを確かめた。(13) は Engine そのものが gh pr create の前に関所を呼ぶかを見る必須のテストで、
        関所を呼ばない手元の Engine では落ちる（差分を当てた Engine 全体の写しを ENGINE_DIR にすると通る）。差分を Engine に入れて ENGINE_REF を上げること、
        ci/pr-body-engine.yml を .github/workflows/ に写して必須のチェックにすることは建設者が行うので、まだ配線されておらず効き目は確かめていない
      issue: 1219
      at: 2026-11-08
      decided_by: committee:D-0078
      requires_check:
        - runs: tools/pr-body-check/gate.test.mjs
          workflow: .github/workflows/pr-body-engine.yml
        - runs: tools/pr-body-check/engine.test.mjs
          workflow: .github/workflows/pr-body-engine.yml
      wired: false
      verified: false
    - kind: schema
      what: >-
        議決 D-0117（PR #1305）の schema の案（issue 1219 の解決策に requires_check を足す）を入れた。issue 1219 の解決策の requires_check に
        .github/workflows/pr-body-engine.yml の tools/pr-body-check/gate.test.mjs と tools/pr-body-check/engine.test.mjs を書いたので、
        tools/knowledge-enforcement-check/check.py が、その写しの pull_request でも走るジョブから両方を呼ぶ wired_by がないまま wired: true にすると
        requires_check_unwired で落とす（前は K-0001・K-0012 の同じ検査の項目と違って requires_check がなく、check.py の配線だけで wired と読ませられた）。
        test_check.py の RequiresCheckTest で、本物の K-*.yaml の requires_check にこの組があることを照らす。ci/pr-body-engine.yml を .github/workflows/ に写して
        必須のチェックにすることは建設者が行い、check.py を PR ごとに走らせる配線（ci/knowledge-enforcement.yml の写し）もまだないので、未配線・未確認
      issue: 1306
      at: 2026-11-09
      decided_by: committee:D-0117
      wired: false
      verified: false
    - kind: ci_check
      what: >-
        議決 D-0117（PR #1305）の ci_check の案（建設者が engine/pr-body-gate.patch を Engine に入れて ENGINE_REF を上げ、ci/pr-body-engine.yml を
        .github/workflows/ に写して必須のチェックにし、engine.test.mjs の (13) が手元の Engine そのもので通ることと、本物のジョブで ## 概要 から
        始まらない最初の本文に body_fix が積まれたことを cases/ に残してから wired と verified を true にする）のうち、ワーカーの権限で入れられる分を入れた。
        tools/pr-body-check/ci.test.mjs（ひな形の engine-test の node --test の中で走る）に、engine.test.mjs の (13)〜(15)（(14) は k0016.mjs の
        BROKEN_HEADS の 4 つの形ごと）が見張る名前の一覧と同じだけあり、TAP で走らせた結果でどれも pass と数えられ skip・todo が 0 かの見張りを足した。
        (13) を消す・名前を変える・(14) のループを外したり絞ったりする書き換えと、(13) を SKIP・TODO にする・落ちる・走らない結果は外れになることを確かめた。
        これで写しを必須のチェックにすれば、(13) を外して関所を呼ばない Engine の版のまま engine-test を通すことはできない。差分を当てた手元の Engine（2e402e5）の
        写しでは ci.test.mjs が通り、差分を当てない手元の Engine では (13) が fail で外れになることを確かめた。今の ENGINE_REF（9fee9c2）の版は手元になく走らせていない。
        差分を Engine に入れて ENGINE_REF を上げること（Engine への作用なので人の承認が要る）、写して必須にすること、本物のジョブでの記録は建設者が行うので
        （tools/pr-body-check/README.md の「配線の手順（建設者）」）、まだ配線されておらず効き目は確かめていない
      issue: 1307
      at: 2026-11-09
      decided_by: committee:D-0117
      requires_check:
        - runs: tools/pr-body-check/ci.test.mjs
          workflow: .github/workflows/pr-body-engine.yml
        - runs: tools/pr-body-check/engine.test.mjs
          workflow: .github/workflows/pr-body-engine.yml
      wired: false
      verified: false
decided_by: committee:D-0078
