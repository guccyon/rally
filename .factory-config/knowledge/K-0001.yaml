id: K-0001
theme: 4
kind: causal
statement: >-
  続きのジョブ（continue。既定ブランチとの衝突の解消など）の報告が、既存の PR 本文への追記になることが実装役に伝わらず、
  Engine も見出しの階層を変えずに本文の末尾に足すと、新しい PR と同じ見出しの組（## 概要・## 対応内容 など）が本文に 2 回出て、
  検査・判定・本文の修正のジョブを使う差し戻しになりやすい。
scope:
  work: [dev.describe]
  artifacts: [PR.body]
  request_form: [ticket]
  roles: [implement, inspect, judge, body_fix]
acts_on: context
confidence: hypothesis
evidence:
  - case: C-0001
  - case: C-0003
  - pr: 546
  - event: "case.analyzed:113682"
  - case: C-0004
  - pr: 534
  - event: "case.analyzed:113588"
  - case: C-0005
  - pr: 659
  - event: "case.analyzed:274379"
  - case: C-0007
  - pr: 290
  - event: "case.analyzed:370939"
status: active
verified_at: 2026-11-08
review_by: 2026-12-08
confidentiality: product
invalidate_when:
  - "続きのジョブへの指示が、報告を既存の PR 本文への追記（### の小見出しの下）として書くよう求めるようになった"
  - "Engine が続きのジョブの報告を本文に組み込むときに見出しの階層を下げるか、本文の見出しの重なりを機械で検査するようになった"
related: [K-0003, K-0004, K-0009, K-0010, K-0014]
enforcement:
  level: deterministic
  solutions:
    - kind: ci_check
      what: >-
        PR 本文で同じ ## 見出しが 2 回以上ないこと、「## 工場の記録」より後ろに ## 以上の見出しがないこと、
        続きのジョブの見出しが「## 工場の記録」の下の ### 以下にあることを見る決定論の検査（tools/pr-body-check/check.mjs）。
        PR 本文の更新（pr.head_updated・handoff.saved）のあと、検査役に回す前に呼ぶ想定。
        呼び出しの配線（Engine の検査の前段か CI）はまだ入っていないので、効き目はまだ確かめていない
      issue: 826
      at: 2026-11-03
      decided_by: committee:D-0001
      wired: false
      verified: false
    - kind: ci_check
      what: >-
        本文の更新の前の関所 tools/pr-body-check/gate.mjs を足した。続きのジョブの summary を組み込んだ本文（gh pr edit の前の NEW_BODY）を
        check.mjs の checkBody に照らし、同じ ## 見出しの重なりや「## 工場の記録」より後ろの ## があれば終了コード 1 で本文を書かせず、
        body_fix の入力（rubric_id PR-002、location「PR 本文 N 行目」）を返す。gate.test.mjs で、C-0005 の 21 回の追記（conflict 20 回・ci_failed 1 回）と
        同じ入力で落ち、1 回目の追記でもう落ちることを確かめた。engine.test.mjs が、Engine の worker/entrypoint.sh の本文を組む節と
        dispatcher の is_body_only・enqueue_body_fix を中身を変えずに動かし、今の Engine の組み込みでも C-0005 の入力で落ちること、
        関所の入力で body_fix が積まれることを確かめる。Engine の本文の更新が外れた本文を書かないことも必須のテストにしたが、今の Engine は関所を呼ばないので
        その形のときだけ todo にした（関所を呼ぶ形にした Engine の写しでは通ることを確かめた）。entrypoint.sh への配線と body_fix への回し方、
        CI（ci/pr-body-engine.yml を .github/workflows/ に写す）は建設者が入れるので、効き目はまだ確かめていない
      issue: 956
      at: 2026-11-05
      decided_by: committee:D-0013
      wired: false
      verified: false
    - kind: ci_check
      what: >-
        議決 D-0019 の ci_check の案のうち、ワーカーの権限で入れられる分を入れた。tools/pr-body-check/engine/pr-body-gate.patch が Engine に当てる差分で、
        worker/entrypoint.sh の続きのジョブの節で、NEW_BODY を gh pr edit に渡す直前に tools/pr-body-check/gate.mjs を呼び、0 以外なら本文を書かずに
        関所の出力（rubric_id PR-002・location「PR 本文 N 行目」の body_fix の入力）と書かなかった報告を FACTORY_RESULT の body_gate と引き継ぎに残し、
        dispatcher の act_on_body_gate が終了コード 1 なら判定役を待たずに enqueue_body_fix で body_fix を積み（書かなかった報告も切らずに全文を、引き継ぎの場所を添えて指摘として渡す）、2・3 なら人に回す。
        未完了の続きが仕上がった回は、報告を足さない本文が関所に通ればそれで仕上げ（未完了の印・Closes・題・ドラフトを外す）だけを先に書き、通らなければ人に回す。
        続きのジョブの記録の見出しも「## 工場の記録」の下の ### に下げ、## 見出しのない報告は止めずに書く。engine.test.mjs の (3)「外れた本文を書かない」の todo を外して
        必須にしたので、関所を呼ばない Engine（今の ENGINE_REF と手元の Engine）では落ちる。差分を当てた Engine の写しでは C-0005 の 21 回の続きのジョブで
        外れた本文を一度も書かず body_fix が積まれること（(4)〜(6)）、差分を当てた Engine 全体の写しを ENGINE_DIR にすると (3) を含め全部通ることを確かめた。
        差分を Engine に入れて ENGINE_REF を上げること、ci/pr-body-engine.yml を .github/workflows/ に写して必須のチェックにすることは建設者が行うので、
        まだ配線されておらず効き目は確かめていない
      issue: 975
      at: 2026-11-07
      decided_by: committee:D-0019
      wired: false
      verified: false
    - kind: ci_check
      what: >-
        議決 D-0032（Issue #1037 の起票時の番号は D-0030。PR #1036）の ci_check の案（建設者が engine/pr-body-gate.patch を Engine に入れて
        ENGINE_REF を上げ、同じ変更で ci/pr-body-engine.yml を .github/workflows/ に写して必須のチェックにし、関所を呼ばない Engine で
        engine.test.mjs の (3) が落ちることと、本物の続きのジョブで外れた本文が書かれず body_fix が積まれたことを記録してから wired と verified を true にする）のうち、
        ワーカーの権限で入れられる分を入れた。tools/pr-body-check/ci.test.mjs（engine-test の node --test の中で走る）が、ひな形と写しで、on が絞り込みのない
        pull_request だけで if:・continue-on-error・needs がなく、ENGINE_REF がワークフローの env に 40 桁の SHA で 1 行だけあり Engine を取る ref がそれを使い、
        テストの手順が ENGINE_DIR を渡して道を渡さずに node --test で全部走らせ exit $rc で落ちることを見て、21 の直しで外れることを確かめた。
        ENGINE_REF が tools/sendback-check/ci/sendback-engine.yml と同じ版か、写しが ENGINE_REF の行のほかでひな形とずれていないかも見る。
        sendback-engine.yml にも engine-test のジョブがあり、同じ名前では必須のチェックがどちらの報告でも満たされるので、ひな形の engine-test に
        name: pr-body-engine-test を付けた。tools/pr-body-check/protection.mjs が gh api の branch protection（古い形か rulesets）の JSON を読み、
        写しがない（workflow_not_copied）・チェックの名前が違う（check_name_changed）・必須にない（required_check_missing）・ほかのジョブも同じ名前を
        報告する（check_name_shared）で落とすことを protection.test.mjs で確かめた。手元の Engine（2490db6）では (3) が落ち、差分を当てた写しでは
        npm test が全部通ることを確かめたが、今の ENGINE_REF（9fee9c2）の版は手元になく走らせていない。差分を Engine に入れること・写すこと・必須にすること・
        本物の続きのジョブでの記録は建設者が行うので（README の「配線の手順（建設者）」）、まだ配線されておらず効き目は確かめていない
      issue: 1037
      at: 2026-11-07
