id: K-0001
theme: 4
kind: causal
statement: >-
  続きのジョブ（continue。既定ブランチとの衝突の解消など）の報告が、既存の PR 本文への追記になることが実装役に伝わらず、
  Engine も見出しの階層を変えずに本文の末尾に足すと、新しい PR と同じ見出しの組（## 概要・## 対応内容 など）が本文に 2 回出て、
  検査・判定・本文の修正のジョブを使う差し戻しになりやすい。
scope:
  work: [dev.describe]
  artifacts: [PR.body]
  request_form: [ticket]
  roles: [implement, inspect, judge, body_fix]
acts_on: context
confidence: hypothesis
evidence:
  - case: C-0001
  - case: C-0003
  - pr: 546
  - event: "case.analyzed:113682"
  - case: C-0004
  - pr: 534
  - event: "case.analyzed:113588"
  - case: C-0005
  - pr: 659
  - event: "case.analyzed:274379"
  - case: C-0007
  - pr: 290
  - event: "case.analyzed:370939"
status: active
verified_at: 2026-11-08
review_by: 2026-12-08
confidentiality: product
invalidate_when:
  - "続きのジョブへの指示が、報告を既存の PR 本文への追記（### の小見出しの下）として書くよう求めるようになった"
  - "Engine が続きのジョブの報告を本文に組み込むときに見出しの階層を下げるか、本文の見出しの重なりを機械で検査するようになった"
related: [K-0003, K-0004, K-0009, K-0010, K-0014]
enforcement:
  level: deterministic
  solutions:
    - kind: ci_check
      what: >-
        PR 本文で同じ ## 見出しが 2 回以上ないこと、「## 工場の記録」より後ろに ## 以上の見出しがないこと、
        続きのジョブの見出しが「## 工場の記録」の下の ### 以下にあることを見る決定論の検査（tools/pr-body-check/check.mjs）。
        PR 本文の更新（pr.head_updated・handoff.saved）のあと、検査役に回す前に呼ぶ想定。
        呼び出しの配線（Engine の検査の前段か CI）はまだ入っていないので、効き目はまだ確かめていない
      issue: 826
