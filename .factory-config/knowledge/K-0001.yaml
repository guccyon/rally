id: K-0001
theme: 4
kind: causal
statement: >-
  実装役の最後の文から handoff の summary.md（PR 本文の元）へ移す途中で、本文の冒頭（見出しと最初の箇条書き）が欠けることがある。
  受け渡しの時点で両者を突き合わせる段がないため、欠けは PR を出したあとの検査と judge まで気づかれない。
scope:
  roles: [implement, inspect, judge]
confidence: hypothesis
evidence:
  - case: C-0001
  - pr: "372"
  - event: "case.analyzed:39249"
status: active
verified_at: 2026-10-31
review_by: 2026-11-30
confidentiality: product
invalidate_when:
  - "handoff.saved の時点で最後の文と summary.md の見出し・行数を突き合わせる処理が Engine に入った"
  - "summary の取り出し方の不具合が特定され、冒頭が欠けない形に直った"
proposal:
  target: role_line_engine
  text: >-
    handoff.saved の時点で、実装役の最後の文と summary.md の見出しや行数を突き合わせる処理を Engine に足す。
    冒頭が欠けていたら、その場で最後の文から作り直すか、警告のイベントを出す。summary の取り出し方の不具合を調べる改善のチケットも起こす。
  recurring: true
related: [K-0002]
decided_by: committee:D-0001
