    - kind: test
      what: >-
        議決 D-0068（Issue #1180 の起票時の番号は D-0066。PR #1176）の test の案を入れた。ci.test.mjs は写しがひな形と同じかを見るだけで、
        ひな形と写しを一緒に変えると、定期の照合（pr-body-protection.yml）そのものが黙って止まる外れ方を見張れなかった。
        tools/pr-body-check/ci.test.mjs に、ひな形と、.github/workflows/pr-body-protection.yml の写しがあれば写しそのものについて、
        on の schedule に cron があり workflow_dispatch があること、continue-on-error がなく、protection のジョブと PR_BODY_PROTECTION_TOKEN を読む手順に if: がないこと、
        その手順を偽の gh で動かし、トークンがない・権限がない（403）・rulesets を読めないのどれでも protection_unreadable の ::error を出して飛ばさず落ちることを確かめるテストを足した。
        schedule・cron・workflow_dispatch を外す、on を 1 行の列にする、ジョブや読む手順に if: や continue-on-error を足す、読めないときに 0 で抜ける、ジョブの id を変えるの
        11 通りの直しがどれも外れになり、今のひな形は通ることを確かめた。写しを置いた仮のリポジトリで、ひな形のままの写しは通り、workflow_dispatch を外した写しは落ちることも確かめた。
        このテストは engine-test の node --test の中で走るが、ひな形 ci/pr-body-engine.yml と ci/pr-body-protection.yml はまだ .github/workflows/ に写されておらず
