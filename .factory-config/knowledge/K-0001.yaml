id: K-0001
theme: 6
kind: causal
statement: >-
  採用した指摘を直す続きのジョブ（review_fix）と同じ PR のマージが並んで進むと、直しが PR に入らないままマージされ、
  直しは差し戻しに回るか、マージ済みの PR への push の競合が起きやすい。続きのジョブで直す間はマージを待たせるか、
  はじめから差し戻しに回すかを先に決め、どちらか一方の道だけを通す。
