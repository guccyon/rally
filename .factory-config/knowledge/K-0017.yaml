id: K-0017
theme: 6
kind: causal
statement: >-
  チケットの大きさ（触る領域の数・契約や schema の差分・予想の行数）を投入の前に測り、1 ジョブのターン予算を超えるものを
  領域ごとの子チケットに分ける段がないと、その大きさのまま 1 ジョブ（tier-large）に投入されてターン上限で途中終了し、
  rerun で同じ規模の実装をやり直して、費用が中央値の数倍に膨らみやすい（C-0009 では 4 領域・46 ファイル・3912 行のチケットで、
  1 回目の 7.31 USD が途中終了の分として残り、合計 17.0 USD になった）。根拠は例の 1 チケットだけで、
  束 process:cost_outlier:code_change のほかの 36 件が同じ型かは確かめていない。rerun が仕掛かりを引き継がずに作り直したことは別の仕組みで、この主張には入れない。
