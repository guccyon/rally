id: K-0017
theme: 6
kind: causal
statement: >-
  チケットの大きさ（触る領域の数・契約や schema の差分・予想の行数）を投入の前に測り、1 ジョブのターン予算の近くの大きさのものを
  領域ごとの子チケットに分ける段がないと、その大きさのまま 1 ジョブ（tier-large）に投入され、ターン上限で途中終了しやすい。
  大きさだけで途中終了が決まるわけではない（C-0009 では、4 領域・46 ファイル・3912 行のチケットの 1 回目の job 260 が途中終了したが、
  rerun の job 261 は仕掛かりなしで同じ大きさを作り直し、1 ジョブで PR #247 を出した）。
  主張は途中終了が起きやすいことまでで、費用の膨らみ（rerun が仕掛かりを引き継がずに作り直したこと）は別の仕組みなので入れない。
  例のチケットの合計 17.0 USD は束 process:cost_outlier:code_change の 1 件平均（約 17.8 USD）とほぼ同じで、束の費用を押し上げた代表ではなく平均並みの 1 件である。
  C-0015（PR #995）でも、plan が design_system の 1 段だけでデザインの正本・両アプリのテーマと部品を 1 PR に入れ、plan.outcome が undersized（XL）、
  62 ファイル・128 ターンになった（分析役の見込みは「繰り返しそう: いいえ」で、この型の根拠は 2 件）。
  根拠はこの 1 チケットだけで、束のほかの 36 件が同じ型かは確かめていない。
