id: K-0028
theme: 6
kind: causal
statement: >-
  共有ファイルの衝突を直すファイルの順は、ファイルごとの衝突の解消の束（process:conflict_fix:<ファイル>）の大きさではなく、
  そのファイルが衝突の解消の回に入っている割合で決める。束の小さいファイル（apps/backend/crates/interface/src/lib.rs など）だけを追記しない作りに直しても、
  同じ回に一緒に衝突するファイル（CHANGELOG.md）が残っていれば回は減らない（C-0013 では interface/src/lib.rs の束 10 件・24.43 USD の例の PR #362 で、
  衝突の解消 8 回のすべてに CHANGELOG.md が入り、lib.rs が入ったのは 2 回だけだった）。
  1 本の衝突の解消のジョブが衝突したファイルのすべてが衝突しなくなるまで消えないという仕組みは K-0022 の主張で、この知見は直す順の決め方に絞る。
  ただし束の費用がファイルの数で割られているというのは分析役の読み（0.94 ≒ 9.40 / 約 10）で、ジョブ 485〜575 が CHANGELOG の断片方式
  （2026-11-03）の前か後かは材料にない。lib.rs の中で何がぶつかったか（mod 宣言かルートの登録か）も確かめていない。
scope:
