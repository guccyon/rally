id: K-0025
theme: 4
kind: causal
statement: >-
  衝突を解く続きのジョブへの指示（continue.enqueued）が、branch・reason: conflict・pr_number だけで、どのファイルがどう衝突したかを渡さないと、
  指示役が衝突の大きさを知らず、機械的な衝突を小さな対応（tier-small・機械的な解消）に振り分けられない（C-0011 では conflict.files が 2026-11-03 の
  backfill で後から足されたもので、continue.enqueued に衝突ファイルがなかった）。K-0014 は「集計で型が見えない」という記録の側の主張で、
  この知見は「積むときの指示に載せないと対応を選べない」という使う側の主張。ただし、K-0014 の担保（conflict_files を積む時点で必須にする検査）が
  Engine に入ったあとの記録では、この欠けが残っているかを確かめていない。ファイルを渡せば小さな対応を選べるかも、分析役の見込み（推測）。
scope:
  work: [dev.build]
  artifacts: [PR.code]
  roles: [supervisor]
  request_form: [ticket]
acts_on: process
confidence: hypothesis
evidence:
  - case: C-0011
  - pr: 345
  - event: "case.analyzed:523039"
status: draft
verified_at: 2026-11-11
review_by: 2026-12-11
confidentiality: product
related: [K-0014, K-0022, K-0010]
invalidate_when:
  - "continue.enqueued の payload に衝突したファイルの一覧が載り、指示役がそれを使って tier や解消の道を選ぶようになった"
  - "衝突ファイルを渡しても、続きのジョブの tier や解消の道の選び方が変わらなかった（選ぶ仕組みが別のところにあった）"
