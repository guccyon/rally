id: K-0025
theme: 4
kind: causal
statement: >-
  実装役の報告（handoff の summary.md）から組んだ PR 本文の頭が欠ける型（K-0016。C-0012 もその再現として K-0016 の evidence に入れた）について、
  欠けた場所は実装役の書き出しではなく、実装役の最後の文から summary.md を作る取り出しの側で、取り出しが報告の一部しか拾わないことが原因だという仮説。
  C-0012 では実装役の会話の記録の最後の文が ## 概要 から始まるのに、summary.md と PR 本文は箇条書きの途中から始まっていた。
  分析役は最後の文が複数のテキストの塊に分かれ後ろの塊だけを拾ったと推測し、2026-11-11 の手元の Engine（34a53af）の orchestrator/worker/entrypoint.sh は報告を tail -80 で切っている（80 行を超える報告は頭が落ちる）。
  どこで落ちたかと、ジョブが動いた時点の Engine が同じだったかは確かめていない。
  主張は欠けた場所が取り出しの側だという原因の仮説に絞る。組んだ本文の先頭を確かめる段がなく、欠けた本文が検査・判定の指摘と本文の直しを生むことは K-0016 の主張。
scope:
  work: [dev.describe]
  artifacts: [PR.body]
  request_form: [ticket]
  roles: [implement, inspect, judge]
acts_on: engine
confidence: hypothesis
evidence:
  - case: C-0012
  - pr: 982
  - event: "case.analyzed:644507"
status: active
verified_at: 2026-11-16
review_by: 2026-12-16
confidentiality: product
related: [K-0016, K-0011, K-0009]
invalidate_when:
  - "summary.md を作るときに実装役の最後の文を切らずに全部渡し、PR 本文の見出しの組を元の文と機械で照らすようになった"
  - "ジョブが動いた時点の Engine と取り出しの記録を確かめ、欠けが取り出しの側ではなかった（実装役の最後の文そのものが欠けていた）と分かった"
  - "80 行を超える報告と超えない報告を比べ、頭の欠けが報告の長さとも塊の分かれ方とも関係なく起きていると分かった"
decided_by: committee:D-0151
