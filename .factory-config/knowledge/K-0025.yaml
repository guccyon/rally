id: K-0025
theme: 4
kind: causal
statement: >-
  衝突を解く続きのジョブへの指示に衝突したファイルの一覧が載っても、指示役がそれを使って続きのジョブの tier や解消の道
  （tier-small・機械的な解消）を選ばないと、衝突の大きさに合った対応にならない（C-0011 では、指示の continue.enqueued に衝突ファイルがなく、
  conflict.files は 2026-11-03 の backfill で後から足されたもので、続きのジョブ 433 は tier-large だった）。
  衝突ファイルを積む時点で載せること自体は K-0014 の担保（continue.enqueued の reason=conflict で conflict_files を必須にする。2026-11-08）で担保済みなので、
  この知見は載ったファイルの使い道に限る。C-0011 の窓（10/28〜11/04）はその担保の前なので、衝突ファイルがなかったのは担保の前の記録である。
  ファイルを使えば小さな対応を選べるかは、分析役の見込み（推測）で、担保のあとの記録で確かめていない。
scope:
