enforcement:
  level: deterministic
  solutions:
    - kind: schema
      what: >-
        judgment.judged の payload で verdict が adopt なら subject（provisional = 仮決めの承認、defect = 欠陥の採用）を必須にし、
        差し戻しの incident は adopted_defects と approved_provisionals に分けて、2 つを混ぜた合計の adopted を置かないことを
        JSON Schema（tools/judgment-event-check/schema/）と決定論の検査（tools/judgment-event-check/check.mjs）で見る。
        今の Engine はイベントに subject を載せず incident に合計の adopted を書くので、書く側を合わせることと
        呼び出しの配線（Engine の書く前の検査）はまだ入っておらず、効き目はまだ確かめていない。
        approve_provisional などの言葉の定義は承認の線（ADR 0023・0024）を経てから入れる
      issue: 903
      at: 2026-11-05
      decided_by: committee:D-0004
