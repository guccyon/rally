id: K-0009
theme: 4
kind: causal
statement: >-
  検査の採用済みの指摘（PR-002 など）と、本文を直す役（body_fix）が決めた本文の書き方の決まりが、次に PR 本文を書き足す役
  （続きのジョブの summary と Engine の追記）の入力に入らないと、body_fix が本文を直しても次の取り込みでまた崩れ、
  同じ指摘が採用され続ける。
scope:
  work: [dev.describe]
  artifacts: [PR.body]
  roles: [implement, body_fix, judge]
acts_on: engine
confidence: hypothesis
evidence:
  - case: C-0005
  - pr: 659
  - event: "case.analyzed:274379"
status: active
verified_at: 2026-11-05
review_by: 2026-12-05
confidentiality: product
related: [K-0001, K-0006]
invalidate_when:
  - "continue（conflict/ci_failed）の implement ジョブの入力に、未解消の採用済みの指摘と body_fix が決めた本文の決まりが入るようになった"
  - "続きのジョブの報告が PR 本文に入るときに、決まり（## を足さないなど）が機械で守られるようになった"
enforcement:
  level: deterministic
  solutions:
    - kind: test
      what: >-
        continue（conflict・ci_failed）の implement ジョブがワーカーに渡す入力に、その PR の未解消の採用済みの指摘の id（adopted_defects[].rubric_id）と
        body_fix が残した本文の決まり（pr.body_amended の rules を body_rules に）が入ることを、線（tools/continue-input-check/line.mjs）と
        そのテスト（line.test.mjs）にした。採用済みの指摘がある PR で入力にその id がなければ missing_defect_id、入力を渡さなければ input_missing で落ちる。
        tools/continue-input-check/engine.test.mjs が、engine_harness.py で Engine の record_judged・act_on_judgment・conflict_step・ci_fix_step・
        continuation.enqueue を中身を変えずに取り出して動かし（judge が PR-002 を採用 → body_fix → 衝突か CI 落ちで続きのジョブ）、渡す入力を線に照らす。
        今の Engine は conflict に入力を渡さず、ci_failed には CI の合図（head_sha・failed）だけを渡すので外れ、その今の形のときだけ todo にした。
        形が変わったら id と決まりがなければ落ちることは Engine の写しで確かめた。Engine の入力の組み立てと body_fix の rules の記録、
        CI への配線は建設者が入れるので、効き目はまだ確かめていない
      issue: 955
      at: 2026-11-05
      decided_by: committee:D-0013
      wired: false
      verified: false
    - kind: ci_check
      what: >-
        知見の委員会の週 1 の定例で、K-0001・K-0006・K-0009 の担保を新しい検査を足さずに今ある道具の配線で効かせると決めた（ADR 0024。Issue #1120）。
        配線するのは tools/pr-body-check の check.mjs（同じ ## 見出しの重なりと、見出しの定義 template.json との順・欠け・外の見出しの位置）・gate.mjs
        （本文の更新の前の関所。外れたら本文を書かずに body_fix に回す）と、それを Engine の続きのジョブの本文の更新から呼ぶ差分 engine/pr-body-gate.patch。
        建設者が差分を Engine に入れて ENGINE_REF を上げ、ci/pr-body-engine.yml を .github/workflows/ に写して pr-body-engine-test を必須のチェックにし、
        本物の続きのジョブで外れた本文が書かれず body_fix に回ったことを記録してから wired と verified を true にする（手順は tools/pr-body-check/README.md の
        「配線の手順（建設者）」）。それまでは K-0001・K-0006・K-0009 に新しい担保の Issue を起こさない。この変更ではワーカーの権限で道具を足しも直しもしていない。
        手元の Engine（57069a8）に engine/pr-body-gate.patch が git apply --check で当たり、その Engine を ENGINE_DIR にすると engine.test.mjs の (3)
        （関所を呼ばない Engine は外れた本文を書く）だけが落ち、差分を当てた写しを ENGINE_DIR にして CI=true で node --test が全部通る（写しがないことを見る 3 件は飛ばし）ことを確かめた。
        今の ENGINE_REF（9fee9c2）の版は手元になく走らせていない。.github/workflows/ にまだ写されておらず、配線されておらず効き目は確かめていない
      issue: 1120
      at: 2026-11-08
      wired: false
      verified: false
decided_by: committee:D-0013
