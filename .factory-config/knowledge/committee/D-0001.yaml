  - K-0002 の「PR 本文の乱れが増える」は K-0001 の仕組みがあって初めて起きる結果なので、K-0002 の主張からは外して衝突と費用の話に絞ってください。
  - どちらも根拠は 1 件の事例だけなので、確かさは hypothesis のままが妥当です。
