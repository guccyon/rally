  - K-0004 の「追記だけの衝突に tier-large のジョブが走る」は、衝突したファイルが CHANGELOG.md だけかどうかで機械的に振り分けられますが、Engine
    の割り当てに作用するので、実装するには人の承認が要ります。
  - どちらも C-0002 一件だけが根拠の hypothesis なので、確かさは今のままでよいです。担保は confirmed に上がるのを待たずに改善チケットとして先に作ってよいと考えます。
  - 知見と事例にあるのは PR・Issue・ジョブの番号と費用だけで、利用者を特定できる情報は見当たりません。
