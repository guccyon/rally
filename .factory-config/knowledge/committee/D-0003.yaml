enforcement:
- knowledge: K-0003
  level: deterministic
  solution_kind: ci_check
  proposal: PR 本文が PR テンプレートの必須の見出し（## 背景・## 問題・## 対応内容 など）をそれぞれ 1 回ずつ持つかを確かめる CI
    チェックを足し、pr.head_updated と pr.body_amended のたびに走らせる。続きのジョブの報告が足されたときに、トップレベルの「##」見出しが重複していれば落とす。
- knowledge: K-0003
  level: checklist
  solution_kind: overlay_rule
  proposal: 実装役の overlay に、summary.md の見出しを PR テンプレートと同じにすることと、続きのジョブの報告は「### 工場の記録」の下に入れ子にすることをルールとして入れる。あわせて、shadow
    の rubric（OV-001・PR-002）の本文を judge の入力に渡す。
- knowledge: K-0004
  level: deterministic
  solution_kind: config
  proposal: .gitattributes に「CHANGELOG.md merge=union」を設定するか、changelog.d/ のチケットごとの断片ファイルに分けてリリースのときにまとめる。衝突したファイルが
    CHANGELOG.md だけのときは、supervisor が tier-small のジョブか自動解消に回すよう Engine の割り当てに条件を足す（これは人の承認が要る）。
