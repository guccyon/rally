    1 つにまとめているので、前者だけに絞り、重複のほうは K-0004 か別の知見に移してください。
  - K-0004 も、CHANGELOG.md の追記の衝突、tier-large の続きのジョブの費用が最初の実装を上回ること、報告が本文に足されることの 3
    つの主張を 1 文に束ねていて、費用の比較は 1 件の観測（3.29・3.54 USD 対 2.97 USD）にすぎないので、主張から外すか事例の記述にとどめてください。
  - 反例として、並列のチケットが CHANGELOG.md に触れない場合や、先にマージされた PR が [Unreleased] の別の節に足した場合は衝突しないので、K-0004
    には「同じ節に追記する PR が並列で走るとき」という条件を明記してください。
  - K-0003 の scope.roles に judge が入っていますが、statement は judge について何も述べておらず（rubric の本文が
    judge に渡らない件は事例にしか出てこない）、主張と範囲が合っていないので judge を外すか主張に含めてください。
  - K-0004 の scope.paths の "CHANGELOG.md" は specs/design/CHANGELOG.md のような別の CHANGELOG
    にも当たりうるので、リポジトリのルートの CHANGELOG.md だけを指すように範囲を絞ってください。
