- role: dissent
  vote: sendback
  reasons:
  - 'K-0003 と K-0004 の根拠は C-0002（PR #548 の 1 件）だけなのに、K-0003 は「毎回の指摘になる」、K-0004 は「マージが入るたびに決まった衝突が起き」と言い切っていて、1
