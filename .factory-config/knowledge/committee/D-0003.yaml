- role: enforcement
  vote: enforce
  reasons:
  - K-0003 が言う「PR 本文にテンプレートの見出し（背景・問題）がない」は、本文の見出しを機械的に見ればはっきり判定できるので、文脈として渡すより CI
    の検査で止める方が確かです。
