  proposal: Engine の worker/entrypoint.sh で、新しい PR の道でも push と gh pr create の直前に origin
    の既定ブランチを fetch して取り込み、衝突したら同じセッションで解いてから開く（解けなければ PR を開かずに失敗として返す）ようにし、同じ変更で engine
    のテストに「新しい PR の道で既定ブランチの取り込みが gh pr create より前にある」「取り込みが衝突したまま PR を開かない」の 2 つを足して
    CI で必須にする。効き目は配線の後の窓で pr.opened と continue.enqueued(reason=conflict) が数秒差の PR
    の件数を数えて確かめ、それまで verified は false のままにする。
