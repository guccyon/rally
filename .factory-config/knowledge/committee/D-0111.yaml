  level: deterministic
  solution_kind: test
  proposal: 工場の CI に Postgres のサービスコンテナと psql を用意して DATABASE_URL を渡し、tools/conflict-check
    の WindowSqlTest を飛ばさず走らせる job を足し、その job では psql か DATABASE_URL がないときに skip ではなく失敗にする。あわせて
    window-events.sql が窓の中の pr.conflicted・continue.enqueued・handoff.saved を引き、窓の外（差分を当てた時刻より前・直近
    8 日より前）を引かないことを fixture の行で確かめ、SQL の誤りで空の列を照らして緑になることを防ぐ。
