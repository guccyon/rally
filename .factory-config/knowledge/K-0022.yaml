id: K-0022
theme: 6
kind: causal
statement: >-
  どのチケットも同じ場所に足す共有ファイル（apps/backend/README.md の機能ごとの節、apps/backend/crates/server/src/lib.rs、
  specs/contracts/api/student-app/openapi.yaml など）を 1 つのファイルのまま残すと、並列に流れるチケットどうしがそこで衝突し、
  並列の数とともに衝突の解消のジョブが増える（C-0011 では README の束が 11 チケットに 17 件・49.17 USD、前の窓は 0 件）。
  1 本の衝突の解消のジョブは衝突したファイルのすべてが衝突しなくなって初めて消えるので、CHANGELOG.md だけを断片にしても（K-0002）、
  ほかの共有ファイルが残っていればジョブは残る（例の PR #345 は CHANGELOG.md・README・lib.rs・openapi.yaml の 4 つで衝突した）。
  この知見は共有ファイルの衝突の一般の主張で、この仕組みはここに置く。.gitattributes の merge=union のような機械的な解消は、
  行を足すだけの追記型の節に限る（既存の 1 行のセルを書き換える作りには合わず、別の手当てが要ることは K-0031。直す順を衝突の解消の回に入っている割合で決めることは K-0028）。
  ただし束の費用がジョブの費用を衝突したファイルの数で均等に割ったものだというのは分析役の読み（0.97 = 3.88 / 4）で、
  窓（2026-10-29〜11-05）は断片方式（2026-11-03）とまたがり、例の #336 がその前か後かは材料にない。
scope:
