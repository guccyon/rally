id: "0001"
ticket: "github:guccyon/rally#1"
gate: L4
rubric_ids: [ARCH-002]           # ドメインの定義を外側（手元の推測）から持ち込まない。用語整合率の対象
pair:
  a: { ref: "github:guccyon/rally#2", job: 12, note: "specs/ に前提がない状態でワーカーが推測で定義した" }
  b: { ref: "github:guccyon/rally#4", job: 13, note: "specs/product-context.md と context-map.yaml を読んでから定義した" }
