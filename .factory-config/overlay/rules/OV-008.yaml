  - "github:guccyon/rally#314"
  - "github:guccyon/rally#357"
signature: "rubric:ARCH-007"
check:
  kind: rubric
  text: >-
    追加・変更した失敗の経路が、種類を型で残さずに文言にしているときは欠陥とする。例: infra / application の関数が `Result<_, String>` や
    `format!(...)`・文字列リテラルの `.into()` で作った `Box<dyn Error>` で失敗を返す（ほかの変種は型のあるエラーを包んでいるのに 1 つだけ文字列にする場合を含む）、
    画面や API クライアントが `response.message === errorMessage(...)` のように表示用の文言を比べて失敗の種類（422 `validation_failed` など）を見分ける、
    クライアントの境界で専用の例外に包むのが一部の失敗だけで、同じ「契約に反する応答」の項目の欠落・型違い（`as int` などの `TypeError`）が包まれずに漏れる。
    専用のエラー型（Display と Error を実装した struct / enum の変種）や `code`・status で失敗を返し、文言は Display か表示する境界で組み立てている差分、
    読み取りの側で型と必須の項目を確かめて境界が包む例外にそろえている差分は欠陥としない。
