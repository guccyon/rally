# 出荷の形（factory-engine の ADR 0012）。工場の shipper が読む。
# イメージは部品ごとに <製品>-<部品>:<版> の名前で作り、compose には env の名前で渡す。
# 環境は staging（自動で出す）と prod（承認ボタンで出す）。どちらも建設者の端末の Docker の別のプロジェクトで、DB を別に持つ。
schema_version: "0.1"
compose: deploy/compose.yaml
images:
  backend:
    context: apps/backend
    env: BACKEND_IMAGE
    # この端末は Docker Hub からベースのイメージを取れないことがあるので、手元の同じ Debian bookworm のイメージで作る（2026-10-30）。
    # 取れるようになったら build_args を消せば Dockerfile の既定（rust:1-bookworm・debian:bookworm-slim）に戻る
    build_args: { BUILD_IMAGE: "factory-worker:rust", RUNTIME_IMAGE: "factory-worker:p0" }
  admin-web:
    context: apps/admin-web
    env: ADMIN_WEB_IMAGE
    build_args: { NODE_IMAGE: "factory-worker:p0" }
  # 生徒アプリの Web 版（Flutter）。工場の手元の Flutter のイメージで作る
  student-web:
    context: apps/student-app
    env: STUDENT_WEB_IMAGE
    build_args: { FLUTTER_IMAGE: "factory-worker:flutter", FLUTTER_USER: "worker", NODE_IMAGE: "factory-worker:p0" }
environments:
  staging:
    env: { BACKEND_PORT: 18080, ADMIN_WEB_PORT: 13000, STUDENT_WEB_PORT: 13100, POSTGRES_IMAGE: "postgres:17-alpine" }
  prod:
    approval: true
    env: { BACKEND_PORT: 28080, ADMIN_WEB_PORT: 23000, STUDENT_WEB_PORT: 23100, POSTGRES_IMAGE: "postgres:17-alpine" }
# 合成シード（apps/backend/README の「合成シード」）。shipper が環境ごとに 1 回だけ、起動を確かめたあとに書く。
# 種を固定するので同じデータになる。prod には書かない（本番相当の環境は空から始める）
seed:
  environments: [staging]
  service: backend
  command: ["seed", "--seed", "42"]
# 触れる環境（factory-engine の ADR 0028 の touchable_env）。Gen1 は staging を QA の環境と兼ねる。
# shipper は出したあと、入口の URL（工場の SHIP_TOUCH_HOST とその環境のポート）とログインの手がかりを release.touchable に残す。
# bind_env は人の端末から届く待ち受けを渡す compose の変数（工場の SHIP_TOUCH_BIND。未設定なら 127.0.0.1 のまま）。
# reset は「シードから入れ直す」ときに DB を空にするコマンド（staging だけ。合成シードしかない環境なので消してよい）
touch:
  environments: [staging]
  bind_env: WEB_BIND_HOST
  entries:
    - { label: "生徒アプリ（スマートフォンのブラウザで開く。最初にアカウントを登録する）", port_env: STUDENT_WEB_PORT, path: /, qr: true }
    - { label: "本部・コーチの管理画面（ロールを選び、下のトークンでログイン）", port_env: ADMIN_WEB_PORT, path: /, qr: true }
  # ログインの手がかり。出力は JSON の配列 [{"label": ..., "value": ...}]（モックのトークン。apps/backend の README の「認証」）
  # 本部も合成シードが登録したアカウントを指す（モックのトークンはどの ID でも本部として通るが、お休みなど本部の操作の記録は
  # 実在の本部のアカウントへの外部キーを持ち、登録のない ID では 500 になる。Issue #1480。検査は apps/backend/crates/seed/tests/touch_accounts.rs）
  accounts:
    service: postgres
    command:
      - psql
      - -U
      - rally
      - -d
      - rally
      - -At
      - -c
      - >-
        select coalesce(json_agg(a), '[]') from (
          select * from (select '本部: ' || display_name as label, 'mock.headquarters.' || account_id as value
                         from identity.accounts where role = 'headquarters' order by created_at, account_id limit 1) h
          union all
          select * from (select 'コーチ: ' || display_name, 'mock.coach.' || account_id
                         from identity.accounts where role = 'coach' order by created_at, account_id limit 3) c
        ) a
  # 時間をまたぐシナリオ（factory-engine の ADR 0028 の scenario_time）。QA が環境の再起動と時計の進めを起こせる。
  # restart は再起動する部品（DB は残す）。clock_env はサーバーの時計を進める秒数を渡す compose の変数（backend の CLOCK_OFFSET_SECONDS）。
  # 進めた時計は、次に版を出す・戻す・入れ直すときに 0 に戻る
  restart: [backend]
  clock_env: CLOCK_OFFSET_SECONDS
  # 障害の演習（factory-engine の ADR 0043 の O5）。factoryctl incident drill が触れる環境に 1 回流す。製品のコードは変えず、合成シードのデータだけを書き換える。
  # 元に戻すのは「シードから入れ直す」（drill-end）。s1_data_leak は、コーチの公開の自己紹介に生徒 1 人の名前・メールアドレス・電話番号を載せ、
  # どの生徒にも他人の個人情報が見える状態（quality_policy.yaml の s1 の data_leak）を作る
  drills:
    - id: s1_data_leak
      service: postgres
      command:
        - psql
        - -U
        - rally
        - -d
        - rally
        - -v
        - ON_ERROR_STOP=1
        - -c
        - >-
          update identity.coaches c set bio = left('連絡メモ: 生徒の ' || s.display_name || ' さん（' || s.email ||
                 '・090-1234-5678）の振替は来週火曜 18 時に。保護者の方にもこの番号で連絡済み。', 400)
          from (select display_name, email from identity.accounts where role = 'student' order by created_at, account_id limit 1) s
  reset:
    service: postgres
    command: ["psql", "-U", "rally", "-d", "postgres", "-v", "ON_ERROR_STOP=1",
              "-c", "drop database if exists rally with (force)", "-c", "create database rally owner rally"]
# PR ごとの使い捨て環境（factory-engine の ADR 0043 の O7 ephemeral_env）。shipper が PR の head を rally-pr-<番号> の compose で立てる。
# 値は base の環境（staging）のものを使い、*_PORT だけ枠の番号 × port_step をずらす（枠 1 は 19080・14000・14100、枠 2 は 20080・15000・15100）。
# 合成シード（seed）・入口（touch.entries）・ログインの手がかり（touch.accounts）は上と同じものを使う
ephemeral:
  base: staging
  port_step: 1000
  port_envs: [BACKEND_PORT, ADMIN_WEB_PORT, STUDENT_WEB_PORT]
# 製品の KPI の測り方（factory-engine の ADR 0043 の O2、週次の Report ライン）。工場の supervisor が毎週月曜の朝に staging で、shipper がこのコマンドを
# service の中で実行する。出力は {id: 数} の JSON（測れない値は null）。id・名前・よい向きは specs/analytics/kpi.yaml の KPI に合わせる。
# 式の正本は specs/analytics/kpi.yaml。Gen1 は行動ログを staging に貯めていない（ANALYTICS_SINK は既定のプロセス内）ので、
# 合成の利用者のループ（ADR 0043 の O4）ができるまでは、staging の DB から近似する（窓は kpi.yaml と同じ 30 日）。
# expected は目安の幅（外れたら異常）、change_alert は前回からの変化の比の閾値（悪い向きにこれ以上動いたら異常。既定 0.2）。
# 値は仮置き（運用パラメータとして工場が調整してよい）。異常は工場が Opportunity の下書きにして受信トレイに出す（起票はしない）
kpi:
  environments: [staging]
  service: postgres
  metrics:
    - { id: slot_fill_rate, ja: "コーチの予約枠充足率", unit: "", direction: up_is_good, expected: [0.3, 0.95] }
    - { id: video_review_lead_time, ja: "添削の返却リードタイム", unit: "時間", direction: down_is_good, expected: [0, 48] }
    - { id: first_lesson_retention_1m, ja: "初回レッスン後の 1 ヶ月継続率", unit: "", direction: up_is_good, expected: [0.2, 1] }
  # 近似: 充足率は開始が過ぎた枠のうち確定した予約が残っている割合（予約のない閉じた枠は取り下げとして除く）。
  # リードタイムは送付からの返却までの時間の中央値（返していない動画は今までの経過時間）。
  # 継続率は 60〜90 日前に初回を終えた生徒のうち、30 日以内に月額を始め、31〜60 日目にもレッスンを終えた割合
  command:
    - psql
    - -U
    - rally
    - -d
    - rally
    - -At
    - -v
    - ON_ERROR_STOP=1
    - -c
    - |-
        with completions as (
          select student_id, is_first_lesson, completed_at from live_lesson.lesson_completions
          union all
          select student_id, is_first_lesson, completed_at from async_lesson.lesson_completions
        )
        select json_build_object(
          'slot_fill_rate', (
            select round(avg(case when exists (select 1 from scheduling.bookings b where b.slot_id = s.slot_id and b.status = 'confirmed')
                                  then 1 else 0 end)::numeric, 4)
            from scheduling.slots s
            where s.starts_at < now() and s.starts_at >= now() - interval '30 days'
              and not (s.status = 'closed'
                       and not exists (select 1 from scheduling.bookings b where b.slot_id = s.slot_id and b.status = 'confirmed'))),
          'video_review_lead_time', (
            select round((percentile_cont(0.5) within group (
                     order by extract(epoch from coalesce(r.returned_at, now()) - v.submitted_at) / 3600))::numeric, 1)
            from async_lesson.videos v left join async_lesson.video_reviews r on r.video_id = v.video_id
            where v.submitted_at >= now() - interval '30 days'),
          'first_lesson_retention_1m', (
            select round(avg(case when exists (select 1 from entitlement.subscriptions s
                                               where s.student_id = f.student_id and s.started_at < f.completed_at + interval '30 days')
                                   and exists (select 1 from completions l
                                               where l.student_id = f.student_id
                                                 and l.completed_at >= f.completed_at + interval '30 days'
                                                 and l.completed_at < f.completed_at + interval '60 days')
                                  then 1 else 0 end)::numeric, 4)
            from completions f
            where f.is_first_lesson and f.completed_at >= now() - interval '90 days' and f.completed_at < now() - interval '60 days'))
# 本番に出す前の DB の控え（factory-engine の ADR 0057 の決定 3）。shipper が本番に出す直前に、いま動いている版の DB をこのコマンドの標準出力で控える。
# 置き場所は工場の shipper の作業場（直近 keep 個）。控えから戻すのは人の手（pg_restore。工場の README の「出荷と Rollback」）
backup:
  environments: [prod]
  service: postgres
  command: [pg_dump, -U, rally, -d, rally, -Fc]
  suffix: .dump
  keep: 10
verify:
  service: backend
  url: http://127.0.0.1:8080/version   # {"app_version": "..."} が出した版と一致すること
